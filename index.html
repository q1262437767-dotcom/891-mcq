<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>891 选择题 1000 道 · 刷题器</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#5d6675;--line:#dde1e7;--pri:#1f6feb;--pri2:#e8f0fe;--ok:#1a7f37;--okb:#dafbe1;--bad:#cf222e;--badb:#ffebe9;--warn:#9a6700;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--fg:#e6e9ef;--mut:#9aa4b2;--line:#2c323d;--pri:#4c8dff;--pri2:#1a2740;--ok:#3fb950;--okb:#12301c;--bad:#ff6b6b;--badb:#3a1618;--warn:#d29922;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:4px 2px 10px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--sh);overflow-wrap:anywhere;word-break:break-word}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{min-height:44px;width:auto;padding:8px 12px;font-weight:500}
.btn:active{transform:scale(.99)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack>*+*{margin-top:10px}
.big{font-size:28px;font-weight:700;line-height:1.2}
.mut{color:var(--mut);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pri2);color:var(--pri);margin:0 6px 4px 0;font-weight:600}
.tag.w{background:var(--badb);color:var(--bad)}.tag.o{background:rgba(154,103,0,.12);color:var(--warn)}
.q{font-size:17px;font-weight:600;margin:6px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;min-height:56px;text-align:left;padding:12px;margin:0 0 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pri2);color:var(--pri);font-size:14px}
.opt span{flex:1;min-width:0;padding-top:2px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad b{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.ex{border-left:4px solid var(--pri);padding:10px 12px;background:var(--pri2);border-radius:10px;margin-top:4px}
.ex.okx{border-color:var(--ok)}.ex.badx{border-color:var(--bad)}
.ex .res{font-weight:700;margin-bottom:4px}
.meta{font-size:13px;color:var(--mut);margin-top:8px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.dock .btn{box-shadow:0 2px 8px rgba(0,0,0,.12)}
select{width:100%;min-height:48px;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left;width:52%;overflow-wrap:anywhere}
.weak td{color:var(--bad)}
.li{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li .t{flex:1;min-width:0;font-size:15px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
.hide{display:none!important}
.kbd{font-size:12px;color:var(--mut);text-align:center;margin-top:6px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.big{font-size:24px}}
@media (hover:none){.kbd{display:none}}
</style>

<script id="qdata" type="application/json">[{"id":1,"book":"大气","chapter":"第1章 大气概述","kp":"地球系统四圈层","q":"地球系统通常指哪几个圈层构成的相互作用综合体（ ）。","options":["岩石圈、水圈、大气圈和高层电离圈","地壳、地幔、外核和内核","对流层、平流层、中间层和热层","岩石圈、水圈、大气圈和生物圈"],"answer":3,"explain":"解析：手册1-D01：地球系统由岩石圈、水圈、大气圈和生物圈通过物质、能量交换构成。电离圈只是高层大气的电离区，不是与之并列的圈层。","source":"上编 1-D01"},{"id":2,"book":"大气","chapter":"第1章 大气概述","kp":"圈层相互作用","q":"关于地球系统各圈层的关系，下列说法正确的是（ ）。","options":["四个圈层是彼此不接触的同心壳层","人类活动只影响生物圈，不能改变大气组成","生物圈与其他圈层在空间上相互重叠，并通过物质能量交换相互作用","大气圈与海洋之间只交换动量，不交换热量和水分"],"answer":2,"explain":"解析：手册易失分点：生物圈与其他物理圈层重叠，不能理解为互不接触的壳层；海气之间交换热量、动量和水分，人类活动可以改变大气组成。手册要点：地球系统是由岩石圈、水圈、大气圈和生物圈通过物质、能量交换形成的相互联系、相互制约的综合体。","source":"上编 1-D01"},{"id":3,"book":"大气","chapter":"第1章 大气概述","kp":"水循环更新期","q":"水圈各水体中，更新期最短的是（ ）。","options":["极地冰川（约1万年）","河水（约16天）","土壤水（约1年）","大气中的水（约8天）"],"answer":3,"explain":"解析：笔记与教材：大气中的水更新期约8天，最短；河水约16天，土壤水约1年，高山冰川约1600年，极地冰川长达1万年。更新期取决于储量与通量之比，大气含水量很小而蒸发、降水通量巨大，因此周转最快，冰川储量大、交换慢，周转最慢。","source":"上编 1-D01（atmos-core笔记）"},{"id":4,"book":"大气","chapter":"第1章 大气概述","kp":"干洁大气定义","q":"干洁大气是指（ ）。","options":["只由氮气和氧气组成的气体","相对湿度为零但含有气溶胶的空气","除去水汽和悬浮固、液态颗粒后的气体混合物","不含二氧化碳的空气"],"answer":2,"explain":"解析：手册1-D02：干洁大气是除去水汽及悬浮颗粒的气体混合物，以氮、氧、氩为主。“只有氮和氧”是易错点，干空气还含氩、CO₂等。","source":"上编 1-D02"},{"id":5,"book":"大气","chapter":"第1章 大气概述","kp":"干空气主要组分","q":"按体积分数，干洁大气中含量前三位依次是（ ）。","options":["氮、氩、氧","氮、氧、氩","氧、氮、水汽","氮、氧、二氧化碳"],"answer":1,"explain":"解析：氮约78%、氧约21%、氩约0.93%居第三；CO₂虽重要但体积分数仅约0.04%。水汽不属于干洁大气。","source":"上编 1-D02"},{"id":6,"book":"大气","chapter":"第1章 大气概述","kp":"湿空气定义","q":"湿空气的正确理解是（ ）。","options":["含液态云滴的空气","只含水汽不含干空气组分的气体","干空气与水汽的混合物","相对湿度超过100%的空气"],"answer":2,"explain":"解析：手册1-D02：湿空气是干空气与水汽的混合物，可近似为理想气体；含云滴是另外的凝结物负载问题。手册要点：湿空气是干空气与水汽的混合物。","source":"上编 1-D02"},{"id":7,"book":"大气","chapter":"第1章 大气概述","kp":"干空气比气体常数","q":"干空气比气体常数R_d约为（ ）。","options":["287 J·kg⁻¹·K⁻¹","461.5 J·kg⁻¹·K⁻¹","1004 J·kg⁻¹·K⁻¹","8.314 J·kg⁻¹·K⁻¹"],"answer":0,"explain":"解析：R_d≈287 J/(kg·K)；461.5是水汽比气体常数R_v；8.314是普适气体常数（单位J/(mol·K)）；1004是c_p。手册要点：干空气比气体常数约为287 J·kg⁻¹·K⁻¹。","source":"上编 1-D02、公式1-01"},{"id":8,"book":"大气","chapter":"第1章 大气概述","kp":"状态方程单位","q":"使用p=ρRT时，下列单位搭配正确的是（ ）。","options":["p用Pa，ρ用kg/m³，T用K","p用Pa，ρ用kg/m³，T用℃","p用atm，ρ用kg/m³，T用K","p用hPa，ρ用g/m³，T用℃"],"answer":0,"explain":"解析：手册公式1-01：p用Pa、ρ用kg·m⁻³、T用K（T=t+273.15）。温度用摄氏度是最常见的错误。","source":"上编 公式1-01"},{"id":9,"book":"大气","chapter":"第1章 大气概述","kp":"平均摩尔质量的加权","q":"若给的是各组分的质量分数w_i，计算混合气体平均摩尔质量应使用（ ）。","options":["M=Πw_iM_i","M=ΣM_i/n","1/M=Σw_i/M_i","M=Σw_iM_i"],"answer":2,"explain":"解析：手册公式1-01条件：按摩尔（体积）分数时M=Σx_iM_i；给质量分数时改用1/M=Σw_i/M_i。两者不能混用。","source":"上编 公式1-01"},{"id":10,"book":"大气","chapter":"第1章 大气概述","kp":"气体常数与密度","q":"同温同压下，比气体常数R越小的气体（ ）。","options":["密度与R无关","密度越大","分子量越小","密度越小"],"answer":1,"explain":"解析：由ρ=p/(RT)，同p、T时R越小ρ越大；R=R*/M，R小意味着分子量大。手册计算易错点明确此关系。","source":"上编 公式1-01"},{"id":11,"book":"大气","chapter":"第1章 大气概述","kp":"虚温定义","q":"虚温T_v的定义是（ ）。","options":["与湿空气同气压、同密度时干空气应有的温度","湿球温度计读到的温度","气块干绝热移到1000 hPa时具有的温度（即位温）","空气冷却到饱和时的温度"],"answer":0,"explain":"解析：手册1-D03：虚温是与湿空气具有相同气压和密度的干空气应有的温度。干绝热到1000 hPa的温度是位温；冷却到饱和是露点。","source":"上编 1-D03"},{"id":12,"book":"大气","chapter":"第1章 大气概述","kp":"虚温与实际温度","q":"无凝结物时，湿空气的虚温与实际温度相比（ ）。","options":["虚温低于实际温度","二者始终相等","仅在空气达到饱和时虚温才高于实际温度，未饱和时二者相等","虚温高于实际温度，水汽越多差值越大"],"answer":3,"explain":"解析：T_v=T/[1−(1−ε)e/p]>T，水汽越多差越大，体现同温同压下湿空气较轻。手册要点：无凝结物时，虚温高于实际温度，水汽越多差值越大。","source":"上编 1-D03"},{"id":13,"book":"大气","chapter":"第1章 大气概述","kp":"湿空气较轻","q":"同温同压下湿空气比干空气密度小，根本原因是（ ）。","options":["水汽吸收地面长波辐射后升温，使湿空气体积膨胀、密度减小","水汽分子量（18）小于干空气平均分子量（约29）","湿空气中氧气的体积分数比干空气更高","水汽在空气中会凝结放热"],"answer":1,"explain":"解析：水汽替换等体积的干空气分子，而水汽摩尔质量18 g/mol小于干空气约29 g/mol，故总密度减小。手册要点：忽略凝结物，求干空气组分密度、水汽密度、湿空气总密度和虚温。","source":"上编 K1-02"},{"id":14,"book":"大气","chapter":"第1章 大气概述","kp":"虚温的应用","q":"在静力学测高公式中引入虚温的目的是（ ）。","options":["修正云滴凝结时释放潜热对气温的影响","把摄氏温度统一换算成绝对温度，以便代入理想气体状态方程计算","消除地转偏向力的影响","用干空气形式的状态方程计入水汽对密度的影响"],"answer":3,"explain":"解析：手册1-D03：实际计算中用虚温替换干空气状态方程中的温度，从而沿用R_d；测高公式也用平均虚温。手册要点：虚温是干空气在与某湿空气具有相同气压和密度时应有的温度，是将水汽影响纳入干空气形式状态方程的等效温度，用 T_v 表示。","source":"上编 1-D03、公式1-15"},{"id":15,"book":"大气","chapter":"第1章 大气概述","kp":"虚温易错","q":"关于虚温，下列说法错误的是（ ）。","options":["含云水、冰水时还要考虑凝结物负载","虚温可代入p=ρR_dT_v求湿空气密度","虚温就是温度计实际测得的气温","水汽越多虚温与气温差越大"],"answer":2,"explain":"解析：手册易失分处：虚温不是温度计读数，而是等效温度。其余三项均为手册表述。","source":"上编 1-D03"},{"id":16,"book":"大气","chapter":"第1章 大气概述","kp":"水汽压定义","q":"水汽压e是指（ ）。","options":["空气中水汽的分压力","水汽质量与干空气质量之比","单位体积空气中水汽的质量","空气达到饱和时的总压"],"answer":0,"explain":"解析：手册1-D04：水汽压是水汽的分压力，常用hPa；单位体积水汽质量是绝对湿度；与干空气质量之比是混合比。手册要点：水汽压e是水汽的分压力，常用hPa。","source":"上编 1-D04"},{"id":17,"book":"大气","chapter":"第1章 大气概述","kp":"混合比与比湿分母","q":"混合比r与比湿q的区别在于（ ）。","options":["r以湿空气总质量为分母，q以干空气质量为分母，二者恰好相反","r的分子是液态水，q的分子是水汽","r只适用于饱和空气","r以干空气质量为分母，q以湿空气总质量为分母"],"answer":3,"explain":"解析：手册1-D04：二者分子都是水汽质量，混合比分母为干空气质量，比湿分母为湿空气总质量；水汽少时近似相等，且r略大于q。手册要点：混合比r以干空气质量为分母，比湿q以湿空气总质量为分母，分子均为水汽质量，常用g·kg⁻¹。","source":"上编 1-D04"},{"id":18,"book":"大气","chapter":"第1章 大气概述","kp":"升降中守恒的湿度量","q":"未饱和、无水分交换的气块在升降过程中，保持不变的湿度量是（ ）。","options":["相对湿度","水汽压和绝对湿度","混合比和比湿","饱和水汽压"],"answer":2,"explain":"解析：手册1-D04：未发生相变时r和q不变，而水汽压、绝对湿度随气压和体积变化，相对湿度随温度变化。手册要点：未发生相变、无水分交换的气块升降中，r和q保持不变，水汽压及绝对湿度通常仍会改变。","source":"上编 1-D04"},{"id":19,"book":"大气","chapter":"第1章 大气概述","kp":"实际与饱和水汽压","q":"关于e与E，下列说法正确的是（ ）。","options":["e是实际水汽压，E是同温下的饱和水汽压","e是饱和水汽压，E是同温下的实际水汽压，二者相反","E随相对湿度变化","e只取决于温度，E只取决于相对湿度"],"answer":0,"explain":"解析：手册公式1-03易错：实际水汽压e不等于饱和水汽压E；E主要取决于温度（及相态），e取决于实际水汽含量。手册要点：实际水汽压e不等于饱和水汽压E。","source":"上编 公式1-03、1-04"},{"id":20,"book":"大气","chapter":"第1章 大气概述","kp":"绝对湿度经验系数","q":"使用a≈217e/T计算绝对湿度时，e应使用的单位是（ ）。","options":["mmHg","Pa（帕）","hPa","kPa"],"answer":2,"explain":"解析：手册公式1-04：a≈217e/T中e用hPa、a得g/m³；若e用Pa应改用2.17，否则放大100倍。若把Pa值直接代入217e/T，结果会大100倍，用kPa则小10倍，mmHg也不是该系数对应的单位。","source":"上编 公式1-03、1-04"},{"id":21,"book":"大气","chapter":"第1章 大气概述","kp":"相对湿度定义","q":"相对湿度RH定义为（ ）。","options":["实际水汽压与同温下饱和水汽压之比","露点与气温之比","水汽质量与空气总质量之比","饱和水汽压与实际水汽压之比"],"answer":0,"explain":"解析：手册1-D05：RH=e/E(t)×100%；露点与气温之比没有物理意义。手册要点：相对湿度是实际水汽压与同温度下指定相面的饱和水汽压之比，常用百分数表示。","source":"上编 1-D05"},{"id":22,"book":"大气","chapter":"第1章 大气概述","kp":"露点定义","q":"露点温度是（ ）。","options":["空气中开始出现降水粒子时对应的气温","空气块绝热膨胀上升至饱和时的温度","在气压不变、水汽含量减少的条件下，空气升温到饱和时的温度","在气压和水汽含量不变的条件下，空气冷却到饱和时的温度"],"answer":3,"explain":"解析：手册1-D05：露点是等压冷却、水分不变时达到饱和的温度，露点对应的饱和水汽压就是实际水汽压。绝热膨胀至饱和对应的是抬升凝结。","source":"上编 1-D05"},{"id":23,"book":"大气","chapter":"第1章 大气概述","kp":"露点与水汽压","q":"露点温度t_d与实际水汽压e的关系是（ ）。","options":["e与t_d无关","e=E_i(t)（冰面）","e=E_w(t_d)","e=E_w(t)−E_w(t_d)"],"answer":2,"explain":"解析：手册公式1-05：e=E_w(t_d)，即实际水汽压等于露点下的饱和水汽压，所以RH=E_w(t_d)/E_w(t)。露点就是等压冷却到饱和的温度，此时饱和水汽压恰等于原来的实际水汽压，所以不能写成与t_d无关或做差。","source":"上编 公式1-05~1-08"},{"id":24,"book":"大气","chapter":"第1章 大气概述","kp":"温度露点差","q":"气温不变而露点升高，说明（ ）。","options":["空气中水汽含量增加，相对湿度增大","空气中水汽含量减少，相对湿度减小","饱和水汽压增大，相对湿度随之减小","空气更接近干绝热"],"answer":0,"explain":"解析：露点对应实际水汽压，露点升高即e增大，温度不变时E不变，RH增大。手册要点：露点是湿空气在水汽含量不变、等压冷却至对水面饱和时的温度。","source":"上编 1-D05"},{"id":25,"book":"大气","chapter":"第1章 大气概述","kp":"风向定义","q":"气象上所说的“北风”是指（ ）。","options":["吹向北方的风","从北方吹来的风","地转偏向后的北向分量","沿经线上升的气流"],"answer":1,"explain":"解析：手册1-D06：风向是风的来向，北风即从北吹来。风是空气相对地面的水平运动。","source":"上编 1-D06"},{"id":26,"book":"大气","chapter":"第1章 大气概述","kp":"风的定义","q":"气象学中“风”通常指（ ）。","options":["空气的垂直对流","空气相对于地面的水平运动","空气相对于地心坐标系的三维运动","任何方向的空气运动"],"answer":1,"explain":"解析：手册1-D06：风指空气相对地面的水平运动，垂直运动另称上升、下沉气流。手册要点：风通常指空气相对于地面的水平运动，用风向和风速表示。","source":"上编 1-D06"},{"id":27,"book":"大气","chapter":"第1章 大气概述","kp":"气溶胶定义","q":"大气气溶胶是指（ ）。","options":["只指燃烧和工业等人为排放的烟尘颗粒","悬浮在大气中的固体和液体微粒（与气体组成的分散体系）","大气中除氮、氧以外的所有痕量气体","大气中悬浮的全部液态水滴和冰晶，不含固体颗粒和人为排放物"],"answer":1,"explain":"解析：手册1-D07：气溶胶是悬浮于大气中的固、液态微粒，有自然源和人为源，可一次排放也可二次生成。手册要点：大气气溶胶是悬浮在空气中的固态、液态微粒所形成的分散体系，粒子可来自海盐、沙尘、火山等自然源，以及燃烧、工业和交通等人为源，也可由气体反应生成。","source":"上编 1-D07"},{"id":28,"book":"大气","chapter":"第1章 大气概述","kp":"气溶胶作用","q":"下列不属于气溶胶对天气气候作用的是（ ）。","options":["使大气能见度降低，形成霾等现象","使地面接收的太阳总辐射减少，并改变云的反照率与寿命","直接吸收太阳紫外辐射加热平流层上部形成增温层","作为云凝结核或冰核参与成云致雨"],"answer":2,"explain":"解析：平流层上部增温主要由臭氧吸收紫外造成。手册1-D07、1-E01指出气溶胶通过辐射和云作用影响天气气候，并影响能见度。","source":"上编 1-D07、1-P03"},{"id":29,"book":"大气","chapter":"第1章 大气概述","kp":"天气与气候区别","q":"关于天气与气候，下列说法正确的是（ ）。","options":["气候是某一地点某一时刻的大气状态，天气则是其长期平均和极端事件的统计","一次强寒潮出现即可否定长期气候变暖的结论","气候只是天气的多年平均值，不含变率和极端事件","气候是一定地区较长时期内天气的统计特征，包括平均值、变率和极端事件"],"answer":3,"explain":"解析：手册1-C01：气候包括平均状态、变率、发生频率和极端事件；单次寒潮不能否定长期变暖。手册要点：气候是一定地区在较长时期内天气的统计特征，既包括平均状态，也包括变率、发生频率和极端事件等特征。","source":"上编 1-C01"},{"id":30,"book":"大气","chapter":"第1章 大气概述","kp":"天气定义","q":"天气描述的是（ ）。","options":["某一时刻或较短时段、某一地点的大气状态及现象","一个地区30年以上的平均气温和降水","大气成分在百年尺度上的长期变化","全球能量平衡"],"answer":0,"explain":"解析：手册1-C01：天气是较短时间特定地点的大气状态和现象；长期统计特征属于气候。手册要点：天气是某一时刻或较短时段、某一地点的大气状态及其现象，例如某日降雨、降温。","source":"上编 1-C01"},{"id":31,"book":"大气","chapter":"第1章 大气概述","kp":"等压面图","q":"等压面图上主要分析的物理量是（ ）。","options":["等压面的位势高度","同一高度上的气压数值","露点","地面温度"],"answer":0,"explain":"解析：手册1-C02：等高面图“定高看气压”，等压面图“定压看高度”，用位势高度等值线（等高线）表示。手册要点：等压面图在相同气压面上画位势高度等值线，表现等压面的起伏。","source":"上编 1-C02"},{"id":32,"book":"大气","chapter":"第1章 大气概述","kp":"高凸低凹","q":"等压面图上位势高度高值区对应等压面向上凸起，表示该处（ ）。","options":["该处一定为冷空气堆积的冷性高压","该处为低压槽","同高度上气压较低，为低压区","同高度上气压较高，为高压区"],"answer":3,"explain":"解析：手册1-C02：等压面“高凸低凹”，等压面上凸处同高度气压较高，对应高压；下凹对应低压。手册要点：同高度上高压区对应等压面上凸、低压区对应下凹。","source":"上编 1-C02"},{"id":33,"book":"大气","chapter":"第1章 大气概述","kp":"大气热力分层顺序","q":"按温度垂直分布，自下而上大气分为（ ）。","options":["平流层、对流层、中间层、热层","对流层、平流层、中间层、热层","对流层、平流层、热层、中间层","对流层、中间层、平流层、热层"],"answer":1,"explain":"解析：手册1-P01：温度随高度“降—升—降—升”对应对流层、平流层、中间层、热层。其余选项把层次顺序打乱了：平流层位于对流层之上，中间层位于平流层之上，热层位于最外侧。","source":"上编 1-P01"},{"id":34,"book":"大气","chapter":"第1章 大气概述","kp":"对流层厚度","q":"对流层顶高度大致为（ ）。","options":["约8—18 km，赤道高、极地低","约80—85 km","约50—55 km","全球各地均约为11 km，固定不变"],"answer":0,"explain":"解析：手册1-P01：对流层至约8—18 km，随纬度、季节变化，极地薄、赤道厚。50—55 km是平流层顶，80—85 km是中间层顶。","source":"上编 1-P01"},{"id":35,"book":"大气","chapter":"第1章 大气概述","kp":"平流层增温原因","q":"平流层上部气温随高度增加的主要原因是（ ）。","options":["地面长波辐射加热","高空气溶胶吸收红外辐射","臭氧吸收太阳紫外辐射","水汽凝结释放潜热"],"answer":2,"explain":"解析：手册1-P01、1-P03：平流层上部因臭氧强烈吸收紫外辐射而增温。手册要点：平流层至约50—55 km，低部近等温，上部因臭氧吸收紫外线而增温。","source":"上编 1-P01"},{"id":36,"book":"大气","chapter":"第1章 大气概述","kp":"中间层特征","q":"中间层的温度垂直分布特征是（ ）。","options":["温度随高度降低，层顶附近为大气最冷区","温度随高度升高，层顶附近最暖","温度随高度先升后降，层顶最暖","温度近于等温"],"answer":0,"explain":"解析：中间层（约50—85 km）气温随高度再度下降，中间层顶是大气温度最低的区域；其上热层因吸收高能辐射而增温。中间层缺少臭氧加热，气温随高度递减，其顶部约−90℃是整层大气中最冷的地方，所以“升温”“等温”都不对。","source":"上编 1-P01"},{"id":37,"book":"大气","chapter":"第1章 大气概述","kp":"平均递减率判稳定","q":"对流层平均递减率约6.5 K/km，据此可得（ ）。","options":["对流层整体绝对稳定，任何时候都不会有对流","对流层整体绝对不稳定","温度随高度降低就说明不稳定","该平均层结对未饱和气块稳定，对饱和气块可能条件性不稳定"],"answer":3,"explain":"解析：手册1-P01：6.5 K/km小于干绝热率9.8 K/km，对未饱和气块稳定；若大于湿绝热率，则为条件性不稳定。温度随高降低不足以判不稳定。","source":"上编 1-P01"},{"id":38,"book":"大气","chapter":"第1章 大气概述","kp":"逆温稳定性","q":"逆温层和等温层的静力稳定度通常是（ ）。","options":["不稳定，有利于对流发展","中性","稳定，抑制垂直运动","取决于是否有风"],"answer":2,"explain":"解析：手册1-P01：逆温和等温层通常稳定，抬升气块比环境冷而回落。在温度不随高度降低甚至升高的气层中，上升气块按干绝热降温后会比环境更冷而下沉，垂直运动受抑制，与是否有风无关。","source":"上编 1-P01"},{"id":39,"book":"大气","chapter":"第1章 大气概述","kp":"标准大气分层","q":"国际标准大气中，11—20 km高度范围的温度特征是（ ）。","options":["以1 K/km递增","以9.8 K/km的干绝热率递减","以6.5 K/km递减","等温，约216.65 K"],"answer":3,"explain":"解析：手册公式1-19：0—11 km T=288.15−0.0065h；11—20 km为216.65 K等温；20—32 km以0.001 K/m递增。6.5 K/km是0—11 km对流层的递减率，9.8 K/km是干绝热率，1 K/km的递增出现在20 km以上，11—20 km则保持等温。","source":"上编 公式1-17、1-19"},{"id":40,"book":"大气","chapter":"第1章 大气概述","kp":"标准大气海平面值","q":"国际标准大气海平面温度与气压分别为（ ）。","options":["288.15 K，1000.00 hPa","300 K，1013.25 hPa","288.15 K，1013.25 hPa","273.15 K，1000 hPa"],"answer":2,"explain":"解析：手册K1-06及公式1-19：标准大气海平面T₀=288.15 K（15℃），p₀=1013.25 hPa。1000 hPa只是常用的参考气压，不是标准海平面气压，300 K和273.15 K也不是标准大气规定的海平面温度。","source":"上编 公式1-19、K1-06"},{"id":41,"book":"大气","chapter":"第1章 大气概述","kp":"环境直减率定义","q":"环境温度直减率γ定义为（ ）。","options":["γ=dT/dz，即温度随高度降低时为正值","γ=g/c_p，即干绝热直减率本身","γ=dθ/dz","γ=−dT/dz，温度随高度降低时为正"],"answer":3,"explain":"解析：手册公式1-17：γ=−dT/dz，温度随高度降低时γ>0；g/c_p是干绝热直减率，二者概念不同。把负号去掉就变成温度随高度升高为正；g/c_p是干绝热直减率Γd，dθ/dz则是位温梯度，都不是γ的定义。","source":"上编 公式1-17"},{"id":42,"book":"大气","chapter":"第1章 大气概述","kp":"静力平衡","q":"大气静力平衡是指（ ）。","options":["离心力与气压梯度力平衡","垂直气压梯度力与重力相平衡","水平气压梯度力与科氏力平衡","摩擦力与科氏力平衡"],"answer":1,"explain":"解析：手册1-P02：静力平衡dp/dz=−ρg，即垂直气压梯度力与重力平衡；水平气压梯度力与科氏力平衡是地转平衡。手册要点：静力平衡指向上的垂直气压梯度力与向下的重力平衡。","source":"上编 1-P02、公式1-14"},{"id":43,"book":"大气","chapter":"第1章 大气概述","kp":"静力方程形式","q":"静力方程的正确形式是（ ）。","options":["dp/dz=−ρg","dp/dz=−g/ρ","dp/dz=−ρRT","dp/dz=ρg"],"answer":0,"explain":"解析：手册公式1-14：dp/dz=−ρg，负号表示气压随高度降低。该式表示单位厚度气柱的压差等于其重量，量纲为Pa/m；ρRT是状态方程中的压强，−g/ρ量纲不对，正号则意味着气压随高增加。","source":"上编 公式1-14"},{"id":44,"book":"大气","chapter":"第1章 大气概述","kp":"气压的物理意义","q":"静力平衡下，某高度的气压等于（ ）。","options":["该处空气分子的平均动能","该高度以下气柱的重量","该处空气密度与温度之积","该高度以上单位面积气柱的重量"],"answer":3,"explain":"解析：由p₁−p₂=g∫ρdz，顶压为0时p=单位面积以上气柱质量×g，因此p_s/g为单位面积气柱质量。手册要点：单位面积气柱质量用kg·m⁻²。","source":"上编 公式1-14"},{"id":45,"book":"大气","chapter":"第1章 大气概述","kp":"暖柱较厚","q":"两个等压面之间的厚度主要取决于（ ）。","options":["两等压面所在纬度的地转参数f的大小","地面风速大小与地表粗糙程度","气层中臭氧含量","气层的平均（虚）温度，越暖越厚"],"answer":3,"explain":"解析：手册1-P02、公式1-15：Δz=(R_dT̄_v/g)ln(p₁/p₂)，平均虚温越高厚度越大，即“暖柱较厚”。手册要点：给定上下界气压之间的厚度随平均虚温增大而增大，所以暖气柱较厚。","source":"上编 1-P02"},{"id":46,"book":"大气","chapter":"第1章 大气概述","kp":"标高含义","q":"气压标高H=R_dT/g的物理含义是（ ）。","options":["气压降为原来一半所需的高度","等温大气中气压降为原来1/e所需的高度","对流层顶所在的平均高度","大气中气压降为地面气压的十分之一时对应的高度，即大气的有效顶"],"answer":1,"explain":"解析：手册公式1-16：p=p₁exp[−Δz/H]，高度增加H时气压降为1/e。降为一半需H·ln2。","source":"上编 公式1-15、1-16"},{"id":47,"book":"大气","chapter":"第1章 大气概述","kp":"测高公式中对数","q":"使用测高公式时，若用常用对数lg代替自然对数ln，应（ ）。","options":["除以2.302585进行换算","无需换算","乘以0.4343","乘以2.302585换算"],"answer":3,"explain":"解析：手册公式1-16：lnx=2.302585log₁₀x；用lg不补2.303会使厚度偏小。由lnx=2.302585lgx可知，lg值须乘以2.302585才是ln值；除以该数或乘以0.4343方向恰好相反。","source":"上编 公式1-15、1-16"},{"id":48,"book":"大气","chapter":"第1章 大气概述","kp":"压高关系冷暖","q":"地面气压相同的情况下，冷空气柱中气压随高度（ ）。","options":["保持不变","下降更慢","先升后降","下降更快"],"answer":3,"explain":"解析：标高H=R_dT/g与温度成正比，冷空气柱的标高小、密度大，气压随高度下降得更快。所以地面气压相同时，同一高度上冷空气柱中的气压更低，暖空气柱中更高。气压随高度只会单调递减，不会保持不变或先升后降。","source":"上编 公式1-15、拿分册模板1"},{"id":49,"book":"大气","chapter":"第1章 大气概述","kp":"臭氧生成反应","q":"平流层臭氧生成的关键反应是（ ）。","options":["NO₂+hν→NO+O，O+O₂+M→O₃+M","O₃+hν→O₂+O，O+O₃→2O₂","Cl+O₃→ClO+O₂","O₂+hν→2O，O+O₂+M→O₃+M"],"answer":3,"explain":"解析：手册1-P03：氧分子吸收短波紫外光解为氧原子，再在第三体M参与下与O₂结合生成O₃。O₃光解是破坏反应，Cl反应是催化破坏。","source":"上编 1-P03"},{"id":50,"book":"大气","chapter":"第1章 大气概述","kp":"第三体M作用","q":"臭氧生成反应O+O₂+M→O₃+M中，第三体M的作用是（ ）。","options":["带走结合时释放的多余能量，使O₃稳定","提供与O₂结合所需的氧原子","作为催化剂加速臭氧的分解","吸收紫外线产生O"],"answer":0,"explain":"解析：手册1-P03：第三体带走结合时释放的能量，使臭氧得以稳定生成，自身不被净消耗。手册要点：氧原子再与氧分子在第三体M参与下结合：O+O₂+M→O₃+M。","source":"上编 1-P03"},{"id":51,"book":"大气","chapter":"第1章 大气概述","kp":"臭氧层误区","q":"关于臭氧层，下列说法错误的是（ ）。","options":["臭氧吸收紫外辐射保护地表生物","臭氧层是由纯臭氧组成的独立壳层","臭氧的垂直分布由生成、破坏和输送共同决定","近地面臭氧是污染物，不能写成臭氧层的保护效应"],"answer":1,"explain":"解析：手册1-P03易失分：臭氧层并非纯臭氧组成的独立壳层，臭氧在其中只占极少体积分数。臭氧层只是臭氧相对集中的平流层区域，臭氧的体积分数仅约百万分之几，其余选项都是手册肯定的正确表述。","source":"上编 1-P03"},{"id":52,"book":"大气","chapter":"第1章 大气概述","kp":"臭氧层高度","q":"笔记中通常称为“臭氧层”的高度范围约为（ ）。","options":["10—50 km","50—85 km","85—500 km","0—10 km"],"answer":0,"explain":"解析：笔记中把10—50 km这一臭氧相对集中的气层称为臭氧层，大致位于平流层内。50—85 km是中间层，85 km以上属热层，0—10 km大致为对流层，都不是臭氧集中的高度。","source":"上编 1-P03（atmos-core笔记）"},{"id":53,"book":"大气","chapter":"第1章 大气概述","kp":"可变成分作用","q":"水汽、CO₂、臭氧含量很少却对天气气候很重要，主要原因是（ ）。","options":["它们的总质量决定了大气的总质量","它们只存在于对流层并随天气变化","它们的分子量最大","它们具有辐射活性、相变能力或化学反应性"],"answer":3,"explain":"解析：手册1-E01：成分的重要性取决于辐射活性、相变能力和化学反应性，而非含量。N₂、O₂含量虽大，但对辐射几乎没有作用，水汽可以发生相变并释放潜热，CO₂和水汽吸收长波辐射，臭氧吸收紫外线并参与光化学反应。","source":"上编 1-E01"},{"id":54,"book":"大气","chapter":"第1章 大气概述","kp":"水汽分布","q":"大气中水汽含量的一般分布特征是（ ）。","options":["随高度增加而增多，冬季多于夏季","随高度增加明显减少，同一地区夏季多于冬季","在全球均匀分布，不随季节变化","随高度增加先增后减，在平流层底部最多，与季节无关"],"answer":1,"explain":"解析：笔记：水汽含量一般随高度增加而明显减少；同一地区夏季多于冬季。水汽主要来自地表蒸发，且饱和水汽压随温度降低而锐减，因此高空冷区水汽少，夏季气温高、蒸发强，水汽多于冬季。","source":"上编 1-E01（atmos-core笔记）"},{"id":55,"book":"大气","chapter":"第1章 大气概述","kp":"CO₂增加原因","q":"大气中CO₂浓度增加的主要人为原因是（ ）。","options":["化石燃料燃烧量不断加大","火山活动增强","海洋向大气释放CO₂增加","臭氧层破坏"],"answer":0,"explain":"解析：笔记：CO₂增加主要归因于煤炭、石油、天然气等化石燃料燃烧，后果是低层大气增温并引起全球气候变化。火山和海洋属自然源，且海洋总体上是CO₂的汇；臭氧层破坏与CO₂浓度升高没有因果关系。","source":"上编 1-E01（atmos-core笔记）"},{"id":56,"book":"大气","chapter":"第1章 大气概述","kp":"气压随高度","q":"在对流层中，大约每升高5.5 km，气压约降为地面的（ ）。","options":["十分之一","不变","三分之二","一半"],"answer":3,"explain":"解析：由p=p₀e^(−z/H)，H≈8 km时降为一半需H·ln2≈5.5 km（公式1-16）。气压每升高约一个“H·ln2”就减半，降到十分之一需约H·ln10≈18 km，故5.5 km对应约一半。","source":"上编 公式1-16"},{"id":57,"book":"大气","chapter":"第1章 大气概述","kp":"槽脊","q":"等压面图上等高线向高值方向凸出的区域称为（ ）。","options":["脊","高压中心","槽","鞍形场"],"answer":2,"explain":"解析：手册1-C02关键词“槽脊鞍”：低值向高值区伸展为槽，高值向低值区伸展为脊。高值区向低值方向伸出的是脊，等高线闭合成高值的是高压中心，两高两低相间的是鞍形场。","source":"上编 1-C02"},{"id":58,"book":"大气","chapter":"第1章 大气概述","kp":"气溶胶来源","q":"下列属于二次气溶胶的是（ ）。","options":["风蚀扬起的沙尘颗粒","SO₂氧化生成的硫酸盐颗粒","海浪飞溅形成的海盐粒子","SO₂直接从燃煤烟囱排放的一次颗粒"],"answer":1,"explain":"解析：手册1-D07：一次直接排放与二次大气转化生成。手册要点：大气气溶胶是悬浮在空气中的固态、液态微粒所形成的分散体系，粒子可来自海盐、沙尘、火山等自然源，以及燃烧、工业和交通等人为源，也可由气体反应生成。","source":"上编 1-D07"},{"id":59,"book":"大气","chapter":"第1章 大气概述","kp":"平均摩尔质量计算","q":"某行星大气含体积分数95%的CO₂和5%的N₂（M分别为44、28 g/mol），其平均摩尔质量约为（ ）。","options":["36.00 g/mol","43.20 g/mol","44.00 g/mol","42.78 g/mol"],"answer":1,"explain":"解析：体积分数即摩尔分数，按摩尔分数加权：M=0.95×44+0.05×28=43.20 g/mol。直接取36 g/mol是错把两组分等权平均；1/M=Σw/M的形式只适用于给质量分数时。","source":"上编 公式1-01"},{"id":60,"book":"大气","chapter":"第1章 大气概述","kp":"比气体常数R=R*/M","q":"平均摩尔质量为43.36 g/mol的行星大气，其比气体常数约为（ ）。","options":["0.2 J/(kg·K)","287.0 J/(kg·K)","429.6 J/(kg·K)","191.7 J/(kg·K)"],"answer":3,"explain":"解析：R=R*/M=8.314/0.04336≈191.7 J/(kg·K)，约为地球干空气287的0.668倍。若把43.36 g/mol直接代入而不换成kg/mol，会得到小1000倍的0.19。","source":"上编 公式1-01、K1-01"},{"id":61,"book":"大气","chapter":"第1章 大气概述","kp":"行星大气总质量","q":"行星半径6.00×10⁶ m、地面平均气压9.00×10⁶ Pa、g=8.80 m/s²，按薄大气静力平衡估算其大气总质量约为（ ）。","options":["7.71×10¹³ kg","3.58×10²² kg","4.63×10²⁰ kg","1.16×10²⁰ kg"],"answer":2,"explain":"解析：单位面积气柱质量为p_s/g，总质量M=4πr²p_s/g≈4.63×10²⁰ kg。用πr²（受光圆盘面积）会少4倍；乘g而不是除g量纲错误。","source":"上编 公式1-14、K1-01"},{"id":62,"book":"大气","chapter":"第1章 大气概述","kp":"虚温计算","q":"T=300 K，p=1000 hPa，e=20 hPa，取ε=0.622，虚温T_v约为（ ）。","options":["306.00 K","307.56 K","302.29 K","297.73 K"],"answer":2,"explain":"解析：T_v=T/[1−(1−ε)e/p]=300/(1−0.378×0.02)≈302.29 K，高于实际温度。把分母写成乘号会得到低于T的值，与“湿空气较轻、虚温偏高”矛盾。","source":"上编 公式1-02、K1-02"},{"id":63,"book":"大气","chapter":"第1章 大气概述","kp":"虚温近似式","q":"气温290 K、比湿10 g/kg时，用T_v≈T(1+0.608q)估算虚温约为（ ）。","options":["288.24 K","2053.20 K","291.10 K","291.76 K"],"answer":3,"explain":"解析：q须代0.010 kg/kg：T_v≈290×(1+0.00608)≈291.76 K。把10 g/kg直接代成10会得到荒谬的千余K；减号形式方向错误。","source":"上编 公式1-12、1-13"},{"id":64,"book":"大气","chapter":"第1章 大气概述","kp":"湿空气密度","q":"T=300 K、总压1000 hPa、水汽压20 hPa，Rd=287、Rv=461.5，湿空气总密度约为（ ）。","options":["1.1527 kg/m³","1.1759 kg/m³","1.1614 kg/m³","1.1382 kg/m³"],"answer":0,"explain":"解析：ρ=(p−e)/(R_dT)+e/(R_vT)=1.1382+0.0144≈1.1527 kg/m³，比同温同压干空气1.1614小约0.76%。干空气组分必须用分压p−e，不能用总压p。","source":"上编 K1-02"},{"id":65,"book":"大气","chapter":"第1章 大气概述","kp":"混合比计算","q":"p=1000 hPa，t=20℃，RH=60%，E=23.4 hPa，混合比r约为（ ）。","options":["8.86 g/kg","14.90 g/kg","8.65 g/kg","8.78 g/kg"],"answer":0,"explain":"解析：e=0.60×23.4=14.04 hPa，r=εe/(p−e)=0.622×14.04/985.96≈8.86 g/kg。用E代替e得到的是饱和混合比；εe/[p−(1−ε)e]是比湿q的式子，略小于r。","source":"上编 公式1-09、K1-03"},{"id":66,"book":"大气","chapter":"第1章 大气概述","kp":"比湿与混合比换算","q":"已知混合比r=12.0 g/kg，则比湿q约为（ ）。","options":["0.92 g/kg","11.86 g/kg","7.46 g/kg","12.14 g/kg"],"answer":1,"explain":"解析：q=r/(1+r)，r须用0.012 kg/kg：q=12.0/1.012≈11.86 g/kg，略小于r。把12直接代进r/(1+r)会得到0.92 g/kg的错误结果。","source":"上编 公式1-11"},{"id":67,"book":"大气","chapter":"第1章 大气概述","kp":"绝对湿度","q":"e=14.04 hPa，T=293.15 K，取Rv=461.5 J/(kg·K)，绝对湿度a约为（ ）。","options":["10.38 g/m³","152.33 g/m³","1037.78 g/m³","0.10 g/m³"],"answer":0,"explain":"解析：a=e/(R_vT)，e换成1404 Pa：a=1404/(461.5×293.15)≈0.01038 kg/m³≈10.38 g/m³；也可用a≈217e/T（e用hPa）。未把hPa换Pa会小100倍。","source":"上编 公式1-03、1-04"},{"id":68,"book":"大气","chapter":"第1章 大气概述","kp":"由露点算相对湿度","q":"气温20℃、露点10℃，用马格努斯式E_w(t)=6.11×10^[7.5t/(237.3+t)] hPa，相对湿度约为（ ）。","options":["44.6%","52.5%","50.0%","60.0%"],"answer":1,"explain":"解析：e=E_w(10)≈12.28 hPa，E=E_w(20)≈23.39 hPa，RH=e/E≈52.5%。RH不是露点与气温的简单比值（10/20=50%），饱和水汽压随温度非线性增长。","source":"上编 公式1-05~1-08、K1-04"},{"id":69,"book":"大气","chapter":"第1章 大气概述","kp":"标高计算","q":"等温大气T=280 K，Rd=287 J/(kg·K)，g=9.80 m/s²，气压标高H约为（ ）。","options":["8200 m","820 m","23754 m","7995 m"],"answer":0,"explain":"解析：H=R_dT/g=287×280/9.80=8200 m。标高随温度正比变化，暖空气层标高更大、气压随高度下降更慢。","source":"上编 公式1-15、K1-05"},{"id":70,"book":"大气","chapter":"第1章 大气概述","kp":"等温压高公式","q":"等温大气标高H=8200 m，地面1000 hPa，3.00 km处气压约为（ ）。","options":["634.1 hPa","430.7 hPa","662.0 hPa","693.6 hPa"],"answer":3,"explain":"解析：p=p₀exp(−z/H)=1000×e^(−3000/8200)≈693.6 hPa。线性近似1−z/H高估递减；把e换成10为底则漏乘2.303。","source":"上编 公式1-16、拿分册模板1"},{"id":71,"book":"大气","chapter":"第1章 大气概述","kp":"等压面厚度","q":"等温T=280 K（H=8200 m），1000 hPa与700 hPa两等压面之间的厚度约为（ ）。","options":["2925 m","2460 m","1270 m","3510 m"],"answer":0,"explain":"解析：Δz=H·ln(p₁/p₂)=8200×ln(10/7)≈2925 m。用lg代替ln少了2.303倍；温度越高厚度越大（暖柱较厚）。","source":"上编 公式1-15、K1-05"},{"id":72,"book":"大气","chapter":"第1章 大气概述","kp":"恒直减率压高模型","q":"标准对流层T₀=288.15 K、p₀=1013.25 hPa、γ=0.0065 K/m，5.00 km处气压约为（ ）。","options":["990.4 hPa","560.0 hPa","540.1 hPa","412.6 hPa"],"answer":2,"explain":"解析：T=288.15−32.5=255.65 K，p=p₀(T/T₀)^(g/(R_dγ))，指数≈5.26，得p≈540.1 hPa。按地面温度套等温公式会偏高；指数倒置（R_dγ/g）结果离谱偏大。","source":"上编 公式1-18、K1-06"},{"id":73,"book":"大气","chapter":"第1章 大气概述","kp":"对流层顶温度估算","q":"地面15℃，平均直减率6.5℃/km，对流层顶高12 km，则对流层顶温度约为（ ）。","options":["93.0℃","-102.6℃","-24.0℃","-63.0℃"],"answer":3,"explain":"解析：T=15−6.5×12=-63.0℃。用9.8℃/km是干绝热直减率，不是环境平均直减率。","source":"上编 公式1-17、单元1"},{"id":74,"book":"大气","chapter":"第1章 大气概述","kp":"自动对流递减率","q":"使干空气密度随高度不变（自动对流阈值）的递减率γ=g/R_d约为（ ）。","options":["19.5 K/km","9.8 K/km","34.1 K/km","6.5 K/km"],"answer":2,"explain":"解析：γ_AC=g/R_d=9.8/287≈0.0341 K/m≈34.1 K/km，远大于干绝热率9.8 K/km；实际大气极少出现。手册要点：γAC为使干空气密度不随高度变化的递减率。","source":"上编 公式1-20"},{"id":75,"book":"大气","chapter":"第1章 大气概述","kp":"均质大气高度","q":"地面温度288 K的均质大气（密度不随高度变）高度H_h=R_dT₀/g约为（ ）。","options":["4217 m","8434 m","19424 m","8794 m"],"answer":1,"explain":"解析：H_h=p₀/(ρ₀g)=R_dT₀/g=287×288/9.8≈8434 m，与等温大气标高同形式，但物理含义是均质大气顶高度。手册要点：γAC为使干空气密度不随高度变化的递减率。","source":"上编 公式1-20"},{"id":76,"book":"大气","chapter":"第2章 大气辐射学","kp":"热辐射定义","q":"热辐射是指（ ）。","options":["大气中宇宙射线等引起的电离辐射","只有高温物体才发出的可见光辐射","物体吸收太阳辐射后再反射出去的那部分电磁辐射，只在白天存在","物体因具有温度而发射的电磁辐射，凡高于绝对零度的物体都有"],"answer":3,"explain":"解析：手册2-D01：温度高于绝对零度的物体均有热辐射。反射的太阳光不是该物体自身的热辐射。","source":"上编 2-D01"},{"id":77,"book":"大气","chapter":"第2章 大气辐射学","kp":"黑体定义","q":"黑体是指（ ）。","options":["颜色为黑色、表面粗糙的实际物体","对所有波长的入射辐射全部吸收的理想物体，吸收率为1","只吸收可见光而反射红外的物体","颜色为黑色、对所有波长入射辐射全部反射而不吸收的理想物体"],"answer":1,"explain":"解析：手册2-D01：黑体的“黑”描述吸收特性，并非肉眼颜色。黑体同时也是同温度下发射最强的物体。","source":"上编 2-D01"},{"id":78,"book":"大气","chapter":"第2章 大气辐射学","kp":"灰体定义","q":"灰体的特征是（ ）。","options":["吸收率等于1","吸收率小于1且与波长无关","只发射不吸收","吸收率随波长剧烈变化且小于1"],"answer":1,"explain":"解析：手册2-D01：灰体吸收率小于1且与波长无关；吸收率随波长变化的是选择性吸收体。吸收率等于1的是黑体；吸收率随波长变化的是选择性吸收体，自然物体都会吸收和发射，不存在只发射不吸收的物体。","source":"上编 2-D01"},{"id":79,"book":"大气","chapter":"第2章 大气辐射学","kp":"雪的辐射性质","q":"关于新雪的辐射性质，下列说法正确的是（ ）。","options":["短波和长波都强烈反射，几乎不吸收也不发射","短波吸收很强，而长波吸收很弱","短波反射很强，但长波吸收和发射也很强","可在所有波段视为黑体"],"answer":2,"explain":"解析：手册2-D01易失分：雪短波反射强，却可有很强的长波吸收和发射，近似长波黑体，不能把长波近似外推到短波。雪的短波反照率高达0.8以上，但在长波波段比辐射率接近1，所以既不能说长短波都反射，也不能在所有波段当黑体。","source":"上编 2-D01"},{"id":80,"book":"大气","chapter":"第2章 大气辐射学","kp":"辐射通量密度单位","q":"辐射通量密度（辐照度）的单位是（ ）。","options":["J","W·m⁻²","W·m⁻²·sr⁻¹","W·m⁻²·μm⁻¹"],"answer":1,"explain":"解析：手册公式2-01：P用W，F用W·m⁻²，辐射率I用W·m⁻²·sr⁻¹，能量E用J。手册要点：辐射通量密度是单位面积的辐射通量，单位W·m⁻²。","source":"上编 2-D02、公式2-01"},{"id":81,"book":"大气","chapter":"第2章 大气辐射学","kp":"辐射率定义","q":"辐射率（辐亮度）是指（ ）。","options":["单位时间通过单位面积的全部方向辐射能","单位体积空间内所含的辐射能量","单位时间通过单位水平面积、来自整个上半球所有方向的辐射能的总和","单位时间通过垂直于传播方向的单位投影面积、单位立体角的辐射能"],"answer":3,"explain":"解析：手册2-D02：辐射率涉及投影面积和单位立体角，对方向积分后得到通量密度。手册要点：辐射率I表示沿指定方向、单位投影面积、单位立体角的辐射通量，单位W·m⁻²·sr⁻¹。","source":"上编 2-D02"},{"id":82,"book":"大气","chapter":"第2章 大气辐射学","kp":"基尔霍夫定律","q":"基尔霍夫定律的内容是（ ）。","options":["物体辐射峰值波长与绝对温度成反比","同温度、同波长下，物体的比辐射率等于其吸收率","吸收率加反射率等于1","物体在任一温度下的辐出度都与绝对温度的四次方成正比"],"answer":1,"explain":"解析：手册公式2-03：ε_λ=a_λ，需同温、同波长及局地热平衡。a+r+t=1是能量守恒，不是基尔霍夫定律。","source":"上编 公式2-03"},{"id":83,"book":"大气","chapter":"第2章 大气辐射学","kp":"吸收反射透射","q":"对不透明面，下列关系正确的是（ ）。","options":["a_λ+r_λ+t_λ=0","a_λ+r_λ=1","t_λ=1","a_λ=r_λ"],"answer":1,"explain":"解析：手册公式2-03：a_λ+r_λ+t_λ=1，不透明面t_λ=0，故a_λ+r_λ=1。三者之和应为1而不是0；不透明意味着透射率t_λ=0，而非t_λ=1，吸收率与反射率一般也不相等。","source":"上编 公式2-03"},{"id":84,"book":"大气","chapter":"第2章 大气辐射学","kp":"普朗克定律用途","q":"普朗克定律主要描述（ ）。","options":["吸收率与发射率的关系","黑体总辐出度与温度的关系","黑体辐射能量按波长的分布","峰值波长与温度的关系"],"answer":2,"explain":"解析：手册2-D03：普朗克定律给出光谱分布；对全波长积分得斯蒂芬定律，求极值得维恩定律。手册要点：普朗克定律描述黑体光谱随波长和温度的分布。","source":"上编 2-D03、公式2-04"},{"id":85,"book":"大气","chapter":"第2章 大气辐射学","kp":"斯蒂芬定律内容","q":"斯蒂芬—玻尔兹曼定律表明黑体总辐出度（ ）。","options":["与绝对温度成反比","与摄氏温度的四次方成正比关系","与绝对温度的四次方成正比","与绝对温度成正比"],"answer":2,"explain":"解析：手册公式2-05：F_b=σT⁴，T必须用绝对温度。σT⁴中T必须用开尔文，用摄氏温度在0℃附近会得到荒谬结果，辐出度随温度升高而增大，不是成反比。","source":"上编 公式2-05、2-06"},{"id":86,"book":"大气","chapter":"第2章 大气辐射学","kp":"斯蒂芬常数","q":"斯蒂芬—玻尔兹曼常数σ约为（ ）。","options":["6.63×10⁻³⁴ J·s","5.670×10⁻⁸ W·m⁻²·K⁻²","5.670×10⁻⁸ W·m⁻²·K⁻⁴","1.38×10⁻²³ J/K"],"answer":2,"explain":"解析：σ=5.670×10⁻⁸ W/(m²·K⁴)；2898 μm·K是维恩常数；后两个分别是玻尔兹曼常数和普朗克常数。单位中温度应为K⁻⁴而不是K⁻²，6.63×10⁻³⁴ J·s是普朗克常数，1.38×10⁻²³ J/K是玻尔兹曼常数。","source":"上编 公式2-05、2-06"},{"id":87,"book":"大气","chapter":"第2章 大气辐射学","kp":"维恩定律内容","q":"维恩位移定律指出（ ）。","options":["温度越高峰值波长越长","辐出度与温度四次方成正比","黑体辐射峰值波长与绝对温度成反比","吸收率等于发射率"],"answer":2,"explain":"解析：手册公式2-06：λ_mT=2898 μm·K，温度越高峰值越向短波移动。手册要点：维恩式为按波长定义的黑体光谱峰值。","source":"上编 公式2-05、2-06"},{"id":88,"book":"大气","chapter":"第2章 大气辐射学","kp":"温度翻倍辐出度","q":"黑体绝对温度变为原来的2倍，辐出度变为原来的（ ）。","options":["32倍","8倍","2倍","16倍"],"answer":3,"explain":"解析：F∝T⁴，2⁴=16。单元测验同类题。","source":"上编 公式2-05、单元3"},{"id":89,"book":"大气","chapter":"第2章 大气辐射学","kp":"升温与峰值","q":"地表升温时，其长波辐射的变化是（ ）。","options":["辐射通量减少，峰值波长向短波移动","辐射通量增加，峰值波长向长波移动","辐射通量增加，峰值波长向短波移动","辐射通量不变"],"answer":2,"explain":"解析：手册K2-01：升温使F按T⁴增大，λ_m按1/T减小（向短波移动）。按斯蒂芬—玻尔兹曼定律，辐射通量随T⁴增大，按维恩定律，峰值波长与T成反比，所以升温时通量增加、峰值移向短波。","source":"上编 K2-01"},{"id":90,"book":"大气","chapter":"第2章 大气辐射学","kp":"消光组成","q":"大气对辐射的消光包括（ ）。","options":["吸收和散射","散射和衍射两种过程","反射和折射","吸收和发射"],"answer":0,"explain":"解析：手册2-D04：β_ext=β_a+β_s，消光是吸收加散射。手册要点：消光是辐射因吸收和散射而从原传播方向减弱的过程。","source":"上编 2-D04、公式2-09"},{"id":91,"book":"大气","chapter":"第2章 大气辐射学","kp":"光学厚度","q":"光学厚度τ的特点是（ ）。","options":["与路径长度无关，只取决于介质种类","沿路径对消光系数积分得到，无量纲","单位为W·m⁻²，表示削弱的能量","单位为m"],"answer":1,"explain":"解析：手册2-D04：τ=∫β_ext ds，无量纲，直接光束按e^(−τ)指数削弱。手册要点：光学厚度τ是消光系数沿光路的累积量，为无量纲量，表示该路径对辐射削弱的程度。","source":"上编 2-D04、公式2-09"},{"id":92,"book":"大气","chapter":"第2章 大气辐射学","kp":"比尔定律","q":"比尔—朗伯定律描述直接光束通过介质时（ ）。","options":["强度随光学厚度指数衰减","强度随路径线性减小","强度随传播距离的平方成反比减小","强度不变"],"answer":0,"explain":"解析：手册公式2-10：I=I₀e^(−τ)=I₀P^m，为指数削弱。平方反比是日地距离效应。","source":"上编 公式2-09、2-10"},{"id":93,"book":"大气","chapter":"第2章 大气辐射学","kp":"太阳常数定义","q":"太阳常数是指（ ）。","options":["平均日地距离处、大气上界垂直于太阳光线的单位面积上的太阳辐射通量","大气上界水平面上一天接收的太阳辐射总量","晴天正午地面接收的太阳总辐射通量","太阳表面单位面积在单位时间内向外发射的全部辐射能量，即太阳的辐出度"],"answer":0,"explain":"解析：手册2-D05：太阳常数定义在平均日地距离、大气上界、垂直于光线的面上，约1360多W/m²。手册要点：太阳直接辐射是未改变方向而到达地面的太阳辐射。","source":"上编 2-D05"},{"id":94,"book":"大气","chapter":"第2章 大气辐射学","kp":"总辐射","q":"地面总辐射是指（ ）。","options":["到达同一接收面的直接辐射与散射辐射之和","大气逆辐射与地面长波辐射之和","直接辐射与地面反射辐射之和","短波与长波之和"],"answer":0,"explain":"解析：手册2-D05、公式2-12：S↓=S_dir,h+S_dif,h，须是同一接收面（如水平面）。手册要点：太阳直接辐射是未改变方向而到达地面的太阳辐射。","source":"上编 2-D05、公式2-11、2-12"},{"id":95,"book":"大气","chapter":"第2章 大气辐射学","kp":"日地距离修正","q":"大气上界法向太阳辐照度随日地距离的变化遵循（ ）。","options":["与日地距离的平方成反比","与日地距离成正比","与日地距离无关","与日地距离成反比"],"answer":0,"explain":"解析：手册公式2-11：S_n=S₀(d₀/d)²，即平方反比。辐射从太阳球面向外扩散，通过的球面积与距离平方成正比，所以单位面积的通量与距离平方成反比。","source":"上编 公式2-11、2-12"},{"id":96,"book":"大气","chapter":"第2章 大气辐射学","kp":"太阳高度角公式","q":"太阳高度角h满足sin h=（ ）。","options":["sinφsinδ+cosφcosδcosω","tanφtanδ","cosφcosδ+sinφsinδcosω","sinφcosδ+cosφsinδ"],"answer":0,"explain":"解析：手册公式2-11：sinh=sinφsinδ+cosφcosδcosω，φ纬度、δ赤纬、ω时角。该式来自球面三角，正午ω=0时化为sinh=cos(φ−δ)，其余写法把正弦与余弦的位置搞错了。","source":"上编 公式2-11、2-12"},{"id":97,"book":"大气","chapter":"第2章 大气辐射学","kp":"大气逆辐射","q":"大气逆辐射是指（ ）。","options":["地面向上发射、被大气吸收的长波辐射","大气反射的太阳辐射","大气散射的短波辐射","大气向下射向地面的长波辐射"],"answer":3,"explain":"解析：手册2-D06：大气逆辐射是向下的长波辐射，云和水汽越多越强，减少地面净长波失热。手册要点：大气逆辐射是大气及云向下到达地面的长波辐射，不是太阳辐射的反射。","source":"上编 2-D06"},{"id":98,"book":"大气","chapter":"第2章 大气辐射学","kp":"地面有效辐射","q":"地面有效辐射是指（ ）。","options":["地面吸收的太阳短波辐射与反射辐射之差","地面吸收的太阳短波辐射与大气逆辐射之和，即地面获得的全部能量收入","地面与大气之间通过湍流交换的感热通量","地面放射的长波辐射与其吸收的大气逆辐射之差，即净长波失热"],"answer":3,"explain":"解析：手册2-D06、公式2-17：F₀=F_E−a_LW R_a，为正表示地面净失热。手册要点：地面有效辐射是地面发射长波与地面吸收的大气逆辐射之差，取地面向外净失热为正。","source":"上编 2-D06、公式2-17"},{"id":99,"book":"大气","chapter":"第2章 大气辐射学","kp":"云对有效辐射","q":"有云的夜晚比晴朗夜晚地面降温少，主要因为（ ）。","options":["云在夜间反射太阳辐射，使地面夜间少失去热量","云增强大气逆辐射，减小地面有效辐射","云释放凝结潜热直接加热地面","云阻挡风"],"answer":1,"explain":"解析：手册2-D06：云和水汽增强向下长波，地面净长波失热减少，因此阴天夜晚不易降温。手册要点：其他条件相同时，暖湿、多云大气逆辐射较强，使地面有效辐射及夜间辐射冷却减小。","source":"上编 2-D06、2-P03"},{"id":100,"book":"大气","chapter":"第2章 大气辐射学","kp":"逆辐射经验式","q":"关于大气逆辐射经验公式（如布伦特式），正确的做法是（ ）。","options":["各经验式结果相同，可任选一个代入","任意选择一个记住的公式代入","e统一用Pa代入，系数不必区分版本","题目给定哪一版本才代入哪一版本，并注意e的单位"],"answer":3,"explain":"解析：手册公式2-13~2-16标题即“给定版本才代入”，各式系数及e的单位（hPa）不同。不同经验式拟合的资料和单位不同，系数不能互换，e多用hPa，若随意改用Pa或换公式，结果会差很大。","source":"上编 公式2-13~2-16"},{"id":101,"book":"大气","chapter":"第2章 大气辐射学","kp":"地面辐射差额","q":"地面辐射差额（净辐射）R_n的表达式为（ ）。","options":["(1−A)S↓+F_E−R_a","S↓+R_a+F_E","(1−A)S↓+a_LW R_a−F_E","A·S↓−F₀"],"answer":2,"explain":"解析：手册公式2-18：R_n=(1−A_s)S↓+a_LW R_a−F_E=(1−A_s)S↓−F₀。净辐射等于吸收的短波（1−A)S↓加上吸收的大气逆辐射，再减去地面长波发射F_E，其余写法的符号或项不对。","source":"上编 公式2-18、2-19"},{"id":102,"book":"大气","chapter":"第2章 大气辐射学","kp":"地表能量平衡","q":"地表净辐射被分配为（ ）。","options":["感热通量、潜热通量、土壤热通量及储热变化","反射率与透射率两部分","只转化为感热，用于加热空气","反射辐射、透射辐射和散射辐射三部分，与湍流交换无关"],"answer":0,"explain":"解析：手册2-D07、公式2-19：R_n=H_s+LE+G+dU_s/dt。手册要点：净辐射可分配为地面与空气交换的感热、蒸发所耗潜热、地面与深层土壤间的输热及地表储热。","source":"上编 2-D07、公式2-19"},{"id":103,"book":"大气","chapter":"第2章 大气辐射学","kp":"短波长波分界","q":"太阳辐射与地球辐射的波长分界约为（ ）。","options":["4 μm","10 μm","100 μm","0.4 μm"],"answer":0,"explain":"解析：手册2-C01：太阳辐射主要在0.15—4 μm为短波，地球大气辐射主要在4 μm以上为长波。手册要点：气象学常以约4 μm为短、长波的实用分界，依据维恩定律，太阳峰值约0.5 μm，地表峰值约10 μm。","source":"上编 2-C01"},{"id":104,"book":"大气","chapter":"第2章 大气辐射学","kp":"太阳短波地球长波","q":"太阳辐射为短波、地球辐射为长波，根本原因是（ ）。","options":["地球不发射可见光是因为反照率高","地球距离太阳太远","两者辐射源温度相差很大","大气吸收了所有短波"],"answer":2,"explain":"解析：手册2-C01：由维恩定律，辐射源温度不同使峰值波长不同（太阳约0.5 μm，地球约10 μm）。手册要点：太阳温度高，其辐射能量主要集中在较短波长。","source":"上编 2-C01"},{"id":105,"book":"大气","chapter":"第2章 大气辐射学","kp":"大气窗口","q":"大气窗区位于（ ）。","options":["约8—12 μm的红外波段","0.3—0.4 μm紫外波段","15 μm CO₂吸收带","全部可见光波段"],"answer":0,"explain":"解析：手册2-C01：大气对8—12 μm长波吸收弱，地面长波可经此直接射向太空，称大气窗口。手册要点：大气对地球红外辐射有强烈且选择性的吸收和发射，部分能量仍可经约8—13 μm大气窗口逸出。","source":"上编 2-C01"},{"id":106,"book":"大气","chapter":"第2章 大气辐射学","kp":"瑞利散射条件","q":"瑞利散射适用于（ ）。","options":["只适用于云滴等大粒子","粒子尺度与入射光波长相当时的散射","粒子尺度远小于波长的分子散射","粒子尺度远大于波长"],"answer":2,"explain":"解析：手册2-C02、公式2-07：尺度参数x=2πa/λ≪1时为瑞利散射，强度∝λ⁻⁴。手册要点：瑞利散射适用于粒子尺度远小于波长的情形，在适用近似下散射强度与λ⁻⁴成正比，前后向分布对称。","source":"上编 2-C02、公式2-07"},{"id":107,"book":"大气","chapter":"第2章 大气辐射学","kp":"瑞利散射规律","q":"瑞利散射强度与波长的关系是（ ）。","options":["与波长无关","与波长的平方成反比关系","与波长四次方成反比","与波长成正比"],"answer":2,"explain":"解析：手册2-C02：F_scat∝λ⁻⁴，短波散射更强。手册要点：瑞利散射适用于粒子尺度远小于波长的情形，在适用近似下散射强度与λ⁻⁴成正比，前后向分布对称。","source":"上编 2-C02"},{"id":108,"book":"大气","chapter":"第2章 大气辐射学","kp":"米散射特征","q":"米散射的主要特征是（ ）。","options":["前后散射对称，对波长选择性强","粒子远小于波长，散射强度与波长四次方成反比，前后对称","只发生在空气分子上，散射光呈蓝色且前后对称分布","粒子与波长相当，散射前向增强，对波长选择性弱"],"answer":3,"explain":"解析：手册2-C02：瑞利散射前后对称；米散射粒子较大，前向增强，色选择性弱，所以云呈白色。手册要点：在气象常见的粒径与波长可比或更大时，方向性通常更强，前向散射突出，波长关系比λ⁻⁴复杂。","source":"上编 2-C02"},{"id":109,"book":"大气","chapter":"第2章 大气辐射学","kp":"天空蓝色","q":"晴朗天空呈蓝色的原因是（ ）。","options":["水汽对蓝光的选择性反射较强","臭氧本身呈蓝色并吸收红光","大气吸收了红光","空气分子对短波蓝光的瑞利散射较强"],"answer":3,"explain":"解析：手册2-C02：瑞利散射∝λ⁻⁴，蓝光散射多，散射天光呈蓝色。手册要点：可见光中蓝光比红光更易被散射，使晴空呈蓝色。","source":"上编 2-C02"},{"id":110,"book":"大气","chapter":"第2章 大气辐射学","kp":"旭日红色","q":"日出日落时太阳呈红色，主要是因为（ ）。","options":["大气吸收了蓝光，使直射光偏红","光程长，短波被大量散射掉，剩余直射光偏红","日出日落时云滴的米散射使各波长散射均匀增强","此时太阳表面温度降低而发红光"],"answer":1,"explain":"解析：手册2-C02：低太阳高度角光程长，蓝光被散射出光路，直射光偏红。手册要点：日出、日落时直射光路较长，短波被更多移出直射方向，故太阳及附近天空偏红。","source":"上编 2-C02"},{"id":111,"book":"大气","chapter":"第2章 大气辐射学","kp":"云呈白色","q":"云通常呈白色，原因是（ ）。","options":["云滴自身发射白色可见光","云滴对各波长的瑞利散射较强","云滴尺度大，米散射对各波长选择性弱","云吸收了所有颜色"],"answer":2,"explain":"解析：手册2-C02：云滴尺度远大于可见光波长，散射对波长选择性弱，各色光混合呈白色。手册要点：云滴对各可见波长的散射差别较小且有多次散射，因此厚云受光部分常呈白色。","source":"上编 2-C02"},{"id":112,"book":"大气","chapter":"第2章 大气辐射学","kp":"选择吸收与温室效应","q":"大气温室效应的本质是（ ）。","options":["臭氧吸收紫外线后向下加热地面","大气像玻璃一样阻止对流散热，使地面增温","大气对短波和长波都强烈吸收，并像玻璃温室一样完全阻止对流散热","大气对短波吸收少、对长波吸收强，并以向下长波减少地面净失热"],"answer":3,"explain":"解析：手册2-P01：短波入射、长波吸收发射、向下长波、净失热减少；人为排放使其增强。与玻璃温室机制不完全相同。","source":"上编 2-P01"},{"id":113,"book":"大气","chapter":"第2章 大气辐射学","kp":"温室类比","q":"关于“玻璃温室”与大气温室效应，下列说法正确的是（ ）。","options":["玻璃温室靠吸收紫外线","大气温室效应主要靠阻挡对流","二者机制完全相同","二者物理细节不同，类比有限"],"answer":3,"explain":"解析：单元3：玻璃房主要抑制对流换热，大气温室效应依靠长波选择吸收与再发射，类比有限。手册要点：自然温室效应与人为增强应区分，机制也不同于玻璃温室主要靠抑制对流的保温。","source":"上编 2-P01、单元3"},{"id":114,"book":"大气","chapter":"第2章 大气辐射学","kp":"主要温室气体吸收","q":"下列成分中，对地球长波辐射吸收最重要的是（ ）。","options":["氮气和氧气这两种分子","氮气和氩气","氩气和氖气","水汽和二氧化碳"],"answer":3,"explain":"解析：水汽和CO₂在红外有强吸收带，是主要温室气体；N₂、O₂、Ar几乎不吸收红外。手册要点：水汽、二氧化碳、甲烷等及云吸收部分长波，并向各方向发射，其中向下的长波使地表净长波失热减少。","source":"上编 2-P01"},{"id":115,"book":"大气","chapter":"第2章 大气辐射学","kp":"太阳高度影响","q":"太阳高度角减小时，地面直接辐射减弱的原因是（ ）。","options":["地面反照率随太阳高度角减小而降低","太阳常数随太阳高度角减小而减小","太阳高度角减小时日地距离增大，太阳常数随之明显变小","单位水平面积接收的能量减少，且光程增长使消光增大"],"answer":3,"explain":"解析：手册2-P02：太阳高度影响水平投影（sin h）和光程（大气质量m），两者都使直接辐射减弱。手册要点：太阳高度降低时，一方面同一束光分摊到更大的水平面积，水平面收入因sin h减小。","source":"上编 2-P02"},{"id":116,"book":"大气","chapter":"第2章 大气辐射学","kp":"透明度影响","q":"大气透明度降低时（ ）。","options":["散射辐射一定为零，总辐射保持不变","直接辐射增强，散射比例减小","总辐射一定增大","直接辐射减弱，散射辐射比例增大"],"answer":3,"explain":"解析：手册2-P02：透明度降低消光增加，直接辐射减少，散射辐射比例上升，应区分直接与总辐射。手册要点：到达地表的直接辐射先受日地距离平方反比关系控制，进入大气后又因吸收和散射而削弱。","source":"上编 2-P02"},{"id":117,"book":"大气","chapter":"第2章 大气辐射学","kp":"气温日变化最低值","q":"晴天气温日最低值一般出现在（ ）。","options":["日出前后","正午","午夜0时","日落时"],"answer":0,"explain":"解析：手册2-P03：地面整夜净失热，热收支滞后，最低温出现在日出前后。手册要点：夜间无太阳收入，地面持续净长波冷却，最低气温通常在日出前后。","source":"上编 2-P03"},{"id":118,"book":"大气","chapter":"第2章 大气辐射学","kp":"气温日变化最高值","q":"晴天气温日最高值通常出现在午后14时前后而不是正午，原因是（ ）。","options":["午后大气逆辐射最弱，地面长波失热最少所致","正午太阳辐射最弱","午后湍流停止，热量全部留在近地层","地面热量收支的滞后：午后地面仍净得热"],"answer":3,"explain":"解析：手册2-P03：地面先受热再加热空气，正午后一段时间地气系统仍有热量盈余，气温继续上升。手册要点：最高气温通常晚于太阳辐射峰值，因为午后初段地面仍可能有净热收入。","source":"上编 2-P03"},{"id":119,"book":"大气","chapter":"第2章 大气辐射学","kp":"辐射逆温条件","q":"最有利于夜间辐射逆温形成的条件是（ ）。","options":["晴朗、风弱、空气较干","白天强日照、夜间有云","有暖锋过境","阴天、大风、空气湿润"],"answer":0,"explain":"解析：手册2-P03：晴朗风弱时地面长波失热多、湍流弱，贴地冷却形成辐射逆温。手册要点：晴朗、风弱夜间，贴地空气受地面冷却最强，上部空气降温较少，形成气温随高度增加的辐射逆温。","source":"上编 2-P03"},{"id":120,"book":"大气","chapter":"第2章 大气辐射学","kp":"地气系统能量收支","q":"地气系统全球平均入射太阳辐射为S₀/4，因子4的来源是（ ）。","options":["一天中只有约1/4时间有阳光照射","地球的平均行星反照率约为0.25","地球自转一周分为4段","受光圆盘截面积πr²与地球表面积4πr²之比"],"answer":3,"explain":"解析：手册2-E01、公式2-20：分母4来自受光圆盘与发射球面积之比。手册要点：全球长期平均、地气系统以单一有效黑体温度发射。","source":"上编 2-E01、公式2-20"},{"id":121,"book":"大气","chapter":"第2章 大气辐射学","kp":"有效温度含义","q":"地气系统有效辐射温度T_e约255 K，而地表平均约288 K，说明（ ）。","options":["有效温度计算有误，应等于地表温度","地表不发射长波辐射，只吸收太阳辐射","大气吸收了全部太阳辐射","大气温室效应使地表温度高于行星有效辐射温度"],"answer":3,"explain":"解析：手册公式2-20易错：T_e不是实际地表平均温度；两者之差约33 K反映温室效应。手册要点：全球长期平均、地气系统以单一有效黑体温度发射。","source":"上编 公式2-20、拿分册模板4"},{"id":122,"book":"大气","chapter":"第2章 大气辐射学","kp":"大气辐射冷却","q":"整层大气的辐射收支通常为（ ）。","options":["净辐射加热，由感热向下输送到地面平衡","净辐射冷却，由感热、潜热输送补偿","辐射收支恒为零，不需其他补偿","只吸收不发射"],"answer":1,"explain":"解析：手册2-E01：大气辐射冷却，地面净辐射盈余以感热和潜热形式输送给大气维持平衡。手册要点：大气总体的净辐射冷却可由地面感热及凝结潜热等补偿，因此大气热源不能只考虑辐射。","source":"上编 2-E01"},{"id":123,"book":"大气","chapter":"第2章 大气辐射学","kp":"辐射加热率","q":"若向上净辐射通量随高度增加，则该气层（ ）。","options":["净得热，温度上升","辐射收支为零","一定发生凝结","净失热，辐射变温率为负"],"answer":3,"explain":"解析：手册公式2-21：(∂T/∂t)_rad=−(1/ρc_p)∂F_net,↑/∂z，净通量随高度增加表示气层失热。手册要点：向上净通量随高度增加表示气层净失热，变温率为负。","source":"上编 公式2-21"},{"id":124,"book":"大气","chapter":"第2章 大气辐射学","kp":"反照率定义","q":"行星反照率A_p增大，地气系统有效温度（ ）。","options":["降低","升高","先升后降","不变"],"answer":0,"explain":"解析：T_e=[S₀(1−A)/(4σ)]^(1/4)，A增大吸收减少，T_e降低（K2-06：0.30→0.35降约4.7 K）。反照率增大意味着反射更多太阳辐射，被地气系统吸收的能量减少，平衡时向外的长波发射也要减少，有效温度随之降低。","source":"上编 K2-06"},{"id":125,"book":"大气","chapter":"第2章 大气辐射学","kp":"冰雪反照率","q":"冰雪覆盖面积减少会通过反照率反馈（ ）。","options":["使行星有效温度降低，从而抵消增暖","增加吸收太阳辐射，放大增暖","减少吸收太阳辐射，抑制增暖","对气候无影响"],"answer":1,"explain":"解析：冰雪反照率高，冰雪减少使地表吸收更多短波，进一步增暖，为正反馈（第10章10-P02互证）。手册要点：冰雪反照率反馈的链条是：升温使冰雪减少，地表反照率降低，吸收太阳辐射增加，进一步升温。","source":"上编 2-P02、10-P02"},{"id":126,"book":"大气","chapter":"第2章 大气辐射学","kp":"散射辐射","q":"晴天时散射辐射占总辐射的比例随太阳高度角减小而（ ）。","options":["增大","变为零","不变","减小"],"answer":0,"explain":"解析：手册2-P02：太阳高度低时光程长，直接辐射衰减多，散射所占比例增大。手册要点：太阳高度降低时，一方面同一束光分摊到更大的水平面积，水平面收入因sin h减小。","source":"上编 2-P02"},{"id":127,"book":"大气","chapter":"第2章 大气辐射学","kp":"长波辐射窗口意义","q":"大气窗口对地球能量平衡的意义是（ ）。","options":["增强大气逆辐射，使地面增温","阻止地面长波散失，是温室效应的主因","大气在窗区强烈吸收地面长波辐射，使地面散热受阻、逆辐射增强","地面长波辐射可经窗区直接散失到太空，是地面冷却的重要通道"],"answer":3,"explain":"解析：手册2-C01：8—12 μm窗区大气吸收弱。手册要点：大气对地球红外辐射有强烈且选择性的吸收和发射，部分能量仍可经约8—13 μm大气窗口逸出。","source":"上编 2-C01"},{"id":128,"book":"大气","chapter":"第2章 大气辐射学","kp":"臭氧紫外吸收","q":"大气中吸收太阳紫外辐射最主要的成分是（ ）。","options":["臭氧和氧分子","氮气和二氧化碳","水汽","二氧化碳分子"],"answer":0,"explain":"解析：手册2-P01、1-P03：O₂与O₃吸收短波紫外，O₃吸收0.2—0.3 μm紫外。手册要点：高空氧分子吸收足够短波长的太阳紫外辐射而发生光解：O₂+hν→2O。","source":"上编 2-P01、1-P03"},{"id":129,"book":"大气","chapter":"第2章 大气辐射学","kp":"地面长波吸收","q":"对长波辐射而言，大多数自然地表可近似看作（ ）。","options":["全反射体","透明体","黑体或灰体","只发射短波的物体"],"answer":2,"explain":"解析：手册2-D01：实际地表常在长波波段近似为黑体或灰体。在8—14 μm等长波波段，多数自然地表的比辐射率在0.9以上，接近黑体，它们并不全反射或透明，也会发射长波。","source":"上编 2-D01"},{"id":130,"book":"大气","chapter":"第2章 大气辐射学","kp":"辐射平衡温度推导前提","q":"推导行星有效温度T_e时采用的假设不包括（ ）。","options":["全球长期辐射平衡","以单一有效黑体温度向太空发射","采用全球平均行星反照率","地表温度处处均匀等于T_e"],"answer":3,"explain":"解析：手册公式2-20条件：全球长期平均、单一有效黑体温度；T_e不是实际地表温度。T_e只是行星整体向太空发射的等效黑体温度，并不要求地表温度处处均匀，实际地表因温室效应平均约288 K。","source":"上编 公式2-20"},{"id":131,"book":"大气","chapter":"第2章 大气辐射学","kp":"斯蒂芬-玻尔兹曼定律","q":"300 K黑体的辐出度σT⁴约为（ ）。","options":["114.8 W/m²","459.3 W/m²","153.1 W/m²","401.0 W/m²"],"answer":1,"explain":"解析：F=σT⁴=5.67×10⁻⁸×300⁴≈459.3 W/m²。除以4是有效温度公式中的几何因子，与黑体辐出度无关。","source":"上编 公式2-05、拿分册模板4"},{"id":132,"book":"大气","chapter":"第2章 大气辐射学","kp":"维恩位移定律","q":"太阳光球温度约5800 K，其辐射峰值波长约为（ ）。","options":["0.386 μm","2.001 μm","0.500 μm","4.997 μm"],"answer":2,"explain":"解析：λ_m=2898/T=2898/5800≈0.500 μm，位于可见光。地面约300 K时峰值约10 μm，故太阳为短波、地面为长波辐射。","source":"上编 公式2-06"},{"id":133,"book":"大气","chapter":"第2章 大气辐射学","kp":"温度升高辐出度倍数","q":"黑体温度由280 K升到310 K，辐出度约变为原来的（ ）。","options":["1.226 倍","1.357 倍","1.107 倍","1.503 倍"],"answer":3,"explain":"解析：F∝T⁴，(310/280)⁴≈1.503。同时峰值波长按λ_m∝1/T向短波移动。","source":"上编 K2-01"},{"id":134,"book":"大气","chapter":"第2章 大气辐射学","kp":"地面峰值波长","q":"288 K地表近似黑体，其辐射峰值波长约为（ ）。","options":["10.06 μm","10.62 μm","1.01 μm","9.94 μm"],"answer":0,"explain":"解析：λ_m=2898/288≈10.06 μm，属于红外长波，处在8–12 μm大气窗区附近。按维恩位移定律λ_m=2898/T计算，10.62 μm和9.94 μm是用错常数或温度的结果，1.01 μm则差了一个数量级。","source":"上编 公式2-06、拿分册模板4"},{"id":135,"book":"大气","chapter":"第2章 大气辐射学","kp":"行星有效温度","q":"S₀=1366 W/m²，行星反照率0.30，地气系统有效辐射温度T_e约为（ ）。","options":["206.2 K","254.8 K","360.4 K","278.6 K"],"answer":1,"explain":"解析：T_e=[S₀(1−A)/(4σ)]^(1/4)=(239.05/σ)^(1/4)≈254.8 K。漏掉分母4（圆盘与球面积之比）会高估到约360 K；误用A而不是1−A会大幅低估。","source":"上编 公式2-20、拿分册模板4"},{"id":136,"book":"大气","chapter":"第2章 大气辐射学","kp":"反照率变化与有效温度","q":"S₀=1360 W/m²，反照率由0.30增至0.35，有效温度约变化（ ）。","options":["4.67 K","-4.67 K","-9.34 K","-12.75 K"],"answer":1,"explain":"解析：T_e由254.54 K降至249.86 K，变化约-4.67 K。反照率增大吸收减少，有效温度下降而非升高。","source":"上编 K2-06"},{"id":137,"book":"大气","chapter":"第2章 大气辐射学","kp":"全球平均吸收太阳通量","q":"S₀=1360 W/m²、反照率0.30，地气系统全球平均吸收的太阳通量约为（ ）。","options":["102.0 W/m²","952.0 W/m²","340.0 W/m²","238.0 W/m²"],"answer":3,"explain":"解析：F_abs=S₀(1−A)/4=1360×0.70/4=238.0 W/m²。不除4得到的是垂直于光线的圆盘截面上的值，不是全球平均。","source":"上编 K2-06"},{"id":138,"book":"大气","chapter":"第2章 大气辐射学","kp":"透明系数","q":"垂直光学厚度τ_v=0.150，大气透明系数P=e^(−τ_v)约为（ ）。","options":["0.8607","0.7079","0.8350","0.7408"],"answer":0,"explain":"解析：P=e^(−0.150)≈0.8607。光程m=1时直接辐射I=I₀P；用10为底不符合比尔定律的自然指数形式。","source":"上编 公式2-09、2-10、K2-03"},{"id":139,"book":"大气","chapter":"第2章 大气辐射学","kp":"比尔定律与大气质量","q":"大气上界法向辐照1360 W/m²，透明系数P=0.86，大气质量数m=2时到达地面的法向直接辐射约为（ ）。","options":["1169.6 W/m²","1005.9 W/m²","930.2 W/m²","584.8 W/m²"],"answer":1,"explain":"解析：I=I₀P^m=1360×0.86²≈1005.9 W/m²。光程增加使衰减按指数而非线性累积。","source":"上编 公式2-10"},{"id":140,"book":"大气","chapter":"第2章 大气辐射学","kp":"直接辐射投影到水平面","q":"法向直接辐射1000 W/m²，太阳高度角30°，水平面上的直接辐射约为（ ）。","options":["866.0 W/m²","1000.0 W/m²","500.0 W/m²","577.4 W/m²"],"answer":2,"explain":"解析：水平面直接辐射=S_n·sin h=1000×sin30°=500 W/m²。用cos h会把天顶角与高度角混淆。","source":"上编 公式2-11、2-12"},{"id":141,"book":"大气","chapter":"第2章 大气辐射学","kp":"瑞利散射波长比","q":"按瑞利散射F∝λ⁻⁴，0.45 μm蓝光的散射强度约为0.65 μm红光的（ ）。","options":["0.23 倍","1.44 倍","4.35 倍","2.09 倍"],"answer":2,"explain":"解析：(0.65/0.45)⁴≈4.35，短波散射更强，故晴空呈蓝色。只取一次方或二次方低估了波长依赖。","source":"上编 公式2-07、K2-02"},{"id":142,"book":"大气","chapter":"第2章 大气辐射学","kp":"地面有效辐射","q":"地表Ts=295 K、长波比辐射率0.95，大气逆辐射R_a=350 W/m²，地面有效辐射F₀≈ε(σTs⁴−R_a)约为（ ）。","options":["79.4 W/m²","407.9 W/m²","75.4 W/m²","740.4 W/m²"],"answer":2,"explain":"解析：σTs⁴≈429.4，F₀=0.95×(429.4−350)≈75.4 W/m²，为正表示地面净长波失热。漏掉逆辐射项会严重高估失热。","source":"上编 公式2-17"},{"id":143,"book":"大气","chapter":"第2章 大气辐射学","kp":"地面净辐射","q":"向下短波600 W/m²、地表反照率0.20、逆辐射350 W/m²、地表295 K、ε=0.95，地面净辐射R_n约为（ ）。","options":["524.6 W/m²","480.0 W/m²","404.6 W/m²","147.5 W/m²"],"answer":2,"explain":"解析：R_n=(1−A)S↓+εR_a−εσTs⁴=480+332.5−407.9≈404.6 W/m²。漏乘(1−A)会把反射的短波也算进收入。","source":"上编 公式2-18、2-19"},{"id":144,"book":"大气","chapter":"第2章 大气辐射学","kp":"半球辐照与各向同性辐射率","q":"各向同性辐射率I=100 W/(m²·sr)，其在水平面上的半球通量密度F=πI约为（ ）。","options":["100.0 W/m²","314.2 W/m²","628.3 W/m²","1256.6 W/m²"],"answer":1,"explain":"解析：对半球积分I cosθ dΩ得F=πI≈314.2 W/m²；2π是半球立体角，未计cosθ投影；4π是全球立体角。手册要点：只有I在半球内均匀时才用F=πI。","source":"上编 公式2-01、2-02"},{"id":145,"book":"大气","chapter":"第3章 大气热力学","kp":"潜热定义","q":"相变潜热是指（ ）。","options":["辐射能转化为内能时所吸收的热量","气块绝热膨胀所做的功","单位质量物质在相变时吸收或放出的热量，温度不变","单位质量物质温度升高1 K所需的热量"],"answer":2,"explain":"解析：手册3-D01：潜热是单位质量相变热。升温1 K所需热量是比热。","source":"上编 3-D01"},{"id":146,"book":"大气","chapter":"第3章 大气热力学","kp":"放热相变","q":"下列相变过程中放出潜热的是（ ）。","options":["蒸发、融化和升华过程","凝结、冻结和凝华","蒸发、冻结和升华","融化、凝结和升华"],"answer":1,"explain":"解析：手册3-D01：三种吸热（蒸发、融化、升华），三种放热（凝结、冻结、凝华）。手册要点：凝结、冻结和凝华放热。","source":"上编 3-D01"},{"id":147,"book":"大气","chapter":"第3章 大气热力学","kp":"升华潜热","q":"升华潜热L_s与蒸发潜热L_v、融化潜热L_f的关系是（ ）。","options":["L_s=L_v·L_f","L_s=L_f−L_v","L_s=L_v−L_f","L_s=L_v+L_f"],"answer":3,"explain":"解析：手册公式3-01：L_s=L_v+L_f，固→气等于固→液再液→气。升华相当于先融化再蒸发，两段吸收的潜热相加，所以L_s≈2.83×10⁶ J/kg，比L_v大，不可能是乘积或差值。","source":"上编 公式3-01"},{"id":148,"book":"大气","chapter":"第3章 大气热力学","kp":"过冷水定义","q":"过冷水是指（ ）。","options":["温度高于100℃的水","含盐的海水","温度低于0℃仍保持液态的水","结冰后的水"],"answer":2,"explain":"解析：手册3-D02：过冷水低于冰点仍为液态，是亚稳态，有冰核或扰动时易冻结。手册要点：过冷水是在低于相应压强下冰点的温度仍保持液态的水，大气中通常指0℃以下的液滴。","source":"上编 3-D02"},{"id":149,"book":"大气","chapter":"第3章 大气热力学","kp":"冰面水面饱和压","q":"同一负温下，冰面与过冷水面饱和水汽压的关系是（ ）。","options":["冰面大于过冷水面","无法比较","二者相等","冰面小于水面"],"answer":3,"explain":"解析：手册3-D02、公式3-02：T<273.15 K时e_si<e_sw，这是冰晶效应（贝吉龙过程）的基础。手册要点：低于0℃且同温时，冰面饱和水汽压小于过冷水面的值。","source":"上编 3-D02、公式3-02"},{"id":150,"book":"大气","chapter":"第3章 大气热力学","kp":"饱和水汽压影响因素","q":"饱和水汽压随下列因素的变化，正确的是（ ）。","options":["随温度升高而减小；曲率增大使其降低；溶质对其无影响","随温度升高而增大；溶质使其升高","随温度升高而增大；曲率增大使其升高；溶质使其降低","随温度升高而减小；曲率增大使其降低；溶质使其升高"],"answer":2,"explain":"解析：手册3-D03：饱和水汽压随温度增加，凸面曲率提高平衡水汽压，溶质降低平衡水汽压。手册要点：克劳修斯—克拉珀龙关系表明，它随温度升高而增大，且这种变化受相变潜热影响。","source":"上编 3-D03"},{"id":151,"book":"大气","chapter":"第3章 大气热力学","kp":"克-克方程","q":"描述饱和水汽压随温度变化的方程是（ ）。","options":["斯蒂芬—玻尔兹曼辐射定律","泊松方程","克劳修斯—克拉珀龙方程","静力方程"],"answer":2,"explain":"解析：手册公式3-02：de_s/dT≈Le_s/(R_vT²)。泊松方程描述干绝热温压关系。","source":"上编 公式3-02"},{"id":152,"book":"大气","chapter":"第3章 大气热力学","kp":"饱和水汽压非线性","q":"饱和水汽压随温度呈指数型增长，这意味着（ ）。","options":["低温时饱和水汽压变化更快","温度每升高1℃饱和水汽压增加同样的绝对量","与温度无关","暖空气饱和所能容纳的水汽远多于冷空气"],"answer":3,"explain":"解析：由克-克方程e_s随温度近似指数增长，高温时增量更大，这也是两气块混合可能过饱和的原因。手册要点：同一零下温度冰面饱和水汽压较低。","source":"上编 公式3-02、6-02"},{"id":153,"book":"大气","chapter":"第3章 大气热力学","kp":"热流量方程","q":"热力学第一定律用于干空气可写为（ ）。","options":["δQ=c_p dT+α dp","δQ=c_p dT−α dp","δQ=c_v dT−p dα","δQ=R_d dT"],"answer":1,"explain":"解析：手册公式3-03：δQ=c_v dT+p dα=c_p dT−α dp。手册要点：热流量方程是热力学第一定律在空气热力过程中的应用。","source":"上编 3-D04、公式3-03"},{"id":154,"book":"大气","chapter":"第3章 大气热力学","kp":"cp与cv关系","q":"干空气定压比热与定容比热之差等于（ ）。","options":["普适气体常数R*","干空气比气体常数R_d","0","g"],"answer":1,"explain":"解析：手册公式3-03：c_p−c_v=R_d（≈1004−717=287 J/(kg·K)）。迈耶关系c_p−c_v=R适用于单位质量的理想气体，对干空气就是R_d；普适气体常数R*是按摩尔计的。","source":"上编 公式3-03"},{"id":155,"book":"大气","chapter":"第3章 大气热力学","kp":"绝热上升冷却","q":"未饱和气块绝热上升时温度降低，是因为（ ）。","options":["水汽凝结时吸收热量使气块降温","气块向环境放出热量","气块膨胀对外做功，内能减少","吸收了长波辐射"],"answer":2,"explain":"解析：手册3-D04、3-P02：绝热上升气压降低，气块膨胀做功消耗内能而降温，与外界无热交换。手册要点：对准静态、仅有体积功的理想气体，外界供给的热量可用于增加内能和对外做功。","source":"上编 3-D04"},{"id":156,"book":"大气","chapter":"第3章 大气热力学","kp":"干绝热过程","q":"干绝热过程是指（ ）。","options":["空气块与外界等温膨胀的过程","饱和空气上升并凝结放热的过程","空气块与外界有热量交换但不做功、温度保持不变的状态变化","未饱和空气块与外界无热量交换、无相变的状态变化"],"answer":3,"explain":"解析：手册3-D05：干绝热无外界热交换，未饱和无相变。手册要点：干绝热指无相变的未饱和气块绝热过程。","source":"上编 3-D05"},{"id":157,"book":"大气","chapter":"第3章 大气热力学","kp":"假绝热过程","q":"假绝热过程的特点是（ ）。","options":["与外界有热交换，但凝结物保留","凝结物一旦生成即全部降落移出气块，为不可逆过程","只发生在未饱和空气中","凝结物全部保留在气块内，为可逆过程"],"answer":1,"explain":"解析：手册3-D05：可逆湿绝热保留凝结物；假绝热凝结物移出，不可逆。焚风即可用假绝热解释。","source":"上编 3-D05"},{"id":158,"book":"大气","chapter":"第3章 大气热力学","kp":"可逆湿绝热","q":"可逆湿绝热过程与假绝热过程的区别在于（ ）。","options":["前者凝结物保留在气块中，后者凝结物移出","前者有相变，后者没有相变","前者与外界有热交换，后者没有","二者完全相同"],"answer":0,"explain":"解析：手册3-D05：区别在凝结物是否保留，下降时可逆过程可再蒸发回到原状态。手册要点：可逆湿绝热中凝结物保留于气块，水总量守恒，下降时可再蒸发。","source":"上编 3-D05"},{"id":159,"book":"大气","chapter":"第3章 大气热力学","kp":"干绝热递减率","q":"干绝热直减率约为（ ）。","options":["9.8 K/km","4 K/km","34.1 K/km","6.5 K/km"],"answer":0,"explain":"解析：手册3-D06：Γd=g/c_p≈9.8 K/km；6.5是环境平均递减率；34.1是自动对流递减率。手册要点：干绝热递减率是同一未饱和气块绝热升降时温度随高度的变化率，约9.8 K·km⁻¹，不能与环境层结的气温递减率混同。","source":"上编 3-D06、公式3-06"},{"id":160,"book":"大气","chapter":"第3章 大气热力学","kp":"湿绝热递减率小","q":"湿绝热直减率小于干绝热直减率的原因是（ ）。","options":["饱和空气密度更大，下沉时增温更快","凝结释放潜热部分抵消了膨胀冷却","湿空气不膨胀","饱和空气比热容更大"],"answer":1,"explain":"解析：手册公式3-12：Γm<Γd，因凝结释放的潜热补偿了部分绝热冷却。饱和气块上升时水汽凝结放出潜热，抵消了部分膨胀冷却，所以降温变慢，这与密度或比热容大小无关。","source":"上编 公式3-11、3-12"},{"id":161,"book":"大气","chapter":"第3章 大气热力学","kp":"湿绝热率变化","q":"湿绝热直减率的数值特点是（ ）。","options":["恒大于干绝热率，约为9.8 K/km以上","恒为6.5 K/km，与温度和气压无关","随温度和气压变化，暖湿低层较小，高空冷处接近干绝热率","与温度无关"],"answer":2,"explain":"解析：手册公式3-12：Γm与r_s、T有关；暖湿时r_s大、潜热多，Γm小（可约4 K/km），冷高空r_s小，Γm接近Γd。Γm并非常数：暖湿低层可只有约4 K/km，高空冷而干时接近9.8 K/km，但始终小于干绝热率，6.5 K/km只是对流层平均递减率。","source":"上编 公式3-11、3-12"},{"id":162,"book":"大气","chapter":"第3章 大气热力学","kp":"位温定义","q":"位温θ是指（ ）。","options":["气块等压冷却到饱和时具有的温度","气块干绝热移到1000 hPa时具有的温度","气块等压冷却或加热到1000 hPa时的温度","气块的虚温"],"answer":1,"explain":"解析：手册3-D06：θ=T(1000/p)^κ，是干绝热移置到1000 hPa时的温度。手册要点：位温是把气块按干绝热过程移到参考气压1000 hPa时所具有的温度，用θ表示，理论计算采用K。","source":"上编 3-D06、公式3-08"},{"id":163,"book":"大气","chapter":"第3章 大气热力学","kp":"位温守恒","q":"位温在下列过程中保持不变的是（ ）。","options":["干绝热过程","辐射冷却过程","凝结加热过程","湍流混合加热"],"answer":0,"explain":"解析：手册3-D06：干绝热过程位温守恒；有凝结或辐射加热时位温改变。手册要点：位温是把气块按干绝热过程移到参考气压1000 hPa时所具有的温度，用θ表示，理论计算采用K。","source":"上编 3-D06、K3-03"},{"id":164,"book":"大气","chapter":"第3章 大气热力学","kp":"泊松常数","q":"泊松方程中κ=R_d/c_p约为（ ）。","options":["0.608","1.4","0.622","0.286"],"answer":3,"explain":"解析：κ≈287/1004≈0.286；0.622是ε=R_d/R_v；1.4是c_p/c_v；0.608用于虚温。代入R_d≈287、c_p≈1004即可算出0.286；其余三个数值分别对应ε、c_p/c_v和虚温系数，是常见混淆。","source":"上编 公式3-05"},{"id":165,"book":"大气","chapter":"第3章 大气热力学","kp":"干绝热上升位温","q":"干空气块绝热上升温度下降，其位温（ ）。","options":["下降","不变","先降后升","升高"],"answer":1,"explain":"解析：手册K3-03：气温下降但干绝热位温守恒（如K3-03两状态均约307.09 K）。位温是把气块干绝热移到1000 hPa时的温度，干绝热过程中气温与气压同步变化，θ=T(1000/p)^κ保持不变。","source":"上编 K3-03"},{"id":166,"book":"大气","chapter":"第3章 大气热力学","kp":"虚位温","q":"虚位温θ_v的作用是（ ）。","options":["只计入温度，不考虑水汽对密度的影响","综合考虑水汽对浮力的影响，用于湿空气稳定度和浮力判断","计入凝结潜热的作用，等同于假相当位温，只用于饱和湿空气","只用于饱和空气的稳定度判断"],"answer":1,"explain":"解析：手册公式3-09：θ_v≈θ(1+0.608q)，易错点是与假相当位温（含潜热）区分。虚位温只计入水汽使密度减小的效应，不含凝结潜热，因此不能等同于假相当位温，也不限于饱和空气。","source":"上编 公式3-09"},{"id":167,"book":"大气","chapter":"第3章 大气热力学","kp":"假相当位温定义","q":"假相当位温θ_se的定义过程是（ ）。","options":["气块等压冷却至饱和，再干绝热移到1000 hPa时的温度","气块等温压缩到1000 hPa时具有的温度","先干绝热升至凝结高度，再假绝热升至水汽凝尽，后干绝热降到1000 hPa","气块干绝热移到1000 hPa"],"answer":2,"explain":"解析：手册3-D07：先干绝热、再假绝热、凝结物移出、返回1000 hPa，干湿绝热过程中都近似守恒。手册要点：假相当位温是把湿空气先干绝热抬升至饱和，再假绝热抬升使水汽近乎全部凝结并移出，最后干绝热移至1000 hPa时的温度。","source":"上编 3-D07"},{"id":168,"book":"大气","chapter":"第3章 大气热力学","kp":"假相当位温守恒","q":"假相当位温在下列哪种过程中近似守恒（ ）。","options":["辐射冷却等非绝热过程","干绝热和湿绝热（假绝热）过程","只在有降水蒸发冷却的过程中守恒","只在等压加热和辐射冷却过程中守恒"],"answer":1,"explain":"解析：手册3-D07：θ_se在干、湿绝热过程中近似守恒，故常用于识别气团和判断对流性不稳定。手册要点：假相当位温是把湿空气先干绝热抬升至饱和，再假绝热抬升使水汽近乎全部凝结并移出，最后干绝热移至1000 hPa时的温度。","source":"上编 3-D07、公式3-13"},{"id":169,"book":"大气","chapter":"第3章 大气热力学","kp":"海陆热力差异","q":"海洋比陆地增温冷却慢，原因不包括（ ）。","options":["太阳辐射可透射到较深水层，且水体能混合","水的比热容大","海水的反照率远大于陆地","海面蒸发耗热多"],"answer":2,"explain":"解析：手册3-C01：比热、透射深度、水体混合、蒸发是主要原因。海水反照率通常小于陆地，不是原因。","source":"上编 3-C01"},{"id":170,"book":"大气","chapter":"第3章 大气热力学","kp":"海陆气温年变化","q":"与内陆相比，海洋性气候气温的年变化特点是（ ）。","options":["年较差小，最高最低温出现时间滞后","没有明显季节变化，全年等温","年较差大，最高最低温出现时间提前","年较差大，最高温出现在夏至前后"],"answer":0,"explain":"解析：手册3-C01：海洋增温冷却慢，温差小、滞后明显。手册要点：因而海洋具有较大热容量和较强调节作用，沿海地区温度日、年变化幅度一般小于同纬度内陆，但还受盛行风、洋流、地形、海拔和云况等影响。","source":"上编 3-C01"},{"id":171,"book":"大气","chapter":"第3章 大气热力学","kp":"绝对稳定判据","q":"环境递减率Γ小于湿绝热率Γm时，大气层结（ ）。","options":["绝对不稳定","绝对稳定","中性","条件性不稳定"],"answer":1,"explain":"解析：手册公式3-18：Γ<Γm绝对稳定；Γm<Γ<Γd条件不稳定；Γ>Γd绝对不稳定。手册要点：以γ表示环境气温随高降低的速率， Γ_d 、 Γ_m 分别为干、湿绝热递减率，通常 Γ_m < Γ_d 。","source":"上编 3-C02、公式3-18"},{"id":172,"book":"大气","chapter":"第3章 大气热力学","kp":"绝对不稳定判据","q":"环境递减率大于干绝热递减率时，大气层结为（ ）。","options":["绝对不稳定","条件性不稳定","对流性稳定","绝对稳定"],"answer":0,"explain":"解析：手册公式3-18：Γ>Γd时，无论饱和与否气块上升后都比环境暖，绝对不稳定。Γ>Γd时，无论气块是否饱和，上升后的降温率（Γd或Γm）都小于环境递减率，气块始终比环境暖而继续上升。","source":"上编 公式3-18"},{"id":173,"book":"大气","chapter":"第3章 大气热力学","kp":"条件性不稳定","q":"条件性不稳定是指（ ）。","options":["Γ>Γd，对任何气块都不稳定","Γm<Γ<Γd，对未饱和气块稳定、对饱和气块不稳定","∂θ_se/∂z>0，对饱和气块和未饱和气块都稳定，不会发展对流","Γ<Γm，对饱和气块也稳定"],"answer":1,"explain":"解析：手册3-C02、K3-05：同一环境对干湿气块稳定性不同，即条件性不稳定。手册要点：Γ_m <γ< Γ_d 为条件性不稳定，即未饱和气块稳定，饱和上升气块不稳定。","source":"上编 3-C02、K3-05"},{"id":174,"book":"大气","chapter":"第3章 大气热力学","kp":"位温判稳定","q":"用位温梯度判断干空气稳定度，∂θ/∂z>0表示（ ）。","options":["稳定","中性层结","饱和","不稳定"],"answer":0,"explain":"解析：手册公式3-17：∂θ/∂z=(θ/T)(Γd−Γ)，Γ<Γd即∂θ/∂z>0为稳定。∂θ/∂z=0为中性，∂θ/∂z<0为不稳定；位温梯度只反映干空气的稳定度，与是否饱和无关。","source":"上编 公式3-17"},{"id":175,"book":"大气","chapter":"第3章 大气热力学","kp":"气块法前提","q":"用气块法判断稳定度时，必须区分（ ）。","options":["地面风速与风向的变化","环境递减率与气块（干或湿绝热）递减率","白天与夜间的辐射差异","地面风速、地面温度与露点三者之间的差异"],"answer":1,"explain":"解析：手册3-C02：环境与气块分开，比较γ与Γ，并考虑是否饱和，等号为中性边界。手册要点：以γ表示环境气温随高降低的速率， Γ_d 、 Γ_m 分别为干、湿绝热递减率，通常 Γ_m < Γ_d 。","source":"上编 3-C02"},{"id":176,"book":"大气","chapter":"第3章 大气热力学","kp":"条件性与对流性不稳定","q":"条件性不稳定与对流性（位势）不稳定的主要区别是（ ）。","options":["前者针对整层抬升后的不稳定，后者针对局地气块当前判据","前者针对局地气块当前判据，后者针对整层抬升后的不稳定","后者只发生在平流层","前者用θ_se判断，后者用递减率判断"],"answer":1,"explain":"解析：手册3-C03：条件性不稳定看当前局地层结与饱和状态；对流性不稳定看整层抬升，用∂θ_se/∂z判断。手册要点：对流性不稳定又称位势不稳定，描述整层气体抬升后可能发展出的不稳定，常用假相当位温随高度减小来识别。","source":"上编 3-C03"},{"id":177,"book":"大气","chapter":"第3章 大气热力学","kp":"对流性不稳定判据","q":"整层抬升时位势（对流性）不稳定的判据是（ ）。","options":["Γ<Γm","∂θ_se/∂z<0","∂θ_se/∂z>0","∂θ/∂z>0"],"answer":1,"explain":"解析：手册公式3-20：∂θ_se/∂z<0位势不稳定；=0中性；>0稳定。θ_se随高度减小时，整层抬升饱和后上层降温比下层快，层结变得不稳定，所以∂θ_se/∂z<0才是位势不稳定。","source":"上编 公式3-20"},{"id":178,"book":"大气","chapter":"第3章 大气热力学","kp":"对流性不稳定配置","q":"最容易形成对流性不稳定的气层配置是（ ）。","options":["上下都很干","上暖下冷的逆温","下干上湿","下湿上干"],"answer":3,"explain":"解析：手册3-C03：下湿上干时θ_se随高度减小，整层抬升后下层先饱和、变得不稳定。手册要点：典型下湿上干气层抬升时，下部先饱和后按较小湿绝热率冷却，上部仍按干绝热率较快冷却，层内温差增大而趋于不稳定。","source":"上编 3-C03"},{"id":179,"book":"大气","chapter":"第3章 大气热力学","kp":"水循环环节","q":"地球水循环的主要环节包括（ ）。","options":["光合作用、呼吸作用、固氮与反硝化","光合作用、呼吸作用和分解作用","蒸发蒸腾、水汽输送、凝结降水、径流与下渗","只有蒸发和降水"],"answer":2,"explain":"解析：手册3-P01：蒸发蒸腾、输送、凝结降水、径流下渗及储量变化。手册要点：海上降水可直接回归海洋，陆地降水则通过径流、下渗和地下水流回海洋，或再次蒸发、蒸腾进入大气，冰雪还可暂时储水。","source":"上编 3-P01"},{"id":180,"book":"大气","chapter":"第3章 大气热力学","kp":"海陆水量收支","q":"全球多年平均而言，海洋与陆地的水量收支特点是（ ）。","options":["二者各自收支为零，无需径流补偿","海洋蒸发多于降水，陆地降水多于蒸发，差额由径流返回海洋","陆地蒸发多于降水，由海洋向陆输送补偿","海洋降水多于蒸发，陆地蒸发多于降水，差额由大气从陆地输回海洋"],"answer":1,"explain":"解析：手册3-P01：海陆收支不平衡由大气水汽输送和地表径流补偿。手册要点：在长期平均且储水变化可忽略时，全球蒸发与降水近似平衡，陆地降水超过蒸发的部分主要由径流输出，海洋蒸发超过降水的部分主要由大气输送至陆地。","source":"上编 3-P01"},{"id":181,"book":"大气","chapter":"第3章 大气热力学","kp":"LCL定义","q":"抬升凝结高度是（ ）。","options":["未饱和气块干绝热上升到温度等于露点而开始凝结的高度","气块开始自由对流、浮力转正的高度","气块浮力为零、对流终止的高度","未饱和气块等压冷却到露点、在原高度上开始凝结时的温度和高度"],"answer":0,"explain":"解析：手册3-P02、公式3-10：上升中T按干绝热下降比露点快，二者相等处即LCL。浮力转正处是自由对流高度。","source":"上编 3-P02、公式3-10"},{"id":182,"book":"大气","chapter":"第3章 大气热力学","kp":"LCL系数","q":"估算抬升凝结高度的经验式z≈125(T−T_d)中，125的来源是（ ）。","options":["干绝热递减率与露点递减率之差约8 K/km的倒数","干绝热递减率约10 K/km的倒数","湿绝热递减率约6 K/km的倒数","干绝热递减率与湿绝热递减率之差约4 K/km的倒数再乘以2"],"answer":0,"explain":"解析：气块T降9.8 K/km，露点约降1.7—2 K/km，差约8 K/km，1000/8=125 m/K。未饱和气块上升时温度按约9.8 K/km下降，露点只按约1.7—2 K/km下降，二者以约8 K/km的速度接近，温度露点差除以8 K/km即得凝结高度。","source":"上编 公式3-10"},{"id":183,"book":"大气","chapter":"第3章 大气热力学","kp":"焚风定义","q":"焚风是指（ ）。","options":["台风外围由海上吹来的大风","冬季由高原吹向平原、沿途下沉降温的干冷风","山谷中夜间沿坡下滑的冷风","气流越山后在背风坡下沉增温形成的干热风"],"answer":3,"explain":"解析：手册3-P02：迎风坡湿绝热上升并降水移出，背风坡干绝热下沉，温度高于山前同高度，湿度更低。焚风的关键是越山后在背风坡下沉绝热增温，所以又干又热，沿坡下滑的冷风是山风，降温的干冷风则与焚风相反。","source":"上编 3-P02"},{"id":184,"book":"大气","chapter":"第3章 大气热力学","kp":"焚风增温原因","q":"焚风使背风坡比山前暖的根本原因是（ ）。","options":["迎风坡凝结释放的潜热随水分降落留在空气中，背风坡按干绝热下沉增温","背风坡来自南方的暖平流与较强日照共同作用，使气温升高","背风坡日照时间更长，地面加热更强","背风坡地面反照率低，吸收短波更多"],"answer":0,"explain":"解析：手册3-P02：迎风湿绝热（降温慢）、背风干绝热（增温快），降水移出使过程不可逆。手册要点：凝结物部分移出后，背风坡空气下降，以干绝热压缩增温为主。","source":"上编 3-P02、拿分册模板5"},{"id":185,"book":"大气","chapter":"第3章 大气热力学","kp":"无降水焚风","q":"若越山气流在迎风坡凝结但没有任何降水落出，下沉过程中凝结物再蒸发，则背风坡（ ）。","options":["气温比山前更低，出现冷风","增温效应明显减弱，接近可逆过程","增温更强，比有降水时更热","一定出现降雪"],"answer":1,"explain":"解析：焚风增温依赖假绝热的不可逆性（凝结物移出）；凝结物保留即可逆湿绝热，下沉时再蒸发吸热。手册要点：可逆湿绝热中凝结物保留于气块，水总量守恒，下降时可再蒸发。","source":"上编 3-D05、3-P02"},{"id":186,"book":"大气","chapter":"第3章 大气热力学","kp":"T-lnp图","q":"在温度—对数压力图上，CAPE对应于（ ）。","options":["环境曲线与干绝热线之间的全部面积","抬升凝结高度以下的负面积","自由对流高度到平衡高度之间状态曲线位于环境曲线右侧的正面积","地面到对流层顶之间环境曲线位于状态曲线右侧的全部负面积之和"],"answer":2,"explain":"解析：手册3-P03、公式3-21：CAPE=∫_LFC^EL max(B,0)dz，对应正浮力面积。手册要点：CAPE是两者之间的正浮力积分，CIN表示到达自由对流高度前需克服的负浮力能量，单位J·kg⁻¹。","source":"上编 3-P03、公式3-19"},{"id":187,"book":"大气","chapter":"第3章 大气热力学","kp":"CIN含义","q":"对流抑制能量CIN表示（ ）。","options":["气块到达平衡高度后继续上升时所需克服的正浮力能量","气块从地面抬升到自由对流高度需克服的负浮力能量","气块在自由对流后获得的能量","水汽在上升中凝结释放的总热量"],"answer":1,"explain":"解析：手册3-P03：CIN是LFC以下负浮力积分（取正值），需触发机制克服。手册要点：CAPE是两者之间的正浮力积分，CIN表示到达自由对流高度前需克服的负浮力能量，单位J·kg⁻¹。","source":"上编 3-P03"},{"id":188,"book":"大气","chapter":"第3章 大气热力学","kp":"自由对流高度","q":"自由对流高度LFC是指（ ）。","options":["对流层顶","气块浮力减为零而停止上升的高度","气块在此高度以上开始比环境暖而自由上升","气块开始凝结的高度"],"answer":2,"explain":"解析：手册3-P03：LCL是凝结高度；LFC以上气块正浮力；EL（平衡高度）以上浮力转负。手册要点：气块越过下方负浮力区、可自由上升的高度称自由对流高度。","source":"上编 3-P03"},{"id":189,"book":"大气","chapter":"第3章 大气热力学","kp":"浮力表达式","q":"气块浮力加速度近似为（ ）。","options":["B≈fV","B≈ρg","B≈g(T_ve−T_vp)/T_vp","B≈g(T_vp−T_ve)/T_ve"],"answer":3,"explain":"解析：手册公式3-19：B≈g(T_v,p−T_v,e)/T_v,e，气块比环境暖为正浮力。气块虚温高于环境时为正浮力向上加速，把分子分母颠倒就成了负号；fV是科氏力，ρg是重力项，都不是浮力加速度。","source":"上编 公式3-19"},{"id":190,"book":"大气","chapter":"第3章 大气热力学","kp":"热对流条件","q":"热对流发展需要的条件不包括（ ）。","options":["不稳定层结","强逆温层贴地覆盖且无任何抬升","触发机制（克服CIN）","充足水汽"],"answer":1,"explain":"解析：手册3-E01：水汽、不稳定、触发、克服CIN；贴地逆温增大CIN，抑制对流。贴地强逆温使CIN很大，又没有抬升触发，热对流无法发展，其余三项正是热对流所需的条件。","source":"上编 3-E01"},{"id":191,"book":"大气","chapter":"第3章 大气热力学","kp":"夹卷作用","q":"对流云发展过程中环境干空气被夹卷进入，通常会（ ）。","options":["使CAPE增大一倍，对流随之增强","增强云内浮力，促进上升","使云内气块浮力减小，削弱对流","不影响对流"],"answer":2,"explain":"解析：手册3-E01：夹卷混入干冷环境空气，蒸发冷却，降低浮力；因此实际上升速度远小于√(2CAPE)。手册要点：夹卷较冷、较干空气会因混合及云水蒸发而降温、减小浮力，通常削弱发展。","source":"上编 3-E01、K3-06"},{"id":192,"book":"大气","chapter":"第3章 大气热力学","kp":"稳定度日变化","q":"晴天陆地近地层稳定度的日变化通常是（ ）。","options":["白天稳定，夜间趋于不稳定","只受风速影响，无明显日变化","白天地面加热趋于不稳定，夜间辐射冷却趋于稳定","白天地面冷却趋于稳定，夜间辐射加热趋于不稳定"],"answer":2,"explain":"解析：手册3-E01与5-P01：白天加热增大递减率，夜间辐射冷却形成逆温。手册要点：日落后地面净失热，近地面空气冷却形成浅薄稳定边界层，白天混合层的上部转为残余层。","source":"上编 3-E01、5-P01"},{"id":193,"book":"大气","chapter":"第3章 大气热力学","kp":"湿静力能","q":"湿静力能h_m=c_pT+gz+L_vq在什么条件下近似守恒（ ）。","options":["有强辐射加热或冷却时","只有干绝热过程","有降水蒸发冷却等非绝热过程时","绝热、无混合的干、湿过程中"],"answer":3,"explain":"解析：手册公式3-15：绝热无混合时dh_m≈0；实际辐射与混合会改变。手册要点：绝热无混合、气块环境温差小，忽略动能及水物质修正时近似守恒。","source":"上编 公式3-15"},{"id":194,"book":"大气","chapter":"第3章 大气热力学","kp":"干静力能","q":"干静力能h_d=c_pT+gz在干绝热过程中守恒，这与下列哪一结论等价（ ）。","options":["干绝热递减率为g/c_p","湿绝热递减率小于干绝热递减率","位温随高度增加","气压随高度指数下降"],"answer":0,"explain":"解析：dh_d=c_pdT+gdz=0⟹−dT/dz=g/c_p=Γd。绝热无加热时c_pdT+gdz=0，整理得−dT/dz=g/c_p，所以h_d守恒与干绝热递减率等价，与湿绝热或气压廓线无关。","source":"上编 公式3-15、3-06"},{"id":195,"book":"大气","chapter":"第3章 大气热力学","kp":"等压冷却与露点","q":"夜间近地面空气等压冷却，当温度降到露点时（ ）。","options":["相对湿度降低，空气更干","空气达到饱和，可能形成露、雾","混合比增加，水汽增多","空气开始绝热上升"],"answer":1,"explain":"解析：露点是等压冷却至饱和的温度，到达露点后继续冷却出现凝结（露、霜、雾）。手册要点：露点是湿空气在水汽含量不变、等压冷却至对水面饱和时的温度。","source":"上编 1-D05、3-P02"},{"id":196,"book":"大气","chapter":"第3章 大气热力学","kp":"上升气流降温","q":"“空气上升冷却”的根本机理是（ ）。","options":["高空太阳辐射弱，加热减少","气压降低导致膨胀做功，内能减少","上升时吸收水汽，蒸发吸热","上层空气辐射更强"],"answer":1,"explain":"解析：手册3-P02关键词“膨胀做功冷却”；与外界无热交换也会降温，这是绝热冷却。手册要点：未饱和气块上升时外界气压降低，气块膨胀做功而降温。","source":"上编 3-P02"},{"id":197,"book":"大气","chapter":"第3章 大气热力学","kp":"凝结潜热释放","q":"每千克空气中凝结出5.0 g水，L_v=2.5×10⁶ J/kg，释放潜热约为（ ）。","options":["1.67 kJ/kg","0.12 kJ/kg","12.50 kJ/kg","12500.00 kJ/kg"],"answer":2,"explain":"解析：δQ=LΔq=2.5×10⁶×0.005=1.25×10⁴ J/kg=12.50 kJ/kg。凝结量须换为kg/kg；把g直接代入会大1000倍。","source":"上编 公式3-01、K3-01"},{"id":198,"book":"大气","chapter":"第3章 大气热力学","kp":"潜热转为升温","q":"每千克空气获得12.5 kJ潜热，c_p=1004 J/(kg·K)，等压下升温约为（ ）。","options":["2.99 K","12.45 K","17.43 K","1.25 K"],"answer":1,"explain":"解析：ΔT=δQ/c_p=12500/1004≈12.45 K。用c_v=717是定容过程；用水的比热4186概念错误。","source":"上编 K3-01"},{"id":199,"book":"大气","chapter":"第3章 大气热力学","kp":"泊松方程干绝热变温","q":"干空气块由1000 hPa、20.0℃干绝热膨胀到800 hPa，温度约为（ ）。","options":["-38.6℃","18.8℃","1.9℃","-138.8℃"],"answer":2,"explain":"解析：T₂=T₁(p₂/p₁)^κ=293.15×0.8^0.286≈275.03 K≈1.9℃。泊松方程必须用K；用℃代入会得到错误比例。","source":"上编 公式3-05~3-08"},{"id":200,"book":"大气","chapter":"第3章 大气热力学","kp":"位温计算","q":"700 hPa处气温280 K，取κ=0.286，位温θ约为（ ）。","options":["252.8 K","310.1 K","309.4 K","400.0 K"],"answer":1,"explain":"解析：θ=T(1000/p)^κ=280×(1000/700)^0.286≈310.1 K。指数底数倒置得到的是该层气块压缩到700 hPa的情况，方向相反。","source":"上编 公式3-05~3-08、K3-03"},{"id":201,"book":"大气","chapter":"第3章 大气热力学","kp":"干绝热递减率","q":"取g=9.8 m/s²、c_p=1004 J/(kg·K)，干绝热递减率Γd=g/c_p约为（ ）。","options":["34.15 K/km","6.50 K/km","13.67 K/km","9.76 K/km"],"answer":3,"explain":"解析：Γd=g/c_p=9.8/1004≈9.76 K/km。用c_v或R_d分别得到13.7和34.1 K/km，均不是干绝热率。","source":"上编 公式3-05~3-08"},{"id":202,"book":"大气","chapter":"第3章 大气热力学","kp":"抬升凝结高度估算","q":"地面气温22℃、露点10℃，用z_LCL≈125(T−T_d)估算抬升凝结高度约为（ ）。","options":["1500 m","1342 m","1200 m","1176 m"],"answer":0,"explain":"解析：z_LCL≈125×(22−10)=1500 m。系数125来自干绝热率与露点递减率之差（约8 K/km）。","source":"上编 公式3-10、拿分册模板5"},{"id":203,"book":"大气","chapter":"第3章 大气热力学","kp":"焚风背风坡温度","q":"山前地面22℃，凝结高度1.5 km，山顶3.0 km，湿绝热率取6.5℃/km、干绝热率9.8℃/km，水汽在迎风坡全部降落，背风山脚（0 m）温度约为（ ）。","options":["22.0℃","30.0℃","27.0℃","17.0℃"],"answer":2,"explain":"解析：LCL处22−14.7=7.3℃，山顶7.3−6.5×1.5≈-2.45℃，背风干绝热下沉：-2.45+9.8×3≈27.0℃，比山前暖约5℃。背风坡若按湿绝热计算就体现不出焚风增温。","source":"上编 公式3-16、拿分册模板5"},{"id":204,"book":"大气","chapter":"第3章 大气热力学","kp":"焚风山顶温度","q":"迎风坡山脚30.0℃，LCL为1.0 km，山顶2.5 km，Γd=9.8℃/km、Γm=6.0℃/km，山顶温度约为（ ）。","options":["5.5℃","9.0℃","15.0℃","11.2℃"],"answer":3,"explain":"解析：LCL以下干绝热：30−9.8=20.2℃；以上湿绝热：20.2−6.0×1.5=11.2℃。全程干绝热会少算凝结潜热的作用。","source":"上编 公式3-16"},{"id":205,"book":"大气","chapter":"第3章 大气热力学","kp":"CAPE与最大上升速度","q":"某探空CAPE=240 J/kg，忽略CIN、夹卷与降水负载，从LFC零初速起算的理论最大上升速度w_max=√(2CAPE)约为（ ）。","options":["43.82 m/s","15.49 m/s","21.91 m/s","24.00 m/s"],"answer":2,"explain":"解析：动能½w²=CAPE，w=√(2×240)≈21.91 m/s。漏乘2得15.49 m/s；实际受夹卷与拖曳影响远小于理论值。","source":"上编 公式3-19、3-21、K3-06"},{"id":206,"book":"大气","chapter":"第3章 大气热力学","kp":"位温垂直梯度","q":"环境递减率6.5 K/km，T=290 K、θ=300 K，由∂θ/∂z=(θ/T)(Γd−Γ)，位温垂直梯度约为（ ）。","options":["3.30 K/km","16.86 K/km","-3.41 K/km","3.41 K/km"],"answer":3,"explain":"解析：∂θ/∂z=(300/290)×(9.8−6.5)≈3.41 K/km>0，对未饱和气块稳定。符号取负会把稳定层结误判为不稳定。","source":"上编 公式3-17、3-18"},{"id":207,"book":"大气","chapter":"第3章 大气热力学","kp":"等压加热焓变","q":"1 kg干空气等压加热升温10 K，c_p=1004、c_v=717 J/(kg·K)，吸热Q约为（ ）。","options":["2.87 kJ","14.00 kJ","10.04 kJ","7.17 kJ"],"answer":2,"explain":"解析：等压过程Q=c_pΔT=1004×10=10.04 kJ，其中内能增加c_vΔT=7.17 kJ，膨胀做功R_dΔT=2.87 kJ。7.17 kJ只是内能部分。","source":"上编 公式3-03、3-04、K3-02"},{"id":208,"book":"大气","chapter":"第3章 大气热力学","kp":"等压加热膨胀功","q":"1 kg干空气等压升温10 K，对外膨胀做功R_dΔT约为（ ）。","options":["10.04 kJ","7.17 kJ","1.00 kJ","2.87 kJ"],"answer":3,"explain":"解析：W=pΔα=R_dΔT=287×10=2870 J=2.87 kJ，等于c_p−c_v乘以ΔT。7.17 kJ是内能增量。","source":"上编 K3-02"},{"id":209,"book":"大气","chapter":"第3章 大气热力学","kp":"虚位温","q":"位温300 K、比湿15 g/kg，虚位温θv≈θ(1+0.608q)约为（ ）。","options":["302.74 K","300.50 K","297.26 K","301.70 K"],"answer":0,"explain":"解析：θv≈300×(1+0.608×0.015)≈302.74 K。虚位温用于考虑水汽的浮力，与假相当位温（包含潜热）不同。","source":"上编 公式3-09"},{"id":210,"book":"大气","chapter":"第3章 大气热力学","kp":"湿静力能","q":"T=300 K、z=1000 m、q=15 g/kg，取c_p=1004、L_v=2.5×10⁶，湿静力能h_m=c_pT+gz+L_vq约为（ ）。","options":["338.7 kJ/kg","37811.0 kJ/kg","348.5 kJ/kg","311.0 kJ/kg"],"answer":2,"explain":"解析：h_m=301.2+9.8+37.5≈348.5 kJ/kg。漏掉潜热项是干静力能；q须用kg/kg。","source":"上编 公式3-15"},{"id":211,"book":"大气","chapter":"第3章 大气热力学","kp":"浮力加速度","q":"500 m处环境温度286.5 K，干绝热上升的气块285.1 K，浮力加速度B≈g(T_p−T_e)/T_e约为（ ）。","options":["0.0479 m/s²","-13.7200 m/s²","-0.0479 m/s²","0.0342 m/s²"],"answer":2,"explain":"解析：B=9.8×(−1.4)/286.5≈-0.0479 m/s²，为负，气块比环境冷而下沉回复，对未饱和扰动稳定。气块比环境冷1.4 K，浮力为负，加速度方向向下，数值约为−0.048 m/s²，选项中的正值弄错了符号，其余数值则代错了量。","source":"上编 K3-05"},{"id":212,"book":"大气","chapter":"第4章 大气动力学","kp":"气压梯度力方向","q":"水平气压梯度力的方向是（ ）。","options":["指向地心，与重力同向","平行于等压线，高压在右","垂直于等压线，由高压指向低压","由低压指向高压"],"answer":2,"explain":"解析：手册4-D01：气压梯度力由气压分布不均引起，垂直于等压线、由高压指向低压，大小与气压梯度成正比、与密度成反比。手册要点：单位质量受力随气压梯度增大而增大、随密度增大而减小，其水平分量是空气水平运动的直接动力。","source":"上编 4-D01"},{"id":213,"book":"大气","chapter":"第4章 大气动力学","kp":"气压梯度力大小","q":"单位质量空气受到的水平气压梯度力（ ）。","options":["与纬度正弦成正比，与风速无关","与风速成正比","与气压梯度成正比，与空气密度成反比","与空气密度成正比，与气压梯度成反比关系"],"answer":2,"explain":"解析：手册公式4-02：a_p=−(1/ρ)∇p。与纬度正弦成正比的是科氏参数。","source":"上编 公式4-02"},{"id":214,"book":"大气","chapter":"第4章 大气动力学","kp":"水平压差比较","q":"比较水平气压梯度时，必须注意（ ）。","options":["可在不同高度上直接比较气压","与高度无关，可直接比较不同海拔地面站点的本站气压","在同一高度上比较气压（或在同一等压面上比较高度）","只看海平面以上任意两点的气压"],"answer":2,"explain":"解析：手册公式4-02：水平压差须在同一高度比较；等压面上则用位势高度梯度。气压随高度迅速减小，若在不同高度比较，主要体现的是高度差而不是水平梯度，所以本站气压必须先订正到同一高度。","source":"上编 公式4-02"},{"id":215,"book":"大气","chapter":"第4章 大气动力学","kp":"物质导数","q":"物质导数DA/Dt与局地导数∂A/∂t的关系是（ ）。","options":["DA/Dt=∂A/∂t+V·∇A","DA/Dt=V·∇A","DA/Dt=∂A/∂t−V·∇A","二者恒等"],"answer":0,"explain":"解析：手册公式4-01：随气块变化=局地变化+平流项。手册要点：平流导致的定点温度倾向为−V·∇T，不能与物质导数展开中的正平流项混淆。","source":"上编 公式4-01"},{"id":216,"book":"大气","chapter":"第4章 大气动力学","kp":"局地变化与平流","q":"某站气温上升，而气块本身绝热无加热（DT/Dt=0），则升温原因是（ ）。","options":["暖平流（−V·∇T>0）","地转偏向力对气块做功","太阳辐射使气块内部直接加热","地面摩擦使气块减速生热"],"answer":0,"explain":"解析：由∂T/∂t=DT/Dt−V·∇T，DT/Dt=0时局地升温来自平流项，即暖平流。手册要点：平流导致的定点温度倾向为−V·∇T，不能与物质导数展开中的正平流项混淆。","source":"上编 公式4-01、4-19"},{"id":217,"book":"大气","chapter":"第4章 大气动力学","kp":"科氏力性质","q":"关于科里奥利力，下列说法错误的是（ ）。","options":["科氏力只在旋转参照系中出现","科氏力垂直于相对速度","科氏力会改变风速大小","北半球科氏力使运动向右偏"],"answer":2,"explain":"解析：手册4-D02：科氏力垂直于相对速度，不做功，只改变方向不改变速率。科氏力始终垂直于相对速度，不做功，因此只改变风向，不改变风速大小，其余选项都是正确的表述。","source":"上编 4-D02"},{"id":218,"book":"大气","chapter":"第4章 大气动力学","kp":"科氏偏向","q":"北半球水平运动受科氏力作用偏向（ ）。","options":["始终向赤道","运动方向右侧","运动方向左侧","始终向东"],"answer":1,"explain":"解析：科氏力是地球旋转参照系中的惯性力，垂直于空气的相对速度、不做功（手册4-D02：北右南左）。易错提醒：相对地面静止或速度平行地轴时完整科氏力为零；赤道地转参数为零，不能由此说赤道一切运动的完整科氏力都为零。","source":"上编 4-D02"},{"id":219,"book":"大气","chapter":"第4章 大气动力学","kp":"地转参数","q":"地转参数f的表达式是（ ）。","options":["f=2Ωtanφ","f=2Ωsinφ","f=2Ωcosφ","f=Ωsinφ"],"answer":1,"explain":"解析：手册公式4-03：f为地球自转角速度铅直投影的两倍，f=2Ωsinφ，北正南负。手册要点：地转参数f为地球自转角速度在当地铅直方向投影的两倍，随纬度而变。","source":"上编 4-D02、公式4-03"},{"id":220,"book":"大气","chapter":"第4章 大气动力学","kp":"赤道f","q":"赤道上地转参数f的值为（ ）。","options":["−2Ω","2Ω","最大","0"],"answer":3,"explain":"解析：sin0°=0，赤道f=0，地转风公式不能直接使用；台风也难以在赤道附近生成。f=2Ωsinφ，φ=0时f=0，赤道上科氏力的水平分量消失，所以既不是最大，也不是±2Ω。","source":"上编 公式4-03、单元5"},{"id":221,"book":"大气","chapter":"第4章 大气动力学","kp":"地球自转角速度","q":"地球自转角速度Ω约为（ ）。","options":["2π s⁻¹","1.0×10⁻⁴ s⁻¹","7.292×10⁻⁵ s⁻¹","7.292×10⁻³ s⁻¹"],"answer":2,"explain":"解析：Ω=2π/(1恒星日)≈7.292×10⁻⁵ s⁻¹；中纬度f约10⁻⁴ s⁻¹。地球一恒星日约86164 s自转一周，Ω=2π/86164≈7.292×10⁻⁵ s⁻¹，2π s⁻¹相当于每秒转一圈，1.0×10⁻⁴ s⁻¹是中纬度f的量级。","source":"上编 公式4-03"},{"id":222,"book":"大气","chapter":"第4章 大气动力学","kp":"科氏力与纬度","q":"同样风速下，水平科氏力随纬度（ ）。","options":["减小，赤道最大","增大，极地最大，赤道为零","不变，与纬度无关","赤道最大，向两极方向逐渐减小"],"answer":1,"explain":"解析：水平科氏力大小为fV=2ΩVsinφ，随纬度增大。sinφ在赤道为0、在极地为1，所以同样风速下水平科氏力在赤道为零、在极地最大，与纬度无关的说法不对。","source":"上编 公式4-03"},{"id":223,"book":"大气","chapter":"第4章 大气动力学","kp":"地转风定义","q":"地转风是（ ）。","options":["近地面斜穿等压线吹向低压的风","水平气压梯度力与科氏力平衡时的匀速直线风","气压梯度力与摩擦力平衡时的风","离心力与气压梯度力平衡时的曲线风，科氏力可忽略"],"answer":1,"explain":"解析：手册4-D03：地转风是气压梯度力与科氏力平衡的无摩擦、无曲率匀速直线运动，适于中纬度自由大气。手册要点：风速与水平气压梯度成正比，与|f|及密度成反比，主要近似中纬度自由大气的大尺度运动。","source":"上编 4-D03"},{"id":224,"book":"大气","chapter":"第4章 大气动力学","kp":"地转风方向","q":"北半球地转风的方向是（ ）。","options":["斜穿等压线由低压指向高压","平行于等压线，背风而立高压在左","垂直于等压线指向低压","平行于等压线，背风而立高压在右、低压在左"],"answer":3,"explain":"解析：手册4-D03与白贝罗定律：北半球背风而立，低压在左、高压在右。手册要点：它平行等压线，北半球沿运动方向低压在左。","source":"上编 4-D03、单元5"},{"id":225,"book":"大气","chapter":"第4章 大气动力学","kp":"地转风大小","q":"地转风速大小与等压线疏密的关系是（ ）。","options":["只取决于纬度","等压线越密，地转风越小","等压线越密，地转风越大","与等压线疏密无关"],"answer":2,"explain":"解析：V_g=(1/ρf)∣∇p∣，气压梯度越大（等压线越密）风越大。地转风是气压梯度力与科氏力平衡的风，梯度越大，平衡所需的科氏力越大，风速也越大，所以等压线越密风越大。","source":"上编 公式4-11"},{"id":226,"book":"大气","chapter":"第4章 大气动力学","kp":"地转风与纬度","q":"同样气压梯度和密度下，纬度越高地转风速（ ）。","options":["越小","先增后减","不变","越大"],"answer":0,"explain":"解析：V_g∝1/f，高纬f大，同样梯度下地转风较小。同样的气压梯度力由更大的f来平衡，所需风速就更小，所以高纬地转风小，低纬地转风大，赤道附近则不适用。","source":"上编 公式4-11"},{"id":227,"book":"大气","chapter":"第4章 大气动力学","kp":"地转风分量","q":"地转风分量u_g的表达式是（ ）。","options":["u_g=(1/fρ)∂p/∂y（无负号）","u_g=−(1/ρ)∂p/∂x","u_g=(1/fρ)∂p/∂x","u_g=−(1/fρ)∂p/∂y"],"answer":3,"explain":"解析：手册公式4-11：u_g=−p_y/(fρ)，v_g=p_x/(fρ)。气压向北减小（p_y<0）时为西风。","source":"上编 公式4-11"},{"id":228,"book":"大气","chapter":"第4章 大气动力学","kp":"等压面地转风","q":"等压面上地转风的表达式中采用的是（ ）。","options":["气压梯度和空气密度","位势高度梯度，与密度无关","湿度梯度与温度","温度梯度"],"answer":1,"explain":"解析：手册公式4-12：V_g=(g₀/f)k×∇_pZ，等压面上不出现密度。在等压面坐标中，气压梯度力写成−g∇_pZ，密度被消去，所以等压面图上可直接用等高线疏密判断地转风大小。","source":"上编 公式4-12"},{"id":229,"book":"大气","chapter":"第4章 大气动力学","kp":"气压向北减小风向","q":"北半球中纬度同一高度气压向北递减时，地转风为（ ）。","options":["偏南风","西风","北风","东风"],"answer":1,"explain":"解析：手册K4-01：气压梯度力向北，科氏力须向南平衡，北半球右偏，故风向东吹，为西风。气压向北递减时，气压梯度力指向北，北半球科氏力指向运动方向右侧，平衡时风向东吹，所以是西风，不是南风或东风。","source":"上编 K4-01"},{"id":230,"book":"大气","chapter":"第4章 大气动力学","kp":"梯度风定义","q":"梯度风是指（ ）。","options":["气压梯度力与科氏力平衡的直线运动","只受惯性离心力和摩擦力作用的风","近地面摩擦力、气压梯度力与科氏力三者平衡，并斜穿等压线吹向低压一侧的运动","无摩擦条件下，气压梯度力、科氏力和惯性离心力三者平衡的水平曲线运动"],"answer":3,"explain":"解析：手册4-D04：梯度风无摩擦、无切向加速度，沿曲线运动；曲率趋零时退化为地转风。手册要点：梯度风是忽略摩擦、无切向加速度的水平曲线运动，其气压梯度力与科氏力的合力提供向心加速度。","source":"上编 4-D04"},{"id":231,"book":"大气","chapter":"第4章 大气动力学","kp":"气旋次地转","q":"同样气压梯度下，北半球低压（气旋）中的梯度风与地转风相比（ ）。","options":["等于地转风（与曲率无关）","小于地转风（次地转）","方向相反（反地转）","大于地转风"],"answer":1,"explain":"解析：手册4-C01、K4-02：气旋式环流中离心力与科氏力同向，梯度风小于地转风；正常反气旋超地转。手册要点：在同纬度、同密度和同气压梯度下，正常气旋中气压梯度力向内，科氏力向外，还须留下向心合力，因此梯度风小于地转风。","source":"上编 4-C01、K4-02"},{"id":232,"book":"大气","chapter":"第4章 大气动力学","kp":"反气旋超地转","q":"北半球正常反气旋中梯度风与地转风相比（ ）。","options":["大于地转风（超地转）","为零（静风）","恒等于地转风","小于地转风（次地转）"],"answer":0,"explain":"解析：手册公式4-16：反气旋R<0，V=V_g−V²/(fR)>V_g。手册要点：北半球正常气旋R＞0有V＜ V_g 。","source":"上编 公式4-16"},{"id":233,"book":"大气","chapter":"第4章 大气动力学","kp":"反气旋中心弱风","q":"高压中心附近气压梯度通常较弱、风小，其理论原因之一是（ ）。","options":["高压中心摩擦力最大，使风减弱","高压中心科氏力为零，无法维持风","正常反气旋梯度风存在上限，要求气压梯度不能过大","高压中心总有强烈下沉运动，使水平气压梯度必然为零"],"answer":2,"explain":"解析：手册公式4-15：反气旋实根条件−p_n/ρ≤f²∣R∣/4，限制了高压中心附近的气压梯度。反气旋中科氏力向内、离心力向外，梯度风方程有实根要求气压梯度大小不超过ρf²∣R∣/4，所以高压中心附近的气压梯度和风速都较小。","source":"上编 公式4-15"},{"id":234,"book":"大气","chapter":"第4章 大气动力学","kp":"梯度风曲率符号","q":"手册约定的自然坐标中，北半球气旋式（左弯）曲率半径R的符号为（ ）。","options":["R>0","视风速而定","R<0","R=0"],"answer":0,"explain":"解析：手册公式4-13：左弯R>0，右弯R<0；北半球左弯为气旋式，右弯为反气旋式。手册约定沿运动方向左弯为正，北半球气旋按逆时针旋转，沿流动方向向左弯，所以R>0，反气旋R<0。","source":"上编 公式4-13"},{"id":235,"book":"大气","chapter":"第4章 大气动力学","kp":"旋衡风","q":"旋衡风是指（ ）。","options":["科氏力与惯性离心力平衡的风","摩擦力与科氏力相互平衡、不存在气压梯度力作用的风","气压梯度力与惯性离心力平衡的风，科氏力可忽略","气压梯度力与科氏力平衡"],"answer":2,"explain":"解析：手册公式4-17：旋衡适用于强曲率、小尺度如龙卷；惯性风是科氏力与离心力平衡。科氏力与惯性离心力平衡的是惯性风，气压梯度力与科氏力平衡的是地转风，旋衡风多见于龙卷等尺度很小、曲率很大的涡旋。","source":"上编 公式4-17"},{"id":236,"book":"大气","chapter":"第4章 大气动力学","kp":"惯性风","q":"惯性风（惯性振荡）的平衡关系是（ ）。","options":["科氏力与惯性离心力平衡，无气压梯度力","气压梯度力与地面摩擦力相互平衡，无科氏力","气压梯度力与离心力平衡","只有重力与浮力平衡"],"answer":0,"explain":"解析：手册公式4-17：−V²/R−fV=0，V=−fR，北半球为反气旋式旋转。惯性风中没有气压梯度力，只有科氏力与离心力平衡，空气沿惯性圆周运动，所以与摩擦力、重力或浮力的平衡无关。","source":"上编 公式4-17"},{"id":237,"book":"大气","chapter":"第4章 大气动力学","kp":"龙卷平衡","q":"龙卷风的受力平衡通常近似为（ ）。","options":["地转平衡","旋衡平衡","静止平衡","惯性平衡"],"answer":1,"explain":"解析：手册4-C02：龙卷尺度小、风速大、Ro很大，科氏力相对很小，近似旋衡，可有两种旋转方向。手册要点：龙卷风尺度小、转速高，曲率加速度相对科氏力更重要，常以气压梯度力提供向心加速度的旋衡平衡近似。","source":"上编 4-C02"},{"id":238,"book":"大气","chapter":"第4章 大气动力学","kp":"龙卷旋向","q":"关于龙卷的旋转方向，下列说法正确的是（ ）。","options":["因科氏力相对很小，气旋式与反气旋式旋转都可能出现","北半球一定逆时针旋转","龙卷没有旋转，只有强烈的上升气流","北半球一定顺时针旋转"],"answer":0,"explain":"解析：手册4-C02：龙卷科氏力相对较小，允许两种方向，但多数仍为气旋式。手册要点：龙卷风尺度小、转速高，曲率加速度相对科氏力更重要，常以气压梯度力提供向心加速度的旋衡平衡近似。","source":"上编 4-C02、9-C04"},{"id":239,"book":"大气","chapter":"第4章 大气动力学","kp":"台风平衡","q":"成熟台风自由大气部分的受力平衡近似为（ ）。","options":["惯性振荡平衡","梯度风平衡","地转平衡","旋衡平衡"],"answer":1,"explain":"解析：手册4-C02：台风尺度较大，科氏力不可忽略，近似梯度风平衡；近地层还有摩擦。手册要点：台风尺度较大，其自由大气主环流可用梯度风作一阶近似，水平气压梯度力与科氏力的差额提供向心加速度。","source":"上编 4-C02"},{"id":240,"book":"大气","chapter":"第4章 大气动力学","kp":"台风旋向","q":"北半球台风低层气流的旋转方向是（ ）。","options":["无固定方向","顺时针向外辐散","顺时针方向向中心辐合","逆时针向中心辐合"],"answer":3,"explain":"解析：台风是北半球的气旋，受科氏力作用呈逆时针旋转。近地面摩擦使风斜穿等压线吹向低压中心，形成低层辐合，并在眼墙强烈上升。顺时针向外辐散是反气旋的特征，台风低层不是这种流型。","source":"上编 4-C02"},{"id":241,"book":"大气","chapter":"第4章 大气动力学","kp":"Rossby数含义","q":"Rossby数Ro=U/(fL)表示（ ）。","options":["摩擦力与科氏力的量级之比","惯性（平流）加速度与科氏加速度的量级之比","气压梯度力与重力的量级之比","浮力加速度与垂直风切变的量级之比"],"answer":1,"explain":"解析：手册公式4-04：Ro≪1支持地转近似（还需弱摩擦等条件）。Ro小说明科氏力远比惯性加速度重要，地转近似较好，其余选项涉及的摩擦、重力或浮力都不在这个比值中。","source":"上编 公式4-04"},{"id":242,"book":"大气","chapter":"第4章 大气动力学","kp":"Ro小于1含义","q":"Rossby数远小于1时（ ）。","options":["旋衡平衡成立，惯性离心力占主导","摩擦力占主导","科氏力可忽略，惯性力主导","科氏力相对重要，地转近似较好"],"answer":3,"explain":"解析：手册K4-05：Ro=0.1的大尺度气流较支持地转近似。手册要点：给平流加速度量级、科氏加速度量级和Rossby数如下。","source":"上编 K4-05"},{"id":243,"book":"大气","chapter":"第4章 大气动力学","kp":"热成风定义","q":"热成风是指（ ）。","options":["两地温度差引起的风","上升气流","地面风与高空风的标量差","上下两层地转风的矢量差"],"answer":3,"explain":"解析：手册4-D05：热成风是地转风的垂直切变（上减下），由水平温度梯度决定。手册要点：热成风是某气层上、下两层地转风的矢量差，即上层地转风减下层地转风，反映水平温度梯度造成的地转风垂直切变。","source":"上编 4-D05"},{"id":244,"book":"大气","chapter":"第4章 大气动力学","kp":"热成风方向","q":"北半球热成风方向与等温线的关系是（ ）。","options":["平行于等温线，背风而立左暖右冷","平行于等平均温度线，背热成风而立左冷右暖","垂直于等温线由冷指向暖","垂直于等温线由暖指向冷"],"answer":1,"explain":"解析：手册4-D05：北半球左冷右暖（低温在左）。手册要点：北半球热成风平行气层平均等温线，沿其方向冷空气在左、暖空气在右。","source":"上编 4-D05、K4-03"},{"id":245,"book":"大气","chapter":"第4章 大气动力学","kp":"热成风大小","q":"热成风大小与下列哪项成正比（ ）。","options":["近地面空气密度的大小与分布","气层平均温度的水平梯度","地面风速大小","地面气压的大小"],"answer":1,"explain":"解析：手册公式4-18：V_T=(R_d/f)ln(p_l/p_u)k×∇T，与水平温度梯度成正比，还与气层厚度（ln项）有关。热成风是上下两层地转风之差，由气层平均温度的水平梯度决定，与地面风速、地面气压或近地面密度无直接比例关系。","source":"上编 公式4-18"},{"id":246,"book":"大气","chapter":"第4章 大气动力学","kp":"高空西风","q":"中纬度高空西风随高度增强的主要原因是（ ）。","options":["科氏力随高度增大使风加速","平流层臭氧加热增强","南暖北冷的经向温度梯度产生西风热成风","地面摩擦随高度减小，与经向温度梯度无关"],"answer":2,"explain":"解析：手册4-E01：南暖北冷热成风为西风，叠加使西风随高度增强。手册要点：中高纬对流层通常南暖北冷，北半球对应向东的热成风，使西风随高度增强，形成高空西风及急流背景。","source":"上编 4-E01、4-D05"},{"id":247,"book":"大气","chapter":"第4章 大气动力学","kp":"风随高度顺转","q":"北半球风向随高度顺时针转（顺转）时，该层存在（ ）。","options":["暖平流","无温度平流","下沉运动","冷平流"],"answer":0,"explain":"解析：手册4-P02：北半球“顺暖逆冷”——风随高度顺转为暖平流，逆转为冷平流。手册要点：对符合地转和热成风关系的气层，地转风随高度顺时针转向通常对应暖平流，逆时针对应冷平流。","source":"上编 4-P02、公式4-19"},{"id":248,"book":"大气","chapter":"第4章 大气动力学","kp":"风随高度逆转","q":"北半球风随高度逆时针转（逆转），表示（ ）。","options":["暖平流","中性层结","冷平流","一定有降水"],"answer":2,"explain":"解析：手册4-P02：顺暖逆冷；该规则仅在北半球地转、静力近似下成立。手册要点：对符合地转和热成风关系的气层，地转风随高度顺时针转向通常对应暖平流，逆时针对应冷平流。","source":"上编 4-P02"},{"id":249,"book":"大气","chapter":"第4章 大气动力学","kp":"温度平流","q":"温度平流项(∂T/∂t)_adv=−V_g·∇T为正表示（ ）。","options":["冷平流，风从冷区吹向暖区，局地降温","暖平流，风从暖区吹向冷区","温度梯度为零，无平流","无平流，温度不随时间变化"],"answer":1,"explain":"解析：手册公式4-19：风从暖区吹向冷区时V·∇T<0，平流项为正，为暖平流。风从暖区吹向冷区会把暖空气带到下游，使局地升温，所以平流项为正；冷平流则平流项为负。","source":"上编 公式4-19"},{"id":250,"book":"大气","chapter":"第4章 大气动力学","kp":"散度符号","q":"水平散度δ_h=∂u/∂x+∂v/∂y为负表示（ ）。","options":["水平辐合","反气旋","水平辐散","垂直上升"],"answer":0,"explain":"解析：手册4-D06：正为辐散，负为辐合，单位s⁻¹。手册要点：δ_h 为水平散度。","source":"上编 4-D06、公式4-08"},{"id":251,"book":"大气","chapter":"第4章 大气动力学","kp":"连续方程","q":"连续方程体现的物理原理是（ ）。","options":["能量守恒","动量守恒定律","质量守恒","角动量守恒"],"answer":2,"explain":"解析：手册公式4-06：∂ρ/∂t+∇·(ρV)=0，即质量守恒。连续方程描述单位体积内质量的变化等于净流入的质量通量，不涉及能量、动量或角动量的收支。","source":"上编 公式4-06"},{"id":252,"book":"大气","chapter":"第4章 大气动力学","kp":"低层辐合上升","q":"由连续方程可推知，低层辐合、高层辐散的配置伴随（ ）。","options":["水平风为零","无垂直运动","中间层为下沉运动","中间层上升运动"],"answer":3,"explain":"解析：手册4-D06、公式4-10：低层辐合空气向上补偿，产生上升，常伴云雨。手册要点：由质量连续性，水平质量收支须与密度变化及垂直质量输送相联系，低层辐合常有利于上升。","source":"上编 4-D06、公式4-10"},{"id":253,"book":"大气","chapter":"第4章 大气动力学","kp":"不可压缩条件","q":"三维散度∇·V=0成立的条件是（ ）。","options":["处于地转平衡状态","流体不可压缩（Dρ/Dt=0）","大气处于静止状态（V=0以外无解）","气温不随时间变化"],"answer":1,"explain":"解析：手册公式4-08：必须先给不可压缩条件，才能由连续方程得∇·V=0。只有密度沿运动不变时，连续方程才简化为∇·V=0，地转平衡、静止或气温不变都不能作为这个条件。","source":"上编 公式4-08"},{"id":254,"book":"大气","chapter":"第4章 大气动力学","kp":"无弹性近似","q":"近似无弹性连续方程∇·(ρ₀V)=0中ρ₀表示（ ）。","options":["实际的瞬时密度","只随高度变化的静止分层参考密度","水的密度","地面处的密度常数（不随高度变化）"],"answer":1,"explain":"解析：手册公式4-09：ρ₀=ρ₀(z)为参考密度，低马赫数近似，忽略扰动密度时间变化。手
