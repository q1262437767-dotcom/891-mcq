途径和目标选择技术。","source":"下编 E4-L03"},{"id":804,"book":"环境","chapter":"第4章 土壤环境","kp":"分配系数Kd","q":"土—水分配系数Kd越大，表示污染物（ ）。","options":["越易溶于水并随水迁移","越易吸附在土壤固相上，迁移性越弱","与吸附能力无关，只表示土壤含水量","越易挥发进入大气"],"answer":1,"explain":"解析：下编公式F4-02：K_d=C_s/C_w。Kd是固相浓度与液相浓度之比，Kd越大说明污染物越多地吸附在土壤颗粒上，溶于水中的越少，迁移性越弱。","source":"下编 公式F4-02"},{"id":805,"book":"环境","chapter":"第4章 土壤环境","kp":"湿基含水","q":"计算土壤中污染物总量时，湿土需要（ ）。","options":["直接用湿土质量乘以固相浓度","湿土与干土不需区分","忽略水相和含水率，直接以湿土计算","先按含水率扣除水分得干土质量，固相浓度以干土计"],"answer":3,"explain":"解析：下编公式F4-02、K4-02：m_d=m_wet(1−w)。手册要点：给定线性分配与质量守恒式，固相浓度以干土为分母。","source":"下编 公式F4-02、K4-02"},{"id":806,"book":"环境","chapter":"第4章 土壤环境","kp":"砷的分类","q":"关于砷，教材的处理是（ ）。","options":["砷是典型的重金属元素，属于金属","砷是类金属，但因毒性和环境行为相似常与重金属一并讨论","砷无毒，因此不纳入土壤污染讨论","砷是非金属，与重金属的环境行为完全不同，教材中不必一并讨论"],"answer":1,"explain":"解析：砷是准金属，但环境研究常与重金属一起讨论（下编E4-C02关键词“砷的分类说明”）。砷在化学上属于类金属（准金属），不是典型金属，但它毒性强，环境行为与重金属相似，所以教材把它与重金属一起讨论。","source":"下编 E4-C02"},{"id":807,"book":"环境","chapter":"第4章 土壤环境","kp":"静态容量假设","q":"土壤静态剩余容量Q=10⁻⁶M_s(C_lim−C₀)的假设是（ ）。","options":["考虑污染物的挥发和淋溶输出","考虑污染物的全部输出与转化过程","不考虑输出与转化，只按目标限值与现状差计算","考虑植物吸收和微生物降解转化"],"answer":2,"explain":"解析：下编公式F4-01：静态土层负荷，质量守恒补充。手册要点：C0、Clim、C1为干土浓度(mg/kg)，Qrem为剩余容量(kg)，J为净输入(kg/a)，Δt为年数(a)。","source":"下编 公式F4-01"},{"id":808,"book":"环境","chapter":"第4章 土壤环境","kp":"土层干土质量","q":"面积1.0×10⁴ m²、厚0.20 m、干容重1300 kg/m³的耕层，干土质量为（ ）。","options":["2.60×10³ kg","2.60×10⁷ kg","1.30×10⁷ kg","2.60×10⁶ kg"],"answer":3,"explain":"解析：M_s=S·h·ρ_d=1.0×10⁴×0.20×1300=2.60×10⁶ kg。干土质量等于面积乘以厚度再乘以干容重，即1.0×10⁴×0.20×1300=2.60×10⁶ kg，其余选项都是数量级或乘数代错。","source":"下编 公式F4-01、K4-01"},{"id":809,"book":"环境","chapter":"第4章 土壤环境","kp":"土壤剩余容量","q":"干土2.6×10⁶ kg，现状Cd 0.40 mg/kg，限值0.80 mg/kg，静态剩余容量Q=10⁻⁶M_s(C_lim−C₀)为（ ）。","options":["0.40 kg","1.04 kg","1040000.00 kg","2.08 kg"],"answer":1,"explain":"解析：Q=10⁻⁶×2.6×10⁶×(0.80−0.40)=1.04 kg；现有总量也为1.04 kg，目标总量2.08 kg。剩余容量=干土质量×（限值−现状）×10⁻⁶，即2.6×10⁶×0.40×10⁻⁶=1.04 kg，2.08 kg是限值对应的总量而不是剩余容量。","source":"下编 公式F4-01、K4-01"},{"id":810,"book":"环境","chapter":"第4章 土壤环境","kp":"农药一级衰减","q":"农药半衰期20 d，初始8.0 mg/kg，60 d后残留约为（ ）。","options":["0.40 mg/kg","2.00 mg/kg","2.67 mg/kg","1.00 mg/kg"],"answer":3,"explain":"解析：60 d为3个半衰期，C=8.0×(1/2)³=1.00 mg/kg。e^(−3)是把t/T½误作kt。","source":"下编 公式F4-03、K4-03"},{"id":811,"book":"环境","chapter":"第4章 土壤环境","kp":"达到残留限值时间","q":"农药半衰期20 d，初始8.0 mg/kg，降至0.50 mg/kg需（ ）。","options":["60 d","160 d","80 d","320 d"],"answer":2,"explain":"解析：8.0→0.50为1/16=(1/2)⁴，需4个半衰期即80 d；或t=ln(C₀/C)/k=ln16/0.03466≈80 d。浓度降为原来的1/16，需要经过4个半衰期，即80 d，60 d少算了一个半衰期，320 d则把倍数当成了天数相乘。","source":"下编 K4-03"},{"id":812,"book":"环境","chapter":"第4章 土壤环境","kp":"土水分配系数","q":"Kd=2.0 L/kg，水相浓度0.889 mg/L，则固相浓度C_s=K_dC_w约为（ ）。","options":["0.444 mg/kg","0.889 mg/kg","1.778 mg/kg","2.889 mg/kg"],"answer":2,"explain":"解析：C_s=2.0×0.889≈1.778 mg/kg（干土）。Kd越大越易吸附于固相、越难随水迁移。","source":"下编 公式F4-02、K4-02"},{"id":813,"book":"环境","chapter":"第5章 固体废物与环境","kp":"固体废物定义","q":"固体废物是指（ ）。","options":["生产生活中丧失利用价值或被抛弃的固态、半固态及置于容器中的气液态物品","只指城市居民日常产生的生活垃圾及其分类收集物","只要是工业生产中产生的物质，无论是否仍有利用价值和使用功能","所有处于固态的物质，不论是否仍具有利用价值，都属于固体废物"],"answer":0,"explain":"解析：下编E5-D01：丢弃属性；“废物”的有用性是有条件的。手册要点：按本教材的概念，固体废物是人类在生产、加工、流通、消费和生活过程中，利用其原有使用价值后丢弃的固体状或泥浆状物质。","source":"下编 E5-D01"},{"id":814,"book":"环境","chapter":"第5章 固体废物与环境","kp":"固废放错地方","q":"“固体废物是放错地方的资源”体现了其（ ）。","options":["流动性（可随水气迁移）","资源性（有条件的）","无害性（不含有毒物质）","永久性（无法再利用）"],"answer":1,"explain":"解析：下编E5-L01：资源性有条件，需技术经济可行。手册要点：固体废物中可能含有金属、有机物、矿物及可利用能量，其资源价值随技术、市场、运输和安全条件而变，因此具有相对资源性。","source":"下编 E5-L01"},{"id":815,"book":"环境","chapter":"第5章 固体废物与环境","kp":"固废分类","q":"按来源，固体废物可分为（ ）。","options":["危险废物与一般废物","工业固体废物、生活垃圾、农业废弃物等","有机废物与无机废物","可燃废物与不可燃废物两大类"],"answer":1,"explain":"解析：下编E5-C01：按来源、化学性质、危险性等不同分类轴。手册要点：固体废物可按来源分为矿业、工业、城市生活、农业等类型。","source":"下编 E5-C01"},{"id":816,"book":"环境","chapter":"第5章 固体废物与环境","kp":"危险特性","q":"危险废物的危险特性不包括（ ）。","options":["毒性","可回收性","易燃性和反应性","腐蚀性"],"answer":1,"explain":"解析：下编E5-C01：腐蚀性、毒性、易燃性、反应性、感染性等。危险特性指腐蚀性、毒性、易燃性、反应性和感染性等危害特征，可回收性是资源属性，不是危险特性。","source":"下编 E5-C01"},{"id":817,"book":"环境","chapter":"第5章 固体废物与环境","kp":"三化原则","q":"固体废物处理的“三化”原则是（ ）。","options":["资源化、市场化、产业化原则","减量化、集中化、填埋化","无害化、焚烧化、填埋化","减量化、资源化、无害化"],"answer":3,"explain":"解析：减量化是从工艺、产品及消费等环节减少废物产生量或需处理体积（下编E5-C02）。无害化是通过适当处理与处置减少危害，使剩余废物受到安全控制。","source":"下编 E5-C02"},{"id":818,"book":"环境","chapter":"第5章 固体废物与环境","kp":"三化优先","q":"“三化”中应优先考虑的是（ ）。","options":["源头减量化","末端填埋","资源化回收","焚烧"],"answer":0,"explain":"解析：源头少产生应优先，随后评价可行的回收利用，对最终残余仍须安全管理（下编E5-C02：源头优先）。减量化是从工艺、产品及消费等环节减少废物产生量或需处理体积。","source":"下编 E5-C02"},{"id":819,"book":"环境","chapter":"第5章 固体废物与环境","kp":"减量化误区","q":"关于减量化，下列说法错误的是（ ）。","options":["减量化包括减少产生量","减量化也包括减少需要处理的体积","源头减量优先","压实减容等于减少了污染物质量"],"answer":3,"explain":"解析：下编E5-C02易错：体积减少率不能当作质量减少率。手册要点：压实主要减容，不自动减少污染物质量。","source":"下编 E5-C02"},{"id":820,"book":"环境","chapter":"第5章 固体废物与环境","kp":"焚烧与热解","q":"焚烧与热解的根本区别是（ ）。","options":["热解需大量氧气，焚烧在无氧条件下进行","二者完全相同","焚烧温度更低，热解是低温氧化","焚烧在充分供氧下氧化，热解在缺氧或无氧条件下热分解"],"answer":3,"explain":"解析：下编E5-C03：供氧条件、反应性质、产物组成不同。手册要点：热解是在无氧或缺氧条件下利用有机物热不稳定性分解，得到气、液和固体产物。","source":"下编 E5-C03"},{"id":821,"book":"环境","chapter":"第5章 固体废物与环境","kp":"热解产物","q":"固体废物热解的产物主要是（ ）。","options":["可燃气、焦油（油）和固体炭","CO₂、H₂O和灰渣","只有水蒸气","只有灰渣"],"answer":0,"explain":"解析：热解是在无氧或缺氧条件下利用有机物热不稳定性分解，得到气、液和固体产物（下编E5-C03）。焚烧需控制烟气及灰渣，热解也需管理可燃气、焦油和残炭。","source":"下编 E5-C03"},{"id":822,"book":"环境","chapter":"第5章 固体废物与环境","kp":"焚烧二次污染","q":"关于垃圾焚烧，下列说法正确的是（ ）。","options":["焚烧只能减容，不能回收任何能量","焚烧主要产物为燃烧气体和灰渣，必须对烟气和灰渣进行二次污染控制","焚烧在无氧条件下进行，主要得到气、液、固三类产物","焚烧属于高温处理，因此不会产生二次污染"],"answer":1,"explain":"解析：下编E5-C03：焚烧是在有氧条件下使可燃组分氧化，主要产物为燃烧气体和灰渣并释放热量，需控制烟气及灰渣。无氧或缺氧分解是热解；不能把高温处理写成没有二次污染。","source":"下编 E5-C03"},{"id":823,"book":"环境","chapter":"第5章 固体废物与环境","kp":"好氧堆肥","q":"好氧堆肥的主要产物是（ ）。","options":["腐殖化的堆肥产品，以及CO₂和水","氢气和少量甲烷","沼气（以CH₄为主，并含少量CO₂）","乙醇和氢气"],"answer":0,"explain":"解析：下编E5-C04：好氧堆肥需供氧；厌氧发酵产沼气。好氧堆肥在供氧条件下由微生物分解有机物，产物是稳定的腐殖质以及CO₂和水，沼气是厌氧消化的产物。","source":"下编 E5-C04"},{"id":824,"book":"环境","chapter":"第5章 固体废物与环境","kp":"厌氧发酵","q":"有机废物厌氧消化（发酵）的主要能源产物是（ ）。","options":["腐殖化的堆肥产品，以及少量氧气","沼气（主要成分CH₄和CO₂）","堆肥产品与腐殖质","氧气和少量氢气"],"answer":1,"explain":"解析：厌氧发酵在无氧条件下经微生物转化产生沼气及消化残余，沼气主要可燃成分为甲烷（下编E5-C04）。易错提醒：厌氧不等于不产气或无臭味；沼渣与堆肥不是天然合格肥料。","source":"下编 E5-C04"},{"id":825,"book":"环境","chapter":"第5章 固体废物与环境","kp":"堆肥条件","q":"堆肥处理适合的原料是（ ）。","options":["含重金属的危险废物","废玻璃和废金属等不可降解的无机物","可生物降解的有机废物（如厨余、粪便、秸秆）","废金属和建筑垃圾"],"answer":2,"explain":"解析：下编E5-C04：可降解原料，产品质量约束（重金属等）。手册要点：两者均适用于可生物降解有机组分，受温度、水分、pH、碳氮比等影响，供氧状态是关键区别。","source":"下编 E5-C04"},{"id":826,"book":"环境","chapter":"第5章 固体废物与环境","kp":"固化稳定化","q":"固化/稳定化处理危险废物的目的是（ ）。","options":["降低有害成分的溶出性和迁移性","增加废物量以便压实填埋","彻底消灭废物中的全部有害成分和重金属","回收金属"],"answer":0,"explain":"解析：下编E5-C05：总量未必减少，存在长期释放风险。手册要点：稳定化重在降低污染物活性、溶解性或迁移性，固化重在用基材包裹和形成较完整固体以减少释放，并方便后续管理。","source":"下编 E5-C05"},{"id":827,"book":"环境","chapter":"第5章 固体废物与环境","kp":"固化增重","q":"固化处理后废物的质量和体积通常（ ）。","options":["必然减少（因为发生了化学分解）","可能增加（加入了固化剂）","消失","不变（只改变形态）"],"answer":1,"explain":"解析：下编E5-C02易错：固化加入材料后质量、体积可能增加。手册要点：这些过程可降低浸出风险，但不一定减少污染物总量，固化还可能增加总体积。","source":"下编 E5-C02、E5-C05"},{"id":828,"book":"环境","chapter":"第5章 固体废物与环境","kp":"处理与处置","q":"在固体废物管理中，与“处理”相区别的“处置”指的是（ ）。","options":["按物理性质进行分选和破碎的预处理过程，属于中间环节","改变废物性质的中间处理过程","最终安全处置（如填埋），解决废物最终归宿","资源回收与综合利用"],"answer":2,"explain":"解析：下编E5-C06：处理是改变性质以便后续，处置是最终归宿；残渣仍需处置。手册要点：处置是解决不能继续利用的废物及处理残渣最终归宿的问题，强调长期环境安全。","source":"下编 E5-C06"},{"id":829,"book":"环境","chapter":"第5章 固体废物与环境","kp":"固废污染途径","q":"固体废物污染环境的途径不包括（ ）。","options":["直接改变太阳常数","渗滤液污染土壤与地下水","通过食物链影响人体","扬尘与挥发污染大气"],"answer":0,"explain":"解析：后果包括占地、环境卫生恶化、生态影响和暴露风险，处理不当还可能产生新的气体、废水及残渣（下编E5-P01）。易错提醒：占地是直接影响，食物链是暴露途径；两者不能混写成同一个迁移过程。","source":"下编 E5-P01"},{"id":830,"book":"环境","chapter":"第5章 固体废物与环境","kp":"渗滤液","q":"垃圾填埋场渗滤液的主要风险是（ ）。","options":["高浓度有机物、氨氮和重金属污染土壤和地下水","产生电磁辐射危害周边居民","使大气增温并产生噪声","产生噪声和恶臭，但不影响地下水"],"answer":0,"explain":"解析：下编E5-L02：渗滤液风险，需防渗与收集处理。手册要点：环境关注点包括渗滤液、填埋气、地表径流、地下水影响以及封场后的稳定性。","source":"下编 E5-L02"},{"id":831,"book":"环境","chapter":"第5章 固体废物与环境","kp":"填埋气","q":"垃圾填埋场填埋气的主要成分及风险是（ ）。","options":["O₃与NO₂，导致光化学烟雾","SO₂与H₂S，导致酸雨","O₂与N₂，无风险","CH₄与CO₂，有爆炸及温室效应风险"],"answer":3,"explain":"解析：下编E5-L02：填埋气需收集利用或处理，全寿命管理。填埋场中有机物厌氧分解产生以CH₄和CO₂为主的填埋气，CH₄在一定浓度范围内遇火会爆炸，并且是强温室气体。","source":"下编 E5-L02"},{"id":832,"book":"环境","chapter":"第5章 固体废物与环境","kp":"卫生填埋优点","q":"卫生填埋作为最终处置方式的优点是（ ）。","options":["不产生填埋气和渗滤液，且不需要防渗","适用范围广、处理量大、技术相对成熟","可以使废物中的重金属彻底分解","不需要占用土地"],"answer":1,"explain":"解析：下编E5-L02：适用与优点，同时需环境控制。手册要点：填埋是将废物置于经过适当设计和管理的场地，以分层、压实及覆盖等方式限制其与环境接触的处置方法。","source":"下编 E5-L02"},{"id":833,"book":"环境","chapter":"第5章 固体废物与环境","kp":"预处理目的","q":"固体废物预处理（分选、破碎、压实、脱水）的目的是（ ）。","options":["增加废物量以便压实","直接消除废物的全部污染","改善物料性质以利于后续运输、回收和处理处置","对废物进行最终处置，解决最终归宿"],"answer":2,"explain":"解析：预处理将混合废物转为便于储存、运输、回收或后续处理的状态（下编E5-P02）。若仅脱水且固形物无损失，守恒的是干物质量。","source":"下编 E5-P02"},{"id":834,"book":"环境","chapter":"第5章 固体废物与环境","kp":"破碎作用","q":"破碎处理的主要作用是（ ）。","options":["通过燃烧回收废物中的能量","减小粒度、使组成均匀，便于分选、焚烧等后续处理","增大颗粒尺寸，减少分选难度","改变废物的化学成分，使其直接达到无害化"],"answer":1,"explain":"解析：破碎是固体废物的预处理，通过机械作用减小粒度、使组成更均匀，从而便于后续的分选、压实、焚烧或堆肥。破碎是物理过程，不改变废物的化学成分，也不能直接实现无害化。燃烧回收能量属于焚烧，增大颗粒尺寸则与破碎的目的相反。","source":"下编 E5-P02"},{"id":835,"book":"环境","chapter":"第5章 固体废物与环境","kp":"脱水守恒","q":"污泥脱水计算中保持不变的量是（ ）。","options":["体积","湿污泥质量","含水率","干固体质量"],"answer":3,"explain":"解析：下编公式F5-02、K5-02：脱水只去除水分，干固体质量不变，即m₁(1−P₁)=m₂(1−P₂)。含水率下降后的湿污泥质量须按干固体守恒折算，不能按含水率差值线性缩减。","source":"下编 公式F5-02"},{"id":836,"book":"环境","chapter":"第5章 固体废物与环境","kp":"资源化原则","q":"固废资源化应遵循的原则是（ ）。","options":["任何回收在技术和经济上都可行，无需核算残余物","技术可行、经济合理、产品质量合格，并核算残余物去向","回收后不会留下任何残余物","不需考虑产品质量和残余物去向"],"answer":1,"explain":"解析：资源化应具备技术可行、经济合理、污染风险可控和产品质量合格等条件，并在合适情况下缩短运输距离（下编E5-L03）。若总量守恒，未被回收的组分必须在残余物流中交代，不能只用一个百分数代表全部资源化效果。","source":"下编 E5-L03"},{"id":837,"book":"环境","chapter":"第5章 固体废物与环境","kp":"污染特殊性","q":"固体废物污染的特殊性在于（ ）。","options":["污染随废物产生而立即消失","只污染大气，不影响水和土壤","它是多种污染的“源头”与“终态”，可跨介质长期传播","不会造成二次污染，可以在露天长期堆放而无需防渗处理"],"answer":2,"explain":"解析：下编E5-L01：积存特点、跨介质传播、源头与终态，需全流程控制。手册要点：固体废物既是其他环境污染的来源，也常是废水废气治理后的污染物集中载体，例如污泥和除尘灰。","source":"下编 E5-L01"},{"id":838,"book":"环境","chapter":"第5章 固体废物与环境","kp":"分选方法","q":"利用磁选从垃圾中回收的是（ ）。","options":["废纸和纸板等纤维","废玻璃瓶","废塑料","铁磁性金属"],"answer":3,"explain":"解析：分选依据物料物理性质差异（下编E5-P02分选）。磁选利用物料的磁性差异，只能吸出铁磁性金属，纸、玻璃、塑料不具铁磁性，需要用风选、光电或密度分选。","source":"下编 E5-P02"},{"id":839,"book":"环境","chapter":"第5章 固体废物与环境","kp":"压实减容率","q":"压实前垃圾体积400 m³，压实后160 m³，减容率为（ ）。","options":["60%","250%","40%","2%"],"answer":0,"explain":"解析：η_V=(400−160)/400=60%；质量不变，压缩比为2.5。40%是剩余体积比例。","source":"下编 公式F5-01、K5-01"},{"id":840,"book":"环境","chapter":"第5章 固体废物与环境","kp":"堆积体积计算","q":"120 t垃圾压实后堆积密度0.75 t/m³，其体积为（ ）。","options":["90 m³","160 m³","1600 m³","120 m³"],"answer":1,"explain":"解析：V=m/ρ=120/0.75=160 m³；若堆置厚3 m，理论占地约53.33 m²。体积等于质量除以密度，120/0.75=160 m³，90 m³是把密度当成乘数，1600 m³则多了一个数量级。","source":"下编 公式F5-01、K5-01"},{"id":841,"book":"环境","chapter":"第5章 固体废物与环境","kp":"污泥脱水后质量","q":"含水率80%（湿基）的污泥1000 kg脱水至60%，脱水后湿污泥质量为（ ）。","options":["250 kg","200 kg","800 kg","500 kg"],"answer":3,"explain":"解析：干固体=1000×0.20=200 kg守恒，终态湿重=200/(1−0.60)=500 kg，移除水500 kg。不能按含水率直接线性扣减。","source":"下编 公式F5-02、K5-02"},{"id":842,"book":"环境","chapter":"第5章 固体废物与环境","kp":"干基含水率","q":"湿基含水率80%的污泥，其干基含水比X=w/(1−w)为（ ）。","options":["0.20 kg/kg","0.80 kg/kg","4.00 kg/kg","1.25 kg/kg"],"answer":2,"explain":"解析：X=0.80/0.20=4.00 kg/kg（即400%）。湿基与干基分母不同，干基可超过100%。","source":"下编 公式F5-02、K5-02"},{"id":843,"book":"环境","chapter":"第5章 固体废物与环境","kp":"总体质量回收率","q":"10 t进料含金属20%、纸40%，金属回收率90%、纸回收率60%，总体质量回收率为（ ）。","options":["75%","150%","42%","60%"],"answer":2,"explain":"解析：回收金属1.8 t、纸2.4 t，共4.2 t，占进料42%。回收率不能按两组分回收率平均。","source":"下编 公式F5-03、K5-03"},{"id":844,"book":"环境","chapter":"第6章 物理环境","kp":"物理性污染","q":"物理性环境污染的共同特点是（ ）。","options":["只污染水体，通过物质残留长期起作用","全部是全球性污染，物质在环境中长期残留，可沿食物链富集","属于化学性污染，污染物排放停止后仍长期存在于环境中，必须依靠生物降解","由声、光、热、电磁、放射等物理因素引起，多为局部性，源停止后一般消失"],"answer":3,"explain":"解析：下编E6-D01、E6-C01：强度时空分布、受体特性；噪声声场不长期残留。手册要点：物理性环境污染是噪声、振动、电磁场、光、热及电离辐射等物理因素，在强度、时间或空间分布上造成环境质量及相关功能不利变化的现象。","source":"下编 E6-D01"},{"id":845,"book":"环境","chapter":"第6章 物理环境","kp":"噪声定义","q":"环境学中噪声是指（ ）。","options":["干扰人们休息、学习和工作的不需要的声音","频率高于20 kHz的声音","一切无规律的、强度超过60 dB的自然声音","音量低于40 dB的声音"],"answer":0,"explain":"解析：下编E6-D02：不只无规律声，与时间场所和受体有关。手册要点：从环境保护角度，噪声是妨碍人们正常学习、工作、休息或其他活动的声音，不仅限于杂乱无规律的声音。","source":"下编 E6-D02"},{"id":846,"book":"环境","chapter":"第6章 物理环境","kp":"噪声与物质污染","q":"噪声污染与物质污染的区别不包括（ ）。","options":["噪声多为局部、分散的","噪声是声能传播","噪声具有感觉性（主观性），因人而异","噪声在环境中长期残留累积"],"answer":3,"explain":"解析：下编E6-C01：声源停止声场即消失，但健康后果可持续。手册要点：声源停止后，声场通常很快衰减，不像某些化学污染物会在环境介质中长期残留。","source":"下编 E6-C01"},{"id":847,"book":"环境","chapter":"第6章 物理环境","kp":"声压级参考","q":"空气中声压级的参考声压p₀为（ ）。","options":["20 Pa","2×10⁻⁵ Pa","1 Pa","10⁻¹² Pa"],"answer":1,"explain":"解析：下编公式F6-01：p₀=2×10⁻⁵ Pa（听阈）。手册要点：prms为有效声压(Pa)，p0为空气参考声压(Pa)，I为声强(W/m²)，I0为参考声强，Lp、LI为相应级值(dB)。","source":"下编 公式F6-01"},{"id":848,"book":"环境","chapter":"第6章 物理环境","kp":"分贝叠加原则","q":"计算多个不相关声源的合成声级时应（ ）。","options":["取各声源声级的算术平均值","直接把各声源的分贝数相加","取其中最大的声级作为合成声级，其余忽略","将各声级还原为能量（10^(L/10)）相加后再取对数"],"answer":3,"explain":"解析：能量项为10^(Li/10)，不是10^(Li/20)（下编E6-C02、公式F6-02）。各声源同时存在，统计互不相关。","source":"下编 公式F6-02"},{"id":849,"book":"环境","chapter":"第6章 物理环境","kp":"A计权","q":"A计权声级的作用是（ ）。","options":["放大低频声音，模拟机器噪声","模拟人耳对不同频率声音的响应，低频衰减较多","测量最大瞬时声压","只用于测量频率高于20 kHz的超声波的强度"],"answer":1,"explain":"解析：下编E6-C03：频率计权，常用dB(A)。手册要点：计权声级对不同频率作规定修正，A计权用于相应声学评价，常记dB(A)。","source":"下编 E6-C03"},{"id":850,"book":"环境","chapter":"第6章 物理环境","kp":"等效声级","q":"等效连续A声级L_eq是指（ ）。","options":["在规定时段内与起伏噪声能量相等的稳定连续声级","测量时段内的中位声级L50","测量时段内出现的最大声级","测量时段内各次读数声级的算术平均值"],"answer":0,"explain":"解析：下编E6-C03、公式F6-03：等能量等时段。手册要点：等效连续声级是在给定时段内，与实际变动噪声具有相同声能的稳定声级，必须进行能量平均，并保留计权和时段信息。","source":"下编 E6-C03"},{"id":851,"book":"环境","chapter":"第6章 物理环境","kp":"统计声级","q":"统计声级L₁₀表示（ ）。","options":["测量时间内的最小声级","有90%时间超过的声级，近似背景噪声","测量时间内有10%时间超过的声级，近似峰值噪声","平均声级"],"answer":2,"explain":"解析：下编E6-C03：超越百分比；L₉₀近似背景噪声，L₅₀为中位数，中位数不等于Leq。手册要点：统计声级L10、L50、L90分别指测量期间有10%、50%、90%的时间被超过的声级。","source":"下编 E6-C03"},{"id":852,"book":"环境","chapter":"第6章 物理环境","kp":"距离衰减规律","q":"自由场点声源距离加倍，声压级约衰减（ ）。","options":["3 dB","10 dB","6 dB","20 dB"],"answer":2,"explain":"解析：下编公式F6-04：ΔL=20lg2≈6 dB；线声源约3 dB。点声源声能按球面扩散，声压级随距离按20lg r衰减，距离加倍衰减约6 dB，线声源才是约3 dB。","source":"下编 公式F6-04"},{"id":853,"book":"环境","chapter":"第6章 物理环境","kp":"城市噪声来源","q":"城市噪声的主要来源不包括（ ）。","options":["建筑施工与社会生活","交通运输","地震波","工业生产"],"answer":2,"explain":"解析：城市噪声可按来源分为交通运输、工业生产、生活活动和建筑施工四类（下编E6-L01）。城市噪声主要来自交通运输、工业生产、建筑施工和社会生活，地震波属于自然地质现象，不是城市噪声源。","source":"下编 E6-L01"},{"id":854,"book":"环境","chapter":"第6章 物理环境","kp":"交通噪声","q":"在城市噪声来源中，影响面最广的通常是（ ）。","options":["工业噪声","交通噪声","宇宙噪声","建筑施工噪声"],"answer":1,"explain":"解析：下编E6-L01：交通运输为主要来源。手册要点：城市噪声可按来源分为交通运输、工业生产、生活活动和建筑施工四类。","source":"下编 E6-L01"},{"id":855,"book":"环境","chapter":"第6章 物理环境","kp":"噪声影响","q":"噪声的危害不包括（ ）。","options":["降低工作效率","使水体富营养化","干扰休息与交流","损伤听力及引起身心不适"],"answer":1,"explain":"解析：下编E6-L02：噪声可损伤听力，干扰睡眠、交谈和工作，并可引起心理与生理不适。水体富营养化由氮、磷等营养物输入引起，与噪声无关。","source":"下编 E6-L02"},{"id":856,"book":"环境","chapter":"第6章 物理环境","kp":"噪声控制环节","q":"噪声控制的三个环节是（ ）。","options":["立法管理、环境监测和影响评价三个环节","隔声、遮光和绿化","吸声、消声和减振","声源控制、传播途径控制和接受者保护"],"answer":3,"explain":"解析：噪声控制可从声源、传播途径和接收者三个环节展开（下编E6-L03）。易错提醒：自由场点声源距离加倍约降6dB；道路长线声源、室内混响或近场不能直接套用。","source":"下编 E6-L03"},{"id":857,"book":"环境","chapter":"第6章 物理环境","kp":"吸声隔声","q":"吸声与隔声的区别是（ ）。","options":["吸声阻挡声音透过屏障","隔声减少室内反射混响","二者相同，都是用多孔材料把声能转化为热能","吸声减少反射声能，隔声阻挡声音透过屏障"],"answer":3,"explain":"解析：吸声主要减弱反射声，隔声主要阻挡传播，不能混同（下编E6-L03关键词“吸声隔声区分”）。传播端利用布局、距离、隔声、吸声、屏障以及减振隔振等降低到达受体的声能。","source":"下编 E6-L03"},{"id":858,"book":"环境","chapter":"第6章 物理环境","kp":"声屏障","q":"在道路两侧设置声屏障属于（ ）。","options":["接受者个人防护","声源控制","噪声监测","传播途径控制"],"answer":3,"explain":"解析：噪声控制可从声源、传播途径和接收者三个环节展开（下编E6-L03）。传播端利用布局、距离、隔声、吸声、屏障以及减振隔振等降低到达受体的声能。","source":"下编 E6-L03"},{"id":859,"book":"环境","chapter":"第6章 物理环境","kp":"放射性活度单位","q":"放射性活度的国际单位是（ ）。","options":["贝可勒尔（Bq）","戈瑞（Gy）","希沃特（Sv）单位","分贝（dB）"],"answer":0,"explain":"解析：下编E6-D03：活度Bq；Gy为吸收剂量，Sv为当量剂量；活度与剂量不同。Bq表示每秒发生一次核衰变，衡量放射源的活度，Gy是吸收剂量，Sv是考虑辐射类型的当量剂量，dB用于声学。","source":"下编 E6-D03"},{"id":860,"book":"环境","chapter":"第6章 物理环境","kp":"半衰期定义","q":"放射性核素物理半衰期是指（ ）。","options":["核素完全衰变所需的时间","活度衰减到初始值一半所需时间","剂量减半时间","生物体通过代谢排出一半核素所需的时间"],"answer":1,"explain":"解析：物理半衰期是核素数量或活度因衰变减少一半的时间（下编E6-D03、公式F6-05）。活度不等于吸收剂量或有效剂量，稳定同位素也不等于放射性核素。","source":"下编 E6-D03"},{"id":861,"book":"环境","chapter":"第6章 物理环境","kp":"活度与剂量","q":"下列说法正确的是（ ）。","options":["放射性活度与时间无关","仅凭活度不能求人体吸收剂量","放射性活度单位是Sv","活度等于剂量"],"answer":1,"explain":"解析：仅凭活度不能求人体吸收剂量（下编K6-04结论）。不使用活度与剂量之间的任何固定换算。","source":"下编 K6-04"},{"id":862,"book":"环境","chapter":"第6章 物理环境","kp":"电磁辐射","q":"电磁辐射污染的控制措施主要是（ ）。","options":["使用放射源进行屏蔽","喷洒药剂","增加发射功率以缩短暴露","屏蔽、吸收、合理布局与距离防护"],"answer":3,"explain":"解析：下编E6-P01：频率与场强、屏蔽吸收；与放射性区分。手册要点：控制可沿“源—途径—受体”采取合理布局、降低不必要泄漏、屏蔽和吸收等措施，并根据具体场景监测。","source":"下编 E6-P01"},{"id":863,"book":"环境","chapter":"第6章 物理环境","kp":"电磁与放射","q":"电磁辐射与放射性的区别是（ ）。","options":["一般环境电磁辐射为非电离辐射，放射性产生电离辐射","放射性不危害健康，电磁辐射有害","电磁辐射都由放射性核素产生","二者完全相同，都会使原子电离并具有放射性"],"answer":0,"explain":"解析：电磁辐射是广义物理过程，不能将日常射频场与放射性核素污染混为一谈，也不能仅按波长长短一概排列健康风险（下编E6-P01关键词“与放射性区分”）。日常射频、工频电磁场的光子能量低，不能使原子电离，而放射性核素衰变放出的α、β、γ射线属于电离辐射。","source":"下编 E6-P01"},{"id":864,"book":"环境","chapter":"第6章 物理环境","kp":"光污染类型","q":"光污染通常分为（ ）。","options":["红外、紫外和可见光污染","日光、月光和灯光污染","白亮污染、人工白昼和彩光污染","直射、散射、反射"],"answer":2,"explain":"解析：下编E6-L04：教材三类分类。手册要点：本教材将光污染分为白亮污染、人工白昼和彩光污染，分别强调反射眩光、夜间过量照明和不协调的彩色光源等问题。","source":"下编 E6-L04"},{"id":865,"book":"环境","chapter":"第6章 物理环境","kp":"光污染影响","q":"光污染的影响不包括（ ）。","options":["影响天文观测","使地下水硬度升高","夜间生态与人体节律紊乱","视觉干扰"],"answer":1,"explain":"解析：本教材将光污染分为白亮污染、人工白昼和彩光污染，分别强调反射眩光、夜间过量照明和不协调的彩色光源等问题（下编E6-L04）。其影响包括视觉干扰、作息及生态活动干扰，以及夜空变亮影响天文观测。","source":"下编 E6-L04"},{"id":866,"book":"环境","chapter":"第6章 物理环境","kp":"热污染","q":"热污染对水体的主要影响是（ ）。","options":["水温升高抑制藻类生长，水质改善","水温升高使溶解氧下降、生物代谢加快，水生生态受损","水温升高增加溶解氧，有利鱼类","对水生生态无影响，只是水温略有升高"],"answer":1,"explain":"解析：升温通常降低氧的溶解度，并可能增加生物代谢耗氧、改变群落和生态过程（下编E6-L05）。热污染重点指人为废热输入改变环境热状态，如温排水使受纳水体升温。","source":"下编 E6-L05"},{"id":867,"book":"环境","chapter":"第6章 物理环境","kp":"热污染与温室效应","q":"热污染与温室效应的区别是（ ）。","options":["热污染是全球增温的主要原因，温室效应是局地废热排放的结果","温室效应就是热污染的另一种叫法，二者都指工厂和电厂向环境直接排放的废热","温室效应主要来自工业废热的直接排放","热污染是废热直接输入环境，温室效应是温室气体改变辐射收支（辐射强迫）"],"answer":3,"explain":"解析：直接废热是热量输入，温室效应增强是温室气体改变辐射收支，两者机制不同（下编E6-L05关键词“区别辐射强迫”）。热污染重点指人为废热输入改变环境热状态，如温排水使受纳水体升温。","source":"下编 E6-L05"},{"id":868,"book":"环境","chapter":"第6章 物理环境","kp":"声强级参考","q":"环境噪声计量中，计算声强级L_I=10lg(I/I₀)所用的I₀取值为（ ）。","options":["1 W/m²","10⁻¹² W/m²","10⁻⁶ W/m²","2×10⁻⁵ W/m²"],"answer":1,"explain":"解析：prms为有效声压(Pa)，p0为空气参考声压(Pa)，I为声强(W/m²)，I0为参考声强，Lp、LI为相应级值(dB)（下编公式F6-01）。声压比系数20，声强比系数10。","source":"下编 公式F6-01"},{"id":869,"book":"环境","chapter":"第6章 物理环境","kp":"三声源叠加","q":"三个不相关声源在同点分别为70、72、68 dB，合成声压级约为（ ）。","options":["70.0 dB","75.1 dB","210.0 dB","72.0 dB"],"answer":1,"explain":"解析：L=10lg(10⁷+10^7.2+10^6.8)≈75.1 dB，只比最强源高约2.2 dB。分贝需按能量叠加。","source":"下编 公式F6-02、K6-01"},{"id":870,"book":"环境","chapter":"第6章 物理环境","kp":"两个相同声源叠加","q":"两个80 dB的不相关等强声源叠加，合成声级约为（ ）。","options":["160 dB","86 dB","80 dB","83 dB"],"answer":3,"explain":"解析：L=80+10lg2≈83 dB。声压相干叠加才可能增6 dB，不相关源按能量增3 dB。","source":"下编 公式F6-02"},{"id":871,"book":"环境","chapter":"第6章 物理环境","kp":"等效连续A声级","q":"8 h内前2 h为85 dB(A)、后6 h为75 dB(A)，等效连续A声级约为（ ）。","options":["80.0 dB(A)","85.0 dB(A)","80.1 dB(A)","77.5 dB(A)"],"answer":2,"explain":"解析：L_eq=10lg[(2×10^8.5+6×10^7.5)/8]≈80.1 dB(A)，高声级时段起主导，不是算术时间平均77.5 dB。等效声级要按能量平均，高声级时段贡献更大，结果约80.1 dB(A)，按时间算术平均得到的77.5 dB(A)偏低。","source":"下编 公式F6-03、K6-02"},{"id":872,"book":"环境","chapter":"第6章 物理环境","kp":"点声源距离衰减","q":"自由场点声源10 m处75 dB，40 m处约为（ ）。","options":["18.8 dB","51.0 dB","63.0 dB","69.0 dB"],"answer":2,"explain":"解析：L(r₂)=L(r₁)−20lg(r₂/r₁)=75−20lg4≈63.0 dB，距离加倍衰减约6 dB。距离从10 m到40 m是4倍，衰减20lg4≈12 dB，75−12=63.0 dB，51.0 dB是多减了一倍。","source":"下编 公式F6-04、K6-03"},{"id":873,"book":"环境","chapter":"第6章 物理环境","kp":"距离反算","q":"自由场点声源10 m处80 dB，降到60 dB所需距离为（ ）。","options":["1000 m","100 m","40 m","20 m"],"answer":1,"explain":"解析：r₂=r₁·10^[(80−60)/20]=10×10=100 m。20 dB对应距离增大10倍。","source":"下编 公式F6-04、K6-03"},{"id":874,"book":"环境","chapter":"第6章 物理环境","kp":"放射性活度衰减","q":"某核素半衰期8.0 d，初始活度1600 Bq，24.0 d后约为（ ）。","options":["800 Bq","200 Bq","80 Bq","533 Bq"],"answer":1,"explain":"解析：24 d=3个半衰期，A=1600×(1/2)³=200 Bq，剩余12.5%。仅凭活度不能求人体吸收剂量。","source":"下编 公式F6-05、K6-04"},{"id":875,"book":"环境","chapter":"第6章 物理环境","kp":"衰变到指定活度时间","q":"半衰期8.0 d、初始1600 Bq，降至100 Bq需（ ）。","options":["24 d","32 d","16 d","128 d"],"answer":1,"explain":"解析：1600/100=16=2⁴，需4个半衰期即32 d。活度降为1/16需要4个半衰期，每个8.0 d，共32 d，128 d是用16乘以8得出的错误结果。","source":"下编 K6-04"},{"id":876,"book":"环境","chapter":"第6章 物理环境","kp":"声压级计算","q":"某噪声源测得有效声压为2.0 Pa，按参考声压2×10⁻⁵ Pa，声压级为（ ）。","options":["120 dB","94 dB","100 dB","50 dB"],"answer":2,"explain":"解析：L_p=20lg(2.0/2×10⁻⁵)=20lg10⁵=100 dB。用10lg会少一半。","source":"下编 公式F6-01"},{"id":877,"book":"环境","chapter":"第7章 生物环境","kp":"生物多样性定义","q":"生物多样性是指（ ）。","options":["所有来源的活生物体中的变异性，包括遗传、物种和生态系统三个层次","只指濒危和珍稀物种的数量","只指某一区域内物种的数目","只指某一区域内植物种类的多少，不包括动物和微生物"],"answer":0,"explain":"解析：下编E7-D01：多样性与变异性，三个层次。手册要点：生物多样性是生物种类、生物所含遗传信息，以及生物与环境相互作用形成的生态系统和生态过程的多样性与变异性总和，通常包括遗传、物种和生态系统三个层次。","source":"下编 E7-D01"},{"id":878,"book":"环境","chapter":"第7章 生物环境","kp":"三个层次","q":"生物多样性的三个层次是（ ）。","options":["陆地、海洋和淡水多样性","植物、动物和微生物三类生物各自的多样性","遗传多样性、物种多样性和生态系统多样性","个体、种群和群落三个层次"],"answer":2,"explain":"解析：生态系统多样性包括生境、群落和生态过程的多样性（下编E7-C01）。三个层次相互联系但不可互相替代：保存若干物种个体不代表保存了全部基因差异，保护物种也离不开栖息地和生态联系。","source":"下编 E7-C01"},{"id":879,"book":"环境","chapter":"第7章 生物环境","kp":"遗传多样性","q":"遗传多样性是指（ ）。","options":["群落结构","物种数目","物种内基因的变异","生态系统的类型"],"answer":2,"explain":"解析：下编E7-C01：遗传变异；层次相互联系。手册要点：遗传多样性强调种内及种群间遗传变异，是适应和演化的基础。","source":"下编 E7-C01"},{"id":880,"book":"环境","chapter":"第7章 生物环境","kp":"物种多样性内涵","q":"物种多样性的衡量包括（ ）。","options":["只看生境面积","物种丰富度和均匀度","只看物种所含的基因数量","只看个体数"],"answer":1,"explain":"解析：物种多样性强调物种组成的丰富性，并可结合各物种数量分布的均匀程度（下编E7-C01关键词“物种丰富与均匀”）。生态系统多样性包括生境、群落和生态过程的多样性。","source":"下编 E7-C01"},{"id":881,"book":"环境","chapter":"第7章 生物环境","kp":"生态系统服务","q":"生态系统服务是指（ ）。","options":["生态系统中的能量流动与物质循环过程","人类对生态系统的保护与管理","人类从生态系统获得的直接和间接惠益","生态系统中的物种"],"answer":2,"explain":"解析：下编E7-D02：常用分类为供给、调节、文化、支持服务。手册要点：生态系统服务是人类从生态系统获得的直接和间接惠益。","source":"下编 E7-D02"},{"id":882,"book":"环境","chapter":"第7章 生物环境","kp":"调节服务","q":"湿地调蓄洪水、净化水质属于（ ）。","options":["供给服务","支持服务","调节服务","文化服务"],"answer":2,"explain":"解析：按千年生态系统评估常用框架，可分供给、调节、文化和支持服务，例如食物供给、水质净化、休闲审美及养分循环（单元15与E7-D02）。调蓄洪水、净化水质属于调节服务，供给服务指食物、淡水、木材，支持服务指养分循环、土壤形成，文化服务指休闲审美。","source":"下编 E7-D02、单元15"},{"id":883,"book":"环境","chapter":"第7章 生物环境","kp":"供给服务","q":"生态系统提供粮食、木材、淡水属于（ ）。","options":["支持服务","供给服务","调节服务","文化服务"],"answer":1,"explain":"解析：按千年生态系统评估常用框架，可分供给、调节、文化和支持服务，例如食物供给、水质净化、休闲审美及养分循环（下编E7-D02）。生态系统服务是人类从生态系统获得的直接和间接惠益。","source":"下编 E7-D02"},{"id":884,"book":"环境","chapter":"第7章 生物环境","kp":"支持服务","q":"养分循环、土壤形成属于（ ）。","options":["供给服务","调节服务","文化服务","支持服务"],"answer":3,"explain":"解析：下编E7-D02：支持过程在价值核算时应避免与最终服务重复计算。手册要点：按千年生态系统评估常用框架，可分供给、调节、文化和支持服务，例如食物供给、水质净化、休闲审美及养分循环。","source":"下编 E7-D02"},{"id":885,"book":"环境","chapter":"第7章 生物环境","kp":"生物污染","q":"生物污染是指（ ）。","options":["有害生物因素进入环境或异常增殖，危害健康、生态或生产","任何生物进入环境都属于污染，不论是否造成危害","植物正常生长和繁殖的过程","污染物在生物体内的富集"],"answer":0,"explain":"解析：下编E7-D03：不只病原菌，也包括入侵物种等。手册要点：生物污染是有害生物及其相关生物性因素进入环境或异常增殖，导致环境质量、生态功能、生产活动或人类健康受到不利影响的现象。","source":"下编 E7-D03"},{"id":886,"book":"环境","chapter":"第7章 生物环境","kp":"食品污染类别","q":"食品污染按性质可分为（ ）。","options":["一次污染和二次污染","固态食品污染和液态食品污染","有机污染和无机污染","生物性、化学性和放射性污染"],"answer":3,"explain":"解析：按本教材可分生物性、化学性和放射性污染，应结合污染物性质、来源、摄入途径及相应检测结果判断（下编E7-D04）。食品污染是食品在原料生产、运输、加工、包装、储存、销售或烹调过程中混入有害物质或病原等，使质量与安全受到不利影响的现象。","source":"下编 E7-D04"},{"id":887,"book":"环境","chapter":"第7章 生物环境","kp":"就地保护","q":"建立自然保护区属于（ ）。","options":["迁地保护","就地保护","人工繁育","基因保存"],"answer":1,"explain":"解析：下编E7-C02：就地保护生境；迁地保护如植物园、动物园；基因库保存种质。手册要点：就地保护是在物种原有自然生境中保护其种群、栖息地和生态联系，可同时维护演化过程与群落功能，是重要基础。","source":"下编 E7-C02"},{"id":888,"book":"环境","chapter":"第7章 生物环境","kp":"迁地保护","q":"建立植物园、动物园对珍稀物种的保护属于（ ）。","options":["就地保护","生态补偿","生境恢复","迁地保护"],"answer":3,"explain":"解析：下编E7-C02：互补而非替代，长期目标仍是野外种群。手册要点：迁地保护是在原生境之外，通过植物园、动物园、种质保存等方式维持濒危生物或遗传资源。","source":"下编 E7-C02"},{"id":889,"book":"环境","chapter":"第7章 生物环境","kp":"保护措施关系","q":"就地保护与迁地保护的关系是（ ）。","options":["二者冲突","只需迁地保护","迁地保护可完全替代就地保护","互补而非替代，就地保护是最根本的措施"],"answer":3,"explain":"解析：就地保护是在物种原有自然生境中保护其种群、栖息地和生态联系，可同时维护演化过程与群落功能，是重要基础（下编E7-C02关键词“互补非替代；长期野外目标”）。迁地保护是在原生境之外，通过植物园、动物园、种质保存等方式维持濒危生物或遗传资源。","source":"下编 E7-C02"},{"id":890,"book":"环境","chapter":"第7章 生物环境","kp":"生物浓集","q":"生物浓集（生物浓缩）是指（ ）。","options":["生物从环境介质（如水）中直接吸收污染物，使体内浓度高于环境","生物将体内污染物排出体外的过程","污染物沿食物链营养级逐级放大，使高营养级生物体内的浓度最高（生物放大）","污染物在生物体内总量增加的全部过程"],"answer":0,"explain":"解析：下编E7-C03：浓集为直接介质；积累包括全部途径；放大为营养级比较。手册要点：生物浓集强调生物从水等环境介质直接摄取污染物，严格的水生BCF不计食物摄入。","source":"下编 E7-C03"},{"id":891,"book":"环境","chapter":"第7章 生物环境","kp":"生物放大","q":"生物放大是指（ ）。","options":["生物从水中直接吸收污染物","污染物在环境中逐渐稀释","污染物降解","污染物沿食物链营养级逐级增加浓度"],"answer":3,"explain":"解析：下编E7-C03与单元15：强调营养级传递。手册要点：生物放大则比较食物链上较高营养级与其食物的浓度，常用BMF描述。","source":"下编 E7-C03"},{"id":892,"book":"环境","chapter":"第7章 生物环境","kp":"DDT放大","q":"食物链顶端生物体内DDT浓度往往（ ）。","options":["与营养级无关","更高","为零","更低"],"answer":1,"explain":"解析：单元15：难降解、脂溶性物质沿食物链放大。手册要点：生物放大则比较食物链上较高营养级与其食物的浓度，常用BMF描述。","source":"下编 E7-C03、单元15"},{"id":893,"book":"环境","chapter":"第7章 生物环境","kp":"BCF与BMF","q":"BCF与BMF的区别是（ ）。","options":["BCF无量纲，BMF单位为L/kg","BCF和BMF都只适用于陆生生物","二者相同，只是名称不同，都是生物与水的浓度比且都无量纲","BCF是生物与水的浓度比（L/kg），BMF是相邻营养级浓度比（无量纲）"],"answer":3,"explain":"解析：Ci为相应生物或食物中同一污染物浓度(mg/kg，同为湿重等一致口径)，BMF为相邻捕食者与其食物的浓度比，无量纲（下编公式F7-01、F7-02）。Cb为全生物体浓度(mg/kg湿重)，Cw为水中浓度(mg/L)，上述口径BCF单位L/kg。","source":"下编 公式F7-01、F7-02"},{"id":894,"book":"环境","chapter":"第7章 生物环境","kp":"易放大物质","q":"最容易发生生物放大的物质特性是（ ）。","options":["易光解、易被微生物降解","易溶于水、易随尿液排出","易挥发","难降解、脂溶性强、易在体内蓄积"],"answer":3,"explain":"解析：下编E7-C03：如DDT、甲基汞。难降解物质不易分解，脂溶性强则易在脂肪中蓄积，难以排出，因而沿食物链逐级放大，如DDT和甲基汞。","source":"下编 E7-C03"},{"id":895,"book":"环境","chapter":"第7章 生物环境","kp":"多样性丧失原因","q":"生物多样性丧失的主要原因不包括（ ）。","options":["环境污染与外来物种入侵","过度开发利用","建立自然保护区","生境丧失与破碎化"],"answer":2,"explain":"解析：下编E7-P01：生境破坏与破碎化、过度利用、外来物种入侵、污染和气候变化是生物多样性下降的主要驱动。建立自然保护区属于就地保护措施，是保护手段而非丧失原因。","source":"下编 E7-P01"},{"id":896,"book":"环境","chapter":"第7章 生物环境","kp":"首要威胁","q":"生物多样性面临的最主要威胁通常是（ ）。","options":["自然灾害","天文变化","生境丧失与破碎化","物种的自然灭绝"],"answer":2,"explain":"解析：生境破坏和破碎化压缩可用空间并隔离种群（下编E7-P01、E7-P02）。开发建设导致的生境丧失和破碎化，压缩了物种的生存空间并隔离种群，这是目前最主要的威胁，自然灭绝速率远低于这一影响。","source":"下编 E7-P01"},{"id":897,"book":"环境","chapter":"第7章 生物环境","kp":"破碎化危害","q":"生境破碎化危害生物多样性的机制不包括（ ）。","options":["边缘效应","增加生境连续面积","斑块面积变小使种群减小","隔离阻碍基因交流"],"answer":1,"explain":"解析：生境破碎化使连续生境变成彼此隔离的小斑块，常伴随适宜生境总面积减少（下编E7-P02）。易错提醒：破碎化不只是面积减少；斑块数量增多也不代表生态系统多样性一定改善。","source":"下编 E7-P02"},{"id":898,"book":"环境","chapter":"第7章 生物环境","kp":"边缘效应","q":"生境破碎化带来的“边缘效应”是指（ ）。","options":["斑块边缘物种多样性一定下降，而内部物种不受任何影响","斑块边缘没有任何环境变化","斑块内部比边缘更易受干扰","斑块边缘受外部干扰增强，环境条件改变，不利于内部物种"],"answer":3,"explain":"解析：斑块边缘增加还会改变温湿度、食物与隐蔽条件，并可能增加外来干扰（下编E7-P02关键词“边缘效应”）。生境破碎化使连续生境变成彼此隔离的小斑块，常伴随适宜生境总面积减少。","source":"下编 E7-P02"},{"id":899,"book":"环境","chapter":"第7章 生物环境","kp":"食品污染途径","q":"食品污染的预防应贯穿（ ）。","options":["原料、运输、加工包装、储存烹调全链条","只在零售销售环节","只在餐桌烹调环节","只在作物种植和畜禽养殖环节"],"answer":0,"explain":"解析：下编E7-P03：源头过程与检测。手册要点：食品污染可在原料端由环境污染、病原或残留带入，运输中因混装和容器交叉接触进入，加工及包装中由原辅料、设备和迁移物引入，储存及烹调中又可因条件不当发生交叉污染或微生物增殖。","source":"下编 E7-P03"},{"id":900,"book":"环境","chapter":"第7章 生物环境","kp":"直接价值","q":"生物多样性的直接价值是指（ ）。","options":["未来可能利用的潜在价值","作为食物、药物、工业原料等直接利用的价值","物种存在本身的价值，与人类的直接利用无关","调节气候、涵养水源的价值"],"answer":1,"explain":"解析：下编E7-L01：直接利用；间接价值为生态功能；另有选择、存在、科学价值。手册要点：直接价值体现为人类收获、消费或交易生物资源，例如食物、木材、纤维、药物来源和育种材料。","source":"下编 E7-L01"},{"id":901,"book":"环境","chapter":"第7章 生物环境","kp":"间接价值","q":"森林涵养水源、保持水土体现生物多样性的（ ）。","options":["选择价值（未来可能利用的潜在价值）","间接价值（生态功能价值）","直接价值（使用价值）","存在价值"],"answer":1,"explain":"解析：间接价值体现为生态系统维持生命支持环境的功能，包括气候调节、土壤保持、水文调节、传粉和环境净化等（下编E7-L01）。直接价值体现为人类收获、消费或交易生物资源，例如食物、木材、纤维、药物来源和育种材料。","source":"下编 E7-L01"},{"id":902,"book":"环境","chapter":"第7章 生物环境","kp":"外来与入侵","q":"关于外来物种，下列说法正确的是（ ）。","options":["入侵物种都是本地物种过度繁殖形成的，外来物种都无害","所有外来物种都有害，必须清除","凡是从外地引入的物种，一旦引入就都会造成生态危害，都属于入侵物种","外来物种不等于入侵物种，只有建立种群、扩散并造成危害的才是入侵"],"answer":3,"explain":"解析：下编E7-L02：外来与入侵区分。手册要点：外来物种指出现在原有自然分布范围之外的物种，外来并不自动等于入侵或有害。","source":"下编 E7-L02"},{"id":903,"book":"环境","chapter":"第7章 生物环境","kp":"入侵防控","q":"防控外来物种入侵最有效的环节是（ ）。","options":["预防引入：风险评估、检疫与早期监测","入侵扩散后再全面清除","大量引种以增加多样性","不采取任何措施，依靠自然竞争淘汰"],"answer":0,"explain":"解析：下编E7-L02：预防评估监测。手册要点：防控应以预防为主，强调引入前风险评估、检疫、监测预警、信息记录和发生后的专业响应。","source":"下编 E7-L02"},{"id":904,"book":"环境","chapter":"第7章 生物环境","kp":"生物浓集系数BCF","q":"水中某物质0.050 mg/L，鱼体（湿重）200 mg/kg，BCF为（ ）。","options":["4000 L/kg","10 L/kg","250 L/kg","0.25 L/kg"],"answer":0,"explain":"解析：BCF=C_b/C_w=200/0.050=4000 L/kg，是生物与水的浓度比，不同于营养级之间的放大系数BMF。BCF=鱼体浓度/水中浓度=200/0.050=4000 L/kg，0.25 L/kg等选项是比值倒置或单位换算出错的结果。","source":"下编 公式F7-01、K7-01"},{"id":905,"book":"环境","chapter":"第7章 生物环境","kp":"鱼体内总量","q":"BCF=4000 L/kg，水中0.050 mg/L，鱼重0.50 kg，体内总量约为（ ）。","options":["200.0 mg","100.0 mg","0.1 mg","0.4 mg"],"answer":1,"explain":"解析：C_b=4000×0.050=200 mg/kg，总量=200×0.50=100 mg。鱼体浓度等于BCF乘以水中浓度，为200 mg/kg，再乘以鱼重0.50 kg得体内总量100 mg，200 mg漏乘了鱼重。","source":"下编 K7-01"},{"id":906,"book":"环境","chapter":"第7章 生物环境","kp":"食物链总放大倍数","q":"相邻营养级BMF依次为5.0、8.0、3.0，链首到链尾的总倍数为（ ）。","options":["16 倍","120 倍","40 倍","5 倍"],"answer":1,"explain":"解析：C_n/C₁=ΠBMF=5×8×3=120，链式放大相乘不相加，结果无量纲。生物放大沿食物链逐级相乘，5×8×3=120，16倍是把各级BMF相加得到的错误结果。","source":"下编 公式F7-02、K7-02"},{"id":907,"book":"环境","chapter":"第7章 生物环境","kp":"相邻营养级BMF","q":"浮游动物中DDT 0.04 mg/kg，小鱼中0.20 mg/kg，小鱼对浮游动物的BMF为（ ）。","options":["0.2","4.0","5.0","8.0"],"answer":2,"explain":"解析：BMF=C_{i+1}/C_i=0.20/0.04=5.0，无量纲。用水中浓度做分母才是BCF。","source":"下编 公式F7-02"},{"id":908,"book":"环境","chapter":"第8章 环境管理","kp":"环境管理对象","q":"环境管理的核心对象是（ ）。","options":["气候系统和天气变化过程","自然环境本身","野生动物","人类影响环境的行为"],"answer":3,"explain":"解析：下编E8-D01：管理人的行为，运用多种手段，综合决策，协调发展。手册要点：环境管理是运用法律、行政、经济、技术和教育等手段，通过规划与综合决策，规范人类开发利用和影响环境的行为，协调经济社会发展与环境保护的活动。","source":"下编 E8-D01"},{"id":909,"book":"环境","chapter":"第8章 环境管理","kp":"环境管理手段","q":"环境管理的手段不包括（ ）。","options":["技术与宣传教育手段","行政、法律手段","经济手段","放任自流"],"answer":3,"explain":"解析：环境管理是运用法律、行政、经济、技术和教育等手段，通过规划与综合决策，规范人类开发利用和影响环境的行为，协调经济社会发展与环境保护的活动（下编E8-D01）。其直接管理对象主要是人的行为，最终目的是改善环境质量、合理利用资源并促进可持续发展。","source":"下编 E8-D01"},{"id":910,"book":"环境","chapter":"第8章 环境管理","kp":"三同时","q":"“三同时”制度是指建设项目中防治污染的设施必须与主体工程（ ）。","options":["同时规划、同时招标、同时运营使用","同时立项、同时审批、同时验收","同时设计、同时施工、同时投产使用","同时环评、同时监测、同时报告"],"answer":2,"explain":"解析：下编E8-D02：三同时并与环评衔接。手册要点：“三同时”是指建设项目的污染防治设施应与主体工程同时设计、同时施工、同时投产使用。","source":"下编 E8-D02"},{"id":911,"book":"环境","chapter":"第8章 环境管理","kp":"三同时意义","q":"“三同时”制度的意义在于（ ）。","options":["征收环保税以弥补污染损失","治理历史遗留的老污染源","防止新建项目产生新的污染，落实环评要求","监测区域环境质量变化，评价区域环境质量现状"],"answer":2,"explain":"解析：其作用是使环保设施与生产能力同步形成，落实环评提出的污染防治要求，防止项目投产后留下新增污染（下编E8-D02）。“三同时”是指建设项目的污染防治设施应与主体工程同时设计、同时施工、同时投产使用。","source":"下编 E8-D02"},{"id":912,"book":"环境","chapter":"第8章 环境管理","kp":"排污许可","q":"排污许可制度是（ ）。","options":["固定污染源监督管理的核心制度，规定许可排放浓度、总量及自行监测、台账等要求","针对机动车等移动源的管理制度","规定区域环境质量目标的标准体系，不涉及排放浓度和总量","只用于核算企业缴纳排污费数额的财务制度，不规定许可排放浓度和总量"],"answer":0,"explain":"解析：排污许可是对纳入管理的固定污染源明确污染物种类、许可排放浓度和排放量等要求，并通过自行监测、台账、执行报告和监督检查落实的制度（下编E8-D03）。它衔接环评、排放标准与总量控制，将管理要求落实到具体排污单位。","source":"下编 E8-D03"},{"id":913,"book":"环境","chapter":"第8章 环境管理","kp":"九项制度","q":"教材所列九项环境管理制度不包括（ ）。","options":["环境影响评价制度","排污收费","碳排放权交易制度","三同时"],"answer":2,"explain":"解析：下编E8-C02：九项为环评、三同时、排污收费、目标责任、城市综合整治定量考核、集中控制、申报登记与许可证、限期治理、总量控制（历史口径）。碳排放权交易是近年的新型市场机制，不在教材所列的九项历史制度中，环境影响评价、排污收费和三同时都在其中。","source":"下编 E8-C02"},{"id":914,"book":"环境","chapter":"第8章 环境管理","kp":"九项制度口径","q":"关于教材九项环境管理制度，正确的说法是（ ）。","options":["它是本教材的历史目录，现行制度已有更新（如收费改环保税）","九项制度已全部废止，不再有参考价值","九项制度从未变化，排污收费至今仍是现行有效、完整的管理制度","它就是截至2026年的现行完整制度"],"answer":0,"explain":"解析：涉及现行制度时，应说明收费已改环保税，环评、许可等已纳入生态环境法典体系，旧清单不是截至2026年的完整现行目录（下编E8-C02易失分）。本教材按历史形成顺序列九项制度：环境影响评价、“三同时”、排污收费、环境保护目标责任制、城市环境综合整治定量考核、污染集中控制、排污申报登记与排污许可证、限期治理、污染物排放总量控制。","source":"下编 E8-C02"},{"id":915,"book":"环境","chapter":"第8章 环境管理","kp":"费改税","q":"我国排污费改为环境保护税的时间是（ ）。","options":["2018年1月1日起","2015年1月1日","2008年1月1日","2026年8月15日"],"answer":0,"explain":"解析：下编E8-C03：2018年起停征排污费，依环境保护税法征收环保税。环境保护税法自2018年1月1日起施行，同时停征排污费，2015年1月1日是新环境保护法的施行日期。","source":"下编 E8-C03"},{"id":916,"book":"环境","chapter":"第8章 环境管理","kp":"污染者负担","q":"排污收费（及环保税）体现的原则是（ ）。","options":["政府全包","受益者付费","污染者负担原则","先污染、后治理"],"answer":2,"explain":"解析：教材中的排污收费，是通过经济负担促使排污者减少污染、承担治理成本的历史制度，体现污染者负担原则（下编E8-C03）。环保税、排污许可、达标排放和总量控制各有功能，缴税不能免除污染防治与损害担责义务。","source":"下编 E8-C03"},{"id":917,"book":"环境","chapter":"第8章 环境管理","kp":"缴税不免责","q":"关于环保税，下列说法正确的是（ ）。","options":["缴纳环保税不免除达标排放、许可和损害担责义务","缴纳环保税即可替代排污许可","缴纳环保税后，企业即不再承担任何环境损害赔偿责任","缴税后即可合法超标排放，环保税就是碳税"],"answer":0,"explain":"解析：环保税、排污许可、达标排放和总量控制各有功能，缴税不能免除污染防治与损害担责义务（下编E8-C03易失分）。易错提醒：不能写“交钱即可合法超标”，也不能把环保税等同于碳税。","source":"下编 E8-C03"},{"id":918,"book":"环境","chapter":"第8章 环境管理","kp":"浓度与总量控制","q":"总量控制与浓度控制的关系是（ ）。","options":["二者相同，只是名称不同，都只看排放口浓度","总量控制在浓度达标基础上进一步约束区域排污质量负荷","浓度达标即可不考虑总量","总量控制只考核排放口浓度，浓度达标后不再约束排放总量"],"answer":1,"explain":"解析：下编E8-C04与单元14：双重控制。手册要点：浓度控制限制排放口污染物的单位体积或单位质量含量，总量控制限制特定区域、特定时段内排入环境的污染物总质量。","source":"下编 E8-C04"},{"id":919,"book":"环境","chapter":"第8章 环境管理","kp":"浓度控制缺陷","q":"单纯浓度控制的缺陷是（ ）。","options":["控制过严，企业难以达标","与环境质量目标完全一致","稀释排放可达标，但不能控制污染物总负荷","无法监测，且与环境质量目标无关"],"answer":2,"explain":"解析：下编E8-C04：浓度与质量负荷、地域、时间不同。手册要点：浓度控制限制排放口污染物的单位体积或单位质量含量，总量控制限制特定区域、特定时段内排入环境的污染物总质量。","source":"下编 E8-C04"},{"id":920,"book":"环境","chapter":"第8章 环境管理","kp":"总量控制类型","q":"总量控制可分为（ ）。","options":["目标总量控制、容量总量控制和行业总量控制","浓度控制、速率控制和时间控制","一级控制、二级控制和三级控制","点源控制、面源控制和线源控制"],"answer":0,"explain":"解析：下编E8-C05：容量总量需建立输入响应关系，兼顾技术经济可行。手册要点：容量总量控制从环境质量目标出发，结合迁移转化、自净条件和环境模型确定允许负荷，再作技术经济分配。","source":"下编 E8-C05"},{"id":921,"book":"环境","chapter":"第8章 环境管理","kp":"目标责任制","q":"环境保护目标责任制的核心是（ ）。","options":["只针对排污企业的责任考核","明确地方政府及负责人的环境质量责任并定量考核","上级环保部门直接代替地方政府承担全部环境质量责任","企业自愿作出的环保承诺，不进行考核"],"answer":1,"explain":"解析：教材的环境保护目标责任制，是将一定时期的环境保护目标落实到政府、部门或单位及其负责人，并通过检查考核促使履责（下编E8-C06）。城市环境综合整治定量考核，则以指标评价城市环境质量、污染控制、环境建设与管理。","source":"下编 E8-C06"},{"id":922,"book":"环境","chapter":"第8章 环境管理","kp":"限期治理","q":"限期治理制度针对的是（ ）。","options":["严重污染的排污单位，限定时间完成治理任务","所有新建、扩建项目","自然保护区内的居民","全部企业，无论是否造成严重污染"],"answer":0,"explain":"解析：教材另列限期治理，强调对严重污染问题限定对象、时间、治理内容和效果，属于历史制度术语（下编E8-C06关键词“四项限定；整改”）。复习时理解“目标—责任—考核—整改”的管理逻辑，不死背旧城市考核权重和旧限期治理审批层级。","source":"下编 E8-C06"},{"id":923,"book":"环境","chapter":"第8章 环境管理","kp":"基准与标准","q":"环境基准与环境标准的关系是（ ）。","options":["基准是科学基础（剂量—效应关系），标准是在其基础上结合技术经济制定的法定限值","标准先于基准制定，基准由标准推导而来","基准具有法律效力，标准只是科学研究得出的剂量—效应参考值","二者完全相同，都是剂量—效应关系"],"answer":0,"explain":"解析：环境基准主要基于科学研究描述保护对象对污染物暴露的效应或风险关系，是制定标准的重要科学基础（下编E8-C08）。环境标准还需综合环境功能、政策目标及技术经济条件，具有特定适用范围和实施要求。","source":"下编 E8-C08"},{"id":924,"book":"环境","chapter":"第8章 环境管理","kp":"标准版本","q":"引用环境标准时应注意（ ）。","options":["只引用教材中的旧标准值","标准一经发布永不更新","任何年份的版本都可以引用，不必注意过渡期","标准有版本和适用范围，应使用现行版本并注意过渡期"],"answer":3,"explain":"解析：环境标准还需综合环境功能、政策目标及技术经济条件，具有特定适用范围和实施要求（下编E8-C08关键词“版本；过渡期”）。复习须核对版本、实施时间和适用条件。","source":"下编 E8-C08"},{"id":925,"book":"环境","chapter":"第8章 环境管理","kp":"环评作用","q":"环境影响评价制度的核心作用是（ ）。","options":["只监测项目所在地的环境质量现状","对已建成项目进行事后处罚并征收税费，不涉及决策前预测","在规划和项目决策前预测评价环境影响，提出替代方案和减缓措施","项目建成后对违法排污进行事后处罚"],"answer":2,"explain":"解析：环境影响评价是在规划或建设项目实施前，分析、预测和评估其可能造成的环境影响，提出预防、减轻不良影响的措施，并安排跟踪监测的方法与制度（下编E8-P01：事前预防）。现行法典使用“生态环境影响评价”表述，并按影响程度实行报告书、报告表、登记表分类管理。","source":"下编 E8-P01"},{"id":926,"book":"环境","chapter":"第8章 环境管理","kp":"环评对象","q":"我国环境影响评价的对象包括（ ）。","options":["规划和建设项目","只有工业建设项目","只有建成项目","只有农业"],"answer":0,"explain":"解析：环境影响评价是在规划或建设项目实施前，分析、预测和评估其可能造成的环境影响，提出预防、减轻不良影响的措施，并安排跟踪监测的方法与制度（下编E8-P01）。现行法典使用“生态环境影响评价”表述，并按影响程度实行报告书、报告表、登记表分类管理。","source":"下编 E8-P01"},{"id":927,"book":"环境","chapter":"第8章 环境管理","kp":"集中控制","q":"污染集中控制的优点是（ ）。","options":["规模效益，便于管理，提高区域环境质量","适合所有污染物和所有排污单位","可完全替代企业内部的预处理","不需规划"],"answer":0,"explain":"解析：下编E8-P02：边界是需预处理和分类治理。手册要点：污染集中控制以区域或流域环境质量改善为目标，按污染源性质、类型与位置，集中建设和运行处理设施，优先解决主要环境问题。","source":"下编 E8-P02"},{"id":928,"book":"环境","chapter":"第8章 环境管理","kp":"集中控制边界","q":"关于污染集中控制，下列说法错误的是（ ）。","options":["追求区域质量改善","需要区域规划协调","进入集中处理设施的废水都无需预处理","有毒难降解废水需分类预处理"],"answer":2,"explain":"解析：污染集中控制以区域或流域环境质量改善为目标，按污染源性质、类型与位置，集中建设和运行处理设施，优先解决主要环境问题（下编E8-P02）。集中治理不能替代所有点源控制，对特殊、有毒、远距离或不适合混合处理的污染物仍需分类治理，防止污染转移和设施失效造成集中风险。","source":"下编 E8-P02"},{"id":929,"book":"环境","chapter":"第8章 环境管理","kp":"环境法原则教材","q":"教材将环境法基本原则概括为（ ）。","options":["单一部门管理、统一审批原则","经济优先、先污染后治理、政府负责、企业无责","协调发展、预防为主、环境责任、公众参与","政府负责、企业不承担责任"],"answer":2,"explain":"解析：下编E8-L01：教材口径；现行有更新。手册要点：教材将原则概括为协调发展、预防为主、环境责任、公众参与，适合回答“按本教材概括”的历史理论题。","source":"下编 E8-L01"},{"id":930,"book":"环境","chapter":"第8章 环境管理","kp":"法典原则","q":"据手册，2026年施行的生态环境法典第六条概括的基本原则不包括（ ）。","options":["预防为主、系统治理","经济优先","公众参与、损害担责","生态优先、绿色发展"],"answer":1,"explain":"解析：下编E8-L01：六项原则为预防为主、系统治理、生态优先、绿色发展、公众参与、损害担责。手册要点：截至2026年10月27日，生态环境法典已于8月15日施行，原环境保护法等十部法律同时废止。","source":"下编 E8-L01"},{"id":931,"book":"环境","chapter":"第8章 环境管理","kp":"法典施行","q":"据手册，生态环境法典的施行日期是（ ）。","options":["2030年10月1日","2018年1月1日","2015年1月1日","2026年8月15日"],"answer":3,"explain":"解析：下编E8-L01：截至2026年10月27日，法典已于8月15日施行，原环境保护法等十部法律同时废止。2018年1月1日是环保税开征日，2015年1月1日是修订后的环境保护法施行日，都不是法典的施行日期。","source":"下编 E8-L01"},{"id":932,"book":"环境","chapter":"第8章 环境管理","kp":"环境管理性质","q":"环境管理的范围可按（ ）划分。","options":["只按污染物","资源、区域、行业等","只按行政级别","只按时间阶段"],"answer":1,"explain":"解析：下编E8-C01：范围（资源、区域、行业）与性质（计划、质量、技术管理）。手册要点：按管理范围，环境管理可分为资源环境管理、区域环境管理和部门或行业环境管理，分别着眼于资源可持续利用、区域整体环境质量以及行业特有的资源消耗和污染问题。","source":"下编 E8-C01"},{"id":933,"book":"环境","chapter":"第8章 环境管理","kp":"排放质量负荷","q":"排水量4000 m³/d、COD 100 mg/L，日排放负荷为（ ）。","options":["40 kg/d","400 kg/d","4000 kg/d","4 kg/d"],"answer":1,"explain":"解析：L=10⁻³QC=10⁻³×4000×100=400 kg/d；按300 d/a计为120 t/a。1 mg/L=1 g/m³，日负荷=4000×100 g=4.0×10⁵ g/d=400 kg/d，40和4000 kg/d都差了一个数量级。","source":"下编 公式F8-01、K8-01"},{"id":934,"book":"环境","chapter":"第8章 环境管理","kp":"年排放量","q":"日负荷400 kg/d、年运行300 d，年排放量为（ ）。","options":["120 t/a","146 t/a","12 t/a","1200 t/a"],"answer":0,"explain":"解析：M=400×300=1.2×10⁵ kg=120 t/a。按365 d计是146 t/a，与题设不符。","source":"下编 K8-01"},{"id":935,"book":"环境","chapter":"第8章 环境管理","kp":"削减目标浓度","q":"年排放120 t需削减25%，流量与运行天数不变（4000 m³/d、300 d），目标浓度为（ ）。","options":["75 mg/L","60 mg/L","25 mg/L","90 mg/L"],"answer":0,"explain":"解析：削减后90 t/a，C=90×10⁶ g/(4000×300 m³)=75 mg/L。削减25%后年排放为90 t，浓度=总量/（日流量×天数），即9.0×10⁷ g/1.2×10⁶ m³=75 mg/L。","source":"下编 公式F8-01"},{"id":936,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"环境监测定义","q":"环境监测是指（ ）。","options":["只测定风、温、湿等气象要素，不涉及环境质量","只在实验室进行样品的化学分析","测定代表环境质量的指标，确定环境质量现状及变化趋势","只测定污染源排放口的排放浓度"],"answer":2,"explain":"解析：下编E9-D01：现状、趋势、污染因子、综合处理。手册要点：环境监测是以环境为对象，运用物理、化学、生物、遥感等技术，对反映环境质量现状、污染源状况及其变化趋势的指标进行观测、分析与综合处理的过程。","source":"下编 E9-D01"},{"id":937,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"监测分类目的","q":"按监测目的，环境监测可分为（ ）。","options":["物理监测、化学监测和生物监测（按方法分）","监视性（例行）监测、特定目的（应急等）监测和研究性监测","点源监测、面源监测和线源监测","大气监测、水质监测和土壤监测"],"answer":1,"explain":"解析：按目的，监测可分为监视性、特定目的和研究性监测（下编E9-C01）。监视性监测长期、定点、定期开展，用于掌握质量与排放趋势。","source":"下编 E9-C01"},{"id":938,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"应急监测","q":"发生突发环境污染事故时进行的监测属于（ ）。","options":["研究性监测（科研监测）","特定目的（应急）监测","背景值监测","监视性（例行）监测"],"answer":1,"explain":"解析：特定目的监测服务于污染事故、纠纷、考核验证或咨询等具体需求（下编E9-C01）。按目的，监测可分为监视性、特定目的和研究性监测。","source":"下编 E9-C01"},{"id":939,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"准确度","q":"准确度反映的是（ ）。","options":["多次重复测定结果之间的一致程度（精密度）","测定次数","分析仪器对浓度变化的响应灵敏度","测定结果与真值（参考值）的接近程度"],"answer":3,"explain":"解析：下编E9-C02：准确度受系统误差影响；精密度反映随机误差。手册要点：准确性描述测量结果与真值或可接受参考值的一致程度，精密性描述规定条件下重复测定结果的接近程度。","source":"下编 E9-C02"},{"id":940,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"精密度","q":"精密度反映的是（ ）。","options":["仪器可测定的浓度量程大小","检出限","多次重复测定结果之间的一致程度","结果与真值的接近程度"],"answer":2,"explain":"解析：准确性描述测量结果与真值或可接受参考值的一致程度，精密性描述规定条件下重复测定结果的接近程度（下编E9-C02）。系统误差常使多次结果共同偏向某一方向，随机误差表现为结果的散布。","source":"下编 E9-C02"},{"id":941,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"系统误差","q":"系统误差的特点是（ ）。","options":["方向一致、大小较固定，可通过校正减小","不影响准确度，只影响精密度","随机出现、方向不定、不可预测","只能通过增加次数消除"],"answer":0,"explain":"解析：下编E9-C02：系统偏差影响准确度；随机误差散布影响精密度。手册要点：系统误差常使多次结果共同偏向某一方向，随机误差表现为结果的散布。","source":"下编 E9-C02"},{"id":942,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"精密不等于准确","q":"重复测定结果非常接近，说明（ ）。","options":["准确度一定很好，没有系统误差","分析方法一定没有误差，可直接作为标准方法使用","数据一定可靠，可以直接报告而无需质控","精密度好，但不能排除系统误差，准确度未必好"],"answer":3,"explain":"解析：准确性描述测量结果与真值或可接受参考值的一致程度，精密性描述规定条件下重复测定结果的接近程度（下编E9-L01易失分）。重复测量相近只能支持精密性，不能证明样品代表性，也不能排除共同存在的系统偏差。","source":"下编 E9-C02、E9-L01"},{"id":943,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"分析方法选择","q":"测定水中痕量有机污染物通常选用（ ）。","options":["色谱（如气相色谱）类仪器分析法","目视比色法（半定量）","重量分析法","酸碱滴定法"],"answer":0,"explain":"解析：下编E9-C03：依浓度与基体选择化学或仪器方法。手册要点：仪器分析利用物质的光学、电化学或色谱等特性，适合多种微量和痕量污染物。","source":"下编 E9-C03"},{"id":944,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"生物监测优点","q":"生物监测相对理化监测的优势是（ ）。","options":["完全不受环境因素的干扰","能反映污染物的综合、累积效应","分析速度更快、精度更高","分析精度高于所有仪器分析方法"],"answer":1,"explain":"解析：下编E9-C04：二者互补，生物响应受混杂因素影响。手册要点：生物监测利用生物个体、生理反应、种群或群落结构对环境变化的响应，指示污染状况及其生态效应。","source":"下编 E9-C04"},{"id":945,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"评价类型","q":"环境影响预测评价针对的是（ ）。","options":["未来","过去","与时间无关","现在"],"answer":0,"explain":"解析：下编E9-C05：回顾评价—过去；现状评价—现在；影响预测—未来。手册要点：环境影响评价则着眼拟议规划或项目可能造成的未来影响，比较方案并提出预防减缓措施。","source":"下编 E9-C05"},{"id":946,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"综合指数缺陷","q":"使用平均型综合指数评价水质的缺点是（ ）。","options":["计算过程太复杂，难以使用","不能用于多个评价因子","只能用于大气","可能掩盖个别因子的超标"],"answer":3,"explain":"解析：综合平均可能掩盖某一因子的超标，不能凭平均指数低于一就断言所有因子达标（下编E9-C06关键词“掩盖超标”）。单因子评价指数常以监测浓度与相应标准之比表示，适用于“浓度越高、污染越重”的常规因子。","source":"下编 E9-C06"},{"id":947,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"单因子指数","q":"单因子指数I=C/S>1表示（ ）。","options":["该因子已达到评价标准","该因子超过评价标准","该因子浓度为零","该因子无法判断是否超标"],"answer":1,"explain":"解析：下编公式F9-02：单因子指数I=C/S，C为实测浓度、S为评价标准。I>1表示该因子超过标准，I≤1表示未超标；它只反映单项因子，不能代替综合评价。","source":"下编 公式F9-02"},{"id":948,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"W值法","q":"教材W值法评价的是（ ）。","options":["最大值","最差两项的分值之和","平均值","全部监测项目的总积分之和"],"answer":1,"explain":"解析：下编E9-C07、公式F9-04：W=s₍₁₎+s₍₂₎；M法为总积分。手册要点：W值法则先给每个因子赋十分、八分、六分、四分、二分或零分，再用最低两项分数之和作判级依据，突出较差因子的影响。","source":"下编 E9-C07、公式F9-04"},{"id":949,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"QA与QC","q":"质量保证QA与质量控制QC的关系是（ ）。","options":["QC包含QA，QA是具体检查措施","二者相同，QA和QC都只是实验室内部的仪器操作规范","QA只针对采样环节，QC只针对报告环节","QA是全过程的总体保证体系，QC是其中的具体技术检查措施"],"answer":3,"explain":"解析：下编E9-P01：QC手段有空白、平行、加标回收等。手册要点：质量控制是全过程中的具体技术检查，如现场和实验室空白、平行样、校准核查、标准样品及加标回收。","source":"下编 E9-P01"},{"id":950,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"QC手段","q":"下列属于实验室质量控制措施的是（ ）。","options":["随意取舍异常数据","空白试验、平行样和加标回收","临时改变监测点位","增加监测报告的页数和图表数量"],"answer":1,"explain":"解析：质量控制是全过程中的具体技术检查，如现场和实验室空白、平行样、校准核查、标准样品及加标回收（下编E9-P01）。不同检查对应不同误差来源：空白有助发现污染，平行样反映重复性，加标回收检查特定条件下的分析回收表现。","source":"下编 E9-P01"},{"id":951,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"监测链条","q":"环境监测的工作流程顺序是（ ）。","options":["布点设计—分析质控—采样保存—数据审核与报告","数据报告—采样保存—分析质控—布点","分析质控—采样保存—布点设计—报告","目的设计与布点—采样保存—分析与质控—数据审核报告"],"answer":3,"explain":"解析：监测应先明确目的、对象、指标和适用标准，再设计点位、时间与频次（下编E9-P02）。分析仪器再精确，也无法补救采样位置失当、容器污染、保存超时或样品标识错误。","source":"下编 E9-P02"},{"id":952,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"环评技术路线","q":"环评技术工作中工程分析的作用是（ ）。","options":["代替主管部门审批项目","识别项目的污染源强和环境影响因素","评价公众意见的满意程度","制定行业污染物排放标准"],"answer":1,"explain":"解析：下编E9-P03：工程分析、敏感受体、预测、替代方案、跟踪。手册要点：开展工程分析与环境现状调查，识别关键污染源、影响路径及敏感受体。","source":"下编 E9-P03"},{"id":953,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"五项质量要求","q":"监测数据的五项质量要求是（ ）。","options":["灵敏性、选择性、稳定性、速度、成本","浓度、总量、时间、空间、频次","代表性、完整性、可比性、准确性、精密性","及时性、经济性、美观性、简洁性、完整性"],"answer":2,"explain":"解析：监测数据要求具有代表性、完整性、可比性、准确性和精密性（下编E9-L01）。完整性要求监测计划和全流程记录完整。","source":"下编 E9-L01"},{"id":954,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"代表性","q":"监测数据“代表性”要求（ ）。","options":["点位、时间、频次与采样方法能反映研究总体","数据完整，没有缺测和漏测","不同方法之间的结果具有可比性","重复测定的结果高度一致"],"answer":0,"explain":"解析：代表性要求点位、时间、频次与采样方法反映研究总体（下编E9-L01）。监测数据要求具有代表性、完整性、可比性、准确性和精密性。","source":"下编 E9-L01"},{"id":955,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"遥感优点","q":"遥感在环境监测中的优势是（ ）。","options":["不需反演和地面验证即可使用","能直接测得所有污染物的浓度","精度高于所有地面监测手段，可完全替代地面监测","大范围、周期性、快速获取信息，但需地面验证"],"answer":3,"explain":"解析：下编E9-L02：遥感反演，GIS空间分析，地面验证。手册要点：遥感通过传感器远距离获取地物与大气的电磁辐射信息，具有大范围、周期性和多尺度观测优势，可用于水体叶绿素、热污染、油膜、气溶胶、植被与土地退化等监测。","source":"下编 E9-L02"},{"id":956,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"GIS作用","q":"GIS在环境科学中的主要作用是（ ）。","options":["采集和保存大气颗粒物样品","现场测定噪声声级","实验室测定水样指标","空间数据管理与空间分析"],"answer":3,"explain":"解析：GIS负责环境信息的存储、空间分析、叠加表达与辅助决策，二者功能相关而不同（下编E9-L02）。遥感定量反演依赖物理模型、经验关系和地面验证，容易受云、观测几何和空间分辨率等影响。","source":"下编 E9-L02"},{"id":957,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"环境规划","q":"环境规划的核心内容是（ ）。","options":["只做环境宣传和教育工作","确定环境目标，提出削减任务和方案并动态实施","只开展常规环境监测，不确定环境目标和削减任务","只做环境现状调查和统计"],"answer":1,"explain":"解析：基本路线是调查评价、预测趋势、确定质量与资源目标、分配控制任务、比较方案、安排工程资金、实施监测与滚动调整（下编E9-L03）。环境规划是为实现环境与经济社会协调发展，对人类活动及环境保护作时间、空间和措施安排。","source":"下编 E9-L03"},{"id":958,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"相对误差符号","q":"相对误差为负值表示（ ）。","options":["测定值低于参考值","无意义","精密度差","测定值高于参考值（偏高）"],"answer":0,"explain":"解析：x为同量纲测定值，xref为参考值（下编公式F9-01、K9-01）。相对误差=（测定值−参考值）/参考值，结果为负表示测定值偏低，它反映准确度，与精密度无直接关系。","source":"下编 公式F9-01"},{"id":959,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"加标回收意义","q":"加标回收率主要用于检验（ ）。","options":["监测数据的完整性","平行样测定结果之间的精密度","采样点位的代表性","分析方法的准确度（基体干扰与损失）"],"answer":3,"explain":"解析：下编E9-P01、K9-01：单个回收率不能证明全部质量。手册要点：不同检查对应不同误差来源：空白有助发现污染，平行样反映重复性，加标回收检查特定条件下的分析回收表现。","source":"下编 E9-P01"},{"id":960,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"综合指数Ig","q":"兼顾最大单因子指数与平均值的综合指数（如I_g=√(I_max·I_avg)）的优点是（ ）。","options":["使各因子权重相同，结果等于算术平均值","只反映平均水平，对单项超标不敏感","计算最简单，只用于噪声评价，忽略最大值","突出最严重因子，避免均值掩盖超标"],"answer":3,"explain":"解析：平均值不能掩盖单项超标（下编公式F9-02）。Ig为本教材式9-4的具体定义，不等同于任意一组指数的通常几何平均。","source":"下编 公式F9-02"},{"id":961,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"相对误差","q":"测定均值10.0 mg/L，参考值10.5 mg/L，相对误差为（ ）。","options":["0.50%","-5.00%","4.76%","-4.76%"],"answer":3,"explain":"解析：E_r=(10.0−10.5)/10.5×100%≈−4.76%，负号表示偏低。分母是参考值而非测定值。","source":"下编 公式F9-01、K9-01"},{"id":962,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"平行相对偏差","q":"平行样9.8与10.2 mg/L，相对偏差RD=|x₁−x₂|/(x₁+x₂)×100%为（ ）。","options":["2.0%","4.0%","1.0%","0.4%"],"answer":0,"explain":"解析：RD=0.4/20.0=2.00%。分母取两次之和，即相对于均值的一半偏差。","source":"下编 公式F9-01、K9-01"},{"id":963,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"加标回收率","q":"原样5.0 mg/L，加标5.0 mg/L后测得9.6 mg/L，加标回收率为（ ）。","options":["96%","192%","8%","92%"],"answer":3,"explain":"解析：R=(9.6−5.0)/5.0=92%。一个回收率合格不能证明全部数据质量可靠。","source":"下编 公式F9-01、K9-01"},{"id":964,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"单因子指数","q":"某污染物实测0.12 mg/L，标准0.10 mg/L，单因子指数I=C/S为（ ）。","options":["12.00","1.20","0.83","0.02"],"answer":1,"explain":"解析：I=0.12/0.10=1.20>1，表示超标20%。单因子指数大于1表示超标，1.20即超标20%，0.83是把C和S颠倒，12.00则是小数点错位。","source":"下编 公式F9-02、K9-02"},{"id":965,"book":"环境","chapter":"第9章 环境科学技术与方法","kp":"内梅罗型综合指数","q":"单因子指数1.20、0.60、0.60，平均0.80，I_g=√(I_max·I_avg)约为（ ）。","options":["0.800","0.980","1.000","1.200"],"answer":1,"explain":"解析：I_g=√(1.20×0.80)≈0.980，兼顾最大值，避免均值掩盖超标。I_g取最大单因子指数与平均值乘积的平方根，√(1.20×0.80)≈0.980，0.800只是平均值，会掩盖单项超标。","source":"下编 公式F9-02、K9-02"},{"id":966,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"温室效应环境","q":"温室效应人为增强的主要原因是（ ）。","options":["化石燃料燃烧等使CO₂等温室气体浓度增加","地球轨道参数变化使日照增强","太阳辐射增强使地表增温","太阳辐射增强，以及火山活动释放大量温室气体"],"answer":0,"explain":"解析：下编E10-D01：长波吸收与发射、辐射收支；自然与人为增强区分。手册要点：人类活动增加二氧化碳、甲烷等气体，改变辐射收支，增强温室效应并推动全球变暖。","source":"下编 E10-D01"},{"id":967,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"酸雨界定环境","q":"环境下编对酸雨的界定是（ ）。","options":["含硫的降水","pH小于4.0的强酸性降水","pH小于5.6的降水","pH小于7的降水"],"answer":2,"explain":"解析：下编E10-D02：pH<5.6；酸沉降包括干、湿沉降。手册要点：酸雨通常指pH低于5.6的降水，是酸性湿沉降的一种常用表述。","source":"下编 E10-D02"},{"id":968,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"酸沉降干湿","q":"酸性物质以气态或颗粒形式直接降落地面属于（ ）。","options":["干沉降","湿沉降","酸雨","雾沉降"],"answer":0,"explain":"解析：酸沉降的范围更广，包括酸性物质经雨雪等过程到达地表的湿沉降，以及酸性气体、颗粒物直接向地表输送的干沉降（下编E10-D02）。酸性物质既可在本地沉降，也可在传输转化后产生跨区域影响。","source":"下编 E10-D02"},{"id":969,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"可持续发展定义","q":"可持续发展的经典定义是（ ）。","options":["经济零增长、保持现状的发展","只保护环境而不发展经济的零增长模式","既满足当代人需求，又不损害后代人满足其需求能力的发展","只保护生态环境、完全停止开发利用自然资源"],"answer":2,"explain":"解析：可持续发展是既满足当代人的需要，又不损害后代人满足其需要能力的发展（下编E10-D03）。它以经济、社会和环境协调为核心，强调代内公平、代际公平及资源环境约束，要求改变高消耗、高排放的发展与消费方式，使发展建立在生态系统支持能力和社会公正的基础上。","source":"下编 E10-D03"},{"id":970,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"公平原则","q":"可持续发展的公平性原则包括（ ）。","options":["城乡公平和行业公平","代内公平和代际公平","国内公平和企业公平","经济公平和技术公平"],"answer":1,"explain":"解析：它以经济、社会和环境协调为核心，强调代内公平、代际公平及资源环境约束，要求改变高消耗、高排放的发展与消费方式，使发展建立在生态系统支持能力和社会公正的基础上（下编E10-D03）。可持续发展是既满足当代人的需要，又不损害后代人满足其需要能力的发展。","source":"下编 E10-D03"},{"id":971,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"可持续原则","q":"可持续发展的基本原则不包括（ ）。","options":["持续性","共同性","公平性（代际与代内）","优先性（经济优先）"],"answer":3,"explain":"解析：下编E10-D03：公平、持续、共同（协调发展、环境约束）。手册要点：可持续发展是既满足当代人的需要，又不损害后代人满足其需要能力的发展。","source":"下编 E10-D03"},{"id":972,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"减缓适应环境","q":"应对气候变化中，增加森林碳汇属于（ ）。","options":["减缓","归因","监测","适应"],"answer":0,"explain":"解析：下编E10-C01：减缓=减排增汇；适应=降低损害；二者互补。手册要点：减缓是减少温室气体排放或增加其汇，以限制气候变化程度。","source":"下编 E10-C01"},{"id":973,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"臭氧层保护","q":"保护臭氧层的国际公约及其议定书是（ ）。","options":["《巴黎协定》和《联合国气候变化框架公约》","《斯德哥尔摩公约》和《巴塞尔公约》","《维也纳公约》和《蒙特利尔议定书》","《京都议定书》和《生物多样性公约》"],"answer":2,"explain":"解析：下编E10-C02：淘汰ODS、基加利修正案管控HFCs。手册要点：维也纳公约与蒙特利尔议定书构成重要国际合作框架，源头控制与存量管理需要同时推进。","source":"下编 E10-C02"},{"id":974,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"HFC问题","q":"HFCs替代CFCs后带来的问题是（ ）。","options":["HFCs对臭氧层的破坏比CFCs更强","HFCs是天然气体，不必管控，也不影响气候","HFCs不破坏臭氧层，但是强温室气体，需按基加利修正案削减","HFCs无任何环境影响，可大量使用"],"answer":2,"explain":"解析：基加利修正案针对部分HFC实施逐步削减（下编E10-C02）。HFC一般不含氯，不能因不破坏臭氧就认定无气候影响。","source":"下编 E10-C02"},{"id":975,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"清洁生产","q":"清洁生产强调（ ）。","options":["末端治理为主","源头预防和生产全过程控制","事后补偿和赔偿","将污染转移到其他介质或地区"],"answer":1,"explain":"解析：下编E10-C03：源头预防、生命周期；末端治理为补充。手册要点：清洁生产把预防污染贯穿生产过程及产品服务全生命周期，通过原料替代、工艺改进、节能节水和管理优化，在污染产生前减少资源消耗、废物数量与毒性。","source":"下编 E10-C03"},{"id":976,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"循环经济","q":"循环经济的“3R”原则是（ ）。","options":["减量化、再利用、资源化（再循环）","回收利用、卫生填埋、焚烧发电","减量化、无害化、资源化","预防、控制、治理"],"answer":0,"explain":"解析：循环经济强调减量化、再利用、资源化，推动企业、园区和社会层面的物质循环，提高资源利用效率（下编E10-C03关键词“减量再用资源化”）。资源化也并非天然无污染，应评价收集运输、再加工、能源消耗和残余物处置。","source":"下编 E10-C03"},{"id":977,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"末端治理局限","q":"末端治理的局限是（ ）。","options":["最经济、最有效的治理方式","适用于所有污染物，且不产生二次废物","只处理已产生的污染，成本高且可能转移污染","不需投入资金，可从源头消除污染"],"answer":2,"explain":"解析：下编E10-C03：末端治理是补充而非主导。手册要点：末端治理处理已经产生的污染物，是必要补充，但不能代替源头预防。","source":"下编 E10-C03"},{"id":978,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"国际气候合作","q":"《联合国气候变化框架公约》下《巴黎协定》的实施机制核心是（ ）。","options":["取消适应，只强调减缓","各国国家自主贡献（NDC）与全球盘点","只要求发达国家承担减排义务","强制统一减排配额"],"answer":1,"explain":"解析：国际气候合作以联合国气候变化框架公约为基本框架，京都议定书和巴黎协定属于其下的重要制度安排（下编E10-P01）。巴黎协定强调将升温控制在远低于二摄氏度并努力限制在一点五摄氏度，各方以国家自主贡献推进减排和适应，并通过透明度、定期盘点及资金技术合作提高行动力度。","source":"下编 E10-P01"},{"id":979,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"共同但有区别","q":"国际气候合作中的“共同但有区别的责任”原则意味着（ ）。","options":["发展中国家无需采取任何行动","各国责任和能力完全相同，应承担同等的减排义务","只有发达国家承担责任，发展中国家没有任何义务","各国都有责任，但发达国家与发展中国家责任和能力有区别"],"answer":3,"explain":"解析：下编E10-P01框架公约原则。手册要点：国际气候合作以联合国气候变化框架公约为基本框架，京都议定书和巴黎协定属于其下的重要制度安排。","source":"下编 E10-P01"},{"id":980,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"平流层臭氧屏障","q":"平流层臭氧的环境意义是（ ）。","options":["吸收太阳紫外辐射，保护地表生物","增强到达地面的紫外辐射","产生光化学烟雾，危害健康","是酸雨前体"],"answer":0,"explain":"解析：臭氧层吸收大部分有害紫外辐射，是保护地表生物的重要屏障（下编E10-P02）。平流层中，氧分子吸收足够能量的紫外线后光解形成氧原子，氧原子再与氧分子在第三体协助下生成臭氧。","source":"下编 E10-P02"},{"id":981,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"臭氧耗损源气体","q":"破坏臭氧层的主要人为物质是（ ）。","options":["甲烷（CH₄）和氧化亚氮（N₂O）等农业排放气体","氯氟烃（CFCs）、哈龙等含卤素的长寿命源气体","二氧化碳（CO₂）","二氧化硫（SO₂）"],"answer":1,"explain":"解析：下编E10-P03：长寿命源气体进入平流层光解，释放卤素催化破坏。手册要点：CFC等长寿命卤代物在对流层相对稳定，可输送到平流层，经紫外光解释放活性氯、溴。","source":"下编 E10-P03"},{"id":982,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"活性氯循环","q":"活性氯催化循环的特点是（ ）。","options":["氯原子在反应中被消耗，作用有限","生成臭氧，使臭氧层增厚","只在对流层发生，氯原子随降水很快被清除","氯原子在循环中再生，一个氯原子可破坏大量臭氧"],"answer":3,"explain":"解析：Cl为活性氯原子，ClO为一氧化氯自由基（下编公式F10-03）。该简单循环需有原子氧，说明催化再生原理。","source":"下编 公式F10-03"},{"id":983,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"酸雨影响因素","q":"影响酸雨形成和分布的因素不包括（ ）。","options":["月相","气象输送条件","大气中碱性物质的中和","SO₂与NOx排放"],"answer":0,"explain":"解析：形成与分布应从“排放—氧化—输送—中和—沉降”解释，结合气象、地形和受体缓冲能力（下编E10-P04）。教材所写我国南方较易形成酸雨可作历史机制理解，不能把旧面积、频率和城市排序冒充2026年监测现状。","source":"下编 E10-P04"},{"id":984,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"北方少酸雨","q":"我国北方SO₂排放量大，但酸雨较南方少，主要原因是（ ）。","options":["北方大气颗粒物（土壤尘）碱性强，中和作用大","北方SO₂排放量实际上更少","北方降水pH测量方法与南方不同","北方气温高、降水多，SO₂被迅速氧化后冲刷"],"answer":0,"explain":"解析：酸度还受氨、碱性颗粒物等中和及降水过程影响（下编E10-P04关键词“中和”）。它们在大气中经气相与云雾水中的液相氧化，形成硫酸、硝酸及其相关颗粒物，在输送过程中经湿、干沉降进入生态系统。","source":"下编 E10-P04"},{"id":985,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"主要温室气体环境","q":"下列不属于温室气体的是（ ）。","options":["水汽H₂O","N₂O","O₂","CH₄"],"answer":2,"explain":"解析：下编E10-L01：CO₂、CH₄、N₂O等；O₂不是温室气体。O₂和N₂是双原子同核分子，对红外长波几乎没有吸收，不是温室气体，水汽、N₂O、CH₄都能吸收长波辐射。","source":"下编 E10-L01"},{"id":986,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"温室气体汇","q":"CO₂的主要自然汇是（ ）。","options":["陆地植被与海洋","平流层光解","OH自由基","降水冲刷"],"answer":0,"explain":"解析：人为CO2主要来自化石燃料燃烧、工业过程和土地利用变化，海洋及陆地生态系统是重要汇（下编E10-L01：陆地海洋汇）。水汽对自然温室效应重要，气候变化中通常主要表现为反馈。","source":"下编 E10-L01"},{"id":987,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"气候影响","q":"气候变化的影响不包括（ ）。","options":["海平面上升","生态系统和农业受影响","地球自转加快","水循环变化与极端事件"],"answer":2,"explain":"解析：气候变化的影响包括海平面上升、水循环变化与极端事件增多，以及对生态系统、农业和健康的影响。地球自转速度由天体力学决定，不在气候变化的影响之列。","source":"下编 E10-L02"},{"id":988,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"酸沉降危害","q":"酸沉降对土壤的危害是（ ）。","options":["使土壤碱化，养分增加","土壤酸化，盐基养分淋失，铝等金属活化","对土壤没有影响","增加土壤养分，提高土壤肥力"],"answer":1,"explain":"解析：酸沉降可使土壤和水体酸化，促使钙镁等养分流失和部分有毒金属活化，损害植物根系、微生物与水生生物，改变生态系统结构（下编E10-L03）。危害取决于沉降负荷、持续时间和生态系统缓冲能力，不能只比较一次降雨pH。","source":"下编 E10-L03"},{"id":989,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"酸沉降防治","q":"防治酸沉降的根本措施是（ ）。","options":["向湖泊投加石灰中和","实施人工增雨稀释","削减SO₂和NOx排放","种植耐酸植物"],"answer":2,"explain":"解析：下编E10-L03：减排协同；投加石灰只是补救。手册要点：防治应优先减少SO2与NOx排放，通过节能、低硫或清洁能源替代、燃烧优化、烟气脱硫和脱硝、机动车排放控制等实现，并加强区域协同与监测。","source":"下编 E10-L03"},{"id":990,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"海洋污染来源","q":"海洋污染的主要来源是（ ）。","options":["海洋生物的排泄物","宇宙尘","陆源污染物","海底火山"],"answer":2,"explain":"解析：下编E10-L04：陆源与海源，以陆源为主，需陆海统筹。海洋污染物约80%来自陆地，经河流、排污口和大气沉降入海，所以治理要陆海统筹，海洋生物、宇宙尘和海底火山都不是主要来源。","source":"下编 E10-L04"},{"id":991,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"陆海统筹","q":"治理近岸海域富营养化和赤潮，关键是（ ）。","options":["只治理海上船舶的排污行为","陆海统筹，控制入海河流氮磷负荷","只在海上打捞藻类","禁止近岸渔业捕捞"],"answer":1,"explain":"解析：治理应实行流域与近岸海域协同、源头减量、污水与养殖污染控制、船舶和溢油防控、海洋垃圾治理、监测预警及生态修复（下编E10-L04）。近岸与交换不畅的海湾较易累积污染，危害表现为缺氧、富营养化、毒性和栖息地受损。","source":"下编 E10-L04"},{"id":992,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"碳中和误区","q":"关于碳中和，下列说法错误的是（ ）。","options":["碳中和就是完全不排放CO₂","需明确核算边界和时间","不能只靠种树","碳中和是人为排放与人为移除的净平衡"],"answer":0,"explain":"解析：碳达峰强调一定范围内二氧化碳排放达到峰值后进入下降趋势，碳中和强调在明确核算范围和时间内，人为排放与人为移除达到净平衡（下编E10-L05易失分）。我国目标为2030年前碳达峰、2060年前碳中和。","source":"下编 E10-L05"},{"id":993,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"强度与总量","q":"排放强度下降而总排放仍增加的原因是（ ）。","options":["排放强度计算错误","总量必然下降，增加只是统计误差","产出增长速度快于强度下降速度","排放强度与总量无关"],"answer":2,"explain":"解析：总排放等于排放强度乘以产出，即E₁/E₀=(1−r)(1+g)，r为强度下降比例，g为产出增长比例。只要产出增长快于强度下降，(1−r)(1+g)>1，总排放就会增加。所以强度下降并不意味着总量必然下降，这不是统计误差。","source":"下编 公式F10-04"},{"id":994,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"减污降碳","q":"减污降碳协同增效强调（ ）。","options":["只要PM2.5达标即可，温室气体在其他边界另行核算并可重复计入","只减排CO₂，不管大气污染物","在同一边界内源头协同治理大气污染物与温室气体，避免重复计量","只治理PM2.5，不考虑温室气体"],"answer":2,"explain":"解析：减污降碳协同是统筹温室气体与常规污染物控制，通过节能、清洁能源、结构调整和资源效率提升，争取同时减少碳排放及SO2、NOx等污染排放（下编E10-L06）。论述应说明核算边界、直接与间接排放、监测证据及长期性，比较净效应后选措施，避免重复计算同一份减排或碳汇。","source":"下编 E10-L06"},{"id":995,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"协同权衡","q":"下列措施中可能存在减污与降碳“权衡”（冲突）的是（ ）。","options":["推进以电代煤、淘汰低效燃煤锅炉，同时降低污染物排放与能耗","以风电、光伏等清洁能源替代燃煤","提高能效，降低单位产品能耗","加装高能耗末端治理设施，使污染物下降但能耗与CO₂上升"],"answer":3,"explain":"解析：协同并非自动发生：末端脱硫脱硝可能增加能耗，不同措施还存在土地、水资源、成本和生态权衡（下编E10-L06关键词“权衡”）。减污降碳协同是统筹温室气体与常规污染物控制，通过节能、清洁能源、结构调整和资源效率提升，争取同时减少碳排放及SO2、NOx等污染排放。","source":"下编 E10-L06"},{"id":996,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"碳收支留存","q":"某区域排放100 MtC，陆地汇30 MtC、海洋汇25 MtC，大气碳增加为（ ）。","options":["75 MtC","45 MtC","55 MtC","155 MtC"],"answer":1,"explain":"解析：ΔM=100−30−25=45 MtC，留存45%；折合CO₂约165 Mt。手册要点：某教学碳收支在一年内向大气排放100 MtC，陆地净吸收30 MtC，海洋净吸收25 MtC，忽略边界外其他通量。","source":"下编 公式F10-01、K10-01"},{"id":997,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"MtC换MtCO₂","q":"大气碳增加45 MtC，折合CO₂约为（ ）。","options":["165 MtCO₂","120 MtCO₂","12 MtCO₂","45 MtCO₂"],"answer":0,"explain":"解析：45×44/12=165 MtCO₂。C与CO₂口径必须统一。","source":"下编 K10-01"},{"id":998,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"排放强度","q":"某地排放200万吨CO₂、GDP 1000亿元（=1.0×10⁷万元），排放强度为（ ）。","options":["2.00 tCO₂/万元","0.02 tCO₂/万元","5.00 tCO₂/万元","0.20 tCO₂/万元"],"answer":3,"explain":"解析：I=E/Y=2.0×10⁶ t/1.0×10⁷万元=0.20 tCO₂/万元。排放强度=排放量/GDP，2.0×10⁶ t除以1.0×10⁷万元得0.20 tCO₂/万元，5.00是比值倒置的结果。","source":"下编 公式F10-04、K10-02"},{"id":999,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"强度下降仍可能增排","q":"排放强度下降10%、GDP增长20%，总排放变化为（ ）。","options":["-10%","10%","-8%","8%"],"answer":3,"explain":"解析：E₁/E₀=(1−0.10)(1+0.20)=1.08，总排放增长8%，强度下降不等于总量下降，不能据此判定达峰。手册要点：下一期GDP按可比价格增长20%，单位GDP排放强度下降10%，两期核算范围一致。","source":"下编 公式F10-04、K10-02"},{"id":1000,"book":"环境","chapter":"第10章 全球环境变化与可持续发展","kp":"减排协同率","q":"项目实施后SO₂由500 t降至350 t，SO₂削减率η为（ ）。","options":["70%","150%","30%","43%"],"answer":2,"explain":"解析：η=(500−350)/500=30%。协同核算须在同一边界内，且不得重复计量。","source":"下编 公式F10-05、K10-03"}]</script>
<script>
(function(){
'use strict';
var KEY='nj891_mcq_v1';
var Q=JSON.parse(document.getElementById('qdata').textContent);
var BY={};Q.forEach(function(q){BY[q.id]=q;});
var CHAPS=[];(function(){var s={};Q.forEach(function(q){var k=q.book+'|'+q.chapter;if(!s[k]){s[k]=1;CHAPS.push(k);}});
 CHAPS.sort(function(a,b){var A=a.split('|'),B=b.split('|');if(A[0]!==B[0])return A[0]==='大气'?-1:1;return parseInt(A[1].replace(/\D+/,''))-parseInt(B[1].replace(/\D+/,''));});})();
function chKey(q){return q.book+'|'+q.chapter;}
function chLabel(k){var p=k.split('|');return p[0]+' · '+p[1];}
var L='ABCD';
function blank(){return {v:1,rec:{},wrong:{},filter:'all',cur:null,wfilter:'all',created:Date.now()};}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===1&&s.rec&&s.wrong)return s;}catch(e){}return blank();}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('保存失败：浏览器存储不可用');}}
var view=document.getElementById('view'),dock=document.getElementById('dock'),dockIn=document.getElementById('dockIn'),homeBtn=document.getElementById('homeBtn');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},1800);}
function inFilter(q,f){if(f==='all')return true;if(f==='大气'||f==='环境')return q.book===f;return chKey(q)===f;}
function fLabel(f){return f==='all'?'全部（两本书混合）':(f==='大气'||f==='环境')?('只刷'+f+'（'+(f==='大气'?'刘红年':'方淑荣/姚红')+'）'):chLabel(f);}
function stats(){var d=0,c=0;for(var id in S.rec){d++;if(S.rec[id].first)c++;}return {done:d,correct:c,acc:d?c/d:0};}
function pct(x){return (x*100).toFixed(1)+'%';}
function setDock(btns){dockIn.innerHTML='';if(!btns||!btns.length){dock.classList.add('hide');return;}dock.classList.remove('hide');btns.forEach(function(b){dockIn.appendChild(b);});}
function mkBtn(txt,cls,fn,id){var b=document.createElement('button');b.type='button';b.className='btn '+(cls||'');b.textContent=txt;if(id)b.id=id;b.addEventListener('click',fn);return b;}
var mode='home',curQ=null,answered=false,shownAt=0,wrongQueue=null,keyNext=null;
homeBtn.addEventListener('click',function(){home();});
function top(){window.scrollTo(0,0);}
// ---------- HOME ----------
function home(){
 mode='home';keyNext=null;homeBtn.classList.add('hide');setDock(null);
 var st=stats(),wn=Object.keys(S.wrong).length;
 var opts=['all','大气','环境'].concat(CHAPS).map(function(k){var n=Q.filter(function(q){return inFilter(q,k);}).length,d=Q.filter(function(q){return inFilter(q,k)&&S.rec[q.id];}).length;return '<option value="'+esc(k)+'"'+(S.filter===k?' selected':'')+'>'+esc(fLabel(k))+'（'+d+'/'+n+'）</option>';}).join('');
 view.innerHTML='<div class="card"><div class="mut">总进度</div><div class="big" id="prog">'+st.done+' / '+Q.length+'</div><div class="bar"><i style="width:'+(st.done/Q.length*100)+'%"></i></div>'+
 '<div class="grid2" style="margin-top:12px"><div><div class="mut">首答正确率</div><div class="big" style="font-size:22px">'+(st.done?pct(st.acc):'—')+'</div></div><div><div class="mut">错题集</div><div class="big" style="font-size:22px">'+wn+' 题</div></div></div></div>'+
 '<div class="card stack"><label class="mut" for="fsel">刷题范围（按书/章节筛选）</label><select id="fsel">'+opts+'</select></div>'+
 '<div class="stack"><button class="btn pri" type="button" id="goBtn">'+(st.done?'继续随机刷':'开始随机刷')+'</button>'+
 '<div class="grid2"><button class="btn" type="button" id="wbBtn">错题集（'+wn+'）</button><button class="btn" type="button" id="stBtn">章节统计</button></div>'+
 '<div class="grid2"><button class="btn" type="button" id="exBtn">导出进度</button><button class="btn" type="button" id="imBtn">导入进度</button></div>'+
 '<button class="btn danger" type="button" id="rsBtn">重置进度</button></div>'+
 '<p class="mut" style="margin-top:14px">题库：大气 '+Q.filter(function(q){return q.book==='大气';}).length+' 题（刘红年《大气科学概论》第3版），环境 '+Q.filter(function(q){return q.book==='环境';}).length+' 题（方淑荣/姚红《环境科学概论》第2版）。题目均出自复习手册与笔记；标「书外应用」的为 HJ 633—2026 应用题。进度只保存在本机浏览器里。</p>';
 document.getElementById('fsel').addEventListener('change',function(e){S.filter=e.target.value;S.cur=null;save();home();});
 document.getElementById('goBtn').addEventListener('click',function(){startQuiz();});
 document.getElementById('wbBtn').addEventListener('click',wrongBook);
 document.getElementById('stBtn').addEventListener('click',statsView);
 document.getElementById('exBtn').addEventListener('click',exportP);
 document.getElementById('imBtn').addEventListener('click',function(){document.getElementById('importFile').click();});
 var rs=document.getElementById('rsBtn'),armed=0;
 rs.addEventListener('click',function(){if(!armed){armed=1;rs.textContent='再点一次确认清零（不可恢复）';rs.classList.add('pri');setTimeout(function(){if(armed){armed=0;rs.textContent='重置进度';rs.classList.remove('pri');}},5000);return;}
  armed=0;S=blank();save();toast('进度已清零');home();});
 top();
}
// ---------- QUIZ ----------
function unseen(f){return Q.filter(function(q){return inFilter(q,f)&&!S.rec[q.id];});}
function startQuiz(){mode='quiz';wrongQueue=null;nextQ();}
function nextQ(){
 if(mode==='wrong'){return nextWrong();}
 var pool;
 if(S.cur&&BY[S.cur]&&!S.rec[S.cur]&&inFilter(BY[S.cur],S.filter)){curQ=BY[S.cur];}
 else{pool=unseen(S.filter);if(!pool.length){return finished();}curQ=pool[Math.floor(Math.random()*pool.length)];S.cur=curQ.id;save();}
 renderQ();
}
function renderQ(){
 answered=false;shownAt=Date.now();homeBtn.classList.remove('hide');
 var q=curQ,isW=mode==='wrong';
 var head=isW?('错题重刷 · 剩余 '+wrongQueue.length+' 题'):(fLabel(S.filter)+' · 已做 '+Q.filter(function(x){return inFilter(x,S.filter)&&S.rec[x.id];}).length+'/'+Q.filter(function(x){return inFilter(x,S.filter);}).length);
 var tags='<span class="tag">'+esc(q.book)+'</span><span class="tag">'+esc(q.chapter)+'</span>'+(q.tag?q.tag.split('、').map(function(t){return '<span class="tag o">'+esc(t)+'</span>';}).join(''):'')+(S.wrong[q.id]?'<span class="tag w">错题</span>':'');
 view.innerHTML='<div class="mut" style="margin:0 2px 8px">'+esc(head)+'</div><div class="card"><div>'+tags+'</div><div class="q">'+q.id+'. '+esc(q.q)+'</div><div id="opts">'+
  q.options.map(function(o,i){return '<button type="button" class="opt" data-i="'+i+'"><b>'+L[i]+'</b><span>'+esc(o)+'</span></button>';}).join('')+
  '</div><div id="exw"></div></div><div class="kbd">键盘：1–4 或 A–D 作答，Enter/空格 下一题</div>';
 Array.prototype.forEach.call(view.querySelectorAll('.opt'),function(b){b.addEventListener('click',function(){answer(+b.getAttribute('data-i'));});});
 setDock(null);keyNext=null;top();
}
function answer(i){
 if(answered)return;answered=true;
 var q=curQ,ok=i===q.answer,now=Date.now();
 var bs=view.querySelectorAll('.opt');
 Array.prototype.forEach.call(bs,function(b,j){b.disabled=true;if(j===q.answer)b.classList.add('ok');else if(j===i)b.classList.add('bad');});
 var note='';
 if(mode==='wrong'){
  var w=S.wrong[q.id];if(w){w.redo=(w.redo||0)+1;w.last=now;if(ok){delete S.wrong[q.id];note='（重做正确，已自动移出错题集）';}else{w.redoWrong=(w.redoWrong||0)+1;}}
  var r=S.rec[q.id];if(r){r.n=(r.n||1)+1;}
 }else{
  if(!S.rec[q.id]){S.rec[q.id]={first:ok?1:0,pick:i,t:now,ms:now-shownAt,n:1};}
  if(!ok){S.wrong[q.id]={added:now,pick:i,redo:0};note='（已加入错题集）';}
  S.cur=null;
 }
 save();
 var ex=document.getElementById('exw');
 ex.innerHTML='<div class="ex '+(ok?'okx':'badx')+'" id="explain"><div class="res" style="color:var(--'+(ok?'ok':'bad')+')">'+(ok?'✓ 回答正确':'✗ 回答错误，正确答案 '+L[q.answer])+esc(note)+'</div><div>'+esc(q.explain)+'</div>'+
  '<div class="meta">知识点：'+esc(q.kp)+'<br>章节：'+esc(q.book)+' · '+esc(q.chapter)+'<br>出处：'+esc(q.source)+'</div></div>';
 var btns=[mkBtn('下一题','pri',function(){nextQ();},'nextBtn')];
 if(mode==='wrong'&&S.wrong[q.id]){btns.unshift(mkBtn('移出错题集','',function(){delete S.wrong[q.id];save();toast('已移出');this.disabled=true;}));}
 setDock(btns);keyNext=function(){nextQ();};
 setTimeout(function(){var e=document.getElementById('explain');if(e&&e.scrollIntoView)e.scrollIntoView({block:'nearest',behavior:'smooth'});},30);
}
function finished(){
 mode='done';homeBtn.classList.remove('hide');setDock(null);keyNext=null;
 var st=stats(),all=st.done>=Q.length,wn=Object.keys(S.wrong).length;
 view.innerHTML='<div class="card stack"><div class="big">'+(all?'🎉 1000 道全部完成！':'本范围已做完')+'</div><div>'+(all?('首答正确 '+st.correct+' 题，正确率 '+pct(st.acc)+'；错题集还有 '+wn+' 题。'):('「'+esc(fLabel(S.filter))+'」的题目都做过了，可以换个范围，或先刷错题。'))+'</div>'+
 '<button class="btn pri" type="button" id="fwBtn">错题重刷（'+wn+'）</button>'+(all?'<button class="btn danger" type="button" id="frBtn">清零重来</button>':'<button class="btn" type="button" id="fhBtn">换个范围</button>')+'</div>';
 document.getElementById('fwBtn').addEventListener('click',function(){startWrong('all');});
 var fr=document.getElementById('frBtn');if(fr){var arm=0;fr.addEventListener('click',function(){if(!arm){arm=1;fr.textContent='再点一次确认清零';return;}S=blank();save();toast('已清零，重新开始');home();});}
 var fh=document.getElementById('fhBtn');if(fh)fh.addEventListener('click',home);
}
// ---------- WRONG BOOK ----------
function wrongIds(f){return Object.keys(S.wrong).map(Number).filter(function(id){return BY[id]&&inFilter(BY[id],f);}).sort(function(a,b){return S.wrong[b].added-S.wrong[a].added;});}
function wrongBook(){
 mode='wbook';keyNext=null;homeBtn.classList.remove('hide');
 var f=S.wfilter||'all';var cnt={};Object.keys(S.wrong).forEach(function(id){var q=BY[id];if(q){var k=chKey(q);cnt[k]=(cnt[k]||0)+1;}});
 var opts=['all','大气','环境'].concat(CHAPS).map(function(k){var n=k==='all'?Object.keys(S.wrong).length:(k==='大气'||k==='环境')?Object.keys(S.wrong).filter(function(id){return BY[id]&&BY[id].book===k;}).length:(cnt[k]||0);return '<option value="'+esc(k)+'"'+(f===k?' selected':'')+'>'+esc(k==='all'?'全部错题':(k==='大气'||k==='环境')?k:chLabel(k))+'（'+n+'）</option>';}).join('');
 var ids=wrongIds(f);
 var chTable=CHAPS.filter(function(k){return cnt[k];}).map(function(k){return '<tr><td>'+esc(chLabel(k))+'</td><td>'+cnt[k]+'</td></tr>';}).join('');
 view.innerHTML='<div class="card stack"><div class="big" id="wbCount">错题集 '+Object.keys(S.wrong).length+' 题</div><select id="wsel">'+opts+'</select></div>'+
 (chTable?'<div class="card"><div class="mut">各章错题数</div><table><tbody>'+chTable+'</tbody></table></div>':'')+
 '<div class="card" id="wlist">'+(ids.length?ids.map(function(id){var q=BY[id],w=S.wrong[id];return '<div class="li"><div class="t"><span class="tag">'+esc(q.book)+' '+esc(q.chapter.split(' ')[0])+'</span>'+id+'. '+esc(q.q)+'<div class="mut">你选 '+L[w.pick]+' · 正确 '+L[q.answer]+'：'+esc(q.options[q.answer])+(w.redo?(' · 已重做 '+w.redo+' 次'):'')+'</div></div><button class="btn small" type="button" data-rm="'+id+'">移出</button></div>';}).join(''):'<div class="mut">这里还没有错题。</div>')+'</div>';
 document.getElementById('wsel').addEventListener('change',function(e){S.wfilter=e.target.value;save();wrongBook();});
 Array.prototype.forEach.call(view.querySelectorAll('[data-rm]'),function(b){b.addEventListener('click',function(){delete S.wrong[b.getAttribute('data-rm')];save();toast('已移出错题集');wrongBook();});});
 setDock(ids.length?[mkBtn('重刷这些错题（'+ids.length+'）','pri',function(){startWrong(f);},'redoBtn')]:null);top();
}
function startWrong(f){var ids=wrongIds(f);if(!ids.length){toast('没有错题');return home();}
 for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t;}
 mode='wrong';wrongQueue=ids;nextWrong();}
function nextWrong(){
 while(wrongQueue&&wrongQueue.length&&!S.wrong[wrongQueue[0]])wrongQueue.shift();
 if(!wrongQueue||!wrongQueue.length){toast('本轮错题重刷完成');return wrongBook();}
 curQ=BY[wrongQueue.shift()];renderQ();
}
// ---------- STATS ----------
function statsView(){
 mode='stats';keyNext=null;homeBtn.classList.remove('hide');setDock(null);
 var rows=CHAPS.map(function(k){var qs=Q.filter(function(q){return chKey(q)===k;});var d=0,c=0;qs.forEach(function(q){var r=S.rec[q.id];if(r){d++;if(r.first)c++;}});return {k:k,n:qs.length,d:d,c:c,a:d?c/d:null,w:qs.filter(function(q){return S.wrong[q.id];}).length};});
 var done=rows.filter(function(r){return r.d>0;}).sort(function(a,b){return a.a-b.a||b.d-a.d;});
 var weak=done.slice(0,5),wk={};weak.forEach(function(r){wk[r.k]=1;});
 var rest=rows.filter(function(r){return !wk[r.k];});
 function tr(r,cls){return '<tr class="'+(cls||'')+'"><td>'+esc(chLabel(r.k))+'</td><td>'+r.d+'/'+r.n+'</td><td>'+(r.a===null?'—':pct(r.a))+'</td><td>'+r.w+'</td></tr>';}
 var st=stats();
 view.innerHTML='<div class="card"><div class="mut">总计</div><div class="big">'+st.done+'/'+Q.length+' · '+(st.done?pct(st.acc):'—')+'</div><div class="mut">正确率按每题第一次作答计算；错题重做不改变首答记录。</div></div>'+
 '<div class="card"><table><thead><tr><th>章节</th><th>已做</th><th>正确率</th><th>错题</th></tr></thead><tbody>'+
 (weak.length?'<tr><td colspan="4" class="mut" style="text-align:left">最薄弱的 '+weak.length+' 章</td></tr>'+weak.map(function(r){return tr(r,'weak');}).join('')+'<tr><td colspan="4" class="mut" style="text-align:left">其余章节</td></tr>':'')+
 rest.map(function(r){return tr(r);}).join('')+'</tbody></table></div>';top();
}
// ---------- EXPORT / IMPORT ----------
function exportP(){
 var data=JSON.stringify({app:'nj891_mcq',key:KEY,exported:new Date().toISOString(),state:S});
 var d=new Date(),name='891刷题进度_'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
 try{var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('已导出 '+name);}
 catch(e){toast('导出失败');}
}
document.getElementById('importFile').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var o=JSON.parse(r.result);var s=o.state||o;if(!s||s.v!==1||typeof s.rec!=='object'||typeof s.wrong!=='object')throw 0;
  Object.keys(s.rec).forEach(function(k){if(!BY[k])delete s.rec[k];});Object.keys(s.wrong).forEach(function(k){if(!BY[k])delete s.wrong[k];});
  S=s;S.cur=null;save();toast('导入成功：已做 '+Object.keys(S.rec).length+' 题');home();}catch(err){toast('导入失败：文件格式不对');}
  e.target.value='';};r.readAsText(f);});
// ---------- KEYS ----------
document.addEventListener('keydown',function(e){
 if(e.target&&(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'))return;
 if((mode==='quiz'||mode==='wrong')&&!answered){var k=e.key.toUpperCase();var i='1234'.indexOf(k);if(i<0)i=L.indexOf(k);if(i>=0&&k.length===1){e.preventDefault();answer(i);}return;}
 if(answered&&keyNext&&(e.key==='Enter'||e.key===' '||e.key==='Spacebar')){e.preventDefault();var f=keyNext;keyNext=null;f();}
});
window.__mcq={Q:Q,state:function(){return S;},KEY:KEY};
home();
})();
</script>
</body>
