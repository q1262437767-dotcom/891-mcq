册要点：ρ₀为静止分层参考密度kg·m⁻³，w为m·s⁻¹。","source":"上编 公式4-09"},{"id":255,"book":"大气","chapter":"第4章 大气动力学","kp":"涡度定义","q":"相对涡度垂直分量ζ的表达式是（ ）。","options":["ζ=∂v/∂x−∂u/∂y","ζ=∂u/∂x+∂v/∂y","ζ=∂u/∂y−∂v/∂x","ζ=∂w/∂z"],"answer":0,"explain":"解析：手册公式4-21：ζ=∂v/∂x−∂u/∂y，从上方看逆时针为正。散度是∂u/∂x+∂v/∂y。","source":"上编 4-D07、公式4-21"},{"id":256,"book":"大气","chapter":"第4章 大气动力学","kp":"绝对涡度","q":"绝对涡度η等于（ ）。","options":["相对涡度ζ加地转参数f","相对涡度ζ减去f","相对涡度减f","水平散度加上地转参数f之和"],"answer":0,"explain":"解析：η为局地垂直绝对涡度（手册4-D07、公式4-21：η=ζ+f）。无条件说绝对涡度守恒不成立。","source":"上编 公式4-21"},{"id":257,"book":"大气","chapter":"第4章 大气动力学","kp":"环流定义","q":"环流C的定义是（ ）。","options":["速度沿闭合曲线的线积分∮V·dl","速度在面积上的积分","速度大小沿曲线之和","速度矢量对闭合曲线所围面积的散度积分"],"answer":0,"explain":"解析：手册公式4-21：C=∮V·dl，描述总体旋转；涡度描述局地旋转。手册要点：环流是速度沿闭合曲线的线积分，表示有限区域总体旋转趋势，单位m²·s⁻¹。","source":"上编 4-D07"},{"id":258,"book":"大气","chapter":"第4章 大气动力学","kp":"气旋涡度符号","q":"北半球气旋（低压）的相对涡度通常（ ）。","options":["无法确定","为零","为负","为正"],"answer":3,"explain":"解析：北半球气旋逆时针旋转，从上方看逆时针ζ>0。按右手定则，逆时针旋转对应垂直涡度为正，北半球低压中气流逆时针旋转，所以相对涡度为正，反气旋则为负。","source":"上编 公式4-21"},{"id":259,"book":"大气","chapter":"第4章 大气动力学","kp":"摩擦作用","q":"近地层摩擦使风（ ）。","options":["风速减小并斜穿等压线吹向低压","风速增大并斜穿等压线吹向高压","风速增大并平行于等压线吹，不再偏向低压","风速不变，平行于等压线"],"answer":0,"explain":"解析：手册4-P01：摩擦减速→科氏力减弱→气压梯度力不能被完全平衡→穿等压线向低压。手册要点：近地面摩擦使风速减小，水平科氏力随之减弱，原有地转平衡被破坏，气流因而偏向低压一侧，形成穿越等压线的分量。","source":"上编 4-P01"},{"id":260,"book":"大气","chapter":"第4章 大气动力学","kp":"摩擦辐合","q":"摩擦作用下，北半球低压中心附近近地面气流（ ）。","options":["逆时针向中心辐合并上升","顺时针向外辐散并在中心下沉","顺时针向中心辐合","无垂直运动"],"answer":0,"explain":"解析：手册4-P01：摩擦使气流向低压辐合，由连续方程产生上升，有水汽时成云致雨。手册要点：近地面摩擦使风速减小，水平科氏力随之减弱，原有地转平衡被破坏，气流因而偏向低压一侧，形成穿越等压线的分量。","source":"上编 4-P01"},{"id":261,"book":"大气","chapter":"第4章 大气动力学","kp":"摩擦参数化","q":"手册中近地摩擦的线性参数化F_r=−k_rV_h，其含义是（ ）。","options":["摩擦力与风垂直，大小恒定","摩擦力与风速垂直，大小与风速平方成正比","摩擦力与风速反向，大小与风速成正比","摩擦力与风同向，使风加速"],"answer":2,"explain":"解析：手册公式4-20：外摩擦线性阻力，k_r>0；不能把所有高度摩擦都当成严格逆风。负号表示摩擦力与水平风方向相反，系数k_r为常数说明大小与风速成线性比例，而不是与风垂直或成平方关系。","source":"上编 公式4-20"},{"id":262,"book":"大气","chapter":"第4章 大气动力学","kp":"运动方程分量","q":"水平运动方程Du/Dt=−(1/ρ)p_x+fv+F_x中，fv项代表（ ）。","options":["气压梯度力产生的加速度","重力加速度","摩擦加速度","科氏加速度的x分量"],"answer":3,"explain":"解析：手册公式4-05：fv是科氏项，F_x为摩擦。fv是科氏力在x方向的分量，−(1/ρ)p_x是气压梯度力项，F_x是摩擦项，方程中没有重力加速度项。","source":"上编 公式4-05"},{"id":263,"book":"大气","chapter":"第4章 大气动力学","kp":"垂直运动方程简化","q":"垂直运动方程中若垂直加速度和摩擦可忽略，即退化为（ ）。","options":["热成风方程","静力方程","地转风方程","连续方程"],"answer":1,"explain":"解析：Dw/Dt=−(1/ρ)p_z−g+F_z，略去Dw/Dt和F_z得静力平衡。手册要点：垂直加速度可忽略、g近似不变。","source":"上编 公式4-05、1-14"},{"id":264,"book":"大气","chapter":"第4章 大气动力学","kp":"三圈环流","q":"三圈环流指的是（ ）。","options":["沃克环流、哈得来环流和季风环流","海陆风、山谷风和热岛环流","哈得来环流、费雷尔环流和极地环流","赤道环流、副热带环流和副极地环流"],"answer":2,"explain":"解析：手册4-E01：三圈为哈得来、费雷尔（间接）和极地环流。手册要点：理想均匀地表且考虑地球自转时，每半球有哈德莱、费雷尔和极地三圈。","source":"上编 4-E01"},{"id":265,"book":"大气","chapter":"第4章 大气动力学","kp":"三风带","q":"三圈环流在地面形成的风带不包括（ ）。","options":["信风带","中纬度西风带","赤道西风带","极地东风带"],"answer":2,"explain":"解析：手册4-E01：三风带为低纬信风（东北/东南信风）、中纬度西风、极地东风。手册要点：赤道受热上升，副热带下沉，副极地上升，极地下沉，近地面相应形成信风、西风和极地东风带。","source":"上编 4-E01"},{"id":266,"book":"大气","chapter":"第4章 大气动力学","kp":"副高下沉区","q":"三圈环流中，约30°纬度附近为（ ）。","options":["赤道低压上升带","副热带高压下沉带","极地高压","副极地低压上升气流带"],"answer":1,"explain":"解析：手册4-E01：四个升降区为赤道上升、副热带（约30°）下沉、副极地（约60°）上升、极地下沉。哈得来环流的下沉支在约30°形成副热带高压带，约60°为副极地低压上升带，赤道低压和极地高压分别位于两端。","source":"上编 4-E01"},{"id":267,"book":"大气","chapter":"第4章 大气动力学","kp":"三圈环流成因","q":"三圈环流形成的主要原因是（ ）。","options":["大型山脉对气流的阻挡","高低纬热力差异与地球自转的共同作用","海陆热力差异与大型山脉阻挡的共同作用","海陆分布的热力差异"],"answer":1,"explain":"解析：手册4-E01：热力差异驱动、自转偏向形成三圈；它是理想模型，实际受海陆等影响。手册要点：赤道至极地的热力差异提供环流能量，自转使经向气流偏转。","source":"上编 4-E01"},{"id":268,"book":"大气","chapter":"第4章 大气动力学","kp":"费雷尔环流性质","q":"费雷尔环流属于（ ）。","options":["直接热力环流（暖区上升、冷区下沉）","间接环流（冷区上升暖区下沉）","季风环流的一部分","局地环流"],"answer":1,"explain":"解析：手册4-E01：哈得来和极地环流为直接环流，费雷尔环流为间接环流，靠两侧环流驱动。费雷尔环流在较冷的高纬一侧上升、较暖的低纬一侧下沉，与热力驱动方向相反，所以称为间接环流，不是季风或局地环流。","source":"上编 4-E01"},{"id":269,"book":"大气","chapter":"第4章 大气动力学","kp":"地转近似适用","q":"地转风近似不适用于（ ）。","options":["中纬度500 hPa等压面上的自由大气","大尺度天气系统","赤道附近及近地面摩擦层","大尺度高空西风带"],"answer":2,"explain":"解析：手册4-D03：适于中纬度自由大气；赤道f≈0，摩擦层受摩擦影响都不满足。手册要点：地转风是水平气压梯度力与水平科氏力平衡时的理想水平风，近似作匀速直线运动。","source":"上编 4-D03"},{"id":270,"book":"大气","chapter":"第4章 大气动力学","kp":"白贝罗定律","q":"北半球白贝罗风压定律是（ ）。","options":["背风而立，低压在右、高压在左","顺风而行，高压在左","面风而立，低压在右后方","背风而立，高压在右后方，低压在左前方"],"answer":3,"explain":"解析：自由大气中背风而立低压在左；近地面摩擦使风偏向低压，表述为高压在右后方、低压在左前方。手册要点：它平行等压线，北半球沿运动方向低压在左。","source":"上编 4-D03、4-P01"},{"id":271,"book":"大气","chapter":"第4章 大气动力学","kp":"科氏力做功","q":"科氏力对运动空气（ ）。","options":["做正功，使风加速","做功大小随纬度增大而增大","不做功，只改变运动方向","做负功，使风减速"],"answer":2,"explain":"解析：手册4-D02：科氏力垂直于相对速度，不做功。力对物体做功需在运动方向上有分量，科氏力始终与相对速度垂直，所以无论在哪个纬度都既不加速也不减速。","source":"上编 4-D02"},{"id":272,"book":"大气","chapter":"第4章 大气动力学","kp":"辐散与气压变化","q":"高空辐散大于低层辐合时，地面气压会（ ）。","options":["不变","下降","上升","周期振荡"],"answer":1,"explain":"解析：由连续方程与静力关系，整层净辐散使气柱质量减少，地面减压，系统发展加深。手册要点：从地面垂直速度近零向上积分连续方程，可把低层辐合与上升联系起来。","source":"上编 4-D06、4-P01"},{"id":273,"book":"大气","chapter":"第4章 大气动力学","kp":"地转风与梯度风差别","q":"地转风与梯度风的根本差别是（ ）。","options":["梯度风考虑了曲线运动的惯性离心力","地转风考虑了摩擦力的作用","梯度风不受科氏力作用","地转风不受气压梯度力"],"answer":0,"explain":"解析：手册4-C01：直线与曲线之分；两者都忽略摩擦。手册要点：地转风沿直等压线运动，由气压梯度力与科氏力平衡。","source":"上编 4-C01"},{"id":274,"book":"大气","chapter":"第4章 大气动力学","kp":"地转偏差","q":"实际风与地转风的差称为地转偏差，它对天气的意义是（ ）。","options":["只出现在赤道附近，无天气意义","导致辐合辐散与垂直运动，引起天气系统发展","使实际风与等压线完全平行，抑制垂直运动发展","使风停止，形成静风区"],"answer":1,"explain":"解析：手册4-P01：摩擦等使风跨等压线，产生辐合上升。地转偏差使风跨等压线吹向低压，造成低层辐合与上升运动，这是天气系统发展的重要机制，并非只出现在赤道附近。","source":"上编 4-P01、4-D06"},{"id":275,"book":"大气","chapter":"第4章 大气动力学","kp":"地转参数计算","q":"取Ω=7.292×10⁻⁵ s⁻¹，北纬40°的地转参数f=2Ωsinφ约为（ ）。","options":["1.117×10⁻⁴ s⁻¹","0.937×10⁻⁴ s⁻¹","1.458×10⁻⁴ s⁻¹","0.469×10⁻⁴ s⁻¹"],"answer":1,"explain":"解析：f=2×7.292×10⁻⁵×sin40°≈0.937×10⁻⁴ s⁻¹。用cos是水平分量；漏乘2得到的是Ω的铅直投影本身。","source":"上编 公式4-03"},{"id":276,"book":"大气","chapter":"第4章 大气动力学","kp":"地转风速计算","q":"40°N，同一高度上200 km内气压降低6 hPa，ρ=1.20 kg/m³，地转风速约为（ ）。","options":["26.7 m/s","53.3 m/s","0.3 m/s","25.0 m/s"],"answer":0,"explain":"解析：V_g=(1/(ρf))∂p/∂n=600/(200×10³×1.20×9.374×10⁻⁵)≈26.7 m/s。气压须换Pa（6 hPa=600 Pa），否则小100倍。","source":"上编 公式4-11、拿分册模板3"},{"id":277,"book":"大气","chapter":"第4章 大气动力学","kp":"热成风大小","q":"40°N，1000–500 hPa层内，向北300 km温度降低6 K，热成风V_T=(R_d/f)ln(p_l/p_u)|∇T|约为（ ）。","options":["42.4 m/s","37.3 m/s","61.2 m/s","18.4 m/s"],"answer":0,"explain":"解析：V_T=(287/f)×ln2×(2×10⁻⁵)≈42.4 m/s，方向为西风（北半球背热成风而立左冷右暖）。漏掉ln(p_l/p_u)或用lg都会低估。","source":"上编 公式4-18、K4-03"},{"id":278,"book":"大气","chapter":"第4章 大气动力学","kp":"热成风（高度形式）","q":"40°N，气层厚3 km、平均温度260 K，向北300 km降温6 K，热成风Δu≈(gΔz/(fT))∂T/∂y约为（ ）。","options":["12.1 m/s","32.1 m/s","2412.5 m/s","24.1 m/s"],"answer":3,"explain":"解析：Δu=9.8×3000/(9.374×10⁻⁵×260)×2×10⁻⁵≈24.1 m/s。若下层西风8 m/s，则上层约32.1 m/s，风速随高增大。","source":"上编 公式4-18、拿分册模板3"},{"id":279,"book":"大气","chapter":"第4章 大气动力学","kp":"Rossby数计算","q":"中纬度大尺度运动U=10 m/s、L=1000 km、f=10⁻⁴ s⁻¹，Rossby数约为（ ）。","options":["10.000","0.080","0.100","1.000"],"answer":2,"explain":"解析：Ro=U/(fL)=10/(10⁻⁴×10⁶)=0.1≪1，惯性项远小于科氏项，支持地转近似。手册要点：气流A：典型风速U＝10.0 m·s⁻¹，水平尺度L＝1000 km。","source":"上编 公式4-04、K4-05"},{"id":280,"book":"大气","chapter":"第4章 大气动力学","kp":"小尺度Rossby数","q":"U=50 m/s、L=1 km、f=10⁻⁴ s⁻¹的小尺度涡旋，Rossby数约为（ ）。","options":["50","0.5","500","0"],"answer":2,"explain":"解析：Ro=50/(10⁻⁴×10³)=500≫1，科氏项相对惯性项可忽略，如龙卷近似旋衡平衡。Ro远大于1说明惯性项远大于科氏项，这种小尺度强涡旋中科氏力可忽略，近似为气压梯度力与离心力平衡的旋衡风。","source":"上编 公式4-04、K4-05"},{"id":281,"book":"大气","chapter":"第4章 大气动力学","kp":"由辐合诊断垂直速度","q":"不可压缩近似下，0–1000 m层平均水平散度δ_h=−2.0×10⁻⁵ s⁻¹，地面w=0，1000 m处w约为（ ）。","options":["-0.020 m/s","0.200 m/s","0.020 m/s","0.002 m/s"],"answer":2,"explain":"解析：w(z)=w(0)−∫δ_h dz=0−(−2.0×10⁻⁵)×1000=+0.020 m/s，低层辐合产生上升。符号搞反会得出下沉。","source":"上编 公式4-10、K4-04"},{"id":282,"book":"大气","chapter":"第4章 大气动力学","kp":"上层辐散减弱上升","q":"1000 m处w=+0.020 m/s，1000–3000 m层平均水平散度+8.0×10⁻⁶ s⁻¹，3000 m处w约为（ ）。","options":["0.036 m/s","-0.004 m/s","0.016 m/s","0.004 m/s"],"answer":3,"explain":"解析：w(3000)=0.020−(8.0×10⁻⁶)×2000=+0.004 m/s。上层辐散使上升随高度减弱，但该层仍为上升。","source":"上编 K4-04"},{"id":283,"book":"大气","chapter":"第4章 大气动力学","kp":"气压梯度加速度","q":"空气密度1.20 kg/m³，同一高度上气压梯度大小为1.20×10⁻³ Pa/m，气压梯度力加速度约为（ ）。","options":["1.20×10⁻³ m/s²","1.44×10⁻³ m/s²","1.00×10⁻¹ m/s²","1.00×10⁻³ m/s²"],"answer":3,"explain":"解析：a=(1/ρ)|∇p|=1.20×10⁻³/1.20=1.00×10⁻³ m/s²，指向低压。乘以ρ而非除以ρ得1.44×10⁻³，量纲虽同但数值错误。","source":"上编 公式4-02、K4-01"},{"id":284,"book":"大气","chapter":"第4章 大气动力学","kp":"由气压梯度加速度求地转风","q":"气压梯度加速度1.00×10⁻³ m/s²，f=1.031×10⁻⁴ s⁻¹，地转风速约为（ ）。","options":["11.64 m/s","9.70 m/s","4.85 m/s","0.01 m/s"],"answer":1,"explain":"解析：V_g=a_p/f=1.00×10⁻³/1.031×10⁻⁴≈9.70 m/s。手册要点：气压梯度加速度为1.00×10⁻³ m·s⁻²，向北。","source":"上编 K4-01"},{"id":285,"book":"大气","chapter":"第4章 大气动力学","kp":"气旋梯度风","q":"北半球气旋，f=10⁻⁴ s⁻¹，曲率半径500 km，地转风10 m/s，由V²/R+fV=fV_g，梯度风约为（ ）。","options":["10.00 m/s","13.82 m/s","8.54 m/s","12.00 m/s"],"answer":2,"explain":"解析：解V²/R+fV−fV_g=0得V≈8.54 m/s<10 m/s，气旋中梯度风为次地转。等于地转风只在曲率趋于零时成立。","source":"上编 公式4-14~4-16、K4-02"},{"id":286,"book":"大气","chapter":"第5章 大气边界层","kp":"边界层定义","q":"大气边界层是指（ ）。","options":["从地面到对流层顶的整个对流层","对流层低层直接受地表影响、对地表强迫约一小时内有响应的气层","平流层下部受臭氧加热影响、几乎不受地表作用的稳定气层，厚约十几千米","地面以上100 m高度固定的气层"],"answer":1,"explain":"解析：手册5-D01：边界层是对流层低层，直接受地表摩擦和加热影响，以湍流交换为主，响应时间约一小时。手册要点：大气边界层是对流层中直接受地表影响，并能在约一小时或更短时间内响应地表强迫的部分，典型厚度为几百米到数千米。","source":"上编 5-D01"},{"id":287,"book":"大气","chapter":"第5章 大气边界层","kp":"边界层厚度变化","q":"关于边界层厚度，下列说法正确的是（ ）。","options":["与地表性质无关，全球固定约1 km","与昼夜和天气无关，全球固定约1 km，白天比夜间浅，夜间可厚达2 km左右","白天比夜间浅，夜间可达1—2 km","随昼夜、天气和地表而变化，白天对流边界层可达1—2 km，夜间稳定层很浅"],"answer":3,"explain":"解析：手册5-D01、5-C02：对流边界层较深，稳定边界层较浅，厚度随时间、地表和天气变化。手册要点：大气边界层是对流层中直接受地表影响，并能在约一小时或更短时间内响应地表强迫的部分，典型厚度为几百米到数千米。","source":"上编 5-D01、5-C02"},{"id":288,"book":"大气","chapter":"第5章 大气边界层","kp":"边界层三类","q":"按稳定度，边界层通常可分为（ ）。","options":["近地层、埃克曼层、自由大气","混合层、残余层、夹卷层（按白天与夜间垂直结构划分）","对流层、平流层、中间层","对流（不稳定）边界层、中性边界层、稳定边界层"],"answer":3,"explain":"解析：手册5-D01关键词“三类稳定度”。近地层/埃克曼层是按垂直结构划分。","source":"上编 5-D01"},{"id":289,"book":"大气","chapter":"第5章 大气边界层","kp":"近地面层","q":"近地面层（常通量层）的特点是（ ）。","options":["湍流通量随高度迅速减小为零","位于边界层底部，垂直湍流通量随高度近似不变","科氏力占主导，湍流通量随高度线性增大至边界层顶","位于边界层顶部，受自由大气控制"],"answer":1,"explain":"解析：手册5-D02：近地面层是边界层低部（约十分之一），要素梯度显著，通量近似常数，科氏力可忽略。手册要点：在近似定常、水平均匀等条件下，动量、热量和水汽的垂直湍流通量随高度变化很小，因此又称常通量层。","source":"上编 5-D02"},{"id":290,"book":"大气","chapter":"第5章 大气边界层","kp":"湍流定义","q":"大气湍流是指（ ）。","options":["分子的热运动","空气不规则的随机脉动运动","只发生在平流层中的规则波动","大尺度天气系统的移动"],"answer":1,"explain":"解析：手册5-D03：湍流为不规则脉动，可分解为平均加脉动，由风切变和热浮力产生，涡旋输送动量、热量和水汽。手册要点：大气湍流是具有不规则脉动和强烈混合的流动，可看成平均运动上叠加脉动。","source":"上编 5-D03"},{"id":291,"book":"大气","chapter":"第5章 大气边界层","kp":"湍流产生机制","q":"湍流的两种产生机制是（ ）。","options":["机械（风切变）湍流和热力（浮力）湍流","辐射湍流与化学湍流","科氏湍流与重力湍流","辐射冷却湍流与重力波破碎湍流"],"answer":0,"explain":"解析：手册5-D03关键词：风切变、热浮力。手册要点：风切变可产生机械湍流，地面加热产生的正浮力可驱动热力湍流。","source":"上编 5-D03"},{"id":292,"book":"大气","chapter":"第5章 大气边界层","kp":"雷诺分解","q":"雷诺分解u=ū+u′中脉动量的平均值（ ）。","options":["等于平均值","恒为正","为零","等于风速平方"],"answer":2,"explain":"解析：手册公式5-02：u′的平均为0，但u′w′的平均一般不为零，代表湍流通量。脉动是瞬时值与平均值之差，按定义其平均为零，但两个脉动量乘积的平均（如u′w′）一般不为零，构成湍流通量。","source":"上编 公式5-02"},{"id":293,"book":"大气","chapter":"第5章 大气边界层","kp":"湍流通量","q":"湍流感热通量的表达式为（ ）。","options":["H=ρL_v·w′q′平均","H=−ρu′w′平均","H=ρc_p·w′T′平均","H=ρc_p·ū·T̄"],"answer":2,"explain":"解析：手册公式5-03：H=ρc_p⟨w′T′⟩；LE=ρL_v⟨w′q′⟩；τ=−ρ⟨u′w′⟩是动量通量。ρL_v⟨w′q′⟩是潜热通量，−ρ⟨u′w′⟩是动量通量，用平均量ū、T̄的乘积则完全不能反映湍流输送。","source":"上编 公式5-03"},{"id":294,"book":"大气","chapter":"第5章 大气边界层","kp":"雷诺应力","q":"湍流动量通量（雷诺应力）τ_xz=（ ）。","options":["ρc_p⟨w′T′⟩","−ρ⟨u′w′⟩","−ρ⟨w′θ′⟩","ρ⟨u⟩⟨w⟩"],"answer":1,"explain":"解析：手册公式5-03：τ_xz=−ρ⟨u′w′⟩。雷诺应力由水平速度与垂直速度脉动的协方差构成，前面带负号，ρc_p⟨w′T′⟩是感热通量，平均量乘积不属于湍流通量。","source":"上编 公式5-03"},{"id":295,"book":"大气","chapter":"第5章 大气边界层","kp":"K闭合","q":"K理论（梯度输送）认为湍流通量（ ）。","options":["与梯度方向相同，由低值向高值","与平均量梯度成正比，方向沿负梯度（由高值向低值）","只在稳定层结成立，与梯度无关","与平均量梯度成反比，只在稳定层结中成立"],"answer":1,"explain":"解析：手册公式5-04：⟨w′θ′⟩=−K_h∂θ/∂z；强对流存在非局地或逆梯度输送，K闭合不再适用。K理论把湍流类比分子扩散，通量沿负梯度从高值向低值输送，K>0，所以不是同向，也不是与梯度成反比。","source":"上编 公式5-04"},{"id":296,"book":"大气","chapter":"第5章 大气边界层","kp":"K理论局限","q":"K闭合梯度输送近似在下列哪种情况下失效（ ）。","options":["湍涡尺度远小于平均量变化尺度的情况","强对流边界层中存在大涡的非局地输送","弱风稳定层中的小涡输送","中性层结下平坦均匀下垫面上的近地层小涡输送"],"answer":1,"explain":"解析：手册公式5-04条件：强对流时有逆梯度输送，局地梯度近似失效。手册要点：强对流存在非局地或逆梯度输送。","source":"上编 公式5-04"},{"id":297,"book":"大气","chapter":"第5章 大气边界层","kp":"摩擦速度","q":"摩擦速度u*的定义是（ ）。","options":["u*=√(τ₀/ρ)","u*=U/ln(z/z₀)","u*=kU","u*=τ₀/ρ"],"answer":0,"explain":"解析：手册公式5-05：u*=√(τ₀/ρ)，单位m/s，表征近地层湍流动量交换强度。u*由地面应力τ₀与空气密度定义，开方后单位才是m/s，τ₀/ρ未开方单位不对，U/ln(z/z₀)只是由廓线反推的近似式。","source":"上编 公式5-05"},{"id":298,"book":"大气","chapter":"第5章 大气边界层","kp":"卡门常数","q":"卡门常数k约为（ ）。","options":["0.286","0.4","1.4","0.622"],"answer":1,"explain":"解析：手册公式5-05：k_v≃0.4。0.286是κ，0.622是ε，1.4是比热比。","source":"上编 公式5-05"},{"id":299,"book":"大气","chapter":"第5章 大气边界层","kp":"对数风廓线","q":"中性近地层平均风速随高度的分布为（ ）。","options":["与高度无关","线性分布","对数分布","指数衰减"],"answer":2,"explain":"解析：手册公式5-06：U(z)=(u*/k)ln[(z−d)/z₀]。中性近地层中混合长随高度线性增大，积分后风速随高度按对数增加，近地面变化快、往上变化慢，不是线性或与高度无关。","source":"上编 公式5-06"},{"id":300,"book":"大气","chapter":"第5章 大气边界层","kp":"粗糙度长度","q":"空气动力学粗糙度z₀的含义是（ ）。","options":["地面障碍物的平均高度","地面以上1 m","地面障碍物平均高度的1/10以上部分","对数风廓线外推风速为零的高度"],"answer":3,"explain":"解析：手册公式5-06：z₀为空气动力粗糙度长度，d为零平面位移；z₀不等于障碍物高度。手册要点：z0为空气动力粗糙度长度。","source":"上编 公式5-06"},{"id":301,"book":"大气","chapter":"第5章 大气边界层","kp":"零平面位移","q":"植被或城市冠层上的风廓线引入零平面位移d的原因是（ ）。","options":["为了计入冠层内的辐射加热","高大粗糙元使有效地面抬高","为了修正温度单位","为了修正冠层内科氏力随高度的变化"],"answer":1,"explain":"解析：手册公式5-05、5-06：用(z−d)代替z，d为零平面位移，适用于茂密植被或建筑。茂密植被或建筑群使动量吸收面整体抬高，风廓线好像从高度d处才开始，所以用z−d代替z，与科氏力或温度单位无关。","source":"上编 公式5-06"},{"id":302,"book":"大气","chapter":"第5章 大气边界层","kp":"非中性修正","q":"非中性层结下风廓线需用稳定度函数ψ_m修正，其自变量是（ ）。","options":["(z−d)/L","Ri的倒数","z/z₀（与层结无关）","u*/k"],"answer":0,"explain":"解析：手册公式5-08：U=(u*/k)[ln((z−d)/z₀)−ψ_m((z−d)/L)+ψ_m(z₀/L)]。稳定度修正项以无量纲高度(z−d)/L为自变量，L是奥布霍夫长度，z/z₀不含层结信息，u*/k也不是稳定度参数。","source":"上编 公式5-08"},{"id":303,"book":"大气","chapter":"第5章 大气边界层","kp":"奥布霍夫长度符号","q":"奥布霍夫长度L<0表示（ ）。","options":["稳定层结（向下的浮力通量为主）","中性层结（无浮力通量）","稳定层结，浮力通量为零","不稳定层结（向上浮力通量）"],"answer":3,"explain":"解析：手册公式5-07：L=−u*³θ_v/(kg⟨w′θ_v′⟩)，虚位温通量向上为正时L<0，不稳定。手册要点：L＜0不稳定、L＞0稳定、浮力通量趋零时|L|趋大。","source":"上编 公式5-07"},{"id":304,"book":"大气","chapter":"第5章 大气边界层","kp":"中性L","q":"中性层结时奥布霍夫长度趋于（ ）。","options":["零（L=0）","1 m（与层结无关）","无穷大（∣L∣→∞）","负值（L<0）"],"answer":2,"explain":"解析：中性时浮力通量≈0，L分母趋零，∣L∣→∞，ζ=z/L→0，回到对数廓线。L与u*³成正比、与浮力通量成反比，中性时浮力通量趋于零，L趋于无穷大而不是零，L<0则表示不稳定。","source":"上编 公式5-07"},{"id":305,"book":"大气","chapter":"第5章 大气边界层","kp":"Richardson数","q":"梯度Richardson数Ri表征（ ）。","options":["浮力（层结）作用与风切变作用的量级比较","声速与平均风速之比","辐射通量与感热通量之比","惯性力与科氏力的量级之比，即Rossby数"],"answer":0,"explain":"解析：手册公式5-S01：Ri=(g/θ_v)(∂θ_v/∂z)/[(∂u/∂z)²+(∂v/∂z)²]。Ri的分子是层结稳定度（浮力项），分母是风切变的平方，Ri大时湍流受抑制，惯性力与科氏力之比是Rossby数。","source":"上编 公式5-S01"},{"id":306,"book":"大气","chapter":"第5章 大气边界层","kp":"Ri判据局限","q":"关于Richardson数判据，下列说法正确的是（ ）。","options":["Ri与风切变无关，只由层结决定","Ri<0就一定是稳定层结，Ri>0就一定是不稳定层结，与实际湍流无关","Ri>0就一定没有任何湍流","是题给判据的量级判断，不能直接断言真实大气中“必有”或“必无”湍流"],"answer":3,"explain":"解析：手册K5-03易失分：不能直接写成真实大气中必有/必无湍流。Ri<0表示不稳定层结。","source":"上编 K5-03"},{"id":307,"book":"大气","chapter":"第5章 大气边界层","kp":"混合层","q":"对流边界层主体混合层的特征是（ ）。","options":["只出现在夜间，湍流很弱","湍流混合强，位温和比湿随高度近于均匀","位温随高度显著增加，比湿随高度显著减小","湍流很弱，位温随高度显著增加"],"answer":1,"explain":"解析：手册5-D04：混合层强混合，位温较均匀，顶部有逆温夹卷层。手册要点：混合层是对流边界层中湍流混合强烈的主体部分，位温、比湿和风速的垂直差异较小。","source":"上编 5-D04"},{"id":308,"book":"大气","chapter":"第5章 大气边界层","kp":"夹卷层","q":"夹卷层位于（ ）。","options":["平流层底部，与对流层交换的过渡带","混合层顶部的逆温层附近，上方自由大气空气被卷入混合层","残余层以下、紧贴地面的稳定层","地面附近的超绝热层，地面加热使空气卷入"],"answer":1,"explain":"解析：手册5-D04：夹卷层在对流边界层顶，热泡冲击逆温层，把上方空气夹卷入混合层。手册要点：其顶部的夹卷层是与自由大气交换的过渡带，常伴逆温。","source":"上编 5-D04"},{"id":309,"book":"大气","chapter":"第5章 大气边界层","kp":"稳定边界层","q":"夜间稳定边界层的特征是（ ）。","options":["湍流很强，位温随高度近于均匀","白天地面加热形成，湍流强烈","位温随高度增加，浮力抑制湍流，湍流弱或间歇","位温随高度均匀不变，湍流强而连续"],"answer":2,"explain":"解析：手册5-D05：稳定边界层位温随高增，夜间冷却形成，湍流弱或间歇。手册要点：稳定边界层中位温通常随高度增加，浮力抑制垂直运动，湍流较弱且可能间歇，常由夜间地表冷却或暖空气流经冷地面形成。","source":"上编 5-D05"},{"id":310,"book":"大气","chapter":"第5章 大气边界层","kp":"残余层","q":"残余层是指（ ）。","options":["夜间稳定层之上、保留前一日混合层特征的气层","平流层下部臭氧较多的气层","白天贴地形成的辐射逆温层","白天混合层顶部的云层和夹卷层"],"answer":0,"explain":"解析：手册5-D05：残余层位于夜间稳定层上方，保留白天混合层的位温和污染物，湍流较弱。手册要点：残余层是日落后留在浅薄稳定边界层上方、保有白天混合层特征的气层，已不直接与地面强耦合。","source":"上编 5-D05"},{"id":311,"book":"大气","chapter":"第5章 大气边界层","kp":"逆温层定义","q":"逆温层是指（ ）。","options":["气温随高度升高的气层","气压随高度升高的那一层气层","气温随高度降低的气层","湿度随高度升高的气层"],"answer":0,"explain":"解析：手册5-D06、公式5-11：dT/dz>0即Γ<0。手册要点：逆温层是气温随高度升高而升高的气层，具有很强的静力稳定性，抑制空气垂直交换。","source":"上编 5-D06"},{"id":312,"book":"大气","chapter":"第5章 大气边界层","kp":"逆温成因","q":"下列不是逆温形成原因的是（ ）。","options":["下沉增温","强烈的地面加热","辐射冷却","暖平流移到冷地面上"],"answer":1,"explain":"解析：手册5-D06：辐射、下沉、平流、锋面、地形可成逆温；地面强加热使递减率增大，破坏逆温。易错提醒：逆温是按实际气温定义，稳定度判断可用位温；稳定层结未必气温随高度升高。逆温也不一定贴地。","source":"上编 5-D06"},{"id":313,"book":"大气","chapter":"第5章 大气边界层","kp":"逆温与污染","q":"逆温对近地面污染物扩散的影响是（ ）。","options":["无影响，污染物仍迅速扩散","促进扩散","稳定层结抑制垂直交换，污染物易积累","使污染物迅速上升到平流层"],"answer":2,"explain":"解析：手册公式5-11：逆温抑制垂直交换；但近地污染还取决于风、湍流、源强和沉降，逆温不等于完全没有扩散。逆温层中位温随高度增加，垂直运动受抑制，污染物难以向上稀释而在近地层累积，不会促进扩散，更不会把污染物送入平流层。","source":"上编 公式5-11"},{"id":314,"book":"大气","chapter":"第5章 大气边界层","kp":"埃克曼层","q":"埃克曼层中的风受到哪三种力的作用（ ）。","options":["气压梯度力、离心力和重力","科氏力、浮力和电场力","重力、浮力和离心力","气压梯度力、科氏力和湍流摩擦力"],"answer":3,"explain":"解析：手册5-D07：三力作用（气压梯度、科氏、湍流黏性摩擦），形成随高度旋转的风矢量。手册要点：理想埃克曼层中，气压梯度力、科氏力与湍流摩擦力共同作用。","source":"上编 5-D07"},{"id":315,"book":"大气","chapter":"第5章 大气边界层","kp":"埃克曼螺线","q":"北半球理想埃克曼螺线中，风随高度的变化是（ ）。","options":["风速增大，风向顺时针右转并逐渐趋近地转风","风速恒定，风向逆时针左转","风向不变","风速减小，风向左转并远离地转风"],"answer":0,"explain":"解析：手册5-D07、公式5-09：近地面风偏向低压，随高度增大并右转，趋近地转风。手册要点：在定常、水平均匀、近中性且湍流黏性系数等为常量的假设下，风矢量随高度呈螺线趋近地转风。","source":"上编 5-D07、公式5-09"},{"id":316,"book":"大气","chapter":"第5章 大气边界层","kp":"埃克曼抽吸","q":"埃克曼抽吸是指（ ）。","options":["边界层摩擦辐合（辐散）在边界层顶引起的垂直运动","山谷风中白天沿坡上升的气流","海洋表层风应力驱动的近岸上升流，与大气边界层无关","对流云中由浮力驱动的上升气流"],"answer":0,"explain":"解析：手册5-D07：气旋中摩擦辐合在层顶产生上升（抽吸），反气旋中产生下沉。手册要点：摩擦引起的辐合、辐散可在层顶产生垂直运动，称埃克曼抽吸或泵作用。","source":"上编 5-D07"},{"id":317,"book":"大气","chapter":"第5章 大气边界层","kp":"近地风偏角","q":"理想埃克曼螺线中，地面风与地转风的夹角为（ ）。","options":["0°","90°","180°","45°"],"answer":3,"explain":"解析：由公式5-09，z→0时v/u→1，地面风与地转风夹角45°（理想条件）；实际一般小于此值。理想埃克曼解中，紧贴地面处风向偏离地转风45°指向低压一侧，并随高度呈螺线逐渐转向地转风。","source":"上编 公式5-09"},{"id":318,"book":"大气","chapter":"第5章 大气边界层","kp":"边界层与自由大气","q":"边界层与自由大气最主要的区别是（ ）。","options":["边界层中没有风，只有湍流","边界层受地表直接作用、湍流输送强、摩擦不可忽略","二者温度相同，只是风速不同，摩擦作用均可忽略不计","自由大气受摩擦更大，湍流更强"],"answer":1,"explain":"解析：手册5-C01：地表直接作用、湍流输送、日变化与梯度明显、风跨等压线；自由大气中摩擦可忽略。手册要点：自由大气离地表直接作用较远，在大尺度水平运动中常可忽略摩擦，用地转或梯度平衡近似。","source":"上编 5-C01"},{"id":319,"book":"大气","chapter":"第5章 大气边界层","kp":"对流与稳定边界层","q":"对流边界层与稳定边界层相比（ ）。","options":["二者混合强度相同，只是厚度不同","前者较浅、混合弱；后者较厚、混合强","稳定边界层只有热力湍流，对流边界层只有机械湍流且厚度较浅","前者浮力供能、混合强、厚度大；后者浮力耗能、混合弱、较浅"],"answer":3,"explain":"解析：手册5-C02：机械湍流可在稳定层结中维持，但浮力起抑制作用。手册要点：对流边界层常由白天地面加热形成，浮力为湍流提供能量，热泡和大涡旋促使垂直混合，通常较深。","source":"上编 5-C02"},{"id":320,"book":"大气","chapter":"第5章 大气边界层","kp":"稳定层机械湍流","q":"稳定边界层中湍流的来源主要是（ ）。","options":["浮力产生的热力对流湍流","辐射","风切变产生的机械湍流","科氏力"],"answer":2,"explain":"解析：手册5-C02：稳定层浮力耗能，湍流主要靠机械切变维持。手册要点：稳定边界层常由夜间地表冷却或暖空气经过冷地面形成，浮力消耗垂直湍流动能，通常较浅，风温湿梯度较强，湍流可弱而间歇，但风切变仍能维持机械湍流。","source":"上编 5-C02"},{"id":321,"book":"大气","chapter":"第5章 大气边界层","kp":"边界层日变化","q":"陆地边界层日出后的演变是（ ）。","options":["日出后逆温增强，混合层逐渐变薄","夜间逆温保持全天不变，混合层一直要到傍晚才开始形成","地面加热先侵蚀夜间逆温，热泡发展，混合层逐渐增厚","混合层在日出时最厚，午后最薄"],"answer":2,"explain":"解析：手册5-P01：日出侵蚀逆温→热泡与混合层增长→顶部夹卷；日落后形成浅稳定层与残余层。手册要点：日出后地面受热，向空气输送感热，先侵蚀夜间浅薄逆温，再产生热泡，使混合层逐渐加深。","source":"上编 5-P01"},{"id":322,"book":"大气","chapter":"第5章 大气边界层","kp":"混合层最厚时间","q":"晴天陆地混合层厚度通常在何时达到最大（ ）。","options":["日出时","日落后2小时","午后","午夜"],"answer":2,"explain":"解析：手册5-P01：白天持续加热，混合层午后最厚，日落后地面冷却形成稳定层。混合层厚度随地面加热持续增长，午后感热通量累积最多，混合层最厚，日落后地面冷却，形成浅薄的稳定边界层。","source":"上编 5-P01"},{"id":323,"book":"大气","chapter":"第5章 大气边界层","kp":"海陆风机制","q":"海陆风、山谷风与热岛环流的共同机制是（ ）。","options":["大尺度天气系统气压场的移动","差异加热造成的热力环流","地转偏向力的作用","潮汐作用"],"answer":1,"explain":"解析：手册5-P02：差异加热，低层空气流向暖区，均为热力环流。手册要点：热岛环流强弱不必与海陆风昼夜相位相同。","source":"上编 5-P02"},{"id":324,"book":"大气","chapter":"第5章 大气边界层","kp":"海风时段","q":"海风通常出现在（ ）。","options":["夜间，低层空气由陆吹向海","只在阴天","白天，低层由海吹向陆","只在冬季"],"answer":2,"explain":"解析：手册5-P02：白天陆地增温快为暖区，低层风从海吹向陆，夜间相反为陆风（“白海夜陆”）。白天陆地增温快，近地面陆上形成相对低压，低层空气从海吹向陆形成海风，夜间相反，形成由陆吹向海的陆风。","source":"上编 5-P02、单元6"},{"id":325,"book":"大气","chapter":"第5章 大气边界层","kp":"山谷风","q":"白天山区低层盛行（ ）。","options":["陆风","谷风，沿坡向上吹","山风，沿坡向下吹","无风"],"answer":1,"explain":"解析：手册5-P02：白天坡面加热，空气沿坡上升为谷风；夜间坡面冷却为山风（白谷夜山）。手册要点：白天山坡相对同高度谷中空气增温快，吹沿坡向上的谷风。","source":"上编 5-P02"},{"id":326,"book":"大气","chapter":"第5章 大气边界层","kp":"夜间山风","q":"夜间山风的方向是（ ）。","options":["沿坡向上","与坡面平行向上","垂直向上","沿坡向下"],"answer":3,"explain":"解析：夜间坡面辐射冷却，近坡空气变冷变重沿坡下滑，形成山风。白天坡面加热，空气沿坡上升为谷风；夜间坡面冷却，冷空气沿坡下滑为山风，并不垂直上升。","source":"上编 5-P02、单元6"},{"id":327,"book":"大气","chapter":"第5章 大气边界层","kp":"热岛环流","q":"城市热岛环流的特征是（ ）。","options":["城区下沉、近地面向郊区辐散","城区与郊区之间没有任何空气交换","城区上升、近地面郊区空气向城区辐合","只在白天出现，与城乡之间的温差大小无关"],"answer":2,"explain":"解析：手册5-P02：城区较暖，近地面郊区空气流入城区上升，高层向郊区回流。夜间热岛往往更明显。","source":"上编 5-P02"},{"id":328,"book":"大气","chapter":"第5章 大气边界层","kp":"城市布局","q":"为减轻城市热岛环流把郊区工厂污染带入城区，工业区应（ ）。","options":["布置在郊区近地面吹向城区的上游","布置在城市中心","与环流无关","布置在热岛环流的下沉区以外"],"answer":3,"explain":"解析：热岛环流近地面郊区风吹向城区，若工厂位于其中则污染被带入城区；应避开环流范围（手册5-P02与环境下编E2-P04互证）。若把工厂布置在郊区近地面吹向城区的气流上游，污染物会被热岛环流直接带进城区，所以应布置在环流范围以外。","source":"上编 5-P02、下编 E2-P04"},{"id":329,"book":"大气","chapter":"第5章 大气边界层","kp":"东海西山城市","q":"一座东临海、西靠山的城市，白天低层可能同时出现的环流是（ ）。","options":["只有夜间沿坡下滑的山风","只有由陆地吹向海洋的陆风","只有大尺度背景地转风，没有任何局地热力环流","东侧海风、西侧谷风及城区热岛环流的叠加"],"answer":3,"explain":"解析：手册5-E01：海风、白天谷风与热岛环流可在同一时段叠加，具体受背景风影响。手册要点：若晴朗、背景风较弱，白天陆地比东侧海面升温快，可形成东侧海面向城市陆地吹的海风，陆上升、海上下沉，高层有返回支。","source":"上编 5-E01"},{"id":330,"book":"大气","chapter":"第5章 大气边界层","kp":"环流叠加","q":"局地热力环流叠加的结果主要受何种条件制约（ ）。","options":["仅取决于太阳常数的大小","仅取决于大气臭氧浓度","仅取决于月相和潮汐","背景天气风场与各环流的强弱、时段"],"answer":3,"explain":"解析：手册5-E01关键词：叠加及背景条件，强背景风可抑制局地环流。海陆风、山谷风、热岛环流叠加后的格局取决于背景风场的强弱和各环流出现的时段，与太阳常数、臭氧或潮汐无关。","source":"上编 5-E01"},{"id":331,"book":"大气","chapter":"第5章 大气边界层","kp":"通量向上为正","q":"手册约定感热、潜热通量的正负号为（ ）。","options":["始终为正","向下为正","向上为正","始终为负"],"answer":2,"explain":"解析：手册公式2-19、5-03：H_s、LE向上为正，白天陆面通常为正。采用“向上为正”的约定后，白天陆面感热、潜热通量通常为正，夜间感热常为负，通量可正可负，不是恒为正或恒为负。","source":"上编 公式5-03、2-19"},{"id":332,"book":"大气","chapter":"第5章 大气边界层","kp":"位温通量与温度通量","q":"边界层中把位温通量换为温度通量需乘以（ ）。","options":["1/κ，即c_p/R_d","比值ε=R_d/R_v","Exner函数Π=(p/p₀)^κ","定压比热c_p除以定容比热c_v之比"],"answer":2,"explain":"解析：手册公式5-03：H≃ρc_pΠ⟨w′θ′⟩。湍流观测给出的是位温通量，乘以Exner函数Π才能换算为温度通量，进而乘ρc_p得到感热通量，1/κ、ε和c_p/c_v都不是换算因子。","source":"上编 公式5-03、K5-01"},{"id":333,"book":"大气","chapter":"第5章 大气边界层","kp":"通量方向判断","q":"若⟨w′θ′⟩>0，则感热通量方向为（ ）。","options":["向上","水平","向下","无法判断"],"answer":0,"explain":"解析：正的垂直运动与正的位温脉动相关，表示暖空气上升、冷空气下沉，感热向上输送。w′>0时θ′>0，表示上升空气偏暖，冷空气下沉，两者都把热量向上输送，所以协方差为正即感热向上。","source":"上编 公式5-03、K5-01"},{"id":334,"book":"大气","chapter":"第5章 大气边界层","kp":"湍流扩散作用","q":"边界层湍流对近地面污染物的主要作用是（ ）。","options":["使污染物凝结成颗粒而沉降","通过涡旋混合把污染物向上输送和稀释","阻止污染物的一切扩散","使污染物光解并全部转化为二次污染物，不起稀释作用"],"answer":1,"explain":"解析：手册5-D03：涡旋输送动量、热量、水汽和物质。湍涡把近地面高浓度空气与上层清洁空气交换，从而向上输送并稀释污染物，湍流本身不会使污染物光解或凝结沉降。","source":"上编 5-D03"},{"id":335,"book":"大气","chapter":"第5章 大气边界层","kp":"地表粗糙度影响","q":"地表越粗糙（如城市），近地层风速和湍流的特点是（ ）。","options":["只影响近地层温度，风速不变","风速增大、湍流减弱","近地风速减小、机械湍流增强","二者都不变"],"answer":2,"explain":"解析：手册公式5-06：z₀增大，同高度风速减小、u*增大。粗糙元增大了地面拖曳，u*和机械湍流增强，同一高度上的平均风速则减小，所以不是“风速增大、湍流减弱”。","source":"上编 公式5-06"},{"id":336,"book":"大气","chapter":"第5章 大气边界层","kp":"夜间低空急流","q":"夜间稳定边界层上方常出现风速极大值（夜间低空急流），与之相关的是（ ）。","options":["白天强对流使高空动量下传","地面加热增强，湍流加强","降水","夜间湍流摩擦减弱，残余层气流加速"],"answer":3,"explain":"解析：手册5-D05：夜间稳定层湍流弱，与上层脱耦，残余层中风可加速（与第9章低空急流夜间较强互证）。手册要点：残余层是日落后留在浅薄稳定边界层上方、保有白天混合层特征的气层，已不直接与地面强耦合。","source":"上编 5-D05、9-E03"},{"id":337,"book":"大气","chapter":"第5章 大气边界层","kp":"边界层顶","q":"对流边界层顶通常以什么为标志（ ）。","options":["对流层顶处出现的温度极小值","积云的云底高度","地面","位温明显增大的夹卷逆温层"],"answer":3,"explain":"解析：手册5-D04：混合层顶部逆温（夹卷层）。手册要点：混合层是对流边界层中湍流混合强烈的主体部分，位温、比湿和风速的垂直差异较小。","source":"上编 5-D04"},{"id":338,"book":"大气","chapter":"第5章 大气边界层","kp":"常通量层厚度","q":"近地面层（常通量层）的典型厚度为（ ）。","options":["约1—2 km且恒定","严格等于1 m","数米至数十米，并随条件变化","约10 km"],"answer":2,"explain":"解析：手册5-D02：近地面层贴近地表，风温湿垂直梯度显著，通量随高度近似不变。手册要点：在近似定常、水平均匀等条件下，动量、热量和水汽的垂直湍流通量随高度变化很小，因此又称常通量层。","source":"上编 5-D02"},{"id":339,"book":"大气","chapter":"第5章 大气边界层","kp":"摩擦速度","q":"中性近地层，z₀=0.10 m，10 m高风速5.0 m/s，k=0.4，摩擦速度u*=kU/ln(z/z₀)约为（ ）。","options":["0.434 m/s","1.000 m/s","1.086 m/s","0.020 m/s"],"answer":0,"explain":"解析：u*=0.4×5.0/ln(100)=0.434 m/s。对数廓线用自然对数；用lg会高估约2.3倍。","source":"上编 公式5-06、K5-02"},{"id":340,"book":"大气","chapter":"第5章 大气边界层","kp":"对数风廓线外推","q":"同上u*≈0.434 m/s、z₀=0.10 m，50 m高风速约为（ ）。","options":["6.29 m/s","6.75 m/s","4.25 m/s","25.00 m/s"],"answer":1,"explain":"解析：U(50)=(u*/k)ln(50/0.1)≈6.75 m/s。风速随高度对数增长，不是线性正比增长。","source":"上编 公式5-06、K5-02"},{"id":341,"book":"大气","chapter":"第5章 大气边界层","kp":"表面应力","q":"空气密度1.20 kg/m³，摩擦速度0.434 m/s，表面切应力τ₀=ρu*²约为（ ）。","options":["0.188 Pa","0.098 Pa","0.521 Pa","0.226 Pa"],"answer":3,"explain":"解析：τ₀=ρu*²=1.20×0.434²≈0.226 Pa。u*=√(τ₀/ρ)，因此反推时须平方。","source":"上编 公式5-05、K5-02"},{"id":342,"book":"大气","chapter":"第5章 大气边界层","kp":"感热通量","q":"ρ=1.20 kg/m³，c_p=1004 J/(kg·K)，运动学温度通量w'T'=0.10 K·m/s，感热通量H约为（ ）。","options":["0.1 W/m²","300.0 W/m²","120.5 W/m²","100.4 W/m²"],"answer":2,"explain":"解析：H=ρc_p·w'T'=1.20×1004×0.10≈120.5 W/m²，为正表示向上输送。漏乘ρ则量纲不对。","source":"上编 公式5-03、K5-01"},{"id":343,"book":"大气","chapter":"第5章 大气边界层","kp":"潜热通量","q":"ρ=1.20 kg/m³，L_v=2.5×10⁶ J/kg，水汽运动学通量w'q'=1.5×10⁻⁵ (kg/kg)·m/s，潜热通量LE约为（ ）。","options":["45.0 W/m²","450.0 W/m²","31.2 W/m²","37.5 W/m²"],"answer":0,"explain":"解析：LE=ρL_v·w'q'=1.20×2.5×10⁶×1.5×10⁻⁵=45.0 W/m²，水汽向上输送。潜热通量等于ρL_v乘以水汽通量，结果为45.0 W/m²，450.0多乘了10倍，其余数值是代错了密度或潜热的结果。","source":"上编 公式5-03、K5-01"},{"id":344,"book":"大气","chapter":"第5章 大气边界层","kp":"埃克曼层厚度尺度","q":"湍流系数K_m=5 m²/s，f=10⁻⁴ s⁻¹，埃克曼厚度尺度δ_E=√(2K_m/f)约为（ ）。","options":["316 m","993 m","1000 m","224 m"],"answer":0,"explain":"解析：δ_E=√(2×5/10⁻⁴)≈316 m；风向与地转风一致的高度约为πδ_E≈993 m。手册要点：f为s⁻¹，Km为m²/s，δE为衰减深度m。","source":"上编 公式5-09"},{"id":345,"book":"大气","chapter":"第5章 大气边界层","kp":"梯度Richardson数","q":"θv=300 K，虚位温梯度0.030 K/m，风切变0.050 s⁻¹，梯度Richardson数约为（ ）。","options":["0.020","2.551","117.600","0.392"],"answer":3,"explain":"解析：Ri=(g/θv)(∂θv/∂z)/(∂u/∂z)²=(9.8/300×0.03)/0.0025≈0.392，层结稳定性与切变量级之比。分母须是切变的平方。","source":"上编 公式5-S01、K5-03"},{"id":346,"book":"大气","chapter":"第5章 大气边界层","kp":"Exner函数","q":"700 hPa层，κ=0.286，Exner函数Π=(p/p₀)^κ约为（ ）。","options":["0.7000","0.2873","0.9030","1.1074"],"answer":2,"explain":"解析：Π=(0.7)^0.286≈0.9030，用于把位温通量换成温度通量：H≈ρc_pΠ·w'θ'。Π=(p/p₀)^κ，700 hPa处p/p₀=0.7，0.7的0.286次方约为0.903，0.7000是没有取幂的结果，1.1074则是取了倒数。","source":"上编 公式5-03、K5-01"},{"id":347,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"云与雾区别","q":"云与雾的根本区别是（ ）。","options":["云不含凝结物，雾含有水滴","雾只出现在海上，云只出现在陆地上空","云由冰晶组成，雾由水滴组成","雾接地，使水平能见度小于1 km；云底离地"],"answer":3,"explain":"解析：手册6-D01：二者都是水滴或冰晶悬浮体，雾接地且水平能见度<1 km，形成环境不同。手册要点：雾是接近地面的凝结或凝华物使水平能见度低于1km的天气现象。","source":"上编 6-D01"},{"id":348,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"雾的能见度标准","q":"气象上雾的定义要求水平能见度（ ）。","options":["小于1 km","小于5 km","小于10 km","小于100 m"],"answer":0,"explain":"解析：雾是接近地面的凝结或凝华物使水平能见度低于1km的天气现象（手册6-D01关键词“水平能见度<1km”）。5 km和10 km是轻雾或霾等现象的能见度范围，100 m以下属强浓雾，雾的基本定义只要求能见度低于1 km。","source":"上编 6-D01"},{"id":349,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"暖云冷云","q":"按温度划分，暖云是指（ ）。","options":["全部由冰晶组成的云","云体温度全部高于0℃的云","云顶温度低于−20℃的那类云","含过冷水的云"],"answer":1,"explain":"解析：手册6-D02：按温度分暖云（>0℃）和冷云（有低于0℃部分）；按相态分水云、冰云、混合云。手册要点：暖云指云体温度高于0℃、由液态云滴组成的云。","source":"上编 6-D02"},{"id":350,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"冷云与冰云","q":"关于冷云和冰云，下列说法正确的是（ ）。","options":["冷云一定全部由冰晶组成","冷云不等于冰云，冷云中可含大量过冷水滴","冰云温度高于0℃，由冰晶组成","暖云中含有冰晶"],"answer":1,"explain":"解析：手册6-D02易错：冷云按温度分类，可含过冷水滴，是混合云或水云；冰云按相态分类。手册要点：冷云可有过冷水滴，因此冷云不等于冰云，混合云也可有很厚的暖区。","source":"上编 6-D02"},{"id":351,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"混合云","q":"混合云是指（ ）。","options":["同时含水滴和雨滴的云","含有污染物的云","高低云的组合","同时含有过冷水滴和冰晶的云"],"answer":3,"explain":"解析：手册6-D02：按相态分水云、冰云和混合云，混合云是冰晶效应发生的场所。手册要点：冷云可有过冷水滴，因此冷云不等于冰云，混合云也可有很厚的暖区。","source":"上编 6-D02"},{"id":352,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"凝结核作用","q":"大气中水汽凝结主要依靠凝结核，原因是（ ）。","options":["凝结核能降低气温，促使饱和","凝结核本身释放水汽","凝结核提供潜热","异质核化所需过饱和度远小于同质核化"],"answer":3,"explain":"解析：手册6-D03：凝结核在较小过饱和度下即可凝结（异质核化），纯水同质核化需极大过饱和。手册要点：凝结核是能在大气常见的小过饱和度下充当云滴凝结核心的气溶胶粒子。","source":"上编 6-D03"},{"id":353,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"吸湿性核","q":"吸湿性可溶凝结核（如海盐、硫酸盐）的作用是（ ）。","options":["溶质效应降低平衡水汽压，可在相对湿度低于100%时开始凝结增长","溶质效应升高平衡水汽压，抑制凝结","只能在冰面上凝华，不能凝结","阻止凝结，使云滴只能在相对湿度高于105%时形成"],"answer":0,"explain":"解析：手册6-D03、3-D03：溶质降低饱和水汽压，吸湿核在RH<100%时即可吸湿增长（如霾转雾）。手册要点：吸湿性可溶核形成溶液滴，亲水性不溶核也可提供表面，从而降低纯水自发形成微小胚滴的困难。","source":"上编 6-D03"},{"id":354,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"过饱和度定义","q":"过饱和度s_w定义为（ ）。","options":["e−e_sw，即实际与饱和水汽压之差","S_w−1，其中S_w=e/e_sw","RH×100","e_sw/e−1"],"answer":1,"explain":"解析：手册公式6-01：S为饱和比，s为超出1的份额。过饱和度是饱和比超出1的部分，例如0.5%过饱和对应s=0.005，不是水汽压差、相对湿度或倒数关系。","source":"上编 公式6-01"},{"id":355,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"Kelvin效应","q":"曲率效应（Kelvin效应）表明（ ）。","options":["小水滴表面平衡水汽压高于平水面，滴越小所需过饱和度越大","曲率与平衡水汽压无关，只看温度","小水滴平衡水汽压更低，更易增长","大水滴表面平衡水汽压更高，滴越大越易蒸发"],"answer":0,"explain":"解析：手册公式6-04：e_sr=e_sw·exp(A_K/r)，r越小越大。水滴越小，表面曲率越大，分子越易逃逸，平衡水汽压越高，因此小滴需要更高的过饱和度才能维持而不蒸发。","source":"上编 公式6-04"},{"id":356,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"Kohler曲线","q":"Köhler曲线描述了（ ）。","options":["曲率效应与溶质效应共同决定的溶液滴平衡饱和比随半径的变化","雨滴末速随半径的变化","冰晶凝华增长速率随温度的变化","云滴之间的碰并效率随半径和末速的变化，以及它对雨滴谱宽度的影响"],"answer":0,"explain":"解析：手册公式6-05：S_eq≈1+A_K/r−B_K/r³，峰值对应临界半径r_c和临界过饱和度s_c。曲线上升段由溶质效应主导、下降段由曲率效应主导，峰值对应活化所需的临界过饱和度，与末速、碰并或凝华速率无关。","source":"上编 公式6-05"},{"id":357,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"活化条件","q":"溶液滴被“活化”成云滴的条件是（ ）。","options":["环境相对湿度达到50%以上","温度低于0℃，且环境始终未达到水面饱和状态","环境过饱和度超过其Köhler曲线峰值（临界过饱和度）","滴半径小于临界半径即可活化"],"answer":2,"explain":"解析：Köhler曲线的峰值对应临界半径和临界过饱和度，只有环境过饱和度超过这个峰值，溶液滴才能越过峰值持续凝结长大，即被活化成云滴。相对湿度50%远未饱和，不能活化，低于0℃且未达水面饱和也不行。半径小于临界半径的溶液滴处于平衡态，并不会自动活化。","source":"上编 公式6-05、K6-03"},{"id":358,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"冰核作用","q":"冰核的作用是（ ）。","options":["促进水汽在其上凝结成水滴","降低周围气温，使水汽在其上直接凝结成大量液态云滴，从而抑制成冰","阻止过冷水滴冻结","促进成冰，使冰晶在比同质冻结高得多的温度下形成"],"answer":3,"explain":"解析：手册6-D04：冰核为特殊气溶胶，通过凝华、冻结、接触等方式促进成冰；有效冰核受温度等条件限制。手册要点：水汽可在适宜核上凝华，过冷水滴也可因浸入其中或与其接触的有效粒子而冻结，形成冰晶。","source":"上编 6-D04"},{"id":359,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"同质冻结温度","q":"无冰核的纯净小水滴发生同质冻结的温度约为（ ）。","options":["0℃","−5℃","−40℃左右","−15℃左右（与冰核无关）"],"answer":2,"explain":"解析：手册6-D07：过冷水滴需有效冰核才在较高负温成冰，纯水滴同质冻结约在−40℃。手册要点：若缺少有效成冰核心，液滴可继续过冷，直至遇到成冰条件或接近约−40℃的同质冻结温度范围。","source":"上编 6-D07"},{"id":360,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"云滴雨滴分界","q":"云滴与雨滴的半径分界约为（ ）。","options":["0.01 mm","0.1 μm","100 μm","10 mm"],"answer":2,"explain":"解析：手册6-D05：云滴典型半径约10 μm，雨滴约1000 μm，以约100 μm为分界。手册要点：本书常以半径约100μm作分界，代表性云滴、雨滴半径约为10μm和1000μm，体积相差约百万倍。","source":"上编 6-D05"},{"id":361,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"典型尺度","q":"典型云滴与典型雨滴的半径分别约为（ ）。","options":["0.1 μm与100 μm","100 μm与1 cm","10 μm与1000 μm","1 μm与10 μm"],"answer":2,"explain":"解析：手册6-D05：约10与1000 μm，雨滴体积约为云滴的百万倍。手册要点：本书常以半径约100μm作分界，代表性云滴、雨滴半径约为10μm和1000μm，体积相差约百万倍。","source":"上编 6-D05"},{"id":362,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"滴谱","q":"滴谱n(r)描述的是（ ）。","options":["不同半径云滴的数浓度分布","云滴下落速度随高度变化的分布","云的高度分布","云滴中各化学成分的比例"],"answer":0,"explain":"解析：手册6-D05、公式6-03：N=∫n(r)dr，W=∫(4π/3)ρ_w r³n(r)dr。n(r)dr表示半径在r到r+dr之间的云滴个数浓度，对它积分可得总数浓度和液水含量，与下落速度或化学成分无关。","source":"上编 公式6-03"},{"id":363,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"液水路径","q":"液水路径LWP是指（ ）。","options":["单位面积整层云液水的垂直积分，单位kg/m²","云底到地面的高度","单位时间降落到地面的降水量（降水率），单位mm/h","单位体积空气中的液水质量"],"answer":0,"explain":"解析：手册公式6-03：LWP=∫W(z)dz，单位kg/m²。手册要点：LWP为整层液水路径kg/m²。","source":"上编 公式6-03"},{"id":364,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"Stokes定律","q":"Stokes定律给出小云滴末速（ ）。","options":["与半径无关","与半径平方成正比","与半径成正比","与半径立方成正比"],"answer":1,"explain":"解析：手册公式6-07：V_t=2(ρ_w−ρ_a)gr²/(9μ)，仅适用于小雷诺数。小雷诺数下黏性阻力与r成正比，重力与r³成正比，两者平衡后末速与r²成正比，所以不是与r成正比或与r无关。","source":"上编 公式6-07"},{"id":365,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"Stokes适用","q":"Stokes末速公式不适用于（ ）。","options":["20 μm云滴","小雷诺数球形滴","10 μm云滴","毫米级大雨滴"],"answer":3,"explain":"解析：手册公式6-07条件：Re≪1，大雨滴雷诺数大且变形，需用经验末速。Stokes公式只在雷诺数远小于1、近似刚性球体时成立，10—20 μm云滴满足条件，毫米级雨滴雷诺数大且变形，不适用。","source":"上编 公式6-07"},{"id":366,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"冰晶效应","q":"冰晶效应（贝吉龙过程）是指（ ）。","options":["冰晶相互碰撞并合并成雪花","水滴冻结后形成冰雹","冰水共存时，冰面饱和水汽压较低，水滴蒸发、冰晶凝华增长","冰晶下落到0℃以上暖层后融化成雨滴的过程"],"answer":2,"explain":"解析：手册6-D06、公式6-10：e_si<e<e_sw时冰增长而水滴蒸发，水分转移。手册要点：当环境对冰过饱和而对水欠饱和时，水滴蒸发、冰晶凝华增长，促成少量较大冰粒子，利于冷云降水。","source":"上编 6-D06、公式6-10"},{"id":367,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"冰晶效应条件","q":"冰晶效应最有效的温度大致在（ ）。","options":["约−10℃至−20℃（混合云区）","0℃以上的暖云区","−40℃以下的纯冰云区","只在近地面的暖湿空气中"],"answer":0,"explain":"解析：手册6-D06关键词“冰水汽三相共存”；e_sw−e_si差值约在−12℃附近最大，混合云中最有效。手册要点：冰晶效应是混合云中水分由过冷水滴经水汽向冰晶转移的过程。","source":"上编 6-D06"},{"id":368,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"贝吉龙必要条件","q":"贝吉龙过程需要（ ）。","options":["地面气温必须低于0℃","冰晶与过冷水滴共存","没有凝结核","只有暖云"],"answer":1,"explain":"解析：单元7：贝吉龙过程需冰晶与过冷水共存。手册要点：冰晶效应是混合云中水分由过冷水滴经水汽向冰晶转移的过程。","source":"上编 6-D06、单元7"},{"id":369,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"海陆云滴谱","q":"与海洋性云相比，大陆性云的特点是（ ）。","options":["云凝结核少，云滴少而大","更易通过碰并形成暖雨","云凝结核多，云滴数浓度大而半径小","凝结核少，云滴大而稀"],"answer":2,"explain":"解析：手册6-C01：大陆核多，滴多且小，碰并效率低；海洋性云核少，滴较少较大，海盐巨核利于碰并。手册要点：在相近液态含水量和可比云环境下，典型大陆性云凝结核较多，活化云滴数浓度较高，水分分给更多液滴，平均云滴较小，早期重力碰并较难启动。","source":"上编 6-C01、公式6-11"},{"id":370,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"海洋云降水","q":"海洋性云比大陆性云更容易产生暖雨，原因是（ ）。","options":["冰晶更多，因而冰晶效应更强所致","云滴较小，数浓度大","温度更低","云滴较大、谱宽，碰并效率高"],"answer":3,"explain":"解析：手册6-C01：海洋性云滴较大，有海盐吸湿巨核，碰并更易启动。比较须在含水量和动力背景相近时。","source":"上编 6-C01"},{"id":371,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"辐射雾","q":"辐射雾的形成条件是（ ）。","options":["晴夜、近地层湿度较大、风小、层结稳定","冷空气流经暖水面，蒸发补充水汽","锋面降水","暖湿空气流经冷下垫面而冷却"],"answer":0,"explain":"解析：手册6-C02：辐射雾由地面辐射冷却形成，需晴湿稳定微风；日出后多消散。手册要点：辐射雾主要由夜间地面长波辐射冷却使近地面湿空气达到饱和形成，有利条件为晴朗、湿润、稳定和微风，日变化明显，常在夜间至清晨发展，日出受热后减弱。","source":"上编 6-C02"},{"id":372,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"平流雾","q":"平流雾是（ ）。","options":["暖湿空气移到冷下垫面上冷却形成的雾","夜间地面辐射冷却形成的雾","冷空气流过暖水面形成的蒸发雾","山坡上升形成的雾"],"answer":0,"explain":"解析：手册6-C02：暖湿空气移向冷面，需适宜风速，日变化不明显，海上多见。手册要点：平流雾由暖湿空气移到较冷下垫面，经接触冷却达到饱和形成，需要持续暖湿平流及适宜风速，海上常见，范围和持续时间可较大，昼夜变化较弱。","source":"上编 6-C02"},{"id":373,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"辐射雾日变化","q":"辐射雾与平流雾相比，日变化特点是（ ）。","options":["辐射雾多在午后出现，平流雾多在夜间","平流雾日出后一定消散，辐射雾不消散","辐射雾日变化明显，日出后常消散；平流雾日变化不明显","二者日变化相同，日出后都会立即消散"],"answer":2,"explain":"解析：辐射雾主要由夜间地面长波辐射冷却使近地面湿空气达到饱和形成，有利条件为晴朗、湿润、稳定和微风，日变化明显，常在夜间至清晨发展，日出受热后减弱（手册6-C02关键词“日变化差异”）。平流雾由暖湿空气移到较冷下垫面，经接触冷却达到饱和形成，需要持续暖湿平流及适宜风速，海上常见，范围和持续时间可较大，昼夜变化较弱。","source":"上编 6-C02"},{"id":374,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"混合成雾","q":"两团接近饱和、温度不同的空气混合可能成雾，原因是（ ）。","options":["混合使温度升高，饱和水汽压增大","混合过程中会产生新的水汽分子，使水汽含量增加","饱和水汽压是温度的凸函数，混合后实际水汽压可能超过新温度的饱和值","混合使气压升高，水汽被压缩凝结"],"answer":2,"explain":"解析：饱和水汽压随温度呈指数型增长，是温度的凸函数。两团接近饱和的空气混合后，温度和水汽压近似按比例平均，而混合温度对应的饱和水汽压低于两者饱和值的平均，于是实际水汽压可能超过新温度下的饱和值，出现过饱和并凝结成雾。混合不会产生新的水汽，也不会使气压升高而把水汽压缩凝结。","source":"上编 公式6-02、K6-04"},{"id":375,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"混合凝结潜热","q":"K6-04中两气块混合后出现凝结，终态温度比试算温度高，原因是（ ）。","options":["水滴蒸发吸热","凝结释放潜热使温度升高","混合后气压上升","周围空气对气块的辐射加热"],"answer":1,"explain":"解析：手册K6-04：试算10.0℃需凝结，考虑潜热修正后终温约11.44℃。手册要点：先忽略凝结，按两团比热相同求试算温度Tm和混合总水qt。","source":"上编 K6-04"},{"id":376,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"积状云成因","q":"积状云主要由下列哪种过程形成（ ）。","options":["大范围空气的缓慢系统性抬升","热力对流或动力抬升导致的强烈垂直上升","波动的升降","夜间地面辐射冷却"],"answer":1,"explain":"解析：手册6-C03：积状云对流发展、垂直伸展；层状云由大范围缓慢抬升（如暖锋）；波状云由波动升降。手册要点：积状云主要由不稳定空气中的对流产生，形成孤立、垂直发展的云体。","source":"上编 6-C03"},{"id":377,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"层状云成因","q":"层状云（如雨层云、高层云）的典型形成机制是（ ）。","options":["局地强烈的热力对流","山后背风波的升降","晴天日照下局地地面加热所引起的强烈热力对流","大范围空气系统性缓慢抬升（如暖锋面上）"],"answer":3,"explain":"解析：手册6-C03：层状云由大范围缓慢抬升形成；云属与成因并非一一对应。手册要点：层状云主要由大范围缓慢抬升产生，湍流混合、辐射冷却也可参与，典型表现为水平广、持续较久。","source":"上编 6-C03"},{"id":378,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"波状云","q":"波状云的形成与下列哪种过程有关（ ）。","options":["强烈的热力对流","锋面的急剧抬升","降水蒸发冷却引起的下沉","空气波动造成的上升与下沉交替"],"answer":3,"explain":"解析：手册6-C03：波动升降形成波状云，如背风波云、层积云波状结构。手册要点：波状云由气流受地形或层结中波动等作用而周期性升降形成，常在波峰附近冷却成云、波谷下沉蒸发，排列成波列。","source":"上编 6-C03"},{"id":379,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"暖云降水","q":"暖云降水的主要机制是（ ）。","options":["云滴间的电荷相互吸引","水汽在云滴上凝华增长","大小云滴因下落速度差引起的重力碰并","冰晶效应使冰晶长大后融化"],"answer":2,"explain":"解析：手册6-P01：凝结增长随半径增大而减慢，需差速重力碰并形成雨滴。手册要点：大小云滴沉降速度不同，较大滴追上较小滴，发生重力碰撞并合。","source":"上编 6-P01"},{"id":380,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"凝结增长局限","q":"单靠凝结增长难以在短时间内形成雨滴，原因是（ ）。","options":["云中始终没有过饱和","凝结增长dr/dt∝1/r，半径越大增长越慢","凝结增长随半径增大而加快","云滴不能凝结，只能通过碰并增长"],"answer":1,"explain":"解析：手册公式6-06：r²−r₀²=2Gst，半径增长随时间变慢，形成滴谱变窄。手册要点：凝结引起的半径增长率随滴径增大而减小，单靠凝结通常难在云寿命内迅速长成雨滴。","source":"上编 6-P01、公式6-06"},{"id":381,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"重力碰并","q":"重力碰并增长中，大滴增长速率与下列因素正相关（ ）。","options":["大滴自身的温度和电荷量","碰并效率、液水含量、大滴末速","当地的科氏参数","环境气压大小"],"answer":1,"explain":"解析：手册公式6-08：dR/dt≈E_cWV(R)/(4ρ_w)，大滴越大末速越大，增长越快。增长率与碰并效率、液水含量和大滴末速成正比，大滴越大末速越大，增长越快，温度、电荷量、科氏参数和气压都不在公式中。","source":"上编 公式6-08"},{"id":382,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"暖雨非必经冰","q":"关于降水形成，下列说法正确的是（ ）。","options":["暖云不能产生降水","冷云不能降水，只有暖云能降水","暖云可以只靠碰并形成降水，不必经过冰晶阶段","所有降水都必须经过冰晶阶段"],"answer":2,"explain":"解析：单元7、手册6-P01：暖雨可通过碰并形成，热带低云常见。暖云中大滴靠重力碰并小滴可以长成雨滴，热带暖雨就是如此，冷云也能通过冰晶效应降水，两者都可产生降水。","source":"上编 6-P01、单元7"},{"id":383,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"冷云降水","q":"冷云降水的基本过程是（ ）。","options":["冰晶先升华成水汽，再在低层重新凝结成雨滴，整个过程不经过融化","只能形成冰雹，不能形成雨或雪","冰晶效应使冰晶长大，再经淞附、聚合，下落过暖层融化成雨","云滴直接碰并成雨，不需冰晶"],"answer":2,"explain":"解析：手册6-P02：混合云中冰核与冰晶→冰晶效应→淞附和聚合→经暖层融化成雨或直接降雪。手册要点：粒子下落进入0℃以上的暖层时可融化成雨滴，再经碰并增长。","source":"上编 6-P02"},{"id":384,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"淞附","q":"淞附（凇附）是指（ ）。","options":["水汽直接在冰晶表面凝华，使冰晶逐渐长大","冰晶下落到暖层时融化","冰晶相互粘连形成雪花","冰晶与过冷水滴碰撞，水滴冻结在冰晶上"],"answer":3,"explain":"解析：手册6-P02：冰晶与过冷水滴碰冻为淞附，可形成霰；冰晶之间粘连为聚合（形成雪花）。手册要点：较大冰晶继续碰集过冷水滴并冻结而淞附增长，或冰粒相互聚合，形成雪、霰等。","source":"上编 6-P02"},{"id":385,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"降水相态","q":"降落到地面的是雨还是雪主要取决于（ ）。","options":["下落路径上是否有足够厚的暖层使冰相粒子融化","地面风向与风速","云顶高度与云中电荷分布","云中电荷的多少与雷电活动的强弱"],"answer":0,"explain":"解析：粒子下落进入0℃以上的暖层时可融化成雨滴，再经碰并增长（手册6-P02关键词“暖层融化；下落路径”）。最终相态取决于整条下落路径的温度和湿度，不由云顶温度单独决定。","source":"上编 6-P02"},{"id":386,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"对流单体发展阶段","q":"雷暴（对流单体）发展阶段的特征是（ ）。","options":["以上升气流为主，云体迅速增长","出现阵风锋，降水最强","以下沉气流为主，云体逐渐消散","上升与下沉气流并存"],"answer":0,"explain":"解析：手册6-P03：形成（发展）阶段以上升为主；成熟阶段上下气流并存、降水与下沉出现；消散阶段以下沉为主。手册要点：形成阶段云内以上升气流为主，低层暖湿空气辐合补给，凝结释放潜热，云体垂直发展，通常尚无显著地面降水。","source":"上编 6-P03"},{"id":387,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"对流单体成熟","q":"对流单体成熟阶段的标志是（ ）。","options":["只有下沉气流，云体消散","云体逐渐消散，以下沉气流为主，降水逐渐减弱","上升和下沉气流并存，地面出现降水与阵风锋","只有上升气流，尚无降水"],"answer":2,"explain":"解析：手册6-P03：降水拖曳和蒸发冷却产生下沉气流，外流形成阵风锋。手册要点：成熟阶段出现地面降水和有组织下沉气流，上升、下沉并存。","source":"上编 6-P03"},{"id":388,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"单体消散","q":"对流单体消散阶段（ ）。","options":["上升气流最强，云体迅速增长","气压骤降","以下沉气流为主，降水减弱","开始形成积云"],"answer":2,"explain":"解析：手册6-P03：下沉占主导，切断暖湿入流，单体减弱消散；单体与整片风暴应区分。手册要点：消散阶段下沉逐渐占优势，暖湿上升补给削弱或切断，降水减弱，云逐渐消散。","source":"上编 6-P03"},{"id":389,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"人工增雨原理","q":"冷云人工增雨（播撒碘化银或干冰）的原理是（ ）。","options":["消除云中凝结核，抑制成云","加热云体，增强对流","直接向云中注入大量水分，增加云中液水含量","增加冰核或降温产生冰晶，触发冰晶效应"],"answer":3,"explain":"解析：手册6-E01：冷云播撒人工冰核或制冷剂，暖云播撒吸湿性核；须已有适宜云体。手册要点：冷云可播撒碘化银提供成冰核，或用干冰强制冷却产生冰晶，促进适量冰粒增长。","source":"上编 6-E01"},{"id":390,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"人工增雨边界","q":"关于人工增雨，下列说法错误的是（ ）。","options":["效果需要科学检验","在无云晴空也能凭空造雨","暖云可以使用吸湿性催化剂","需已有适宜的云体"],"answer":1,"explain":"解析：手册6-E01：不可凭空造雨，须把握时机剂量，效果需检验。手册要点：它不能在无适宜云水条件下凭空造雨，也没有被证明可任意消除台风、龙卷等强天气，不能把自然降雨全部计为人工效果。","source":"上编 6-E01"},{"id":391,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"暖云催化","q":"暖云人工增雨通常播撒（ ）。","options":["吸湿性粒子（如盐粉）促进大滴形成与碰并","干冰或碘化银等冷云催化剂","干冰或液氮，使云体迅速降温，从而产生大量冰晶","碘化银，增加冰核"],"answer":0,"explain":"解析：手册6-E01：暖云吸湿催化；碘化银、干冰用于冷云。手册要点：暖云可用吸湿性粒子改变滴谱，促进碰并。","source":"上编 6-E01"},{"id":392,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"粒子升降","q":"若上升气流速度大于云滴末速，云滴相对地面（ ）。","options":["水平移动","上升","下降","静止"],"answer":1,"explain":"解析：手册公式6-09：w_drop=w_air−V_t，w_air>V_t时上升；这是云滴在上升气流中能长时间停留增长的原因。手册要点：wair＞Vt时粒子相对地面上升，不能看到下落末速就断言已经降到地面。","source":"上编 公式6-09"},{"id":393,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"固定含水量滴数","q":"在液水含量相同的条件下，云滴数越多则（ ）。","options":["半径不变","平均半径越小","降水越容易","平均半径越大"],"answer":1,"explain":"解析：手册K6-01：固定W时滴数多对应平均滴半径更小，碰并效率更低。液水含量W∝Nr³，W固定时N越大，平均半径越小，碰并效率越低，降水越不容易形成。","source":"上编 K6-01"},{"id":394,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"云凝结核数量","q":"云凝结核数量增加（其他条件不变）时，暖云降水效率通常（ ）。","options":["升高","降低","变为100%","不变"],"answer":1,"explain":"解析：手册6-C01、7-E03：核多滴多而小，碰并效率低，降水可能被抑制。手册要点：气溶胶还可作为云凝结核或冰核，改变云滴数目、大小、反照率以及降水过程。","source":"上编 6-C01、7-E03"},{"id":395,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"雾的消散","q":"辐射雾日出后消散的主要原因是（ ）。","options":["湿度增加，雾滴吸湿增长","地面受热升温，湍流增强，雾滴蒸发","气温继续下降","风速减小，湍流减弱，雾层抬升为低云"],"answer":1,"explain":"解析：手册6-C02：辐射雾日变化明显。手册要点：辐射雾主要由夜间地面长波辐射冷却使近地面湿空气达到饱和形成，有利条件为晴朗、湿润、稳定和微风，日变化明显，常在夜间至清晨发展，日出受热后减弱。","source":"上编 6-C02"},{"id":396,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"蒸发雾","q":"冷空气流经暖水面，水面蒸发进入冷空气而形成的雾是（ ）。","options":["蒸发雾","夜间辐射雾","平流雾","锋面雾"],"answer":0,"explain":"解析：手册6-C02对比辐射雾与平流雾的成因思路：冷空气上蒸发补充水汽达到饱和。蒸发雾是冷空气从暖水面获得蒸发水汽而饱和，辐射雾靠夜间地面辐射冷却，平流雾是暖湿空气移到冷下垫面冷却形成。","source":"上编 6-C02"},{"id":397,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"霰","q":"霰的形成主要依靠（ ）。","options":["雨滴落入冷层后整体冻结","较大冰晶碰集过冷水滴并冻结的淞附增长","小云滴之间的碰并增长","水汽在冰晶上凝华的扩散增长"],"answer":1,"explain":"解析：手册6-P02：较大冰晶继续碰集过冷水滴并冻结而淞附增长，或冰粒相互聚合，形成雪、霰等。凝华增长发生在冰晶优先增长阶段，并非霰的主要成因。","source":"上编 6-P02"},{"id":398,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"冰晶与水滴竞争","q":"在混合云中，冰晶迅速长大而水滴蒸发，当环境水汽压e满足（ ）时发生。","options":["e<e_si","e>e_sw","e=0（空气完全干燥）","e_si<e<e_sw"],"answer":3,"explain":"解析：同温下冰面饱和水汽压e_si小于过冷水面饱和水汽压e_sw。当e_si<e<e_sw时，环境对冰面过饱和、对水面未饱和，冰晶凝华长大而水滴蒸发，这就是贝吉龙（冰晶）效应。e<e_si时冰晶和水滴都会蒸发，e>e_sw时两者都会增长。","source":"上编 公式6-10"},{"id":399,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"液水含量（单分散）","q":"云滴半径10 μm、数浓度100 cm⁻³，ρw=1000 kg/m³，液水含量W约为（ ）。","options":["4.189 g/m³","0.419 g/m³","0.004 g/m³","41887.902 g/m³"],"answer":1,"explain":"解析：W=(4π/3)ρ_w r³N=(4π/3)×1000×(10⁻⁵)³×10⁸≈4.189×10⁻⁴ kg/m³≈0.419 g/m³。N须换成m⁻³（×10⁶），半径须用立方。","source":"上编 公式6-03、6-11、K6-01"},{"id":400,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"液水路径","q":"云层均匀液水含量0.419 g/m³、厚800 m，液水路径LWP约为（ ）。","options":["335.200 kg/m²","0.001 kg/m²","0.335 kg/m²","3.352 kg/m²"],"answer":2,"explain":"解析：LWP=W·Δz=0.419×800 g/m²=335 g/m²≈0.335 kg/m²。手册要点：LWP为整层液水路径kg/m²。","source":"上编 公式6-03、K6-01"},{"id":401,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"Stokes末速","q":"半径16 μm云滴，ρw=1000、ρa=1.20 kg/m³，μ=1.80×10⁻⁵ Pa·s，Stokes末速约为（ ）。","options":["0.3094 m/s","1.9358 m/s","0.0155 m/s","0.0309 m/s"],"answer":3,"explain":"解析：V_t=2(ρw−ρa)gr²/(9μ)≈0.0309 m/s，正比于r²。小雷诺数才适用，大雨滴不能用。","source":"上编 公式6-07、K6-02"},{"id":402,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"粒子对地升降","q":"上升气流0.50 m/s，云滴相对空气沉降末速0.031 m/s，云滴相对地面的速度约为（ ）。","options":["0.531 m/s（向上为正）","0.469 m/s（向上为正）","0.031 m/s（向上为正）","-0.469 m/s（向上为正）"],"answer":1,"explain":"解析：w_drop=w_air−V_t=0.50−0.031=+0.469 m/s，云滴仍随气流上升。只有V_t>w_air时粒子才对地下降。","source":"上编 公式6-09"},{"id":403,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"两气块混合温度","q":"同压下等质量的两气块温度分别为5℃和15℃，初步混合温度约为（ ）。","options":["8.7℃","20.0℃","12.5℃","10.0℃"],"answer":3,"explain":"解析：T_m≈(m₁T₁+m₂T₂)/(m₁+m₂)=10.0℃；比湿同样按质量加权。因饱和水汽压是温度的凸函数，混合可能出现过饱和而成雾。","source":"上编 公式6-02、K6-04"},{"id":404,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"Kelvin曲率效应","q":"Kelvin系数A_K=1.20×10⁻⁹ m，半径0.500 μm纯水滴平衡所需过饱和度约为（ ）。","options":["0.024%","0.240%","2.403%","2.400%"],"answer":1,"explain":"解析：e_sr/e_sw=exp(A_K/r)=exp(0.0024)，过饱和度≈0.240%。滴越小所需过饱和度越大。","source":"上编 公式6-04、K6-03"},{"id":405,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"凝结增长半径平方律","q":"初半径5 μm，G=1.0×10⁻¹⁰ m²/s，过饱和度0.5%恒定，600 s后半径约为（ ）。","options":["24.50 μm","12.25 μm","5.00 μm","25.00 μm"],"answer":3,"explain":"解析：r²=r₀²+2Gst，r=√(25×10⁻¹²+6×10⁻¹⁰)≈25.00 μm。半径增长随时间变慢，这正是单靠凝结难以形成雨滴的原因。","source":"上编 公式6-06"},{"id":406,"book":"大气","chapter":"第6章 云 雾和降水物理学","kp":"固定液水含量的滴数浓度","q":"液水含量0.419 g/m³不变，若单分散云滴半径为15 μm，数浓度约为（ ）。","options":["29.6 cm⁻³","100.0 cm⁻³","44.5 cm⁻³","44.4 cm⁻³"],"answer":0,"explain":"解析：N=W/[(4π/3)ρ_w r³]≈29.6 cm⁻³。含水量一定时滴越大数量越少，海洋性云正是“少而大”。","source":"上编 公式6-11、K6-01"},{"id":407,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"PM2.5定义","q":"PM2.5是指（ ）。","options":["单个质量为2.5 μg的颗粒物","直径2.5 mm的颗粒","几何直径恰好等于2.5 μm的颗粒","空气动力学当量直径小于等于2.5 μm的颗粒物"],"answer":3,"explain":"解析：手册7-D01：按空气动力学当量直径定义，不是几何直径。手册要点：PM₂.₅指空气动力学当量直径不大于2.5μm的颗粒物。","source":"上编 7-D01"},{"id":408,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"PM2.5组分","q":"PM2.5的主要化学组分不包括（ ）。","options":["臭氧","有机物","黑碳","硫酸盐、硝酸盐、铵盐"],"answer":0,"explain":"解析：手册7-D01：主要组分有硫酸盐、硝酸盐、铵盐、有机物、黑碳及矿物等；臭氧是气态污染物。有机物、黑碳和二次无机盐都是PM2.5的颗粒态组分，臭氧是气态二次污染物，不属于颗粒物的化学组分。","source":"上编 7-D01"},{"id":409,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"PM2.5来源","q":"PM2.5中的硫酸盐、硝酸盐主要属于（ ）。","options":["全部由燃烧直接排放的一次颗粒","海浪飞溅产生的海盐颗粒","地表风蚀扬起的土壤扬尘和矿物颗粒等直接排放的一次组分","由SO₂、NOx等前体物在大气中转化生成的二次组分"],"answer":3,"explain":"解析：手册7-D01：一次与二次来源并存，硫酸盐、硝酸盐、铵盐主要为二次生成。手册要点：主要组分有硫酸盐、硝酸盐、铵盐、有机物、黑碳及部分矿物尘等，既有燃烧等一次排放，也有前体气体转化的二次来源。","source":"上编 7-D01"},{"id":410,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"酸雨判别","q":"通常把pH低于多少的降水称为酸雨（ ）。","options":["4.0","6.5","7.0","5.6"],"answer":3,"explain":"解析：手册7-D02：常用pH<5.6；自然降水溶入CO₂呈弱酸性，pH约5.6，不以7为基准。手册要点：酸雨通常指pH低于5.6的降水，基准是未污染降水受CO₂溶解而呈弱酸性，不能以纯水pH7直接判别。","source":"上编 7-D02"},{"id":411,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"自然降水pH","q":"洁净大气中的自然降水pH约为5.6而不是7，主要是因为（ ）。","options":["溶解了大气中的CO₂形成碳酸","溶解了SO₂生成亚硫酸","含有海盐","溶解了NH₃"],"answer":0,"explain":"解析：手册7-D02、公式7-04：洁净雨水溶CO₂偏酸，因此酸雨不以中性pH 7判断。手册要点：酸雨通常指pH低于5.6的降水，基准是未污染降水受CO₂溶解而呈弱酸性，不能以纯水pH7直接判别。","source":"上编 7-D02"},{"id":412,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"pH定义","q":"pH的定义是（ ）。","options":["−lg[H⁺]（稀溶液中近似）","[H⁺]×10⁷","lg[H⁺]（常用对数，不取负）","−ln[H⁺]（自然对数）"],"answer":0,"explain":"解析：手册公式7-04：pH=−log₁₀a_H⁺，稀溶液用摩尔浓度近似活度。pH取常用对数的负值，所以[H⁺]=10⁻⁵ mol/L对应pH=5，不取负号、用自然对数或乘以10⁷都不是定义。","source":"上编 公式7-04"},{"id":413,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"氨中和作用","q":"大气中NH₃对降水酸度的作用是（ ）。","options":["与SO₂反应生成硫酸","中和H⁺生成NH₄⁺，使降水pH升高","增加H⁺浓度，使降水pH降低、酸性增强","与降水酸度无关"],"answer":1,"explain":"解析：手册公式7-04：NH₃+H⁺→NH₄⁺，碱性物质中和酸性；但铵盐沉降后在土壤中硝化仍可致酸。NH₃是大气中主要的碱性气体，溶于云雨水后结合H⁺生成NH₄⁺，降低酸度，它不会生成硫酸，也不会增加H⁺。","source":"上编 公式7-04"},{"id":414,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"一次与二次污染物","q":"二次污染物是指（ ）。","options":["一次污染物在大气中经化学或光化学反应生成的新污染物","只来自火山、植物等自然源而非人为源排放的各类污染物","直接从污染源排出的污染物","排放量较少、浓度较低的污染物"],"answer":0,"explain":"解析：手册7-C01：一次污染物直接排放，二次在大气中转化生成，如O₃、硫酸盐。手册要点：一次污染物是污染源直接排入大气的物质，如SO₂、NO和一次颗粒物。","source":"上编 7-C01"},{"id":415,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"二次污染物举例","q":"下列属于典型二次污染物的是（ ）。","options":["光化学反应生成的O₃","火山喷出的火山灰","燃煤锅炉直接排放的SO₂","汽车排出的CO"],"answer":0,"explain":"解析：单元8：O₃为二次污染物；其余为一次排放。手册要点：二次污染物是排放物在大气中经化学转化形成的物质，如近地面O₃、二次硫酸盐和二次有机气溶胶。","source":"上编 7-C01、单元8"},{"id":416,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"双重来源","q":"关于一次与二次污染物，下列说法正确的是（ ）。","options":["二次污染物的危害一定小于一次污染物","一次污染物不参与任何大气化学反应，最终都直接沉降到地面","同一成分（如颗粒物中的有机物）可兼有一次和二次来源","一种成分只能属于一次或二次中的一类"],"answer":2,"explain":"解析：同一种成分可能兼有一次排放和二次生成，如NO₂及部分颗粒物，因此减排量与环境浓度的变化未必成正比（手册7-C01关键词“同一成分可兼具两类来源”）。一次污染物是污染源直接排入大气的物质，如SO₂、NO和一次颗粒物。","source":"上编 7-C01"},{"id":417,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"干沉降","q":"干沉降是指（ ）。","options":["无降水时，污染物通过重力沉降、湍流扩散和表面吸附到达地表","云内吸收后随雨滴降落","在大气中发生化学转化而消失","污染物被云滴吸收后，随降水冲刷到达地面的过程"],"answer":0,"explain":"解析：手册7-C02：干沉降无降水；湿沉降包括云内清除（雨除）和云下冲刷（冲刷）。手册要点：干沉降是气体或颗粒物在不借助降水的情况下，通过湍流输送、分子扩散、重力沉降及表面吸收等过程到达地表。","source":"上编 7-C02"},{"id":418,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"湿沉降","q":"湿沉降包括（ ）。","options":["重力沉降和湍流扩散","吸附解吸与光化学转化","气溶胶的凝结增长与老化过程","云内清除（雨除）和云下冲刷"],"answer":3,"explain":"解析：手册7-C02：湿沉降分云内清除与云下冲刷。手册要点：湿沉降是污染物随云内清除、云下冲刷等过程被降水带到地表。","source":"上编 7-C02"},{"id":419,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"酸沉降","q":"酸沉降的正确含义是（ ）。","options":["酸性物质的干沉降与湿沉降之总称","只指SO₂的干沉降","只指pH<5.6的降雨","只指酸雾"],"answer":0,"explain":"解析：手册7-C02：酸沉降包括酸性干沉降与酸性湿沉降，酸雨只是其中湿沉降部分。手册要点：酸沉降是酸性物质由大气向地表的沉降总称，既包括酸雨、酸雪等湿沉降，也包括酸性气体和颗粒物的干沉降。","source":"上编 7-C02、E10-D02"},{"id":420,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"干沉降寿命","q":"干沉降速度越大，污染物的干沉降寿命（ ）。","options":["越短","与速度平方成正比","不变","越长"],"answer":0,"explain":"解析：手册公式7-03：τ_d≈H/v_d，与沉降速度成反比、与混合层厚度成正比。τ_d≈H/v_d，沉降速度越大，污染物越快从混合层中被清除，寿命越短，与速度平方无关。","source":"上编 公式7-03"},{"id":421,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"平流层与近地臭氧","q":"平流层臭氧与近地面臭氧的作用（ ）。","options":["平流层臭氧吸收紫外起屏障作用，近地面臭氧是有害二次污染物","近地面臭氧保护生物免受紫外伤害","二者都有益，浓度越高越好","二者都有害，平流层臭氧也会增强地面紫外辐射"],"answer":0,"explain":"解析：手册7-C03：高度不同作用不同，保护与治理应区分。手册要点：近地面高浓度臭氧是二次污染物。","source":"上编 7-C03"},{"id":422,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"臭氧温室作用","q":"关于臭氧，下列说法正确的是（ ）。","options":["臭氧只吸收紫外线，不吸收红外","对流层臭氧越多越有利于健康","臭氧还能吸收红外辐射，也是一种温室气体","臭氧不影响气候"],"answer":2,"explain":"解析：近地面臭氧可刺激呼吸系统、损害植物，又通过红外吸收产生温室效应（手册7-C03关键词“红外吸收”）。平流层臭氧主要由O₂光解后的反应产生，吸收紫外线，保护地表生命，并加热平流层。","source":"上编 7-C03"},{"id":423,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"污染物归宿","q":"污染物从排放到最终归宿的过程依次包括（ ）。","options":["排放、输送扩散、化学转化、干湿沉降","排放后立即沉降到地面","排放、凝结、蒸发、光合","排放、光合吸收、呼吸释放、最终在海底沉积"],"answer":0,"explain":"解析：污染物进入大气后，随平均风输送并受湍流混合，可在气相、液相或界面发生化学转化，最后经干沉降、湿沉降等途径离开大气（手册7-P01关键词）。转化可能消耗某成分，也可能产生新的二次污染物。","source":"上编 7-P01"},{"id":424,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"平均停留时间","q":"准稳态下污染物平均停留时间τ=（ ）。","options":["大气中总量除以排放（或清除）速率","排放速率除以大气中总量","大气中总量乘以排放速率","浓度除以平均风速"],"answer":0,"explain":"解析：手册公式7-01：τ=M/L≈M/E（E≈L时）。停留时间等于库存量除以通量，量纲才是时间，倒数或乘积的量纲不对，浓度除以风速也不是时间。","source":"上编 公式7-01"},{"id":425,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"一阶损失","q":"一阶损失过程中，平均寿命τ与损失速率常数k的关系是（ ）。","options":["τ=k²","τ=ln2/k","τ=ln2·k","τ=1/k"],"answer":3,"explain":"解析：手册公式7-01：M=M₀e^(−kt)，τ=1/k，t½=ln2/k。一阶过程中损失速率与库存量成正比，平均寿命τ=1/k，ln2/k是半衰期，二者相差约0.69倍，不能混用。","source":"上编 公式7-01"},{"id":426,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"寿命与分布","q":"寿命长的气体（如CO₂）与寿命短的气体（如OH自由基）相比（ ）。","options":["不参与输送","在全球混合较均匀","只存在于排放源附近局地","空间变化更大"],"answer":1,"explain":"解析：停留时间越长，输送混合越充分，全球分布越均匀；短寿命物种空间变化大（手册7-P01停留时间概念）。CO₂寿命长达百年量级，有充分时间被全球环流混合，浓度各地相近，OH寿命不到一秒，只在生成处附近存在，空间变化极大。","source":"上编 7-P01"},{"id":427,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"ppm含义","q":"1 ppm体积分数表示（ ）。","options":["每立方米空气中含1 μg该气体","每10⁶个空气分子中有1个该气体分子（摩尔比10⁻⁶）","每10⁹个空气分子中有1个该气体分子（摩尔比10⁻⁹）","每升空气中含1 mg该气体"],"answer":1,"explain":"解析：手册公式7-02：1 ppm=10⁻⁶，1 ppb=10⁻⁹，均为摩尔（体积）比。ppm是体积（摩尔）比而不是质量浓度，每10⁹个分子中有1个是ppb，μg/m³和mg/L都是质量浓度单位，需按温度、气压换算。","source":"上编 公式7-02"},{"id":428,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"摩尔比与浓度","q":"同一摩尔比的气体，在高空低压低温处的质量浓度与地面相比（ ）。","options":["与气压和温度无关，质量浓度处处相同","一定更高，因为高空更冷","一定相同","一般较低，需按实际p、T换算"],"answer":3,"explain":"解析：手册公式7-02、K7-01：C=χpM/(R*T)，不能套标准状态。C=χpM/(R*T)，高空气压降低的比例大于温度降低的比例，所以同一摩尔比对应的质量浓度一般较低，不能一律套用标准状态。","source":"上编 公式7-02、K7-01"},{"id":429,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"大气氧化性","q":"对流层大气的主要氧化剂是（ ）。","options":["OH自由基","氮气分子N₂","二氧化碳","氩气Ar"],"answer":0,"explain":"解析：手册7-P02：OH是对流层“清洁剂”，引发多数气相氧化；还有HO₂、RO₂、O₃等。手册要点：OH等活性自由基可发起CO、CH₄和VOCs等的氧化，并在反应链中与HO2、RO2相互转化。","source":"上编 7-P02"},{"id":430,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"三类反应","q":"大气化学反应按物相可分为（ ）。","options":["热反应与核反应","快反应与慢反应","有机反应与无机反应两类","气相、液相和非均相反应"],"answer":3,"explain":"解析：手册7-P02：气相、液相（云雾水中）和非均相（颗粒表面界面）反应，对二次生成都重要。手册要点：气相反应在气体中进行，液相反应在云雾雨滴等液体内部进行，非均相反应涉及不同物相及其界面。","source":"上编 7-P02"},{"id":431,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"Chapman机制","q":"Chapman臭氧机制中消耗臭氧的反应包括（ ）。","options":["O₃+hν→O₂+O 和 O+O₃→2O₂","O+O₂+M→O₃+M 和 O₂+hν→2O","NO₂+hν→NO+O 和 O+O₂+M→O₃","O₂+hν→2O 和 NO+O₃→NO₂+O₂"],"answer":0,"explain":"解析：手册公式7-06：生成为O₂光解和三体反应，损耗为O₃光解和O+O₃。O+O₂+M→O₃+M和O₂光解是生成臭氧的反应，NO₂光解属于对流层光化学，NO+O₃虽消耗臭氧，但不属于Chapman纯氧机制。","source":"上编 公式7-06"},{"id":432,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"氯催化","q":"氯自由基催化破坏臭氧的净反应是（ ）。","options":["Cl+O₂→ClO","2O₃→3O₂（无需氧原子）","O₃+O→2O₂","O₂+hν→2O"],"answer":2,"explain":"解析：手册公式7-07：Cl+O₃→ClO+O₂；ClO+O→Cl+O₂；净O₃+O→2O₂，Cl再生。两步相加后Cl和ClO都被消去，净效果是O₃与O结合成两个O₂，Cl+O₂→ClO并不是该循环中的反应。","source":"上编 公式7-07"},{"id":433,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"Cl与Cl⁻","q":"在催化破坏臭氧的反应中，Cl代表（ ）。","options":["氯化钠","氯气分子","氯离子Cl⁻（带负电）","氯原子自由基"],"answer":3,"explain":"解析：手册公式7-07易错：不可写成氯离子。手册要点：Cl为氯原子自由基，ClO为一氧化氯。","source":"上编 公式7-07"},{"id":434,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"催化剂再生","q":"一个氯原子能破坏成千上万个臭氧分子，原因是（ ）。","options":["氯原子质量大","氯在循环中再生，起催化作用","氯吸收紫外线","氯与臭氧结合形成稳定的化合物"],"answer":1,"explain":"解析：Cl在循环中被再生，因而少量活性氯可连续破坏臭氧（手册7-P03关键词“卤素催化；Cl再生”）。平流层中，O₂吸收高能紫外辐射后光解为氧原子，随后O+O₂+M→O₃+M。","source":"上编 7-P03"},{"id":435,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"极地臭氧洞","q":"极地臭氧洞的形成除基础氯催化循环外，还涉及（ ）。","options":["火山灰颗粒直接分解平流层中的臭氧","对流层臭氧增加并向上输送","极地平流层云上的非均相反应活化氯","太阳活动减弱"],"answer":2,"explain":"解析：手册公式7-07条件：极地臭氧洞还涉及极地平流层云及其他循环。手册要点：不能把两步基础式当作极地臭氧洞的全部机制，氯也会进入储库物种。","source":"上编 公式7-07"},{"id":436,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"NO2光解","q":"对流层臭氧生成的起点反应是（ ）。","options":["Cl+O₃→ClO+O₂","NO₂+hν→NO+O","SO₂+OH→HSO₃","O₂+hν→2O"],"answer":1,"explain":"解析：手册7-P04、公式7-08：NO₂光解产生O，O与O₂结合生成O₃。对流层到达的紫外线波长较长，不能光解O₂，臭氧的氧原子来自NO₂光解，Cl+O₃属于平流层催化破坏，SO₂+OH则是硫的氧化。","source":"上编 公式7-08"},{"id":437,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"NO滴定","q":"反应NO+O₃→NO₂+O₂的作用是（ ）。","options":["消耗O₃，与NO₂光解构成无净生成的光稳态循环","消耗NO₂，与NO的光解共同构成净生成O₃的循环","净生成O₃，是光化学烟雾的主要来源","生成PAN"],"answer":0,"explain":"解析：手册公式7-08：仅有NOx循环O₃无净积累，称“只有循环还不够”。NO₂光解生成O₃，NO又把O₃消耗掉，两者构成无净生成的光稳态循环，要净积累O₃，还需过氧自由基把NO转化为NO₂。","source":"上编 公式7-08"},{"id":438,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"净臭氧生成","q":"对流层O₃净积累的关键是（ ）。","options":["NO与O₃反应生成NO₂，使O₃不断积累","NO₂直接与O₂反应生成O₃，既不需要光照，也不需要过氧自由基参与","OH与O₃反应生成HO₂，使O₃净增加","HO₂、RO₂等过氧自由基将NO转化为NO₂，而不消耗O₃"],"answer":3,"explain":"解析：手册公式7-09、7-P04：RO₂+NO→RO+NO₂，不耗O₃转化NO，打破光稳态，O₃净积累。手册要点：OH、HO₂、RO₂均为自由基，区别于稳定过氧化氢。","source":"上编 公式7-09"},{"id":439,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"VOCs作用","q":"在光化学烟雾形成中，VOCs的主要作用是（ ）。","options":["直接光解产生氧原子，进而生成O₃","中和大气酸性物质，降低降水酸度","被OH氧化产生RO₂、HO₂自由基，推动NO向NO₂转化","吸收紫外线并屏蔽光解，使O₃生成速率下降"],"answer":2,"explain":"解析：手册7-P04：VOCs氧化提供过氧自由基，是O₃净生成的燃料。手册要点：VOCs或CO被OH等氧化，可产生RO2、HO2。","source":"上编 7-P04"},{"id":440,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"O3非线性","q":"O₃生成对NOx和VOCs的响应是非线性的，这意味着（ ）。","options":["削减任一前体物O₃一定同比下降","在VOC控制区削减NOx可能使O₃不降反升","O₃与前体物排放无关，只取决于当天的气象条件","O₃只取决于NOx"],"answer":1,"explain":"解析：手册7-P04、7-E06：O₃与前体物非线性，分VOC受限与NOx受限，需协同控制。手册要点：O₃对NOx和VOCs存在非线性响应。","source":"上编 7-P04、7-E06"},{"id":441,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"光化学条件","q":"光化学烟雾易在下列条件下出现（ ）。","options":["冬季阴冷、高湿、日照弱","夏季晴朗强日照、气温高、风小","大风降雨、扩散条件好","夜间"],"answer":1,"explain":"解析：手册7-P04、7-E02：需日照驱动光解，静稳利于前体物积累。NO₂光解需要强日照，高温加快反应，风小则前体物不易扩散，所以夏季晴朗静稳的午后最易出现，阴冷高湿或大风降雨都不利于生成。","source":"上编 7-P04"},{"id":442,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"人为源","q":"下列属于大气污染物主要人为源的是（ ）。","options":["海浪飞沫、火山喷发和沙尘","火山喷发、闪电与植物花粉","植物排放VOCs和闪电生成NOx","燃料燃烧、工业生产、交通运输和农业NH₃排放"],"answer":3,"explain":"解析：手册7-E01：人为源有燃烧、工业交通、农业NH₃；自然源有扬尘海盐、生物与火山。手册要点：人为源主要有化石燃料燃烧、工业过程、交通运输、溶剂使用、农业施肥养殖和生活排放，分别可排放SO₂、NOx、CO、VOCs、NH₃及颗粒物。","source":"上编 7-E01"},{"id":443,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"自然源","q":"下列属于大气污染物自然源的是（ ）。","options":["机动车尾气","燃煤电厂烟气","火山喷发与海浪飞沫","化肥施用和农田秸秆焚烧"],"answer":2,"explain":"解析：手册7-E01：扬尘、海盐、生物排放和火山为自然源。机动车尾气、燃煤烟气以及化肥施用、秸秆焚烧都来自人类活动，属于人为源，火山和海浪飞沫属于自然源。","source":"上编 7-E01"},{"id":444,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"气象与污染","q":"下列气象条件中最不利于污染物扩散的是（ ）。","options":["静稳天气：风小、混合层低、逆温","大风天气、强降水","冷锋过境后风速增大、混合层明显抬升","不稳定层结、混合层高"],"answer":0,"explain":"解析：手册7-E02：风与湍流、混合层、逆温静稳、降水均影响污染；气象与排放共同控制浓度。手册要点：风决定污染物的输送方向和整体稀释，湍流增强及混合层抬升通常有利于近地面污染物扩散。","source":"上编 7-E02"},{"id":445,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"降水清除","q":"降水对大气颗粒物的作用主要是（ ）。","options":["湿清除，降低浓度","对颗粒物几乎无影响","生成臭氧","增加颗粒物浓度"],"answer":0,"explain":"解析：手册7-E02：降水通过湿沉降清除污染物。手册要点：降水可通过湿清除降低部分气体和颗粒物浓度。","source":"上编 7-E02"},{"id":446,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"气溶胶直接效应","q":"气溶胶的直接辐射效应是指（ ）。","options":["影响大气中声波的传播速度","作为云凝结核改变云的反照率和寿命（间接效应）","改变降水化学成分和酸度","散射和吸收太阳辐射，改变地气系统能量收支"],"answer":3,"explain":"解析：手册7-E03：直接散射吸收；黑碳吸收加热；作为CCN改变云滴与反照率为间接效应。手册要点：气溶胶直接散射和吸收辐射，改变地气系统能量收支。","source":"上编 7-E03"},{"id":447,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"气溶胶间接效应","q":"气溶胶增多使云滴数增多、半径变小，云反照率增大，这属于（ ）。","options":["气溶胶的直接辐射效应","臭氧的温室效应","气溶胶的间接效应（云反照率效应）","温室效应（吸收长波辐射）"],"answer":2,"explain":"解析：手册7-E03：云凝结核增多→云滴多而小→反照率增大。手册要点：气溶胶还可作为云凝结核或冰核，改变云滴数目、大小、反照率以及降水过程。","source":"上编 7-E03"},{"id":448,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"黑碳作用","q":"关于黑碳，下列说法正确的是（ ）。","options":["强烈吸收太阳辐射，沉积于冰雪表面会降低反照率","只散射不吸收，使气候必然变冷","对冰雪表面反照率不产生影响","只散射太阳辐射而不吸收，沉积在雪面会增加反照率"],"answer":0,"explain":"解析：手册7-E03：黑碳吸收，冰雪变暗；气溶胶净效应依条件，不能简单说只致冷。手册要点：黑碳沉积于冰雪会降低反照率并促进融化。","source":"上编 7-E03"},{"id":449,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"硫酸形成","q":"SO₂在云水中被H₂O₂氧化成硫酸盐属于（ ）。","options":["液相氧化途径","气相途径","光解反应","非氧化的物理溶解过程"],"answer":0,"explain":"解析：手册公式7-05：HSO₃⁻+H₂O₂→SO₄²⁻+H⁺+H₂O为水相途径；NO₂+OH+M→HNO₃+M为气相途径。反应发生在云滴的液态水中，HSO₃⁻被H₂O₂氧化为硫酸盐，属于液相氧化，不是气相途径、光解反应或单纯的物理溶解。","source":"上编 公式7-05"},{"id":450,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"硝酸形成","q":"NO₂在白天生成硝酸的主要气相反应是（ ）。","options":["NO+O₃→NO₂+O₂","NO₂+hν→NO+O","NO₂+NH₃→NH₄NO₃（气相）","NO₂+OH+M→HNO₃+M"],"answer":3,"explain":"解析：白天NO₂的主要去向是与OH自由基反应生成HNO₃，M为吸收多余能量的第三体。NO+O₃→NO₂+O₂和NO₂光解只是NOx之间的相互转化，不生成硝酸。NH₄NO₃是HNO₃与NH₃中和的产物，不是NO₂直接与氨反应生成的。","source":"上编 公式7-05"},{"id":451,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"酸雨前体物","q":"酸雨的主要前体物是（ ）。","options":["O₃和CH₄","SO₂和NOx","CO和CO₂","NH₃和Ca²⁺"],"answer":1,"explain":"解析：手册7-E04：SO₂与NOx氧化成硫酸和硝酸；NH₃、Ca²⁺等碱性物质起中和作用。手册要点：燃煤等排放SO₂，高温燃烧和交通排放NOx。","source":"上编 7-E04"},{"id":452,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"酸雨危害","q":"下列不属于酸雨危害的是（ ）。","options":["增强平流层臭氧层","腐蚀建筑物和材料","损伤植被","使湖泊、土壤酸化"],"answer":0,"explain":"解析：手册7-E04关键词：酸化、腐蚀；酸雨与臭氧层无增强关系。易错提醒：只写SO₂遇水生成酸雨而跳过氧化；把酸雨发生地当作唯一排放地。","source":"上编 7-E04"},{"id":453,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"石灰石石膏法","q":"湿法石灰石—石膏法脱硫的副产物是（ ）。","options":["亚硫酸钠（Na₂SO₃）溶液和硫磺","浓硫酸（H₂SO₄）","石膏（CaSO₄·2H₂O）","单质硫"],"answer":2,"explain":"解析：手册7-E05：湿法石灰石石膏为主流，副产石膏；另有干法、半干法。手册要点：湿法常用石灰石或石灰浆液吸收SO₂，再经氧化形成硫酸盐，如石膏，适用于较大烟气量和较高脱除要求。","source":"上编 7-E05"},{"id":454,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"脱硫分类","q":"烟气脱硫技术按工艺可分为（ ）。","options":["湿法、干法和半干法","高温法与低温法两类","物理法与生物法","燃烧前与燃烧后"],"answer":0,"explain":"解析：烟气脱硫按工艺状态分为湿法、干法和半干法三类。湿法用浆液吸收（如石灰石—石膏法），干法用干态吸收剂，半干法介于两者之间。“燃烧前与燃烧后”是按脱硫环节划分，不是按工艺划分。","source":"上编 7-E05、下编 E2-P05"},{"id":455,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"减排不同比下降","q":"大幅减排一次污染物后，某些污染物浓度不降反升的原因可能是（ ）。","options":["减排必然导致所有污染物升高","监测仪器失灵，或减排量统计口径计算有误，与二次生成的化学过程无关","浓度变化与气象条件无关，只取决于排放","二次生成非线性（如NO滴定减弱使O₃升高）和不利气象条件"],"answer":3,"explain":"解析：手册7-E06：一次与二次、气象输送、NO滴定、VOC/NOx受限都会使各污染物不同比下降，需协同控制。手册要点：在VOCs受限条件下，单独减少NOx可能因NO滴定减弱等使O₃暂时上升。","source":"上编 7-E06"},{"id":456,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"疫情减排案例","q":"某城市交通大幅减少后NO₂明显下降而O₃上升，最合理的解释是（ ）。","options":["交通减少使气温降低，O₃生成加快","NO减少使对O₃的滴定消耗减弱，且处于VOC控制区","城市中O₃的一次直接排放随交通减少而增加","NO₂直接转化为O₃后由汽车排出"],"answer":1,"explain":"解析：交通减排使NO大幅减少，对O₃的滴定消耗减弱，O₃因此回升。在VOC控制区，削减NOx反而可能使O₃生成增加，这是O₃对前体物的非线性响应。O₃是二次污染物，汽车并不直接排放O₃。","source":"上编 7-E06（2023卷考点）","tag":"2023卷考点"},{"id":457,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"AQI规则","q":"AQI与各项IAQI的关系是（ ）。","options":["AQI是各项浓度之和","AQI取各项IAQI的算术平均值","AQI只看PM2.5","AQI取各项IAQI的最大值"],"answer":3,"explain":"解析：AQI取各项污染物IAQI中的最大值，即由最差的一项决定空气质量等级。各污染物的单位和标准限值不同，浓度不能直接相加或平均，AQI也不是只看PM2.5。","source":"上编 公式7-12（书外应用）","tag":"书外应用"},{"id":458,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"首要污染物","q":"关于首要污染物，下列说法正确的是（ ）。","options":["AQI≤50时也必须报告首要污染物","是IAQI最大且AQI大于50时的污染物，不一定是浓度数值最大者","一定是浓度数值最大、且对健康危害最直接的那种污染物","始终是PM2.5，与其他污染物无关"],"answer":1,"explain":"解析：单元9：看IAQI而非原始浓度大小（不同污染物单位、标准不同）。不同污染物的浓度单位和标准限值不同，直接比较浓度没有意义，所以要按IAQI判断，AQI≤50时不报告首要污染物。","source":"上编 公式7-12（书外应用）","tag":"书外应用"},{"id":459,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"IAQI断点","q":"按HJ 633—2026，IAQI=100时PM2.5和PM10的24小时平均浓度限值分别为（ ）。","options":["60和120 μg/m³","35和70 μg/m³","115和250 μg/m³","75和150 μg/m³"],"answer":0,"explain":"解析：按HJ 633—2026，IAQI=100对应的PM2.5和PM10 24小时平均浓度限值分别为60和120 μg/m³。旧版标准为75和150 μg/m³，计算时不能混用新旧断点。旧版中115和250 μg/m³对应IAQI=150，也不是IAQI=100的限值。","source":"上编 公式7-12、拿分册模板6（书外应用）","tag":"书外应用"},{"id":460,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"SO2转化","q":"大气中SO₂转化为硫酸盐的途径包括（ ）。","options":["只能通过NH₃中和直接生成硫酸盐","气相OH氧化和云雾水中H₂O₂、O₃等液相氧化","只有通过干沉降到地面后，在土壤中氧化才能生成硫酸盐","只有SO₂直接光解一条途径"],"answer":1,"explain":"解析：O₃、H₂O₂等也参与氧化（手册公式7-05、7-P02）。气相反应在气体中进行，液相反应在云雾雨滴等液体内部进行，非均相反应涉及不同物相及其界面。","source":"上编 公式7-05、7-P02"},{"id":461,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"PAN","q":"光化学烟雾中具有强烈刺激性的二次污染物除O₃外还有（ ）。","options":["过氧乙酰硝酸酯（PAN）","一氧化碳（CO）","甲烷（CH₄）","二氧化硫（SO₂）"],"answer":0,"explain":"解析：手册7-P04：RO₂与NO₂反应生成PAN等有机硝酸酯分支。PAN由过氧乙酰自由基与NO₂结合生成，对眼睛和植物刺激性强，CO、CH₄、SO₂都是一次排放为主，不是光化学烟雾的特征产物。","source":"上编 7-P04、公式7-09"},{"id":462,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"pH与氢离子浓度","q":"降水pH=4.5，其氢离子浓度约为（ ）。","options":["3.16×10⁻⁴ mol/L","4.50×10⁻⁵ mol/L","3.16×10⁻⁵ mol/L","3.16×10⁻⁶ mol/L"],"answer":2,"explain":"解析：[H⁺]=10^(−pH)=10^(−4.5)≈3.16×10⁻⁵ mol/L。pH每降1，氢离子浓度增大10倍。","source":"上编 公式7-04、K7-04"},{"id":463,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"pH差与酸度倍数","q":"雨水A的pH=4.5，雨水B的pH=5.5，A的氢离子浓度约为B的（ ）。","options":["1 倍","2 倍","100 倍","10 倍"],"answer":3,"explain":"解析：[H⁺]_A/[H⁺]_B=10^(5.5−4.5)=10倍。pH是对数标度，不能用4.5与5.5的数值比较。","source":"上编 K7-04"},{"id":464,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"摩尔比换质量浓度","q":"700 hPa、250 K处O₃摩尔比60 ppb（M=48 g/mol），质量浓度约为（ ）。","options":["128.6 μg/m³","96993.0 μg/m³","97.0 μg/m³","117.8 μg/m³"],"answer":2,"explain":"解析：C=χpM/(R*T)=60×10⁻⁹×7.00×10⁴×0.048/(8.314×250)≈97.0 μg/m³。高空低压同摩尔比时质量浓度较小，不能套标准状态。","source":"上编 公式7-02、K7-01"},{"id":465,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"干沉降寿命","q":"混合层厚1000 m，干沉降速度0.625 cm/s，干沉降寿命τ=H/v_d约为（ ）。","options":["0.44 h","4.4 h","6.2 h","44.4 h"],"answer":3,"explain":"解析：τ=1000/0.00625=1.6×10⁵ s≈44.4 h。速度须由cm/s换为m/s。","source":"上编 公式7-03、K7-03"},{"id":466,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"干沉降通量","q":"颗粒物浓度32 μg/m³，干沉降速度0.625 cm/s，向下沉降通量约为（ ）。","options":["20.000 μg/(m²·s)","0.200 μg/(m²·s)","0.160 μg/(m²·s)","0.512 μg/(m²·s)"],"answer":1,"explain":"解析：F=v_dC=0.00625 m/s×32 μg/m³=0.200 μg/(m²·s)。手册要点：C为kg·m⁻³，向下沉降通量 F_d 为kg·m⁻²·s⁻¹。","source":"上编 公式7-03"},{"id":467,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"箱模型浓度衰减","q":"箱内初始浓度40 μg/m³，只有干沉降损失、寿命44.4 h，12 h后浓度约为（ ）。","options":["29.2 μg/m³","30.5 μg/m³","33.2 μg/m³","1.0 μg/m³"],"answer":1,"explain":"解析：C=C₀e^(−t/τ)=40×e^(−12/44.4)≈30.5 μg/m³。用半衰期公式时须把τ换成t½=τln2。","source":"上编 公式7-01、K7-03"},{"id":468,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"准稳态停留时间","q":"某气体大气总量1.0×10⁷ kg，排放与清除均为2.0×10⁶ kg/d，平均停留时间约为（ ）。","options":["0.2 d","10.0 d","2.0 d","5.0 d"],"answer":3,"explain":"解析：准稳态下τ=M/E=1.0×10⁷/2.0×10⁶=5.0 d。倒置得0.2 d量纲虽对但含义相反。","source":"上编 公式7-01、K7-02"},{"id":469,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"停止排放后的清除","q":"停留时间5.0 d、总量1.0×10⁷ kg的一阶损失气体，停止排放3 d后剩余约为（ ）。","options":["5.49×10⁶ kg","6.60×10⁶ kg","1.89×10⁶ kg","4.00×10⁶ kg"],"answer":0,"explain":"解析：M=M₀e^(−t/τ)=10⁷×e^(−0.6)≈5.488×10⁶ kg。半衰期为τln2≈3.47 d。","source":"上编 K7-02"},{"id":470,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"一阶损失半衰期","q":"一阶损失的平均寿命τ=5.0 d，其半衰期约为（ ）。","options":["5.00 d","2.50 d","3.47 d","7.21 d"],"answer":2,"explain":"解析：t½=τ·ln2=5.0×0.693≈3.47 d。半衰期短于平均寿命。","source":"上编 公式7-01"},{"id":471,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"IAQI分段插值(PM2.5)","q":"书外应用（HJ 633—2026口径）：PM2.5日均85 μg/m³，所在断点区间为60→IAQI 100、115→150，IAQI约为（ ）。","options":["123","113","122","85"],"answer":0,"explain":"解析：IAQI=I_L+(I_H−I_L)/(C_H−C_L)×(C−C_L)=100+50/55×25≈122.7，按规定向上进位取整为123。若沿用旧版75断点会得113；IAQI也不等于浓度值本身。","source":"上编 公式7-12、拿分册模板6（书外应用）","tag":"书外应用"},{"id":472,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"AQI取最大","q":"书外应用：某日各项IAQI为PM2.5 123、PM10 108、SO₂ 40、NO₂ 108，则AQI为（ ）。","options":["379","123","95","108"],"answer":1,"explain":"解析：AQI=max(IAQI_i)=123，首要污染物为PM2.5，属轻度污染（101–150）。AQI不是平均值，也不是求和。","source":"上编 公式7-12、拿分册模板6（书外应用）","tag":"书外应用"},{"id":473,"book":"大气","chapter":"第7章 大气化学和大气污染","kp":"ppm换mg/m³","q":"20.0℃、101325 Pa下SO₂体积分数0.12 ppm（M=64 g/mol），质量浓度约为（ ）。","options":["0.343 mg/m³","0.319 mg/m³","319.285 mg/m³","0.346 mg/m³"],"answer":1,"explain":"解析：C=x·pM/(RT)=0.12×10⁻⁶×101325×0.064/(8.314×293.15) kg/m³≈0.319 mg/m³。22.4 L/mol只适用于0℃标准状态。","source":"上编 公式7-02、拿分册模板7"},{"id":474,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声波性质","q":"空气中的声波属于（ ）。","options":["电磁波，可在真空中传播","横波，依靠空气的切变弹性传播","只能在真空中传播的波","纵波，依靠空气的可压缩性和惯性传播"],"answer":3,"explain":"解析：手册8-D01：声波是纵波，传播依赖可压缩性与惯性，声速取决于绝对温度。手册要点：声波是空气中可压缩性与惯性作用形成的纵向疏密扰动。","source":"上编 8-D01"},{"id":475,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声速决定因素","q":"干空气中声速主要取决于（ ）。","options":["气压","绝对温度","风向","湿度以外的成分无关因素"],"answer":1,"explain":"解析：手册公式8-02：c=√(γR_dT)，与绝对温度平方根成正比，与气压无直接关系（理想气体）。理想气体中c=√(γR_dT)，等温时气压与密度同比变化，作用相互抵消，所以声速只取决于绝对温度，风向只影响有效声速。","source":"上编 公式8-02"},{"id":476,"book":"大气","chapter":"第8章 大气中的声光电","kp":"有效声速","q":"有效声速c_eff≈c+U·ŝ表示（ ）。","options":["声速加上风速在传播方向上的分量","声速减去光速在传播方向上的分量之差","声速与温度之积","风速大小，与声速无关"],"answer":0,"explain":"解析：手册公式8-03：顺风传播有效声速增大，逆风减小。手册要点：U为风矢量m·s⁻¹，s帽为传播方向单位矢量， c_eff 用m·s⁻¹。","source":"上编 公式8-03、8-D01"},{"id":477,"book":"大气","chapter":"第8章 大气中的声光电","kp":"均匀风与声线","q":"均匀风场对声线传播的影响是（ ）。","options":["使声线向上弯曲，在下风方形成声影区","只使声波整体平移，不使声线弯曲","使声线向下弯曲，传得更远","使声音消失"],"answer":1,"explain":"解析：手册公式8-03易错：声线弯曲由有效声速的空间梯度决定，均匀风不使其弯曲。手册要点：均匀风只平移传播，不自动使声线弯曲。","source":"上编 公式8-03"},{"id":478,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声线折射规律","q":"声线在传播中总是向哪一侧弯曲（ ）。","options":["向有效声速较低的一侧","向上","向有效声速较高的一侧","向风来的方向"],"answer":0,"explain":"解析：手册8-P01：声线向低速侧弯曲。手册要点：在温度和风随高度变化的大气中，声速或有效声速随高度改变，声线一般向声速较小的一侧弯曲。","source":"上编 8-P01"},{"id":479,"book":"大气","chapter":"第8章 大气中的声光电","kp":"逆温可闻","q":"夜间逆温时远处声音听得更清楚，原因是（ ）。","options":["逆温层吸收噪声，使背景更安静","夜间气温低，声速比白天更快","夜间风更大","上层气温高声速大，声线向下弯曲回到地面"],"answer":3,"explain":"解析：手册8-P01：逆温使声速随高增，声线下弯，远处可闻。手册要点：逆温时高处声速较大，声线可向下弯曲，声音较容易传播到较远地面。","source":"上编 8-P01"},{"id":480,"book":"大气","chapter":"第8章 大气中的声光电","kp":"顺逆风可闻","q":"通常顺风方向比逆风方向声音传得远，原因是（ ）。","options":["顺风时声波频率升高，更易听到","顺风方向气温高，声速大","风速随高度增加，顺风时有效声速随高增、声线下弯","逆风时声速变为零，声波根本无法向上风方向传播出去"],"answer":2,"explain":"解析：手册8-P01：逆风方向声线上弯，可能形成声影区。手册要点：若风速随高度增加，顺风方向有效声速通常随高度增加而有利于下弯，逆风方向则可能上弯。","source":"上编 8-P01"},{"id":481,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声影区","q":"声影区是指（ ）。","options":["光线照不到、声音也减弱的区域","声线汇聚、声音最强的区域","雷暴云遮挡太阳形成的阴影区，声音因云层吸收而减弱","声线向上弯曲而地面附近接收不到直达声的区域"],"answer":3,"explain":"解析：手册8-P01关键词“声影”：白天地面加热或逆风时声线上弯形成。手册要点：正常温度递减时，高处声速较小，声线容易向上弯曲，地面远处可能出现声影。","source":"上编 8-P01"},{"id":482,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声衰减机制","q":"声音在大气中衰减的原因不包括（ ）。","options":["空气吸收耗散","湍流和粒子散射","几何扩散","声速随温度升高"],"answer":3,"explain":"解析：手册8-C01：几何扩散、吸收耗散、散射造成衰减；声速与温度关系不是衰减机制。声速随温度升高只会使声线折射弯曲，并不消耗声能，几何扩散、空气吸收和散射才是声音减弱的原因。","source":"上编 8-C01"},{"id":483,"book":"大气","chapter":"第8章 大气中的声光电","kp":"次声特点","q":"次声波的特点是（ ）。","options":["频率低于约20 Hz，吸收弱，可远距离传播","频率高于约20 kHz，衰减极快","频率越高越容易远距离传播","人耳可闻，频率在20 Hz至20 kHz之间"],"answer":0,"explain":"解析：手册8-C01：次声低频、吸收少，能远距离传播（如火山、核爆探测）。手册要点：次声频率低于人耳可闻范围，具有波长长、部分吸收较弱和可远距离传播等特点，可由火山、爆炸、海浪或强对流等过程产生，并用于大气探测。","source":"上编 8-C01"},{"id":484,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声强级系数","q":"声强级L_I=10lg(I/I₀)与声压级L_p=20lg(p/p₀)系数不同的原因是（ ）。","options":["声强与声压的平方成正比","声强单位是Pa","声压是能量量","二者定义完全无关"],"answer":0,"explain":"解析：手册公式8-01：I∝p²，10lg(p²)=20lg p。手册要点：声压用20lg，声强用10lg。","source":"上编 公式8-01"},{"id":485,"book":"大气","chapter":"第8章 大气中的声光电","kp":"参考声强","q":"声强级的参考声强I₀为（ ）。","options":["10⁻⁶ W/m²","2×10⁻⁵ W/m²","1 W/m²","10⁻¹² W/m²"],"answer":3,"explain":"解析：手册公式8-01：I_ref=10⁻¹² W/m²，p_ref=2×10⁻⁵ Pa。10⁻¹² W/m²约为人耳在1 kHz处的听阈声强，2×10⁻⁵ Pa是参考声压，单位是Pa而不是W/m²。","source":"上编 公式8-01"},{"id":486,"book":"大气","chapter":"第8章 大气中的声光电","kp":"dB叠加","q":"两个不相干的60 dB声源叠加，总声级约为（ ）。","options":["63 dB","120 dB","60 dB","66 dB"],"answer":0,"explain":"解析：能量相加：10lg(2×10⁶)≈63 dB，分贝不能直接相加（手册K8-01）。两个相同声源的声能相加是原来的2倍，声级增加10lg2≈3 dB，所以是63 dB，直接相加得120 dB是错误的。","source":"上编 K8-01"},{"id":487,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声遥感","q":"声雷达（声达）探测大气的原理是（ ）。","options":["接收大气分子对激光的光散射","接收雷电发出的电磁波信号","发射声脉冲，接收湍流温度、风场不均匀引起的后向散射回波","测量太阳辐射被大气吸收后引起的温度变化"],"answer":2,"explain":"解析：手册公式8-05：r=cΔt/2，多普勒频移测径向速度。声雷达发射声脉冲，接收湍流温度、风速不均匀造成的后向散射回波，用回波时间定距离，用多普勒频移测风，激光散射属于激光雷达。","source":"上编 公式8-05"},{"id":488,"book":"大气","chapter":"第8章 大气中的声光电","kp":"蓝天红日","q":"蓝天、红日和白云依次对应的主要散射机制是（ ）。","options":["米散射、瑞利散射、选择性吸收","选择性吸收、反射、折射","瑞利散射、长光程散射后的直射光、米散射","衍射、折射、反射"],"answer":2,"explain":"解析：手册8-C02：分子瑞利λ⁻⁴得蓝天；长光程直射光偏红；云滴米散射弱色选择呈白。手册要点：蓝天是散射光、红日是透射直射光的选择性削弱，解释时应明确观察的是哪一束光。","source":"上编 8-C02"},{"id":489,"book":"大气","chapter":"第8章 大气中的声光电","kp":"虹的成因","q":"虹是由于（ ）。","options":["阳光经卷层云中冰晶折射","微小云滴对阳光的衍射","空气分子对阳光的瑞利散射所造成的色散","阳光在雨滴中折射、内反射再折射造成色散"],"answer":3,"explain":"解析：手册8-C03：虹为水滴折射内反射；晕为冰晶折射；华为微粒衍射。手册要点：虹通常出现在背向太阳的雨幕中，由日光在水滴内两次折射和一次内反射形成，主虹内紫外红。","source":"上编 8-C03"},{"id":490,"book":"大气","chapter":"第8章 大气中的声光电","kp":"虹的位置","q":"观测者看到虹时，虹出现在（ ）。","options":["背向太阳的一侧","太阳周围的彩色圆环上","正头顶","太阳同一侧"],"answer":0,"explain":"解析：虹由背阳方向的雨幕产生，观测者背对太阳；晕和华环绕日月出现。手册要点：虹通常出现在背向太阳的雨幕中，由日光在水滴内两次折射和一次内反射形成，主虹内紫外红。","source":"上编 8-C03"},{"id":491,"book":"大气","chapter":"第8章 大气中的声光电","kp":"虹与霓","q":"霓（副虹）与主虹相比（ ）。","options":["位于主虹内侧，色序与主虹相同","位于主虹外侧，色序相反，由两次内反射形成","色序相同，由冰晶折射形成","由冰晶两次折射形成，位于主虹内侧"],"answer":1,"explain":"解析：手册8-C03：主虹一次内反射，外红内紫；霓两次内反射，色序相反、较暗。手册要点：虹通常出现在背向太阳的雨幕中，由日光在水滴内两次折射和一次内反射形成，主虹内紫外红。","source":"上编 8-C03"},{"id":492,"book":"大气","chapter":"第8章 大气中的声光电","kp":"晕的成因","q":"日晕、月晕是由于（ ）。","options":["光线经小水滴衍射形成","空气分子对阳光的瑞利散射所形成的彩色光环","光线在雨滴内反射形成","光线经卷层云中冰晶折射（或反射）形成"],"answer":3,"explain":"解析：日晕、月晕是光线经卷层云中六角柱状冰晶折射（有时伴有反射）形成的，最常见的是22°晕，常预示卷层云。小水滴衍射形成的是华，雨滴内折射加反射形成的是虹，分子瑞利散射则使天空呈蓝色。","source":"上编 8-C03"},{"id":493,"book":"大气","chapter":"第8章 大气中的声光电","kp":"华的成因","q":"华（日华、月华）是由于（ ）。","options":["光线经云中小水滴或冰晶的衍射形成","阳光在雨滴内两次折射、一次反射形成","瑞利散射","光线经卷层云冰晶折射形成"],"answer":0,"explain":"解析：手册8-C03：华为微粒衍射，紧贴日月、内紫外红的彩色光环。手册要点：华主要由微小云滴或冰晶的衍射形成，紧绕日月且尺度通常比晕小，常见内紫外红。","source":"上编 8-C03"},{"id":494,"book":"大气","chapter":"第8章 大气中的声光电","kp":"大气折射","q":"天体的视位置比真实位置偏高，是因为（ ）。","options":["大气吸收使天体光线偏向上方","大气折射率随高度减小，光线向下弯曲（蒙气差）","地球自转使天体视位置偏高","大气对光的散射使天体光线偏向上方"],"answer":1,"explain":"解析：手册8-P02、公式8-07：蒙气差使视天顶距变小，近地平最大。手册要点：气压、温度和湿度的不均匀分布使大气折射率发生变化，光线经过不同气层时改变方向。","source":"上编 8-P02、公式8-07"},{"id":495,"book":"大气","chapter":"第8章 大气中的声光电","kp":"上现蜃景","q":"海面上空出现的“上现蜃景”通常与（ ）。","options":["降雨使近地层折射率增大","大风使近地层空气充分混合","地表强烈加热（下暖上冷）","强逆温（下冷上暖）造成光线向下弯曲"],"answer":3,"explain":"解析：手册8-P02：强逆温形成上现蜃景；热地表上方形成下现蜃景（如沙漠“水面”）。手册要点：强逆温等条件可使光路向下弯曲，出现物像高于实际物体的上现蜃景。","source":"上编 8-P02"},{"id":496,"book":"大气","chapter":"第8章 大气中的声光电","kp":"下现蜃景","q":"夏季公路远处看似有“水面”，这属于（ ）。","options":["冰晶折射形成的晕","虹：阳光在近地层水汽中两次折射一次反射","下现蜃景：热地表使近地层折射率随高增大，光线向上弯曲","上现蜃景：逆温使光线向下弯曲"],"answer":2,"explain":"解析：手册8-P02：热地表下现蜃景，看到的是天空的倒像。手册要点：强热地表上方的异常密度梯度可使光路向上弯曲，出现物像低于物体的下现蜃景。","source":"上编 8-P02"},{"id":497,"book":"大气","chapter":"第8章 大气中的声光电","kp":"Snell定律","q":"Snell折射定律中角度θ的量取方式为（ ）。","options":["从界面法线量起","从水平线（地平线）量起","从界面量起","任意量取"],"answer":0,"explain":"解析：手册公式8-06：n₁sinθ₁=n₂sinθ₂，θ从法线量。手册要点：n、N均无量纲，θ从界面法线量。","source":"上编 公式8-06"},{"id":498,"book":"大气","chapter":"第8章 大气中的声光电","kp":"晴天电场方向","q":"晴天大气电场的方向通常是（ ）。","options":["没有电场，大气呈电中性","向下（地面带负电，大气带正电）","水平","向上（地面带正电，大气带负电）"],"answer":1,"explain":"解析：手册8-P03：晴天电场向下，近地约100 V/m量级，靠离子导电维持。手册要点：晴天近地面通常存在向下的电场，大气中由宇宙射线、地面放射性等产生的离子使空气具有微弱导电性。","source":"上编 8-P03"},{"id":499,"book":"大气","chapter":"第8章 大气中的声光电","kp":"全球大气电路","q":"全球大气电路的构成及其作用是（ ）。","options":["雷暴等发电、导电高层与地表及晴天区回流构成，维持晴天电场","由地面放射性电离构成，使晴天电场方向向上","由电离层单独构成，与雷暴和晴天电场均无关","只由一次次闪电放电构成，与晴天电场无关"],"answer":0,"explain":"解析：手册8-P04：全球大气电路由雷暴等发电过程、导电高层和地表以及晴天区回流共同构成，维持晴天电场。局地放电与全球电平衡应区分层次理解。","source":"上编 8-P04"},{"id":500,"book":"大气","chapter":"第8章 大气中的声光电","kp":"起电机制","q":"雷暴云中电荷分离的主要机制是（ ）。","options":["霰与冰晶在过冷水存在时碰撞起电，并靠气流和重力分离","地磁场使带电粒子在云中分离","空气摩擦生热使云滴带电","太阳风带来的带电粒子在云中聚集，并随地磁场作用而分离"],"answer":0,"explain":"解析：雷暴云中，冰晶、霰和过冷水滴之间的碰撞起电以及不同粒子的沉降、上升输送，使电荷分离并建立强电场（手册8-P03关键词“碰撞起电；粒子输送”）。实际结构会变化，电荷分离是微物理与动力输送耦合的结果，不能解释为一切云必有完全相同的简单双极结构。","source":"上编 8-P03"},{"id":501,"book":"大气","chapter":"第8章 大气中的声光电","kp":"大气电导","q":"大气导电的主要载体是（ ）。","options":["云中自由电子的金属式导电过程所致","宇宙线和放射性产生的正负离子","悬浮尘埃与水滴","云中悬浮的水滴和雨滴"],"answer":1,"explain":"解析：手册公式8-11：σ=e(n₊μ₊+n₋μ₋)，j=σE只指传导电流。在没有云和降水时，空气中的正负小离子由宇宙线和地壳放射性电离产生，在电场中迁移形成传导电流，尘埃和水滴反而会吸附离子、降低电导率。","source":"上编 公式8-11"},{"id":502,"book":"大气","chapter":"第8章 大气中的声光电","kp":"雷声成因","q":"雷声的成因是（ ）。","options":["大雨滴撞击地面发出的声音","冰雹在云中破裂、相互撞击发出的声音","云块之间相互碰撞发出的声音","闪电通道被急剧加热、空气爆炸式膨胀产生冲击波"],"answer":3,"explain":"解析：手册8-P04：通道加热膨胀产生雷声。手册要点：电流使通道迅速加热，空气急剧膨胀产生冲击波并向外传播，形成雷声。","source":"上编 8-P04"},{"id":503,"book":"大气","chapter":"第8章 大气中的声光电","kp":"先导回击","q":"云地闪电的主要过程是（ ）。","options":["梯级先导向下发展，接地后产生强烈回击","从地面向上缓慢放电，无回击","回击先于先导，向下发展","只有云内放电"],"answer":0,"explain":"解析：云地闪电一般包含先导发展和回击等阶段（手册8-P04关键词“先导回击”）。云地闪电先有梯级先导逐级向下推进，接近地面后与上行连接，随即沿已电离的通道产生强烈回击，回击发生在先导之后。","source":"上编 8-P04"},{"id":504,"book":"大气","chapter":"第8章 大气中的声光电","kp":"全球大气电路","q":"全球大气电路中，维持晴天地面负电荷的“发电机”是（ ）。","options":["全球雷暴活动","地球的自转运动","太阳辐射","海洋潮汐"],"answer":0,"explain":"解析：手册8-P04：雷暴向地面输送负电荷，晴天区漏电流返回，构成全球电路。手册要点：全球大气电路由雷暴等发电过程、导电高层和地表以及晴天区回流共同构成，维持晴天电场。","source":"上编 8-P04"},{"id":505,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声光时差","q":"“先见闪电后闻雷声”的原因是（ ）。","options":["声波被云吸收","光走的路径更短","光速远大于声速","雷声先于闪电产生"],"answer":2,"explain":"解析：手册公式8-S01：r≈c_sΔt，光传播时间可忽略。光速约3×10⁸ m/s，声速约340 m/s，闪电的光几乎瞬间到达，雷声却要走约3 s/km，雷声与闪电是同时产生的。","source":"上编 公式8-S01"},{"id":506,"book":"大气","chapter":"第8章 大气中的声光电","kp":"电场符号","q":"手册中E↓≡−E_z（向下为正）的约定意味着晴天典型电场E↓（ ）。","options":["为负值","随机变号","为正值","为零"],"answer":2,"explain":"解析：手册公式8-09：晴天电场向下，E_z为负，E↓为正。手册要点：E_z 是带号分量，E↓是向下为正的标量。","source":"上编 公式8-09"},{"id":507,"book":"大气","chapter":"第8章 大气中的声光电","kp":"分段电场连续","q":"手册强调晴天电场分段经验式在z_b=10 km处须连续，目的在于（ ）。","options":["使电场方向在10 km处反转","保证两段函数在交界处电场值相等，避免出现物理上不合理的跳变","与物理无关，只为方便代入计算和统一单位，因而交界处允许出现跳变","使电场在10 km处恰好为零"],"answer":1,"explain":"解析：手册公式8-10：上段以E↓(z_b)为起点，确保连续。两段经验式若在10 km处取值不同，电场会出现无物理意义的突变，所以上段要以下段在z_b处的值为起点，保证连续。","source":"上编 公式8-10"},{"id":508,"book":"大气","chapter":"第8章 大气中的声光电","kp":"光速与声速","q":"在声光时差测距中可忽略光传播时间，是因为（ ）。","options":["闪电本身没有光，只有声音","光速约3×10⁸ m/s，比声速大约百万倍","光速与声速相近，可相互抵消","声速比光速更快，声音先到达观测者"],"answer":1,"explain":"解析：手册公式8-S01：r=Δt/(1/c_s−1/c_ℓ)≈c_sΔt。光在几公里内传播只需约10⁻⁵ s，与数秒的声音传播时间相比可以忽略，所以距离近似等于声速乘以时差。","source":"上编 公式8-S01"},{"id":509,"book":"大气","chapter":"第8章 大气中的声光电","kp":"蒙气差变化","q":"蒙气差在天体位置靠近地平线时（ ）。","options":["最小","为零","最大","与天顶距无关"],"answer":2,"explain":"解析：手册公式8-07：δ≈(n₀−1)tanZ，Z越大越大；近地平需更完整模型。大气折射使天体看起来比实际位置高，天顶距越大，光路穿过的大气越长，弯折越多，所以在地平线附近最大，天顶处为零。","source":"上编 公式8-07"},{"id":510,"book":"大气","chapter":"第8章 大气中的声光电","kp":"闪电类型","q":"闪电按发生部位可分为（ ）。","options":["球状闪电、带状闪电和片状闪电","正闪电和负闪电","白天和夜间","云内闪电、云间闪电和云地闪电"],"answer":3,"explain":"解析：云内、云间或云地之间电场足够强时可发生放电（手册8-P04：放电类型）。云地闪电一般包含先导发展和回击等阶段。","source":"上编 8-P04"},{"id":511,"book":"大气","chapter":"第8章 大气中的声光电","kp":"大气导电原因","q":"晴天大气具有微弱导电性，主要因为（ ）。","options":["宇宙射线和地面放射性等电离产生离子","闪电持续不断","水汽凝结时释放电荷，使空气带电而导电","空气中含大量自由电子金属"],"answer":0,"explain":"解析：手册8-P03：离子由宇宙射线、地面放射性等产生，电导率受离子浓度影响。手册要点：晴天近地面通常存在向下的电场，大气中由宇宙射线、地面放射性等产生的离子使空气具有微弱导电性。","source":"上编 8-P03"},{"id":512,"book":"大气","chapter":"第8章 大气中的声光电","kp":"雷声成因","q":"雷声产生的直接原因是（ ）。","options":["闪电电流使通道迅速加热，空气急剧膨胀产生冲击波","云滴相互碰撞发出的声音","气压缓慢变化所引起的低频振动，与闪电通道加热无关","冰雹落地撞击发出的声音"],"answer":0,"explain":"解析：手册8-P04：通道加热膨胀产生冲击波并向外传播，衰减后成为雷声。回击电流使通道在微秒内升温到约3万K，空气急剧膨胀形成冲击波，传播中衰减成雷声，并非云滴或冰雹碰撞的声音。","source":"上编 8-P04"},{"id":513,"book":"大气","chapter":"第8章 大气中的声光电","kp":"云地闪电阶段","q":"云地闪电一般包含的阶段是（ ）。","options":["只有回击","只有先导","先导发展和回击","蒸发、凝结和冻结"],"answer":2,"explain":"解析：手册8-P04：云地闪电一般包含先导发展和回击等阶段。梯级先导建立电离通道后，回击沿通道向上传播，产生强电流和主要光亮，蒸发、凝结、冻结是相变过程，不是闪电的阶段。","source":"上编 8-P04"},{"id":514,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声速与温度","q":"干空气20℃时声速c≈20.05√T约为（ ）。","options":["355.8 m/s","331.4 m/s","343.3 m/s","89.7 m/s"],"answer":2,"explain":"解析：c=20.05×√293.15≈343.3 m/s，也可用331.4+0.61t≈343.6 m/s。声速取决于绝对温度，331.4是0℃时的值。","source":"上编 公式8-02"},{"id":515,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声速线性近似","q":"气温−10℃时，用c≈331.4+0.61t估算声速约为（ ）。","options":["63.4 m/s","337.5 m/s","325.3 m/s","331.4 m/s"],"answer":2,"explain":"解析：c≈331.4+0.61×(−10)=325.3 m/s。气温越低声速越小，这是逆温时声线向下弯曲的基础。","source":"上编 公式8-02"},{"id":516,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声光时差测距","q":"看到闪电后4.0 s听到雷声，声速343.6 m/s，雷击点单程距离约为（ ）。","options":["1320.0 m","687.2 m","1374.4 m","2748.8 m"],"answer":2,"explain":"解析：r≈c_sΔt=343.6×4.0≈1374.4 m（光传播时间可忽略）。单程不必除以2；除以2是声雷达往返测距的做法。","source":"上编 公式8-S01、K8-02"},{"id":517,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声雷达往返测距","q":"声雷达发射脉冲后0.40 s收到回波，声速340 m/s，散射体距离约为（ ）。","options":["136 m","68 m","850 m","34 m"],"answer":1,"explain":"解析：收发合置r=cΔt/2=340×0.40/2=68 m。不除以2会把往返路程当单程。","source":"上编 公式8-05"},{"id":518,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声强级叠加","q":"两个不相干声源单独作用分别为63.0 dB和64.8 dB，合成声级约为（ ）。","options":["63.9 dB","67.0 dB","64.8 dB","127.8 dB"],"answer":1,"explain":"解析：L=10lg(10^6.3+10^6.48)≈67.0 dB。分贝不能直接相加；两等级相同则合成只增加3 dB。","source":"上编 公式8-01、K8-01"},{"id":519,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声强级定义","q":"声强1.0×10⁻⁵ W/m²，参考声强10⁻¹² W/m²，声强级约为（ ）。","options":["7 dB","140 dB","35 dB","70 dB"],"answer":3,"explain":"解析：L_I=10lg(I/I₀)=10×7=70 dB。声强级系数是10；用20是声压级的写法。","source":"上编 公式8-01"},{"id":520,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声压级定义","q":"有效声压0.20 Pa，参考声压2×10⁻⁵ Pa，声压级约为（ ）。","options":["64 dB","40 dB","80 dB","86 dB"],"answer":2,"explain":"解析：L_p=20lg(p/p₀)=20lg(10⁴)=80 dB。声压与声强平方相关，故系数为20。","source":"上编 公式8-01"},{"id":521,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声吸收dB衰减","q":"振幅衰减系数α=1.0×10⁻³ m⁻¹，传播500 m的强度级损失约为（ ）。","options":["0.50 dB","2.17 dB","4.34 dB","1.00 dB"],"answer":2,"explain":"解析：ΔL=8.686αr=8.686×10⁻³×500≈4.34 dB。强度∝e^(−2αr)，故系数为8.686而非4.343。","source":"上编 公式8-04"},{"id":522,"book":"大气","chapter":"第8章 大气中的声光电","kp":"声雷达多普勒频移","q":"声雷达发射1000 Hz，散射体以5 m/s远离（v_r为正），多普勒频移Δf≈−2f₀v_r/c（c=340 m/s）约为（ ）。","options":["-29.4 Hz","-30.2 Hz","-14.7 Hz","29.4 Hz"],"answer":0,"explain":"解析：Δf≈−2×1000×5/340≈-29.4 Hz，远离时接收频率降低。后向散射为双程，故有因子2。","source":"上编 公式8-05"},{"id":523,"book":"大气","chapter":"第8章 大气中的声光电","kp":"折射率N单位","q":"近地空气折射率n=1.00030，折射率N=(n−1)×10⁶为（ ）。","options":["300 N单位","0.3 N单位","0.03 N单位","30 N单位"],"answer":0,"explain":"解析：N=(1.00030−1)×10⁶=300。空气折射率极接近1，用N单位便于表示其微小变化。","source":"上编 公式8-06"},{"id":524,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"天气图种类","q":"地面天气图与高空天气图上分析的主要要素分别是（ ）。","options":["降水分布与能见度","海平面气压（等压线）与等压面位势高度（等高线）","风向与总云量","地面温度与湿度、高空温度与湿度的分布"],"answer":1,"explain":"解析：手册9-D01：地面图分析海平面气压，高空图为等压面图，分析位势高度；需结合三维配置。易错提醒：把高空等压面图上的等高线称为等压线；把天气简单等同于是否下雨。","source":"上编 9-D01"},{"id":525,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"天气图同时性","q":"天气图的基本特点是（ ）。","options":["数值预报模式输出的预报结果","单张卫星云图照片","同一时刻多站观测资料的综合","单站长期记录"],"answer":2,"explain":"解析：天气图把同一时刻不同地点的观测按统一规范绘于地图（手册9-D01关键词“同一时刻”）。易错提醒：把高空等压面图上的等高线称为等压线；把天气简单等同于是否下雨。","source":"上编 9-D01"},{"id":526,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"高空等高线与风","q":"高空等压面图上地转风与等高线的关系是（ ）。","options":["与等高线无关，由温度场决定","沿等高线吹，北半球高值在左","沿等高线吹，北半球高值在右，等高线越密风越大","垂直于等高线，由高值区吹向低值区"],"answer":2,"explain":"解析：手册公式9-01：V_g=(g₀/f)k×∇_pZ，与地面等压线规律一致。等压面上地转风平行等高线，北半球背风而立，高值在右、低值在左，等高线越密风越大，并非垂直于等高线吹。","source":"上编 公式9-01"},{"id":527,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"气团定义","q":"气团是指（ ）。","options":["水平方向上温度、湿度等物理属性较均匀的大范围空气","任何一团正在运动的空气","锋面附近性质差异很大的过渡带空气","对流云中上升的空气块"],"answer":0,"explain":"解析：手册9-D02：气团水平均匀，水平范围数百至数千公里的三维空气体。手册要点：气团是水平方向温度、湿度等性质较均匀、具有一定三维范围的大块空气，通常在性质较均一的下垫面上经较长时间停留形成。","source":"上编 9-D02"},{"id":528,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"气团形成条件","q":"气团形成需要的条件是（ ）。","options":["大范围性质均匀的下垫面和空气长时间停留（稳定环流）","空气快速移动、连续经过多种不同性质的下垫面","复杂地形和强烈的锋生作用","强烈的锋生和气旋活动"],"answer":0,"explain":"解析：手册9-D02：均一下垫面、足够停留时间。手册要点：气团是水平方向温度、湿度等性质较均匀、具有一定三维范围的大块空气，通常在性质较均一的下垫面上经较长时间停留形成。","source":"上编 9-D02"},{"id":529,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"气团变性","q":"气团变性是指（ ）。","options":["两个气团相遇形成锋面","气团
