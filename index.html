在源地逐渐形成的过程","气团离开源地移到新下垫面后，性质逐渐改变","气团突然消失或被锋面截断的过程"],"answer":2,"explain":"解析：手册9-D02关键词“变性”。如冷气团南下变暖变湿。","source":"上编 9-D02"},{"id":530,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"冷暖气团","q":"按热力分类，冷气团是指（ ）。","options":["湿度小、温度低于0℃的气团","气团温度低于所经下垫面温度的气团","温度低于0℃的气团（与下垫面无关）","来自极地方向的任何气团"],"answer":1,"explain":"解析：天气补充笔记：按温度和湿度分类，冷气团低于下垫面温度，移动中下部受热、趋于不稳定。手册要点：气团是水平方向温度、湿度等性质较均匀、具有一定三维范围的大块空气，通常在性质较均一的下垫面上经较长时间停留形成。","source":"上编 9-D02（南赫天气补充互证）"},{"id":531,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"锋的定义","q":"锋是指（ ）。","options":["气团内部温度最均匀的中心区域","等温线最稀疏处","气压最低的线","冷暖气团之间狭窄的过渡带"],"answer":3,"explain":"解析：手册9-C01：锋为不同气团间的过渡区，温度、湿度等要素变化剧烈。手册要点：锋是性质不同气团之间的过渡带，锋面通常向冷空气一侧倾斜。","source":"上编 9-C01、单元10"},{"id":532,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"锋面倾斜","q":"锋面在空间上的倾斜方向是（ ）。","options":["水平铺展，暖空气在下","向冷空气一侧倾斜，暖空气在上","垂直于地面","向暖空气一侧倾斜，冷空气在上"],"answer":1,"explain":"解析：手册9-C01：冷空气密度大位于下方，锋面向冷侧倾斜。手册要点：锋是性质不同气团之间的过渡带，锋面通常向冷空气一侧倾斜。","source":"上编 9-C01"},{"id":533,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"冷锋定义","q":"按锋面移动方向分类，下列关于冷锋的描述正确的是（ ）。","options":["暖气团主动推进、冷气团被迫后退的那类锋","冷锋追上暖锋形成的锋","冷气团主动推进、暖气团被迫后退的锋","冷暖气团势均力敌、少动的锋"],"answer":2,"explain":"解析：手册9-C01：按主动推进方向区分冷、暖锋。手册要点：冷锋由冷气团主动向暖气团推进，暖锋由暖气团主动向冷气团推进，两者都会使暖空气抬升冷却。","source":"上编 9-C01"},{"id":534,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"暖锋云雨","q":"暖锋的云雨主要出现在（ ）。","options":["锋后狭窄地带，多为阵性降水","锋面正上方很窄区域","锋前，范围宽、多为连续性降水","暖锋无降水"],"answer":2,"explain":"解析：手册9-C01、公式9-03：暖锋坡度小（约1/150），云雨在锋前。手册要点：典型暖锋坡度较缓，稳定湿暖空气滑升，广阔层状云和连续性降水多在地面锋线前。","source":"上编 9-C01、公式9-03"},{"id":535,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"缓行冷锋","q":"缓行冷锋（第一型冷锋）的降水主要位于（ ）。","options":["无降水","锋前很远处","锋后","锋面两侧对称"],"answer":2,"explain":"解析：手册公式9-03：缓行冷锋多在锋后；急行冷锋常为锋前窄带强对流。手册要点：暖锋云雨常在锋前，缓行冷锋多在锋后。","source":"上编 公式9-03"},{"id":536,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"急行冷锋","q":"急行冷锋（第二型冷锋）的天气特点是（ ）。","options":["锋前或锋线附近出现窄带雷暴、大风等强对流天气","锋后大范围连续性降水","锋面过境前后天气无明显变化，风向也不转变","锋前大范围层状云和毛毛雨"],"answer":0,"explain":"解析：手册公式9-03：急行冷锋坡度大，暖空气被迫急剧抬升形成强对流。手册要点：急行冷锋常为窄带强对流。","source":"上编 公式9-03"},{"id":537,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"锋面坡度","q":"暖锋与缓行冷锋的典型坡度分别约为（ ）。","options":["1/150与1/100","1/10与1/50","1与1/2","1/1000与1/10"],"answer":0,"explain":"解析：手册公式9-03：暖锋约1/150、缓行冷锋约1/100，仅为典型值。手册要点：暖锋云雨常在锋前，缓行冷锋多在锋后。","source":"上编 公式9-03"},{"id":538,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"冷锋过境天气","q":"冷锋过境后的典型天气变化是（ ）。","options":["气温上升、气压下降","湿度增加、持续阴雨","气温上升、风力减弱、湿度增加","气温下降、气压上升、天气转晴"],"answer":3,"explain":"解析：冷锋过境后冷气团控制，降温升压转晴（9-C01冷锋性质）。冷锋过境后由冷气团控制，气温下降、气压上升，湿度减小，云消天晴，暖锋过境后才出现升温和湿度增加。","source":"上编 9-C01"},{"id":539,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"准静止锋","q":"准静止锋的特点是（ ）。","options":["只出现在冬季海上","冷暖气团势力相当，锋面少动或来回摆动，形成持续性阴雨","移动很快，降水时间很短","一定伴随强烈雷暴和冰雹，持续时间很短，移动迅速"],"answer":1,"explain":"解析：手册9-C02：少动摆动，持续抬升，如江淮梅雨锋、昆明准静止锋。手册要点：准静止锋是冷暖气团势力相当或受地形等影响而移动缓慢、来回摆动的锋。","source":"上编 9-C02"},{"id":540,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"锢囚锋","q":"锢囚锋是（ ）。","options":["冷锋与暖锋平行排列、互不相遇的锋","暖锋追上冷锋，冷空气被迫抬离地面后形成的锋","两个冷锋相遇合并形成的锋","冷锋追上暖锋，暖空气被抬离地面形成的锋"],"answer":3,"explain":"解析：手册9-C02：冷锋移速快于暖锋，追上后暖空气离地，由相对冷暖决定锢囚类型。手册要点：锢囚锋通常由移动较快的冷锋追上暖锋，使暖气团脱离地面而形成。","source":"上编 9-C02"},{"id":541,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"梅雨与副高","q":"副高脊线位于20°—25°N时，我国东部主要雨带对应（ ）。","options":["华北雨季","西北干旱","华南前汛期","江淮梅雨"],"answer":3,"explain":"解析：天气补充笔记：脊线<20°N对应华南前汛期；20°—25°N对应江淮梅雨；25°—30°N黄淮雨季；越过30°N华北雨季。手册要点：副高的强弱、脊线位置、西伸北跳或南退影响我国夏季雨带位置、持续时间以及旱涝分布。","source":"上编 9-E01（南赫天气补充互证）"},{"id":542,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"副高北跳","q":"西太平洋副高一年中到达最北位置的时间约为（ ）。","options":["6月中旬前后","5月初前后","7月底至8月初","10月中旬前后"],"answer":2,"explain":"解析：天气补充笔记：7月中旬脊线再次北跳越过25°N，7月底或8月初到达最北，9月以后南撤。手册要点：西太平洋副热带高压是深厚的暖性高压系统，其主体下沉运动强，常伴晴热少雨。","source":"上编 9-E01（南赫天气补充互证）"},{"id":543,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"副高性质","q":"西太平洋副热带高压的主要性质是（ ）。","options":["暖性深厚高压，主体盛行下沉气流","冷性浅薄高压，主体上升","主体盛行上升气流的暖低压","低压系统"],"answer":0,"explain":"解析：手册9-E01：主体下沉晴热，边缘水汽输送形成雨带，并引导台风。手册要点：西太平洋副热带高压是深厚的暖性高压系统，其主体下沉运动强，常伴晴热少雨。","source":"上编 9-E01"},{"id":544,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"副高控制天气","q":"长时间受副高主体控制的地区，夏季易出现（ ）。","options":["晴热少雨甚至伏旱","持续暴雨并引发洪涝","大雾和低温","寒潮"],"answer":0,"explain":"解析：手册9-E01：主体下沉增温，晴热少雨；雨带在副高北侧边缘。手册要点：西太平洋副热带高压是深厚的暖性高压系统，其主体下沉运动强，常伴晴热少雨。","source":"上编 9-E01"},{"id":545,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"副高与台风","q":"副高对台风路径的作用是（ ）。","options":["与台风路径无关","阻止所有台风生成","其南侧和西侧外围气流引导台风西行或转向北上","其北侧外围偏东气流使台风停止移动并原地消亡"],"answer":2,"explain":"解析：手册9-E01、9-E02：台风沿副高外围移动，副高进退影响西行或转向。手册要点：副高还通过外围引导气流影响台风路径。","source":"上编 9-E01、9-E02"},{"id":546,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"气旋定义","q":"气旋是指（ ）。","options":["中心气压高于四周的涡旋","只在热带出现的系统","地面辐散的系统","中心气压低于四周的大型水平涡旋"],"answer":3,"explain":"解析：手册9-C03：气旋为低压涡旋，北半球逆时针，低层辐合上升。手册要点：气旋是中心气压低于四周的水平涡旋，反气旋则相反。","source":"上编 9-C03"},{"id":547,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"反气旋近地面","q":"北半球反气旋近地面气流（ ）。","options":["顺时针向外辐散，中心下沉","逆时针向中心辐合，中心上升","只向上运动","无水平运动，只有下沉"],"answer":0,"explain":"解析：手册9-C03、单元10：反气旋高压涡旋，顺时针辐散下沉，天气多晴好。手册要点：近地面摩擦使气旋气流辐合、反气旋气流辐散，常分别联系上升云雨和下沉晴好。","source":"上编 9-C03"},{"id":548,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"反气旋例外","q":"反气旋控制通常天气晴好，但其例外情况是（ ）。","options":["一定有锋面过境","一定出现冰雹","高压中心强烈上升运动，常伴随暴雨和冰雹","下沉逆温和静稳使近地面雾、霾积累"],"answer":3,"explain":"解析：近地面摩擦使气旋气流辐合、反气旋气流辐散，常分别联系上升云雨和下沉晴好（手册9-C03关键词“雾霾例外”）。天气并非绝对：反气旋中心静稳和逆温可造成雾霾，边缘也可能有云雨。","source":"上编 9-C03"},{"id":549,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"寒潮","q":"影响我国的寒潮主要是由（ ）。","options":["热带辐合带北移带来冷空气","副高西伸北跳","强冷高压（冷性反气旋）南下爆发造成大范围剧烈降温","台风登陆后带来的强冷空气使大范围降温"],"answer":2,"explain":"解析：手册9-C03：寒潮与冷高压相关，伴降温、大风、霜冻等。手册要点：温带冷高压可推动冷空气南下，强烈过程引起大范围剧烈降温、大风及相关灾害，形成寒潮。","source":"上编 9-C03"},{"id":550,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"寒潮源地","q":"影响我国寒潮的冷空气主要来源于（ ）。","options":["青藏高原南侧","西伯利亚、蒙古一带的冷高压","西太平洋洋面","印度洋上空的冷性低压"],"answer":1,"explain":"解析：天气补充笔记：西伯利亚气团冬季活跃，冷高压南下造成气温剧降。手册要点：温带冷高压可推动冷空气南下，强烈过程引起大范围剧烈降温、大风及相关灾害，形成寒潮。","source":"上编 9-C03（南赫天气补充互证）"},{"id":551,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"温带气旋生命史","q":"温带锋面气旋的生命史依次为（ ）。","options":["锢囚、发展、初生、消亡","初生（波动）、发展、锢囚、消亡","形成、成熟、消散、再生","发展、初生、消亡、锢囚"],"answer":1,"explain":"解析：手册9-P01与天气补充笔记：初生（波动）、发展（成熟）、锢囚和消亡四个阶段。手册要点：典型温带锋面气旋可由锋面波动发展：初生时锋线发生波动，暖空气向极侧伸展、冷空气向赤侧推进，形成低压和冷暖锋。","source":"上编 9-P01"},{"id":552,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"气旋锢囚后","q":"温带气旋锢囚后的演变是（ ）。","options":["暖空气被抬离地面，气旋逐渐变为冷涡并填塞消亡","转变为反气旋并持续加强","迅速加强为台风","暖空气重新回到地面，气旋转为暖性系统并再次加强"],"answer":0,"explain":"解析：天气补充笔记：锢囚后气旋转变为对流层下部大冷涡，暖空气能源被切断而逐渐消亡。手册要点：由于冷锋通常移速较快，逐渐追上暖锋，暖区被抬离地面并形成锢囚锋。","source":"上编 9-P01（南赫天气补充互证）"},{"id":553,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"斜压性","q":"温带气旋发展的能量主要来自（ ）。","options":["太阳辐射直接加热","斜压不稳定（水平温度梯度中有效位能的释放）","暖海面上的潜热释放（与台风的能量来源完全相同）","地形强迫抬升"],"answer":1,"explain":"解析：手册9-P01关键词“斜压”；台风则主要依靠潜热的暖心机制。手册要点：温带气旋多有显著水平温度差和锋面，不能把其发展过程套用于所有暖心热带气旋。","source":"上编 9-P01"},{"id":554,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风定义","q":"台风属于（ ）。","options":["锋面气旋","冷心温带气旋","暖心热带气旋","反气旋"],"answer":2,"explain":"解析：手册9-P02：台风为暖心热带气旋，无锋面。手册要点：台风属于暖心热带气旋，通常需暖而深的海水提供热量水分、低层初始扰动与辐合、充足水汽、较弱垂直风切变和足够的科里奥利作用，赤道附近因科氏作用弱而不易生成。","source":"上编 9-P02"},{"id":555,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风生成海温","q":"热带气旋生成通常要求海面温度高于（ ）。","options":["26.5℃","20℃","15℃","30℃以上方可"],"answer":0,"explain":"解析：天气补充笔记：需广阔暖性洋面，海水温度高于26.5℃。手册要点：台风属于暖心热带气旋，通常需暖而深的海水提供热量水分、低层初始扰动与辐合、充足水汽、较弱垂直风切变和足够的科里奥利作用，赤道附近因科氏作用弱而不易生成。","source":"上编 9-P02（南赫天气补充互证）"},{"id":556,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风生成条件","q":"下列不是台风生成必要条件的是（ ）。","options":["暖而深的海水","低层初始扰动","一定的科氏作用（离开赤道）","强烈的垂直风切变"],"answer":3,"explain":"解析：手册9-P02：需弱垂直风切变，强切变破坏暖心结构。手册要点：台风属于暖心热带气旋，通常需暖而深的海水提供热量水分、低层初始扰动与辐合、充足水汽、较弱垂直风切变和足够的科里奥利作用，赤道附近因科氏作用弱而不易生成。","source":"上编 9-P02"},{"id":557,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"赤道无台风","q":"台风很少在赤道附近（约5°以内）生成，原因是（ ）。","options":["科氏力太弱，难以形成气旋性环流","赤道海温太低，能量不足","风切变太弱，无法组织","水汽不足"],"answer":0,"explain":"解析：手册9-P02：赤道附近科氏作用弱不易生成。手册要点：台风属于暖心热带气旋，通常需暖而深的海水提供热量水分、低层初始扰动与辐合、充足水汽、较弱垂直风切变和足够的科里奥利作用，赤道附近因科氏作用弱而不易生成。","source":"上编 9-P02"},{"id":558,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风眼","q":"台风眼区的天气特征是（ ）。","options":["有强烈上升运动，云墙最厚","风雨最强，气压梯度最大","风小、多下沉气流，天气相对晴好","气压最高"],"answer":2,"explain":"解析：手册9-P02易错：说台风眼是风雨最强区是错误的；最强风雨在眼墙。眼区是台风中心的下沉区，空气下沉增温，云消风弱，常见晴空，最强上升运动、最大风和最强降水都在眼墙。","source":"上编 9-P02、单元10"},{"id":559,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"眼墙","q":"台风中风雨最强的区域是（ ）。","options":["台风中心以外500 km","眼墙（云墙）","外围螺旋雨带之外","台风眼"],"answer":1,"explain":"解析：手册9-P02：眼墙强烈上升，出现最大风和强降水。眼墙中有强烈上升运动，并有最大风速和最强降水，台风眼内下沉微风，外围螺旋雨带以外风雨明显减弱。","source":"上编 9-P02"},{"id":560,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风结构","q":"成熟台风的垂直环流结构是（ ）。","options":["眼区强烈上升、眼壁区下沉","全层下沉，低层辐散、高层辐合","只有水平运动","低层向内辐合、高层向外辐散"],"answer":3,"explain":"解析：手册9-P02：低层气旋式辐合、高层反气旋式辐散，眼墙上升、眼区下沉。手册要点：成熟台风低层向内辐合、高层向外辐散，眼墙强烈上升并出现最大风和强降水。","source":"上编 9-P02"},{"id":561,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风能量","q":"维持台风强度的主要能量来源是（ ）。","options":["斜压有效位能","水汽凝结释放的潜热","地形","太阳辐射直接加热空气"],"answer":1,"explain":"解析：手册9-P02：凝结潜热与环流相互促进，形成暖心。台风从暖洋面获得水汽，在眼墙上升凝结释放潜热，形成暖心并维持低压，斜压有效位能是温带气旋的能源。","source":"上编 9-P02"},{"id":562,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风灾害","q":"台风的主要灾害不包括（ ）。","options":["风暴潮增水","寒潮降温","暴雨","大风"],"answer":1,"explain":"解析：手册9-P02：灾害有大风、暴雨、风暴潮及次生灾害；登陆后风减弱仍可致强降水。易错提醒：说台风眼是风雨最强区；说海面温度高就足以生成台风。","source":"上编 9-P02"},{"id":563,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风登陆后","q":"关于台风登陆后的影响，下列说法正确的是（ ）。","options":["登陆后风险立即消失，无需防范","登陆后迅速转变为反气旋","登陆后一定增强","虽风力减弱，仍可能造成强降水及次生灾害"],"answer":3,"explain":"解析：手册9-P02易错：不能以风力减弱判定风险消失。手册要点：主要灾害包括大风、暴雨、风暴潮及次生灾害。","source":"上编 9-P02"},{"id":564,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风初始扰动","q":"西太平洋—南海热带气旋的初始扰动来源不包括（ ）。","options":["东风波","热带辐合带扰动","高空冷涡或切断低压","极地高压"],"answer":3,"explain":"解析：天气补充笔记：四类初始扰动为ITCZ扰动、东风波、中高纬长波槽切断低压或高空冷涡、斜压性扰动。手册要点：台风属于暖心热带气旋，通常需暖而深的海水提供热量水分、低层初始扰动与辐合、充足水汽、较弱垂直风切变和足够的科里奥利作用，赤道附近因科氏作用弱而不易生成。","source":"上编 9-P02（南赫天气补充互证）"},{"id":565,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"中美东岸台风","q":"中国东部沿海和美国东海岸都多热带气旋影响，共同原因是（ ）。","options":["都位于赤道附近，科氏力最强","都位于大洋东岸冷洋流区附近","都受极地东风控制，热带气旋随极地冷空气南下","都位于大洋西岸暖海附近，受副高西侧（外围）偏南气流引导"],"answer":3,"explain":"解析：中国东部沿海和美国东海岸都位于大洋西岸，近海有暖流、海温高，热带气旋活跃。生成的热带气旋受副热带高压西侧（外围）偏南气流引导北上，因此两地都常受影响。大洋东岸多冷洋流，海温低，不利于热带气旋发展。","source":"上编 9-E02（2023卷考点）","tag":"2023卷考点"},{"id":566,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风与飓风","q":"台风与飓风的关系是（ ）。","options":["同一类强热带气旋在不同海域的名称","飓风是温带气旋，台风是热带气旋，二者无关","二者形成机制不同","台风是暖心系统，飓风是冷心系统"],"answer":0,"explain":"解析：不同海盆称作台风或飓风，本质同属热带气旋（手册9-E02关键词“台风飓风同类”）。中国东南沿海邻近西北太平洋热带气旋活跃海区，美国东南与东海岸邻近北大西洋及加勒比海的飓风活动区。","source":"上编 9-E02"},{"id":567,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风龙卷对比","q":"台风与龙卷相比，下列说法正确的是（ ）。","options":["龙卷尺度更大、Ro较小，满足地转平衡","台风尺度大、Ro较小，梯度风平衡；龙卷尺度小、Ro很大，近似旋衡","台风尺度大、Ro很大，两种旋向都可能","二者都近似满足地转平衡，Ro都远小于1，并且旋转方向在两个半球都固定不变"],"answer":1,"explain":"解析：手册9-C04、K9-01：台风Ro=4，龙卷Ro=2400。手册要点：龙卷尺度小、转速大，Rossby数通常很大，科氏作用相对弱，可近似由气压梯度力提供向心加速度，即旋衡。","source":"上编 9-C04、K9-01"},{"id":568,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"雷暴生命史","q":"普通雷暴单体的生命史为（ ）。","options":["积云阶段、成熟阶段、消散阶段","波动阶段、发展阶段、锢囚阶段和消亡阶段","形成阶段、填塞阶段、再生阶段","初生、锢囚、消亡"],"answer":0,"explain":"解析：手册9-P03：积云—成熟—消散；成熟阶段上升下沉并存。手册要点：普通单体雷暴的积云阶段以上升气流为主，暖湿空气抬升凝结。","source":"上编 9-P03"},{"id":569,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"强对流条件","q":"强对流天气发生需要的基本条件是（ ）。","options":["只需近地面气温很高","只需大风和较低的云底","只需低云和较高的地面湿度，与层结稳定度和抬升触发无关","水汽、不稳定层结和抬升触发，强风切变利于组织化"],"answer":3,"explain":"解析：手册9-P03：水汽、不稳定、触发；风切变使对流组织化（多单体、超级单体、飑线）。手册要点：形成深对流通常需要水汽、不稳定层结和触发抬升。","source":"上编 9-P03"},{"id":570,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"超级单体","q":"超级单体风暴的特征是（ ）。","options":["直径20—40 km以上、生命期数小时，内部有稳定的有组织环流，雷达可见钩状回波","由多个单体排成线状、长达数百千米的雷暴带","尺度约1 km、生命期仅数分钟，内部无旋转，雷达回波呈均匀片状，一般只产生零星小雨","水平尺度数百千米，以层状云和连续性降水为主"],"answer":0,"explain":"解析：天气补充笔记：比普通单体更大、更持久、更猛烈，RHI有穹隆、回波墙，PPI有钩状回波。手册要点：垂直风切变影响风暴组织与持续性，多单体和超级单体可持续更久。","source":"上编 9-P03（南赫天气补充互证）"},{"id":571,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"飑线","q":"飑线是指（ ）。","options":["雷暴云团线状排列的中尺度强对流带，水平尺度约150—300 km","台风外围呈螺旋状分布的雨带","温带气旋暖区中的层状云带","锋面上大范围的层状云系和连续性降水带，水平尺度上千千米"],"answer":0,"explain":"解析：天气补充笔记：飑线是线状中尺度系统，生命期一般4—10小时。飑线由多个雷暴单体排成线状，水平尺度约一百到几百千米，伴有雷暴大风和气压涌升，与锋面层状云系或台风螺旋雨带不同。","source":"上编 9-P03（南赫天气补充互证）"},{"id":572,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"低空急流","q":"低空急流的典型特征是（ ）。","options":["位于200 hPa附近，风速大于30 m/s的西风带","只出现在冬季、输送干冷空气的偏北气流","位于1—3 km，风速12—30 m/s，超地转、有日变化，输送暖湿水汽","只出现在冬季对流层顶附近，风速一般超过50 m/s，以输送干冷空气向南为主"],"answer":2,"explain":"解析：天气补充笔记：低空急流850/700 hPa最明显，多西南风，夜间较强，输送暖湿建立位势不稳定。低空急流位于850—700 hPa附近，多为西南风，夜间较强，向暴雨区输送暖湿空气，200 hPa附近的强风带是高空急流。","source":"上编 9-E03（南赫天气补充互证）"},{"id":573,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"急流标准","q":"急流的风速下限，低空与高空分别约为（ ）。","options":["≥5 m/s与≥10 m/s","≥50 m/s与≥100 m/s","≥30 m/s与≥12 m/s","≥12 m/s与≥30 m/s"],"answer":3,"explain":"解析：天气补充笔记：急流为强而窄的气流带，低空≥12 m/s，高空≥30 m/s。气象上把低空强风带的风速下限定为12 m/s，高空急流定为30 m/s，把两者颠倒或改成其他数值都不对。","source":"上编 9-E03（南赫天气补充互证）"},{"id":574,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"暴雨条件","q":"暴雨形成的关键条件不包括（ ）。","options":["持续强烈的下沉气流","强烈持久的上升运动（辐合抬升）","系统移动缓慢、持续时间长","充足的水汽补给"],"answer":0,"explain":"解析：手册9-E03：水汽补给、辐合抬升、条件性不稳定、降水效率、持续少动、列车效应。手册要点：条件不稳定有利于强对流和较大的瞬时雨强，但持续性暴雨也可能含稳定层结中的层状降水，因此不能把强不稳定列为一切暴雨的绝对必要条件。","source":"上编 9-E03"},{"id":575,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"列车效应","q":"暴雨中的“列车效应”是指（ ）。","options":["雨带快速移出，降水持续时间很短","单一雷暴在原地生成并迅速消散","火车高速通过引起的近地面气流扰动导致对流加强","多个对流单体相继经过同一地区，造成累积大雨"],"answer":3,"explain":"解析：手册9-E03关键词“列车效应”，使同一地点长时间强降水。手册要点：同一区域对流反复生成和移入的列车效应、系统停滞及地形增幅，可把高雨强累积成极端雨量。","source":"上编 9-E03"},{"id":576,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"降水量决定","q":"某地累计降水量主要取决于（ ）。","options":["仅取决于最大小时雨强","降水强度与持续时间的共同作用","仅取决于云顶高度","仅取决于当地气温高低"],"answer":1,"explain":"解析：手册公式9-10：P=∫I(t)dt。手册要点：量级受强度和持续时间共同控制。","source":"上编 公式9-10"},{"id":577,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"层状暴雨","q":"关于暴雨的不稳定条件，下列说法正确的是（ ）。","options":["任何暴雨都需强对流不稳定","暴雨与抬升触发无关，只取决于水汽多少","暴雨只发生在稳定层结中","层状云暴雨不一定需要强烈的对流不稳定"],"answer":3,"explain":"解析：手册公式9-10条件：对流性暴雨查不稳定与组织；锋面、地形或低空辐合提供抬升，层状暴雨不需同等强的不稳定。锋面、地形或低空辐合提供的大范围抬升可以产生持续性层状云暴雨，不需要强烈的对流不稳定，但暴雨仍离不开抬升和充足的水汽。","source":"上编 公式9-10"},{"id":578,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"地形暴雨","q":"地形对暴雨的增幅作用主要在（ ）。","options":["远离山脉的平坦洋面上空","背风坡下沉气流和辐散","迎风坡强迫抬升和辐合","高原顶部下沉区"],"answer":2,"explain":"解析：单元11与手册9-E04：迎风坡抬升增幅降水。迎风坡迫使气流抬升辐合，使降水增幅，背风坡下沉增温、雨量减少，平坦洋面和高原顶部下沉区没有这种强迫抬升。","source":"上编 9-E04、单元11"},{"id":579,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"郑州7·20","q":"分析2021年郑州“7·20”特大暴雨，手册骨架强调的大尺度背景是（ ）。","options":["副高偏北偏强与台风远程水汽输送等形成稳定环流，配合地形抬升","副高明显南撤、夏季风偏弱，水汽主要来自本地蒸发","强寒潮南下与冬季风偏强形成的冷空气堆积，地形的作用基本可以忽略","副高南撤、台风远离使水汽输送中断"],"answer":0,"explain":"解析：“7·20”暴雨的大尺度背景是西太平洋副高偏北偏强，台风远程输送水汽，环流形势稳定少动，使暖湿气流持续输向河南。再加上太行山、伏牛山前的地形抬升和对流反复生成，才形成极端降水。寒潮、冬季风或水汽中断都与这次夏季暴雨的背景相反。","source":"上编 9-E04（2023卷考点）","tag":"2023卷考点"},{"id":580,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"暴雨预报难点","q":"暴雨预报困难的原因不包括（ ）。","options":["暴雨只受单一温度控制、规律简单","初值和模式误差","大气的非线性","中小尺度系统发展快、可预报时效短"],"answer":0,"explain":"解析：手册9-E05：小尺度快演变、初值模式误差、非线性；改进靠多源同化、高分辨率、集合概率、临近滚动。暴雨涉及多尺度系统的相互作用，受水汽、动力、热力和地形等多种因子影响，不是由单一温度控制的简单过程。","source":"上编 9-E05"},{"id":581,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"暴雨预报改进","q":"改进暴雨预报的有效途径是（ ）。","options":["依赖单一确定性预报并延长时效","减少雷达观测，只依靠地面图","多源观测资料同化、高分辨率模式、集合概率预报和临近滚动订正","只看一张地面天气图，凭经验确定雨区和雨量"],"answer":2,"explain":"解析：改进应加强雷达、卫星、自动站及探空等联合观测和快速同化，发展高分辨率对流预报并改进地形、陆面和微物理过程，采用集合预报表达极端雨量概率（手册9-E05关键词）。还应开展临近监测外推、滚动订正和检验，将预报概率与影响预警结合。","source":"上编 9-E05"},{"id":582,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"数值预报","q":"数值天气预报的本质是（ ）。","options":["只根据卫星云图的移动趋势外推","统计历史上相似天气的出现概率","依靠看云识天气等经验口诀进行定性推断","以观测确定初值，在边界条件下对大气方程组数值积分"],"answer":3,"explain":"解析：手册9-P04：观测初值、方程数值积分、边界条件。手册要点：数值天气预报以观测约束的初始大气状态为起点，用描述大气动力、热力及水物质过程的方程组，通过数值积分预报未来状态。","source":"上编 9-P04"},{"id":583,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"资料同化","q":"资料同化是指（ ）。","options":["把模式预报结果直接改为观测值","只使用卫星资料，不使用地面和探空观测","将观测与模式背景场按误差加权结合，得到最优初始场","删除所有与模式不符的异常观测"],"answer":2,"explain":"解析：手册9-P04：同化结合背景与观测，并有质控与检验。手册要点：资料同化把不同时空、不同误差的观测与模式背景场结合，利用统计和动力约束，形成较协调的分析场以改进初值，并非把观测点简单画线插值。","source":"上编 9-P04"},{"id":584,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"集合预报","q":"集合预报的主要作用是（ ）。","options":["只用于月以上的气候预测","用多个扰动成员估计预报不确定性，给出概率预报","完全消除初值误差，得到确定预报","提高单一确定性预报的模式分辨率"],"answer":1,"explain":"解析：手册公式9-12：成员比例给出事件概率，须检验校准。集合预报对初值和模式施加扰动，得到多个成员，成员的离散度反映预报不确定性，它不能消除初值误差，也不只用于气候预测。","source":"上编 公式9-12"},{"id":585,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"可预报性","q":"对流系统的可预报时效与大尺度环流相比（ ）。","options":["更长","相同","无限长","更短"],"answer":3,"explain":"解析：手册公式9-12条件：对流系统可预报时效与大尺度不同，小尺度误差增长快。对流系统尺度小、发展快，误差增长迅速，通常只能提前数小时预报，大尺度环流的可预报时效可达数天到一两周。","source":"上编 公式9-12"},{"id":586,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"气旋低层辐合","q":"北半球地面低压中由于摩擦，低层气流（ ）。","options":["逆时针向中心辐合，产生上升运动","顺时针向外辐散，并在中心产生下沉运动","下沉辐散，低层气流吹离中心","没有辐合辐散，只有水平旋转"],"answer":0,"explain":"解析：手册公式9-04条件：近地摩擦使低压常辐合、高压常辐散。摩擦削弱风速，使科氏力小于气压梯度力，风斜穿等压线吹向低压中心，北半球低压中气流逆时针辐合，中心上升。","source":"上编 公式9-04"},{"id":587,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"锋面气旋暖区","q":"温带气旋暖区（冷锋与暖锋之间）的天气通常是（ ）。","options":["较暖湿，可有阵性降水或雾，天气相对较好","强沙尘暴和大风降温","连续性大雪和严寒","严寒大风和持续的沙尘天气，气温骤降"],"answer":0,"explain":"解析：手册9-P01：锋面波动形成冷暖锋，暖区受暖气团控制。手册要点：由于冷锋通常移速较快，逐渐追上暖锋，暖区被抬离地面并形成锢囚锋。","source":"上编 9-P01"},{"id":588,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"天气系统尺度","q":"按水平尺度，下列系统从大到小排列正确的是（ ）。","options":["雷暴>台风>龙卷>气旋","龙卷>雷暴>台风>温带气旋","长波槽脊>温带气旋>台风>雷暴>龙卷","台风>长波>龙卷>雷暴"],"answer":2,"explain":"解析：手册9-C04、K9-01与公式4-04尺度分析：龙卷尺度最小、Ro最大。长波槽脊尺度达数千千米，温带气旋约一两千千米，台风数百千米，雷暴约十千米，龙卷只有百米量级，其余排列都打乱了顺序。","source":"上编 9-C04、公式4-04"},{"id":589,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"累计降水量","q":"某站连续3 h降水强度分别为20、35、27.5 mm/h，累计降水约为（ ）。","options":["27.5 mm","82.5 mm","105.0 mm","90.8 mm"],"answer":1,"explain":"解析：P=ΣI·Δt=20+35+27.5=82.5 mm，平均强度27.5 mm/h。不能用最大小时雨强乘时长。","source":"上编 公式9-10、K9-02"},{"id":590,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"区域雨量体积","q":"20 km²区域平均降水82.5 mm，雨量体积约为（ ）。","options":["1.65×10⁶ m³","1.65×10⁹ m³","8.25×10⁵ m³","1.65×10³ m³"],"answer":0,"explain":"解析：V=0.0825 m×2.0×10⁷ m²=1.65×10⁶ m³，质量约1.65×10⁹ kg。mm须换成m。","source":"上编 K9-02"},{"id":591,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"集合预报概率","q":"50个集合成员中有18个预报出暴雨，按成员比例估计的暴雨概率为（ ）。","options":["50%","64%","18%","36%"],"answer":3,"explain":"解析：P=18/50=36%。该概率需经历史资料校准检验，成员比例不等于真实发生频率。","source":"上编 公式9-12"},{"id":592,"book":"大气","chapter":"第9章 天气系统与天气预报","kp":"台风Rossby数","q":"台风U=40 m/s、L=200 km、f=5×10⁻⁵ s⁻¹，Rossby数约为（ ）。","options":["0.4","3.2","40.0","4.0"],"answer":3,"explain":"解析：Ro=U/(fL)=40/(5×10⁻⁵×2×10⁵)=4.0，量级>1，科氏力不可忽略但离心项显著，需用梯度风平衡而非地转平衡。Ro≈4说明惯性（离心）项与科氏项同量级，不能只用地转平衡，需用梯度风平衡来描述台风的切向风。","source":"上编 公式9-08、K9-01"},{"id":593,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"气候系统组成","q":"气候系统由哪五个圈层组成（ ）。","options":["对流层、平流层、中间层、热层、散逸层","大气圈、水圈、冰冻圈、岩石圈（陆面）和生物圈","大气圈、水圈、岩石圈、生物圈、电离圈","海洋、陆地、冰川、森林、城市"],"answer":1,"explain":"解析：手册10-D01：气候系统五圈层通过能量物质交换耦合。手册要点：气候系统由大气圈、水圈、冰雪圈、岩石圈和生物圈组成，通过能量、动量、水分和物质交换相互联系，是决定气候形成、分布与变化的复杂耦合系统，而非仅指大气。","source":"上编 10-D01"},{"id":594,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"气候定义","q":"气候的科学定义强调（ ）。","options":["气候系统状态的长期统计特征，包括平均与变率","只指某地多年平均气温","某日某时某地的天气状况及其强度","某次极端天气事件的强度"],"answer":0,"explain":"解析：气候是一定地区较长时期天气的统计特征，既含平均状态，也含变率和极端特征（手册10-D01关键词“长期统计；平均与变率”）。气候系统由大气圈、水圈、冰雪圈、岩石圈和生物圈组成，通过能量、动量、水分和物质交换相互联系，是决定气候形成、分布与变化的复杂耦合系统，而非仅指大气。","source":"上编 10-D01"},{"id":595,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"温室效应定义","q":"温室效应是指（ ）。","options":["臭氧吸收紫外线使平流层增温，并使地面温度高于无大气时的现象","气溶胶反射太阳辐射使地面降温的现象","城市地表储热使城区比郊区暖的现象","大气中温室气体吸收地面长波辐射并向下发射，使地面温度高于无大气时的现象"],"answer":3,"explain":"解析：手册10-D02：长波吸收发射、向下长波、能量收支；人为排放导致增强温室效应。城市比郊区暖是热岛效应。","source":"上编 10-D02"},{"id":596,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"增强温室效应","q":"“增强的温室效应”指（ ）。","options":["城市热岛使城区比郊区更暖的现象","太阳活动增强，使到达地面的辐射与自然温室效应同步增大","人类排放使温室气体浓度增加，额外的辐射强迫导致变暖","自然温室效应本身，与人类活动无关"],"answer":2,"explain":"解析：温室效应是大气中温室气体和云吸收地表及低层发出的长波辐射，并向各方向发射长波，使地表和低层在能量平衡中维持较高温度的作用（手册10-D02关键词“增强温室效应”）。温室气体增加可先减少相同温度下向太空散失的能量，系统随后升温重新调整。","source":"上编 10-D02"},{"id":597,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"ENSO定义","q":"ENSO是指（ ）。","options":["低纬哈得来、中纬费雷尔与极地环流","由海陆热力差异形成的季风环流在冬季与夏季之间的转换及其年际变化","热带太平洋厄尔尼诺/拉尼娜与南方涛动构成的海气耦合年际变率","北大西洋涛动引起的欧洲冬季气候异常"],"answer":2,"explain":"解析：手册10-D03：海气耦合、热带太平洋、年际、暖冷位相、遥相关。手册要点：ENSO是厄尔尼诺—南方涛动的合称，是热带太平洋海温异常与大气环流、气压异常相互耦合的年际变化。","source":"上编 10-D03"},{"id":598,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"厄尔尼诺","q":"厄尔尼诺事件期间（ ）。","options":["赤道中东太平洋海温异常偏暖","全球海温均匀降低","西太平洋海温异常偏暖并上升流增强","赤道东太平洋海温偏冷"],"answer":0,"explain":"解析：厄尔尼诺为暖位相，中东太平洋偏暖；拉尼娜为冷位相。手册要点：ENSO是厄尔尼诺—南方涛动的合称，是热带太平洋海温异常与大气环流、气压异常相互耦合的年际变化。","source":"上编 10-D03"},{"id":599,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"遥相关","q":"ENSO能影响远离热带太平洋地区的天气气候，称为（ ）。","options":["地转偏差","热岛效应","遥相关","热成风"],"answer":2,"explain":"解析：它可改变热带对流和大尺度环流，通过遥相关影响其他地区天气气候，但不等同长期全球变暖（手册10-D03关键词“遥相关”）。ENSO是厄尔尼诺—南方涛动的合称，是热带太平洋海温异常与大气环流、气压异常相互耦合的年际变化。","source":"上编 10-D03"},{"id":600,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"ENSO时间尺度","q":"ENSO主要属于哪一时间尺度的气候变率（ ）。","options":["年际（约2—7年）","日变化","千年","季节内（30—60天）"],"answer":0,"explain":"解析：手册10-D03：年际气候变率。手册要点：ENSO是厄尔尼诺—南方涛动的合称，是热带太平洋海温异常与大气环流、气压异常相互耦合的年际变化。","source":"上编 10-D03"},{"id":601,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"外强迫与内部变率","q":"下列属于气候系统内部变率的是（ ）。","options":["ENSO","太阳辐射变化","火山喷发","人为温室气体排放"],"answer":0,"explain":"解析：手册10-C01：外强迫来自系统外部改变能量收支，内部变率是系统自身波动。手册要点：内部变率是在无相应外强迫改变时，由耦合系统内部过程产生的波动，如ENSO。","source":"上编 10-C01"},{"id":602,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"辐射强迫","q":"辐射强迫的单位是（ ）。","options":["W/m²","W/(m²·K)","ppm","K（开尔文）"],"answer":0,"explain":"解析：手册10-C01、公式10-02：ΔF单位W·m⁻²；λ为W·m⁻²·K⁻¹。手册要点：辐射强迫常用规定条件下净向下辐射收支的变化衡量，单位W/m²，正值倾向增暖，负值倾向降温。","source":"上编 10-C01、公式10-02"},{"id":603,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"正反馈","q":"正反馈的含义是（ ）。","options":["对初始扰动的响应进一步放大该扰动","与初始扰动无关的独立变化","对初始扰动的响应使扰动减弱","只出现在海洋"],"answer":0,"explain":"解析：手册10-C01：扰动后响应，放大为正、抑制为负。手册要点：反馈是系统受到扰动后产生、又反过来改变初始响应的过程。","source":"上编 10-C01"},{"id":604,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"负反馈举例","q":"下列属于气候系统负反馈的是（ ）。","options":["海温升高使海洋吸收CO₂减少","冰雪反照率反馈","温度升高使向外长波辐射增加（普朗克反馈）","水汽反馈（升温使水汽增多）"],"answer":2,"explain":"解析：σT⁴随温度增大使系统失热增多，起稳定作用；其余为正反馈（手册10-C01、10-P02、10-P03）。手册要点：冰雪反照率反馈的链条是：升温使冰雪减少，地表反照率降低，吸收太阳辐射增加，进一步升温。","source":"上编 10-C01、10-P02"},{"id":605,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"能量不平衡","q":"公式N≈ΔF−λΔT中，N>0表示（ ）。","options":["地球系统正在净失热，温度将随之下降","系统已达到新的辐射平衡","强迫为零","地球系统仍在净得热，温度将继续上升"],"answer":3,"explain":"解析：手册公式10-02：N=0时达平衡ΔT_eq=ΔF/λ。N是大气顶向下为正的能量不平衡，N>0说明吸收多于放出，系统仍在储热升温，N=0才达到新的平衡。","source":"上编 公式10-02"},{"id":606,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"云的辐射效应","q":"云的两种相反辐射作用是（ ）。","options":["只有反射短波的致冷作用，不吸收长波","不影响辐射","只有吸收长波的增温作用","反射短波致冷和吸收长波保温"],"answer":3,"explain":"解析：手册10-C02：短波冷却、长波保温，平均净效应为冷却，但扰动后的云反馈不能直接推出。手册要点：云一方面反射太阳短波辐射产生冷却作用，另一方面吸收并发射长波辐射产生保温作用。","source":"上编 10-C02"},{"id":607,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"云反馈不确定","q":"关于云反馈，下列说法正确的是（ ）。","options":["云的平均辐射效应为冷却，不能据此推断云反馈为负","云的平均辐射效应为冷却，因此可以断定云反馈一定为负值","云反馈一定为负，云量增加必然使气候变冷","云不影响气候敏感度，可忽略"],"answer":0,"explain":"解析：手册10-C02：平均辐射效应与扰动后云变化（反馈）是两回事。手册要点：云反馈问的是气候先发生变化后，云量、云高、光学厚度等变化如何再影响辐射收支，不能由现有云平均降温直接推出负反馈。","source":"上编 10-C02"},{"id":608,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"检测与归因","q":"气候变化“检测”与“归因”的区别是（ ）。","options":["二者相同，都是比较模式与观测","检测只用模式，归因只用观测","检测判断变化是否超出内部变率；归因判断原因及各因子贡献","归因只看观测资料，检测只看模式结果，二者互不相关"],"answer":2,"explain":"解析：手册10-C03：检测、归因、自然与人为对比。手册要点：检测是判断观测变化是否显著超出内部变率等不确定性范围。","source":"上编 10-C03"},{"id":609,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"情景预估","q":"未来气候情景预估的性质是（ ）。","options":["与人类排放无关的确定性预言","确定性预言，一定会按预估结果发生","在给定排放等情景条件下的有条件预估，而非确定预报","对未来某日具体天气的预报"],"answer":2,"explain":"解析：未来气候预估以排放或浓度情景为条件，使用气候模式估计可能变化，区别于逐日天气预报（手册10-C03关键词“条件情景；模式；内部变率”）。情景描述假设路径，不是对未来政策、人口和排放的唯一预测。","source":"上编 10-C03"},{"id":610,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"减缓与适应","q":"气候变化“减缓”与“适应”的区别是（ ）。","options":["二者相同，都是减少温室气体排放","减缓是减少排放、增加移除；适应是调整系统以减少损害","适应是减少排放，减缓是修建海堤","减缓是修建海堤和防洪设施，适应是减少温室气体排放和增加碳汇"],"answer":1,"explain":"解析：手册10-C04：二者互补，有协同与权衡。手册要点：减缓是减少温室气体排放或增强移除，以限制未来气候变化，例如节能、低碳能源、减少甲烷排放和保护碳汇。","source":"上编 10-C04"},{"id":611,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"适应措施","q":"下列属于气候变化适应措施的是（ ）。","options":["提高能源利用效率","培育耐旱作物、修建防洪设施","大力发展风电和光伏","植树造林、增加碳汇"],"answer":1,"explain":"解析：手册10-C04：适应是调整系统减少损害；风电、能效、增汇属减缓。耐旱作物和防洪设施是调整系统以减少气候变化损害，属于适应，提高能效、发展风光电和植树增汇都是减缓。","source":"上编 10-C04"},{"id":612,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"海洋储热","q":"海洋在气候系统中的作用不包括（ ）。","options":["使气候对强迫的响应立即完成、无滞后","储存巨大热量，使响应滞后","吸收CO₂","向高纬输送热量"],"answer":0,"explain":"解析：手册10-P01、10-P03：海洋热容量大，响应滞后；同时是碳汇。手册要点：海洋热容量大，通过海气热交换和环流吸收、储存并再分配热量，使气候对外部强迫的响应具有滞后。","source":"上编 10-P01、10-P03"},{"id":613,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"冰雪反照率反馈","q":"冰雪反照率反馈的机理是（ ）。","options":["变暖使冰雪增加，反照率升高，抑制变暖","冰雪反照率与温度无关，冰雪的变化不会影响地表吸收的太阳辐射量多少","变暖使冰雪减少，地表反照率降低、吸收更多太阳辐射，进一步变暖","冰雪减少使地表反照率升高，吸收减少"],"answer":2,"explain":"解析：手册10-P02：放大原变化，为正反馈。手册要点：冰雪反照率反馈的链条是：升温使冰雪减少，地表反照率降低，吸收太阳辐射增加，进一步升温。","source":"上编 10-P02"},{"id":614,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"水汽反馈","q":"水汽反馈为正反馈的前提是（ ）。","options":["相对湿度大致维持，升温使饱和水汽压增大，水汽增加增强温室效应","相对湿度必定下降，水汽总量减少","水汽不吸收长波，增温只来自CO₂","升温使水汽减少，温室效应减弱，升温被抑制，因而是负反馈"],"answer":0,"explain":"解析：手册10-P02关键词“相对湿度条件；水汽长波”；正反馈也非必然失控。手册要点：水汽反馈的链条是：初始升温使空气可容纳更多水汽，在相对湿度大致维持的条件下，大气水汽增加，长波吸收增强，进一步放大升温，因此通常为正反馈。","source":"上编 10-P02"},{"id":615,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"反馈非失控","q":"关于水汽反馈与冰雪反照率反馈，下列说法错误的是（ ）。","options":["正反馈必然导致气候失控","水汽反馈需相对湿度条件","普朗克负反馈起稳定作用","二者都放大原变化"],"answer":0,"explain":"解析：手册10-P02易错：放大原变化但非必然失控。手册要点：冰雪反照率反馈的链条是：升温使冰雪减少，地表反照率降低，吸收太阳辐射增加，进一步升温。","source":"上编 10-P02"},{"id":616,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"海温CO2反馈","q":"海温升高使海洋吸收CO₂能力下降，属于（ ）。","options":["正反馈","负反馈","无反馈","外强迫"],"answer":0,"explain":"解析：手册10-P03：气体溶解度随温度升高而降低，大气CO₂更多，进一步增暖。手册要点：在其他条件相近时，海水升温降低CO₂溶解度，可削弱吸收或促进逸出，增加大气CO₂并进一步增暖，构成正反馈链条。","source":"上编 10-P03"},{"id":617,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"海洋碳汇机制","q":"海洋吸收CO₂的机制包括（ ）。","options":["溶解泵（分压差驱动的溶解）与生物泵","海洋浮游植物光合作用向大气释放CO₂","海底火山排放CO₂进入海水","臭氧分解"],"answer":0,"explain":"解析：海洋也通过物理溶解、化学平衡和生物过程吸收部分CO₂，形成重要碳汇（手册10-P03关键词“溶解与生物泵；分压差”；碳汇有限）。实际海气碳通量还取决于海气CO₂分压差、环流、混合和生物活动，因此不能仅由局地升温推断全球海洋立刻成为净碳源，也不能把碳汇当成无限、永久的排放抵消能力。","source":"上编 10-P03"},{"id":618,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"CH4汇","q":"大气甲烷的主要汇是（ ）。","options":["植物光合作用","被海洋溶解吸收","平流层臭氧光解","与OH自由基反应氧化"],"answer":3,"explain":"解析：手册10-E01：CH₄与OH；CO₂有陆海汇；N₂O在平流层光解。甲烷在对流层中主要被OH氧化成CO₂和水，寿命约10年，光合作用吸收的是CO₂，海洋溶解对甲烷不是主要汇。","source":"上编 10-E01"},{"id":619,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"N2O","q":"N₂O的主要来源与汇分别是（ ）。","options":["化石燃料燃烧；对流层OH氧化","火山喷发；降水湿清除","土壤微生物（含化肥施用）；平流层光解","海洋；光合作用"],"answer":2,"explain":"解析：N₂O主要涉及土壤和农业氮循环，主要在平流层被光解或与活性氧反应清除（手册10-E01关键词“N₂O土壤平流层”）。主要温室气体包括H2O、CO₂、CH₄、N₂O、O₃及含卤气体。","source":"上编 10-E01"},{"id":620,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"含卤气体","q":"含卤工业气体（如CFCs）的气候与环境作用是（ ）。","options":["对环境无害的惰性气体","只反射太阳辐射致冷","只破坏平流层臭氧，本身不是温室气体","既是强温室气体，又破坏平流层臭氧"],"answer":3,"explain":"解析：手册10-E01含卤工业气体与7-P03互证。手册要点：主要温室气体包括H2O、CO₂、CH₄、N₂O、O₃及含卤气体。","source":"上编 10-E01"},{"id":621,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"太阳强迫","q":"太阳活动对气候的影响属于（ ）。","options":["自然外强迫","反馈","内部自然变率","人为强迫"],"answer":0,"explain":"解析：手册10-E02：太阳、火山、轨道参数均为自然驱动。太阳活动在气候系统外部改变入射能量，属于自然外强迫，反馈是对强迫的响应，内部变率是系统自身的振荡。","source":"上编 10-E02"},{"id":622,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"火山影响","q":"强烈火山喷发后1—2年全球气温常降低，主要因为（ ）。","options":["火山释放大量水汽增强温室效应","喷入平流层的硫酸盐气溶胶反射太阳辐射","火山加热海洋","火山灰增强温室效应，并直接加热平流层和地面"],"answer":1,"explain":"解析：手册10-E02：火山平流层气溶胶短期致冷。手册要点：大规模火山向平流层注入含硫物质，可形成硫酸盐气溶胶并增强太阳反射，常造成数年尺度降温。","source":"上编 10-E02"},{"id":623,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"轨道参数","q":"米兰科维奇轨道三要素是（ ）。","options":["偏心率、地轴倾角和岁差","日地距离、自转速度、公转速度","纬度、经度、海拔","太阳常数、反照率、温室气体"],"answer":0,"explain":"解析：手册10-E02：轨道三要素改变季节和纬度日照分布，驱动冰期旋回。手册要点：轨道偏心率、黄赤交角和岁差主要改变不同季节、纬度的日照分配，与万年至十万年尺度变化相关。","source":"上编 10-E02"},{"id":624,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"时间尺度匹配","q":"归因气候变化时，强调驱动因子与变化的时间尺度相匹配，例如（ ）。","options":["轨道参数变化能解释近百年的快速增暖","轨道参数主要解释万年尺度冰期旋回，不能解释近百年快速增暖","火山活动主要解释千年尺度的变化","ENSO年际变化可以解释万年尺度的冰期旋回"],"answer":1,"explain":"解析：轨道偏心率、黄赤交角和岁差主要改变不同季节、纬度的日照分配，与万年至十万年尺度变化相关（手册10-E02关键词“尺度匹配”）。自然驱动包括太阳辐射变化、火山活动、地球轨道参数变化以及海陆分布和地形改变。","source":"上编 10-E02"},{"id":625,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"人类影响气候","q":"人类改变气候的途径不包括（ ）。","options":["改变地球轨道参数","排放温室气体","排放气溶胶","改变土地利用与地表反照率"],"answer":0,"explain":"解析：手册10-E03：温室气体、气溶胶、土地利用、反照率与蒸散、碳源汇。地球轨道参数由天体力学决定，周期达数万年，人类无法改变，排放温室气体、气溶胶和改变土地利用才是人为途径。","source":"上编 10-E03"},{"id":626,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"土地利用","q":"毁林开荒对气候的影响包括（ ）。","options":["只增加碳汇，使气候变冷","没有影响","释放碳、改变反照率与蒸散","只降低反照率，不影响碳循环"],"answer":2,"explain":"解析：手册10-E03：土地利用改变碳源汇和地表能量水分收支，综合效应需具体分析。手册要点：土地利用和土地覆盖变化还会改变反照率、粗糙度、蒸散、地表水循环及生态碳源汇，例如森林砍伐可能同时释放碳并改变局地水热交换。","source":"上编 10-E03"},{"id":627,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"气候风险","q":"气候风险由哪些要素共同决定（ ）。","options":["只取决于人口数量","只取决于气温升高的幅度","只取决于降水","危险性、暴露度与脆弱性"],"answer":3,"explain":"解析：手册10-E04：风险由危险性、暴露度、脆弱性（敏感性与适应能力）组成。手册要点：风险需结合危险性、暴露度和脆弱性分析。","source":"上编 10-E04"},{"id":628,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"脆弱性","q":"脆弱性的构成包括（ ）。","options":["温度与降水","敏感性与适应能力","排放与吸收","暴露度与危险性两项"],"answer":1,"explain":"解析：手册10-E04：脆弱性取决于敏感性和适应能力。手册要点：脆弱性体现易受损程度，涉及敏感性和应对、适应能力。","source":"上编 10-E04"},{"id":629,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"碳达峰含义","q":"碳达峰是指（ ）。","options":["陆地碳汇达到最大值","一定范围内CO₂排放达到峰值后进入下降趋势","人为CO₂排放降为零","单位GDP的CO₂排放强度达到历史最高值的时间点"],"answer":1,"explain":"解析：碳达峰指CO₂排放达到峰值后逐步下降（手册10-E05、E10-L05：达峰后下降）。碳中和指规定时期和边界内人为CO₂排放与人为移除相平衡，实现净零，并不要求每项活动都绝对零排放。","source":"上编 10-E05"},{"id":630,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"碳中和含义","q":"碳中和是指（ ）。","options":["只靠植树造林抵消全部排放","完全不排放任何CO₂","所有温室气体的排放量都在同一年降为零","在规定边界和时期内人为CO₂排放与人为移除达到净零"],"answer":3,"explain":"解析：碳中和是在规定边界和时期内，人为CO₂排放与人为移除（如生态增汇、CCUS）相抵，达到净零。它并不要求完全不排放，也不能只靠植树造林抵消。碳中和通常针对CO₂，不是要求所有温室气体在同一年归零。","source":"上编 10-E05、单元12"},{"id":631,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"双碳目标年份","q":"我国提出的“双碳”目标是（ ）。","options":["2030年前碳中和、2060年前碳达峰","2025年碳达峰、2050年碳中和","2035年碳达峰、2070年碳中和","2030年前碳达峰、2060年前碳中和"],"answer":3,"explain":"解析：手册E10-L05：2030年前达峰，2060年前中和。两个目标分别是2030年前CO₂排放达峰、2060年前实现碳中和，把顺序颠倒或改成其他年份都不对。","source":"上编 10-E05、下编 E10-L05"},{"id":632,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"双碳路径","q":"实现双碳目标的技术路径不包括（ ）。","options":["提高能效","生态增汇与CCUS","扩大无减排措施的煤电装机","能源结构转型"],"answer":2,"explain":"解析：手册10-E05：能源效率、能源转型、碳汇CCUS、核算政策。无减排措施的煤电增加CO₂排放，与双碳目标相悖，提高能效、能源转型、生态增汇与CCUS都是减排路径。","source":"上编 10-E05"},{"id":633,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"CCUS","q":"CCUS的含义是（ ）。","options":["清洁煤燃烧与发电技术","碳汇林","碳排放权交易","碳捕集、利用与封存"],"answer":3,"explain":"解析：技术上以节能提效、低碳能源替代、电气化和产业转型减少排放，配合甲烷等非CO₂减排、生态增汇及适用场景的碳捕集利用与封存（手册10-E05关键词“碳汇CCUS”）。CCUS即Carbon Capture, Utilization and Storage，指把CO₂从排放源捕集后加以利用或封存，碳汇林和碳交易属于其他减排手段。","source":"上编 10-E05"},{"id":634,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"气候变暖与寒潮","q":"全球变暖背景下仍出现强寒潮，正确的理解是（ ）。","options":["寒潮与大气环流无关，纯属偶然现象","说明气候正在变冷，全球变暖结论被否定","单次天气事件不能否定长期气候趋势","变暖只发生在夏季，冬季不受影响"],"answer":2,"explain":"解析：手册1-C01与10-C03：天气与气候不同，需用长期统计检测。手册要点：单次极端事件还需专门事件归因，不能仅由长期增暖背景断定全部成因。","source":"上编 10-C03、1-C01"},{"id":635,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"海冰与海平面","q":"全球海平面上升的主要原因是（ ）。","options":["海水热膨胀和陆地冰川、冰盖融化","地壳整体上升抬高海面","北极海冰融化","降水增加，使河流入海的水量明显增多"],"answer":0,"explain":"解析：海冰本身浮于海面，融化对海平面贡献很小；手册10-P01海洋储热与冰雪圈作用。海冰本来就漂浮在海面上，融化后几乎不改变海平面，海平面上升主要来自海水受热膨胀和陆地冰川、冰盖融化后的入海水量。","source":"上编 10-P01"},{"id":636,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"陆面过程","q":"陆面影响气候的主要途径是（ ）。","options":["只通过地震和火山活动","地表通量（感热、潜热）、反照率和水分收支","不影响气候，地表状况只受大气的单向控制","只通过海拔高度影响气温"],"answer":1,"explain":"解析：陆面通过反照率、粗糙度、土壤水分和感热潜热通量影响边界层（手册10-P01关键词“陆面通量”）。冰雪通过高反照率和相变参与能量与水循环。","source":"上编 10-P01"},{"id":637,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"气候系统响应时间","q":"气候系统不同圈层的响应时间（ ）。","options":["都极慢，需数千年才响应","都很快","全部相同，同步变化","差异很大：大气快，深海和冰盖慢"],"answer":3,"explain":"解析：因此相同外部扰动下，各圈层响应快慢不同（手册10-P01关键词“响应时间”）。气候变化是圈层耦合的结果，例如变暖可融冰、改变反照率，再反过来放大变暖。","source":"上编 10-P01"},{"id":638,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"水汽是反馈","q":"一般把水汽视为反馈而非外强迫，原因是（ ）。","options":["其浓度主要由温度决定，停留时间短","水汽只存在于平流层，人类无法影响","人类不排放水汽","水汽不吸收红外辐射"],"answer":0,"explain":"解析：水汽由蒸发等补给、凝结降水移除，全球增暖中主要作为快速反馈（手册10-E01、10-P02）。水汽反馈的链条是：初始升温使空气可容纳更多水汽，在相对湿度大致维持的条件下，大气水汽增加，长波吸收增强，进一步放大升温，因此通常为正反馈。","source":"上编 10-E01、10-P02"},{"id":639,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"气候敏感度","q":"反馈参数λ越小，同样强迫下的平衡增温（ ）。","options":["为零","不变","越大","越小"],"answer":2,"explain":"解析：手册公式10-02：平衡时N=0，ΔT_eq=ΔF/λ。λ越小表示单位增温带来的额外向外辐射越少，即系统越难恢复平衡，同样强迫下平衡增温越大。","source":"上编 公式10-02"},{"id":640,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"拉尼娜","q":"拉尼娜事件期间赤道中东太平洋海温（ ）。","options":["异常偏暖","异常偏冷","先暖后冷","正常"],"answer":1,"explain":"解析：手册10-D03：ENSO冷位相。手册要点：ENSO是厄尔尼诺—南方涛动的合称，是热带太平洋海温异常与大气环流、气压异常相互耦合的年际变化。","source":"上编 10-D03"},{"id":641,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"储热与滞后","q":"即使立即停止增加温室气体，地表温度仍可能继续上升一段时间，原因是（ ）。","options":["太阳活动持续增强","冰雪面积增加使反照率升高","海洋热惯性使系统尚未达到平衡（N>0）","大气没有热容量，温度只取决于当时的温室气体浓度"],"answer":2,"explain":"解析：正强迫表示增暖倾向，不等于强迫施加瞬间已经达到平衡温升（手册10-P03、公式10-02、K10-01）。海洋热容量大，通过海气热交换和环流吸收、储存并再分配热量，使气候对外部强迫的响应具有滞后。","source":"上编 10-P03、公式10-02"},{"id":642,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"CH4汇","q":"大气CH₄的主要清除途径是（ ）。","options":["被植物光合作用大量吸收","被海洋大量溶解吸收","与OH自由基反应氧化","降水冲刷清除"],"answer":2,"explain":"解析：手册10-E01：CH₄来自湿地、反刍动物、稻田等，主要经OH氧化清除。甲烷在对流层被OH氧化，最终生成CO₂和水，植物光合作用吸收的是CO₂而不是甲烷，海洋溶解也不是甲烷的主要汇。","source":"上编 10-E01"},{"id":643,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"N2O汇","q":"N₂O在大气中的主要清除方式是（ ）。","options":["被海洋大量溶解吸收","在对流层被OH快速氧化","在平流层被光解或与活性氧反应","被雨水快速冲刷"],"answer":2,"explain":"解析：手册10-E01：N₂O涉及土壤和农业氮循环，主要在平流层被光解或与活性氧反应清除。N₂O在对流层中化学性质稳定，OH对它几乎不起作用，只有上升到平流层后才被紫外光解或与O(¹D)反应清除，寿命约百年。","source":"上编 10-E01"},{"id":644,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"CO2汇","q":"大气CO₂的主要汇是（ ）。","options":["陆地生态系统吸收和海洋吸收","被闪电分解为碳和氧","被OH自由基氧化分解","平流层光解"],"answer":0,"explain":"解析：手册10-E01：CO₂源有燃料燃烧、水泥生产、土地利用变化及呼吸分解，汇主要是陆地生态系统和海洋吸收。CO₂在大气中不会被OH氧化或光解，主要由陆地植被光合作用和海洋溶解吸收，闪电也不会分解CO₂。","source":"上编 10-E01"},{"id":645,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"平衡增温","q":"辐射强迫ΔF=3.7 W/m²，气候反馈参数λ=1.23 W/(m²·K)，平衡增温ΔT=ΔF/λ约为（ ）。","options":["3.70 K","4.55 K","3.01 K","0.33 K"],"answer":2,"explain":"解析：平衡时N=0，ΔT_eq=ΔF/λ=3.7/1.23≈3.01 K。λ越小（正反馈越强）增温越大。","source":"上编 公式10-02、K10-01"},{"id":646,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"能量不平衡","q":"强迫ΔF=3.0 W/m²，λ=1.0 W/(m²·K)，当前已增温1.2 K，能量不平衡N=ΔF−λΔT为（ ）。","options":["3.0 W/m²","1.8 W/m²","4.2 W/m²","-1.8 W/m²"],"answer":1,"explain":"解析：N=3.0−1.0×1.2=+1.8 W/m²，为正表示系统仍在净得热、继续增温，热量主要储存在海洋。N=ΔF−λΔT=3.0−1.2=1.8 W/m²，结果为正表示系统仍在吸热，4.2是把减号写成了加号，3.0则漏掉了已增温产生的反馈项。","source":"上编 公式10-02、K10-01"},{"id":647,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"海洋混合层储热","q":"海水ρ=1025 kg/m³、c=4000 J/(kg·K)，混合层厚100 m升温0.10 K，单位面积储热约为（ ）。","options":["4.10×10⁷ J/m²","3.28×10⁷ J/m²","4.10×10⁸ J/m²","4.10×10⁵ J/m²"],"answer":0,"explain":"解析：Q/A=ρcHΔT=1025×4000×100×0.10≈4.10×10⁷ J/m²，海洋巨大热容是气候响应滞后的原因。手册要点：假定海水密度 ρ_w =1025 kg·m⁻³、比热 c_w =4000 J·kg⁻¹·K⁻¹均为常数，层厚固定，不发生相变。","source":"上编 公式10-08、K10-03"},{"id":648,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"碳与CO₂换算","q":"某年大气中碳增加5.0 GtC，相当于CO₂约为（ ）。","options":["1.4 GtCO₂","10.0 GtCO₂","18.3 GtCO₂","13.3 GtCO₂"],"answer":2,"explain":"解析：M_CO₂=M_C×44/12=5.0×3.667≈18.3 GtCO₂。反乘12/44把方向搞反。","source":"上编 公式10-03、K10-02"},{"id":649,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"碳增量换浓度","q":"取1 ppm CO₂≈2.12 GtC，大气碳增加5.0 GtC对应浓度增加约为（ ）。","options":["1.03 ppm","2.36 ppm","8.65 ppm","10.60 ppm"],"answer":1,"explain":"解析：Δχ=5.0/2.12≈2.36 ppm。若按CO₂质量换算须用约7.8 GtCO₂/ppm，单位口径不能混用。","source":"上编 K10-02"},{"id":650,"book":"大气","chapter":"第10章 气候系统与气候变化","kp":"大气留存比例","q":"某年人为碳排放10 GtC，陆地汇3 GtC、海洋汇2 GtC，留在大气的比例为（ ）。","options":["20%","50%","30%","70%"],"answer":1,"explain":"解析：ΔM=10−3−2=5 GtC，留存比例5/10=50%。其余被陆地与海洋碳汇吸收。","source":"上编 公式10-03、K10-02"},{"id":651,"book":"环境","chapter":"第1章 绪论","kp":"环境定义","q":"环境科学中“环境”的含义是（ ）。","options":["只指城市建成区及其基础设施","只指自然界的动植物和微生物","以人类为主体的外部世界，包括天然的和经人工改造的自然因素","只指大气圈，不包括水体、土壤、生物及人工改造的因素"],"answer":2,"explain":"解析：下编E1-D01：以人类为主体，包括天然与人工改造的物质和因素。手册要点：环境科学中的环境，是以人类为主体、与人类生存和发展相互作用的外部世界总体，包括天然的和经人工改造的自然因素。","source":"下编 E1-D01"},{"id":652,"book":"环境","chapter":"第1章 绪论","kp":"环境要素","q":"环境要素是指（ ）。","options":["构成环境整体的各个独立、性质不同而又服从总体演化规律的基本物质组分","环境标准中规定的各项监测指标","人类的生产生活活动及其排放的各种污染物，以及由此产生的各类环境问题","环境中由人类排放的各种污染物"],"answer":0,"explain":"解析：下编E1-D01：如水、大气、生物、土壤、岩石等，彼此相互联系。手册要点：环境要素是组成环境整体、性质不同而相对独立的基本物质组分，如大气、水、土壤和生物。","source":"下编 E1-D01"},{"id":653,"book":"环境","chapter":"第1章 绪论","kp":"环境质量","q":"环境质量是指（ ）。","options":["一定时期内区域各污染源排放污染物的总量及其随时间的变化趋势","环境所能容纳污染物的最大负荷量","环境标准规定的污染物浓度限值","一定时空范围内环境总体或某些要素对人类生存及社会发展适宜程度的状态优劣"],"answer":3,"explain":"解析：下编E1-D02：可定性与定量表述，依据标准，通过监测评价。手册要点：环境质量是环境状况优劣的表征，是对具体环境要素或环境整体状态的定性和定量描述。","source":"下编 E1-D02"},{"id":654,"book":"环境","chapter":"第1章 绪论","kp":"环境容量定义","q":"环境容量是指（ ）。","options":["环境单元所占据的空间体积","环境中现有的污染物总量","在一定环境单元和环境目标下，环境所能容纳污染物的最大负荷量","国家规定的各类污染物排放标准限值，以及企业实际执行的排放浓度"],"answer":2,"explain":"解析：下编E1-D03：环境单元、环境目标、最大负荷、动态条件。手册要点：环境容量是一定环境单元在特定时间、空间和环境目标下，在不损害人体健康及生态系统正常结构和功能的前提下，所能容纳污染物的最大负荷量。","source":"下编 E1-D03"},{"id":655,"book":"环境","chapter":"第1章 绪论","kp":"环境容量影响","q":"环境容量首先取决于（ ）。","options":["区域内人口数量的多少和人口密度","区域内企业的工业产值","行政区面积大小","环境功能区目标（标准）和环境单元的自然条件"],"answer":3,"explain":"解析：单元14与E1-D03：容量依赖环境目标，并随气象、水文等动态条件变化。手册要点：环境容量是一定环境单元在特定时间、空间和环境目标下，在不损害人体健康及生态系统正常结构和功能的前提下，所能容纳污染物的最大负荷量。","source":"下编 E1-D03、单元14"},{"id":656,"book":"环境","chapter":"第1章 绪论","kp":"环境污染定义","q":"环境污染是指（ ）。","options":["自然环境本身的演化变化","任何物质进入环境都属于污染","有害物质或因子进入环境，使其结构功能变化，危害人类及生物","环境质量提高或生态系统得到改善的过程，与有害物质的进入无关"],"answer":2,"explain":"解析：下编E1-D04：强调有害、结构功能变化、产生危害，且与程度和时间有关。手册要点：环境污染是人类活动产生的有害物质或因子进入环境，达到一定数量、浓度、强度和持续时间，使环境结构与功能发生不利变化，并危害人体健康、生物活动或环境用途的现象。","source":"下编 E1-D04"},{"id":657,"book":"环境","chapter":"第1章 绪论","kp":"环境科学对象","q":"环境科学的研究对象是（ ）。","options":["只研究污染治理技术","只研究自然生态系统","只研究天气与气候的变化规律及其预报","人类—环境系统及其相互作用"],"answer":3,"explain":"解析：下编E1-D05：研究人类与环境的相互作用规律及其影响，任务包括监测、评价、治理。手册要点：环境科学研究人类社会活动与环境规律之间的相互作用，寻求人与环境协调、持续发展的途径。","source":"下编 E1-D05"},{"id":658,"book":"环境","chapter":"第1章 绪论","kp":"人工环境","q":"下列属于人工环境的是（ ）。","options":["极地冰盖","远洋","城市、农田和水库","原始森林自然保护区"],"answer":2,"explain":"解析：下编E1-C01：按形成方式分自然环境与人工环境，人工环境以自然为基础并与之相互依赖。手册要点：人工环境是在自然环境基础上，经人类有意识劳动改造而形成的生产与生活环境，如城市、农田和工厂。","source":"下编 E1-C01"},{"id":659,"book":"环境","chapter":"第1章 绪论","kp":"原生环境问题","q":"下列属于原生环境问题（第一环境问题）的是（ ）。","options":["城市噪声","火山、地震、洪涝等自然灾害","过度放牧造成的沙漠化","工业废水污染"],"answer":1,"explain":"解析：下编E1-C02：原生由自然因素引起；次生由人类活动引起，包括污染、资源破坏、生态破坏。手册要点：原生环境问题由自然因素引起，如地震、火山喷发、自然洪涝等造成的灾害及环境影响。","source":"下编 E1-C02"},{"id":660,"book":"环境","chapter":"第1章 绪论","kp":"次生环境问题","q":"次生环境问题主要由（ ）。","options":["火山、地震等自然因素引起","人类活动引起，包括环境污染和生态破坏","天文现象与宇宙射线引起","地质运动引起"],"answer":1,"explain":"解析：次生环境问题主要由人类生产生活活动引起，通常包括环境污染、资源短缺和生态破坏（下编E1-C02：成因分类）。原生环境问题由自然因素引起，如地震、火山喷发、自然洪涝等造成的灾害及环境影响。","source":"下编 E1-C02"},{"id":661,"book":"环境","chapter":"第1章 绪论","kp":"联合毒害","q":"两种污染物共同作用的毒性大于各自单独作用之和，称为（ ）。","options":["独立作用","协同作用","拮抗作用","相加作用"],"answer":1,"explain":"解析：下编E1-C03：单独、相加、协同、拮抗，且联合作用具有条件性。手册要点：多种污染物共同存在时，毒害效应取决于其作用部位、浓度、暴露条件及相互作用。","source":"下编 E1-C03"},{"id":662,"book":"环境","chapter":"第1章 绪论","kp":"拮抗作用","q":"两种污染物联合作用时毒性相互削弱，称为（ ）。","options":["相加作用","协同作用","富集作用","拮抗作用"],"answer":3,"explain":"解析：多种污染物共同存在时，毒害效应取决于其作用部位、浓度、暴露条件及相互作用（下编E1-C03）。拮抗作用指一种组分削弱另一种的作用。","source":"下编 E1-C03"},{"id":663,"book":"环境","chapter":"第1章 绪论","kp":"环境问题阶段","q":"环境问题发展的阶段中，以土地破坏、水土流失为主的阶段是（ ）。","options":["全球化阶段","工业化阶段","采集狩猎阶段","农业社会阶段"],"answer":3,"explain":"解析：下编E1-P01：采集狩猎→农业土地破坏→工业污染→全球与突发风险。手册要点：农业发展后，不合理砍伐、耕作和灌溉导致水土流失、土地退化及盐渍化。","source":"下编 E1-P01"},{"id":664,"book":"环境","chapter":"第1章 绪论","kp":"工业阶段问题","q":"工业革命后环境问题的突出特点是（ ）。","options":["以采集狩猎造成的破坏为主","没有环境问题，人与自然和谐共处","工业“三废”污染日益严重，出现公害事件","只有水土流失和土地沙化"],"answer":2,"explain":"解析：下编E1-P01：工业化阶段以污染为主。手册要点：工业革命后，能源消耗与工业排放增加，使大气、水体和有毒物污染突出。","source":"下编 E1-P01"},{"id":665,"book":"环境","chapter":"第1章 绪论","kp":"环境特性","q":"环境的特性不包括（ ）。","options":["变化的滞后性","区域性","无限性","整体性"],"answer":2,"explain":"解析：下编E1-L01：整体性、区域性、综合性、有限性、相对稳定性、滞后性。环境容量和资源都是有限的，所以“有限性”是环境特性，“无限性”与之相反，其余三项都是教材列出的环境特性。","source":"下编 E1-L01"},{"id":666,"book":"环境","chapter":"第1章 绪论","kp":"环境有限性","q":"环境“有限性”给管理的启示是（ ）。","options":["只需末端治理","应约束资源消耗与排放总量","无需监测","环境可无限承受干扰"],"answer":1,"explain":"解析：下编E1-L01：有限性要求约束资源消耗及排放总量。资源和环境容量有限，只靠末端治理不能解决问题，必须从源头控制消耗与排放总量，并持续监测。","source":"下编 E1-L01"},{"id":667,"book":"环境","chapter":"第1章 绪论","kp":"环境滞后性","q":"环境变化的“滞后性”启示我们（ ）。","options":["污染后果会立即显现，可及时处理","应重视预防和长期监测，滞后发生的损害不等于没有损害","暂时没有影响就不必管理，损害会自行消失","只需事后治理，无需预防和监测"],"answer":1,"explain":"解析：下编E1-L01易错：滞后损害不等于没有损害。手册要点：滞后性则要求预防、长期监测和风险管理。","source":"下编 E1-L01"},{"id":668,"book":"环境","chapter":"第1章 绪论","kp":"环境整体性","q":"环境“整体性”要求（ ）。","options":["统筹大气、水、土壤和生物，避免污染在介质间转移","各要素分别独立管理，互不影响","只治理大气，其他介质可暂缓","只治理一个重点区域，其他区域暂不考虑"],"answer":0,"explain":"解析：整体性要求统筹大气、水、土壤和生物，避免污染转移（下编E1-L01）。环境具有整体性、区域性、综合性、有限性、相对稳定性和变化的滞后性。","source":"下编 E1-L01"},{"id":669,"book":"环境","chapter":"第1章 绪论","kp":"环境问题实质","q":"环境问题的实质是（ ）。","options":["人与自然关系失调，开发利用超过环境承载能力","人口太少，开发不足","自然灾害频繁发生","单纯的技术问题，只要提高污染治理技术即可解决"],"answer":0,"explain":"解析：下编E1-L02：不合理开发、超过容量；治理方向为全过程预防、协调发展。手册要点：环境问题实质上反映人与自然关系及发展方式的失调。","source":"下编 E1-L02"},{"id":670,"book":"环境","chapter":"第1章 绪论","kp":"当代环境问题特点","q":"当代环境问题的特点不包括（ ）。","options":["局限于单一地区、与社会经济无关","综合化：多种问题相互交织","社会化、政治化，影响到国际关系格局","全球化：跨越国界，影响全球"],"answer":0,"explain":"解析：下编E1-L03：全球化、综合化、高技术化、社会与政治化，需要合作治理。手册要点：教材把当代环境问题概括为全球化、综合化、高技术化以及政治化和社会化。","source":"下编 E1-L03"},{"id":671,"book":"环境","chapter":"第1章 绪论","kp":"相对稳定性","q":"环境的“相对稳定性”是指（ ）。","options":["环境在一定干扰范围内具有自我调节和恢复能力","环境可承受无限干扰而不变","环境永远保持不变，任何程度的干扰都不会引起变化","环境变化与人类无关"],"answer":0,"explain":"解析：下编E1-L01：能自我调节不意味着能承受无限干扰。手册要点：相对稳定性说明环境可在一定干扰范围内恢复。","source":"下编 E1-L01"},{"id":672,"book":"环境","chapter":"第1章 绪论","kp":"环境区域性","q":"环境的区域性要求（ ）。","options":["只看全球平均状况统一治理","与地理条件无关，各地采用相同的治理方案","依据地方自然条件和产业结构因地制宜治理","全国采用一刀切的统一措施"],"answer":2,"explain":"解析：区域性要求依据地方自然条件和产业结构治理（下编E1-L01）。环境具有整体性、区域性、综合性、有限性、相对稳定性和变化的滞后性。","source":"下编 E1-L01"},{"id":673,"book":"环境","chapter":"第1章 绪论","kp":"环境负荷","q":"环境负荷（排放负荷）通常按（ ）计算。","options":["浓度×体积÷时间平方","浓度÷流量","流量×浓度×时间","面积×人口"],"answer":2,"explain":"解析：下编公式F1-01：M=QCΔt，单位须相容。污染负荷是一段时间内排入环境的污染物质量，等于流量乘以浓度再乘以时间，单位必须相容，例如m³/s×mg/L×s。","source":"下编 公式F1-01"},{"id":674,"book":"环境","chapter":"第1章 绪论","kp":"容量与浓度区别","q":"关于环境容量，下列说法正确的是（ ）。","options":["容量就是浓度标准，二者相同","容量与本底浓度无关，只取决于排放标准","容量固定不变，不随条件变化","容量是总量概念，不同于浓度标准，且随条件动态变化"],"answer":3,"explain":"解析：下编E1-D03与公式F1-01：W=V(S−B)+M_net，与本底、目标及自净有关。手册要点：它取决于环境组成、污染物性质、本底水平和净化条件，并随条件及目标改变，不是固定不变的自然常数。","source":"下编 E1-D03、公式F1-01"},{"id":675,"book":"环境","chapter":"第1章 绪论","kp":"排放负荷与去除率","q":"污水量12000 m³/d，处理前浓度180 mg/L、处理后45 mg/L，污染物去除率为（ ）。","options":["135%","80%","75%","25%"],"answer":2,"explain":"解析：η=(180−45)/180=75%；处理前负荷=12000×180×10⁻³=2160 kg/d，处理后540 kg/d。25%是剩余比例。","source":"下编 K1-01"},{"id":676,"book":"环境","chapter":"第1章 绪论","kp":"日负荷计算","q":"污水量12000 m³/d、浓度180 mg/L，日污染负荷为（ ）。","options":["2 kg/d","216 kg/d","2160 kg/d","21600 kg/d"],"answer":2,"explain":"解析：L=QC=12000 m³/d×180 g/m³=2.16×10⁶ g/d=2160 kg/d（1 mg/L=1 g/m³）。1 mg/L=1 g/m³，日负荷为12000×180=2.16×10⁶ g/d=2160 kg/d，216和21600 kg/d都是单位换算差了10倍的结果。","source":"下编 K1-01、公式F1-01"},{"id":677,"book":"环境","chapter":"第1章 绪论","kp":"简化水环境容量","q":"湖库体积1.0×10⁵ m³，目标浓度1.0 mg/L、本底0.1 mg/L，忽略自净，静态容量W=V(S−B)为（ ）。","options":["100.0 kg","10.0 kg","90.0 kg","9.0 kg"],"answer":2,"explain":"解析：W=1.0×10⁵ m³×(1.0−0.1) g/m³=9.0×10⁴ g=90.0 kg。只用S不扣本底会高估为100 kg。","source":"下编 公式F1-01、K1-02"},{"id":678,"book":"环境","chapter":"第2章 大气环境","kp":"大气五层","q":"环境下编按温度垂直结构把大气自下而上分为（ ）。","options":["对流层、平流层、中间层、热成层和散逸层","近地层、边界层、自由大气、平流层和高空热层","平流层、对流层、中间层、热成层、散逸层","对流层、臭氧层、电离层、散逸层"],"answer":0,"explain":"解析：下编E2-D01：五层顺序；热成层与电离层划分依据不同、范围重叠。手册要点：按温度垂直结构，自下而上为对流层、平流层、中间层、热成层和散逸层。","source":"下编 E2-D01"},{"id":679,"book":"环境","chapter":"第2章 大气环境","kp":"气体与颗粒区别","q":"下列关于大气组成的说法错误的是（ ）。","options":["干空气以氮、氧为主","气溶胶是悬浮的固体或液体颗粒","CO₂含量少却影响辐射","SO₂、NOx本身属于颗粒物"],"answer":3,"explain":"解析：下编E2-D01易错：不能把气态SO₂、NOx统称为颗粒物，它们是颗粒物（二次）前体。手册要点：气溶胶是空气中悬浮的固体或液体颗粒，不能把气态SO2、NOx本身统称为颗粒物。","source":"下编 E2-D01"},{"id":680,"book":"环境","chapter":"第2章 大气环境","kp":"大气污染定义","q":"大气污染的判定通常需考虑（ ）。","options":["只看烟气颜色深浅和有无异味，与持续时间无关","只看污染源排放量大小","污染物浓度达到一定程度并持续一定时间，对人或环境造成危害","只要有人为排放就属于大气污染"],"answer":2,"explain":"解析：下编E2-D02：浓度与时间、危害；取决于输入与清除（源—汇）平衡。手册要点：大气污染是物质或有害因子进入大气后，达到足够的浓度并持续足够时间，从而危害健康、生物、材料或环境用途的现象。","source":"下编 E2-D02"},{"id":681,"book":"环境","chapter":"第2章 大气环境","kp":"源汇平衡","q":"某地大气污染物浓度主要取决于（ ）。","options":["只取决于气象条件","只取决于排放量","只取决于地形，与排放量和气象条件均无关系","排放（源）与清除（汇）的平衡及气象条件"],"answer":3,"explain":"解析：下编E2-D02：输入清除；排放与气象共同决定。手册要点：大气污染是物质或有害因子进入大气后，达到足够的浓度并持续足够时间，从而危害健康、生物、材料或环境用途的现象。","source":"下编 E2-D02"},{"id":682,"book":"环境","chapter":"第2章 大气环境","kp":"PM10与PM2.5","q":"PM10与PM2.5的关系是（ ）。","options":["二者完全相同","二者互不包含","PM10包含在PM2.5之中","PM2.5包含在PM10之中"],"answer":3,"explain":"解析：下编E2-D03：按空气动力学直径，PM10≤10 μm包含PM2.5。手册要点：PM₁₀和PM₂.₅分别以空气动力学当量直径不大于10 μm和2.5 μm界定，后者属于前者的一部分。","source":"下编 E2-D03"},{"id":683,"book":"环境","chapter":"第2章 大气环境","kp":"逆温定义环境","q":"在环境学中，逆温是指（ ）。","options":["气温随高度增加而降低，层结不稳定的现象","湿度随高度增加而增大的现象","气温随高度增加而升高的现象，层结稳定","气压随高度增加"],"answer":2,"explain":"解析：下编E2-D04：环境气温负梯度为正常递减，逆温随高升温、稳定。手册要点：逆温指一定气层内气温随高度升高而上升，此时递减率为负。","source":"下编 E2-D04"},{"id":684,"book":"环境","chapter":"第2章 大气环境","kp":"干稳定度判据","q":"用气块法判别某气层时，若实测Γ超过Γd，该气层应判为（ ）。","options":["逆温层结","中性","稳定","不稳定"],"answer":3,"explain":"解析：下编公式F2-02：Γ>Γd不稳定；Γ=Γd中性；Γ<Γd稳定。实际递减率大于干绝热率时，气块上升后比环境暖，会继续加速上升，所以是不稳定，逆温则对应Γ<0，非常稳定。","source":"下编 公式F2-02"},{"id":685,"book":"环境","chapter":"第2章 大气环境","kp":"污染源按形状","q":"按排放源形状，污染源可分为（ ）。","options":["固定源和流动源两类","点源、线源和面源","高架源和地面源","天然源和人为源"],"answer":1,"explain":"解析：下编E2-C01：点线面按几何形状；固定移动按是否运动；天然人为按成因。手册要点：人为源还可按空间形式分点源、线源和面源，按位置分固定源与移动源，按高度分高架源与地面源，按时间分连续、间断和瞬时源。","source":"下编 E2-C01"},{"id":686,"book":"环境","chapter":"第2章 大气环境","kp":"流动源","q":"机动车属于（ ）。","options":["流动（移动）源","天然源","固定源","面源中的固定点源"],"answer":0,"explain":"解析：下编E2-C01：按排放源是否移动，可分固定源与移动源。机动车、船舶、飞机等随运行排放，属于流动（移动）源；工厂烟囱属于固定源。","source":"下编 E2-C01"},{"id":687,"book":"环境","chapter":"第2章 大气环境","kp":"CO危害","q":"CO的主要健康危害是（ ）。","options":["破坏平流层臭氧层，增加紫外辐射","致癌","与血红蛋白结合形成碳氧血红蛋白，阻碍输氧","刺激呼吸道并在大气中形成酸雨"],"answer":2,"explain":"解析：下编E2-C03：CO主要来自不完全燃烧，与血红蛋白结合能力远高于O₂。CO与血红蛋白的结合能力约为O₂的200多倍，会使血液输氧能力下降，它不破坏臭氧层，也不是酸雨前体物。","source":"下编 E2-C03"},{"id":688,"book":"环境","chapter":"第2章 大气环境","kp":"SO2来源","q":"大气SO₂的主要人为来源是（ ）。","options":["汽车尾气中排放的CO和CO₂","海洋","植物排放","含硫燃料（煤）的燃烧"],"answer":3,"explain":"解析：下编E2-C03：含硫燃烧；SO₂是酸雨和硫酸盐的前体。手册要点：二氧化硫主要来自含硫燃料燃烧及含硫矿物加工，也有天然来源，可刺激呼吸系统，并转化为硫酸和硫酸盐。","source":"下编 E2-C03"},{"id":689,"book":"环境","chapter":"第2章 大气环境","kp":"NOx组成","q":"燃烧排放的NOx主要以哪种形式为主（ ）。","options":["N₂O","NO","NO₂","NH₃"],"answer":1,"explain":"解析：下编E2-C03：燃烧产生的NOx以NO为主，在大气中被氧化为NO₂，是光化学烟雾和硝酸盐前体。高温燃烧时空气中的N₂与O₂反应主要生成NO，排出后再逐步氧化为NO₂，N₂O和NH₃不是燃烧NOx的主要形式。","source":"下编 E2-C03"},{"id":690,"book":"环境","chapter":"第2章 大气环境","kp":"煤烟型污染","q":"煤烟型（伦敦型）污染的主要特征是（ ）。","options":["只发生在夜间","SO₂与颗粒物为主，多在冬季低温高湿、逆温时出现","NOx与VOCs为主，夏季强日照","以O₃为主，多出现在夏季午后强日照条件下"],"answer":1,"explain":"解析：下编E2-C04：煤烟型SO₂颗粒、低温高湿逆温；光化学烟雾NOx与VOCs、日照氧化。手册要点：煤烟型污染与含硫燃料燃烧排放的二氧化硫和颗粒物密切相关，常在低温、高湿、静风和逆温条件下积累，并伴随硫酸等二次生成。","source":"下编 E2-C04"},{"id":691,"book":"环境","chapter":"第2章 大气环境","kp":"光化学烟雾特征","q":"光化学烟雾（洛杉矶型）的特征是（ ）。","options":["主要成分为CO，在交通高峰时积累","SO₂与煤烟在冬季静风高湿条件下积累","NOx和VOCs在强日照下反应生成O₃、PAN等二次污染物","只出现在阴雨天，以SO₂和煤烟为主，与日照无关"],"answer":2,"explain":"解析：光化学烟雾以氮氧化物和挥发性有机物为前体，依赖日照及自由基反应，常表现为较高臭氧和强氧化性（下编E2-C04、E2-P01）。煤烟型污染与含硫燃料燃烧排放的二氧化硫和颗粒物密切相关，常在低温、高湿、静风和逆温条件下积累，并伴随硫酸等二次生成。","source":"下编 E2-C04"},{"id":692,"book":"环境","chapter":"第2章 大气环境","kp":"复合污染","q":"当代我国大城市大气污染的特征是（ ）。","options":["只有燃煤产生的煤烟型污染","没有二次污染","只有以O₃为代表的光化学型污染","煤烟型与机动车尾气型并存的区域性复合污染"],"answer":3,"explain":"解析：二者在污染源、气象背景和关键产物上不同，但现实城市可同时受燃煤、交通及区域输送影响，形成复合污染，不能仅按季节或可见烟色作唯一判别（下编E2-C04关键词“复合污染”）。煤烟型污染与含硫燃料燃烧排放的二氧化硫和颗粒物密切相关，常在低温、高湿、静风和逆温条件下积累，并伴随硫酸等二次生成。","source":"下编 E2-C04"},{"id":693,"book":"环境","chapter":"第2章 大气环境","kp":"辐射逆温","q":"晴朗无风夜晚地面强烈辐射冷却形成的逆温是（ ）。","options":["下沉逆温","平流逆温","辐射逆温","锋面逆温"],"answer":2,"explain":"解析：下编E2-C05：五种逆温——辐射冷却、下沉压缩、暖平流冷地面、冷空气汇聚（地形）、锋面暖上冷下。手册要点：辐射逆温源于晴朗微风夜间地面辐射冷却，近地空气降温更强。","source":"下编 E2-C05"},{"id":694,"book":"环境","chapter":"第2章 大气环境","kp":"下沉逆温","q":"高压控制区空气下沉压缩增温形成的逆温是（ ）。","options":["辐射逆温","平流逆温","下沉逆温","湍流逆温"],"answer":2,"explain":"解析：下编E2-C05：下沉压缩增温，常在高空较厚，范围广。手册要点：下沉逆温源于高压区气层下沉压缩，不同高度增温使稳定层结增强。","source":"下编 E2-C05"},{"id":695,"book":"环境","chapter":"第2章 大气环境","kp":"平流逆温","q":"暖空气流到冷地面上形成的逆温是（ ）。","options":["下沉逆温","辐射逆温","锋面逆温","平流逆温"],"answer":3,"explain":"解析：平流逆温由暖空气流到冷地面后下部冷却形成（下编E2-C05）。辐射逆温源于晴朗微风夜间地面辐射冷却，近地空气降温更强。","source":"下编 E2-C05"},{"id":696,"book":"环境","chapter":"第2章 大气环境","kp":"锋面逆温","q":"锋面逆温形成的原因是（ ）。","options":["高压区空气下沉压缩增温","夜间地面辐射冷却","冷空气流到山谷","锋面附近暖空气在上、冷空气在下"],"answer":3,"explain":"解析：锋面逆温源于暖空气位于较冷空气之上（下编E2-C05）。平流逆温由暖空气流到冷地面后下部冷却形成。","source":"下编 E2-C05"},{"id":697,"book":"环境","chapter":"第2章 大气环境","kp":"地形逆温","q":"山谷中夜间冷空气沿坡下沉汇聚形成的逆温是（ ）。","options":["平流逆温","地形逆温","下沉逆温","锋面逆温"],"answer":1,"explain":"解析：下编E2-C05：冷空气汇聚，与山风相关。手册要点：地形逆温常由坡面冷空气沿坡下滑、在谷底积聚形成。","source":"下编 E2-C05"},{"id":698,"book":"环境","chapter":"第2章 大气环境","kp":"翻卷形","q":"烟流呈波浪状上下翻卷（翻卷形/波浪形）时，大气层结为（ ）。","options":["稳定逆温","不稳定","上稳下不稳","中性"],"answer":1,"explain":"解析：下编E2-C06：翻卷形不稳定，地面污染浓度时高时低。手册要点：不稳定层结常出现翻卷形，扩散快但高架烟流也可能在近处落地。","source":"下编 E2-C06"},{"id":699,"book":"环境","chapter":"第2章 大气环境","kp":"锥形烟流","q":"锥形烟流出现时的大气层结通常为（ ）。","options":["强不稳定","强逆温","中性或弱稳定","上部逆温、下部不稳定"],"answer":2,"explain":"解析：下编E2-C06：锥形对应中性，扩散对称。中性或弱稳定时，水平与垂直扩散相近，烟流呈对称的锥形，强不稳定时呈翻卷形，强逆温时呈扇形，上逆下不稳时呈熏烟形。","source":"下编 E2-C06"},{"id":700,"book":"环境","chapter":"第2章 大气环境","kp":"爬升形","q":"爬升形（屋脊形）烟流的层结配置是（ ）。","options":["全层不稳定，烟流上下翻卷","下部不稳定、上部稳定，烟流主要向下方地面扩散","下部稳定、上部不稳定，污染物主要向上扩散","全层逆温"],"answer":2,"explain":"解析：下编E2-C06：爬升形常见于日落后地面逆温形成时，对地面影响较小。手册要点：排口下方稳定、上方不稳定时易出现爬升形，下向扩散受抑。","source":"下编 E2-C06"},{"id":701,"book":"环境","chapter":"第2章 大气环境","kp":"重力沉降室","q":"重力沉降室主要用于去除（ ）。","options":["较大颗粒（粒径数十微米以上）","挥发性有机物VOCs","粒径≤2.5 μm的细颗粒物","气态SO₂"],"answer":0,"explain":"解析：下编E2-C07：利用重力沉降，结构简单、效率低，用于预除尘。重力沉降室靠颗粒自身重量在低速气流中沉降，只对数十微米以上的大颗粒有效，对PM2.5、SO₂和VOCs基本无效。","source":"下编 E2-C07"},{"id":702,"book":"环境","chapter":"第2章 大气环境","kp":"旋风除尘","q":"旋风除尘器的原理是（ ）。","options":["利用旋转气流产生的离心力分离颗粒","利用滤料对颗粒的拦截作用","利用电场使颗粒荷电后沉积","利用液滴捕集"],"answer":0,"explain":"解析：下编E2-C07：沉降、离心、液滴、过滤、静电，按工况选型。手册要点：旋风除尘利用离心分离，设备紧凑但细颗粒效率有限。","source":"下编 E2-C07"},{"id":703,"book":"环境","chapter":"第2章 大气环境","kp":"静电除尘","q":"静电除尘器的工作原理是（ ）。","options":["利用化学吸收剂与颗粒反应","利用颗粒自身的重力，在沉降室中自然沉降分离","利用旋转气流的离心力分离","使颗粒荷电，在电场力作用下沉积到集尘极"],"answer":3,"explain":"解析：下编E2-C07：荷电电场，效率高，适合大气量烟气。手册要点：静电除尘使颗粒荷电后在电场中收集，适合大气量，性能受粉尘电阻等影响。","source":"下编 E2-C07"},{"id":704,"book":"环境","chapter":"第2章 大气环境","kp":"袋式除尘","q":"袋式（过滤式）除尘器的特点是（ ）。","options":["几乎无压降，不受温湿度影响","可同时脱硫","只能去除大颗粒，对细颗粒效率低","对细颗粒效率高，但受烟气温湿度和滤料限制"],"answer":3,"explain":"解析：下编E2-C07：过滤，选型需考虑工况。手册要点：袋式过滤靠滤料及粉尘层截留颗粒，对细颗粒有较高效率，需控制温湿度和阻力。","source":"下编 E2-C07"},{"id":705,"book":"环境","chapter":"第2章 大气环境","kp":"湿式除尘","q":"湿式除尘器的缺点之一是（ ）。","options":["产生需处理的污水，可能腐蚀设备","除尘效率极低，完全不能用于工业烟气","无需用水，但效率随温度下降","不能去除颗粒"],"answer":0,"explain":"解析：下编E2-C07：液滴捕集；带来废水和腐蚀问题。手册要点：湿式除尘利用液滴捕集，可兼顾部分可溶气体，但产生含污液和腐蚀问题。","source":"下编 E2-C07"},{"id":706,"book":"环境","chapter":"第2章 大气环境","kp":"NO滴定环境","q":"夜间城区近地面O₃常较低，主要因为（ ）。","options":["夜间降雨对O₃的湿清除","夜间风大使O₃扩散稀释","夜间O₃直接排放少，且白天生成的O₃全部被雨水清除","新排放的NO与O₃反应（NO滴定）"],"answer":3,"explain":"解析：下编公式F2-01：NO+O₃→NO₂+O₂，夜间无光解补充。夜间没有光照，NO₂不能光解补充O₃，城区新排放的NO持续消耗O₃，所以近地面O₃偏低，主要原因不是降雨或大风。","source":"下编 公式F2-01"},{"id":707,"book":"环境","chapter":"第2章 大气环境","kp":"风与污染","q":"风对大气污染物的作用是（ ）。","options":["输送和稀释，风速越大稀释越强","风只改变方向","无作用","风速越大，地面浓度就一定越高"],"answer":0,"explain":"解析：下编E2-P02：输送稀释；但高架源有效源高随风速减小，需综合判断。手册要点：风首先通过平流输送决定污染物主要去向，并通过通风稀释影响浓度。","source":"下编 E2-P02"},{"id":708,"book":"环境","chapter":"第2章 大气环境","kp":"湍流类型","q":"大气湍流按成因分为（ ）。","options":["机械湍流和热力湍流","层流和紊流","水平湍流和垂直湍流两类","正湍流和负湍流"],"answer":0,"explain":"解析：下编E2-P02：机械与热力湍流。手册要点：机械湍流受风速梯度与地表粗糙度影响，热力湍流受地表加热和大气稳定度影响。","source":"下编 E2-P02"},{"id":709,"book":"环境","chapter":"第2章 大气环境","kp":"混合层与污染","q":"混合层高度越低，地面污染物浓度一般（ ）。","options":["不变","与混合层无关","越高","越低"],"answer":2,"explain":"解析：下编E2-P02：混合层限制了垂直扩散空间。手册要点：温度层结通过改变气块浮力、稳定度和混合层发展，间接控制污染物扩散。","source":"下编 E2-P02"},{"id":710,"book":"环境","chapter":"第2章 大气环境","kp":"城市热岛","q":"城市热岛环流对城市污染的影响是（ ）。","options":["使污染物远离城市向郊区扩散","只在白天降低城区污染浓度","郊区近地面空气流入城区，可将郊区工厂污染带入城市","对城市污染没有影响，热岛环流只改变气温分布"],"answer":2,"explain":"解析：下编E2-P04：城升郊入，形成局地回流，布局需避开。手册要点：城市较郊区温暖时，城区空气上升，近地郊区空气向城区流入，高处向外辐散形成热岛环流。","source":"下编 E2-P04"},{"id":711,"book":"环境","chapter":"第2章 大气环境","kp":"海陆风污染","q":"海陆风对沿海城市污染的可能影响是（ ）。","options":["一定把污染物吹向海上清除","局地环流使污染物在海陆间往返，可能造成重复污染","只在冬季出现，与污染无关","与污染无关，海陆风只影响气温和湿度"],"answer":1,"explain":"解析：下编E2-P04：局地回流，影响布局。手册要点：这些局地环流可输送、回流或汇集污染物，转换期、海风锋及稳定边界层会改变污染落地位置，因此污染源布局不能只看单一时刻风向。","source":"下编 E2-P04"},{"id":712,"book":"环境","chapter":"第2章 大气环境","kp":"脱硫分类环境","q":"烟气脱硫按吸收剂与产物状态可分为（ ）。","options":["物理法和化学法","燃前、燃中、燃后三类","一级、二级、三级","湿法、干法和半干法"],"answer":3,"explain":"解析：按吸收剂和产物的状态，烟气脱硫分为湿法、干法和半干法。湿法用浆液吸收并得到湿态产物（如石灰石—石膏法），干法用干粉吸收剂、产物为干态，半干法介于两者之间。“燃前、燃中、燃后”是按脱硫环节划分，不是按吸收剂和产物状态划分。","source":"下编 E2-P05（2023卷考点）","tag":"2023卷考点"},{"id":713,"book":"环境","chapter":"第2章 大气环境","kp":"石灰石石膏法原理","q":"石灰石—石膏法脱硫的主要过程是（ ）。","options":["石灰石浆液吸收SO₂中和，氧化生成石膏结晶后分离","高温分解SO₂生成单质硫，再冷凝回收硫磺","活性炭吸附SO₂后解吸制硫酸","用氨水吸收SO₂并还原为单质硫"],"answer":0,"explain":"解析：下编E2-P05：吸收中和、氧化结晶、石膏分离；问题有废水、结垢、腐蚀。手册要点：湿式石灰石—石膏法使烟气与石灰石浆液接触，二氧化硫进入液相后被中和，亚硫酸盐经氧化并结晶形成石膏，经过固液分离后排出副产物。","source":"下编 E2-P05"},{"id":714,"book":"环境","chapter":"第2章 大气环境","kp":"石膏法总反应","q":"石灰石—石膏法的总反应产物是（ ）。","options":["CaSO₃和H₂O","Ca(OH)₂、SO₃和水蒸气","CaSO₄·2H₂O和CO₂","CaS和O₂（还原产物）"],"answer":2,"explain":"解析：下编公式F2-06：CaCO₃+SO₂+½O₂+2H₂O→CaSO₄·2H₂O+CO₂。石灰石中的CaCO₃吸收SO₂并被氧化，生成石膏CaSO₄·2H₂O，同时放出CO₂，CaS是还原产物，不会在这一氧化工艺中生成。","source":"下编 公式F2-06"},{"id":715,"book":"环境","chapter":"第2章 大气环境","kp":"石膏法问题","q":"湿法石灰石—石膏法存在的主要问题是（ ）。","options":["脱硫效率极低，难以稳定达标","设备结垢、腐蚀和脱硫废水","不产生任何副产物","只能脱除NOx"],"answer":1,"explain":"解析：湿式石灰石—石膏法使烟气与石灰石浆液接触，二氧化硫进入液相后被中和，亚硫酸盐经氧化并结晶形成石膏，经过固液分离后排出副产物（下编E2-P05关键词“废水结垢腐蚀”）。同时需控制结垢、腐蚀、浆液与废水，并处理石膏去向。","source":"下编 E2-P05"},{"id":716,"book":"环境","chapter":"第2章 大气环境","kp":"三元催化","q":"汽车三元催化转化器可同时净化（ ）。","options":["O₃、PAN和NO₂","SO₂、CO₂和颗粒物三类","CH₄、N₂O和CO₂","CO、碳氢化合物和NOx"],"answer":3,"explain":"解析：下编E2-P06：CO氧化、烃氧化、NOx还原。手册要点：三元催化净化利用催化剂同时促进三类主要污染物转化：将一氧化碳和未燃烃氧化为二氧化碳和水，将氮氧化物还原为氮气。","source":"下编 E2-P06"},{"id":717,"book":"环境","chapter":"第2章 大气环境","kp":"三元催化条件","q":"三元催化转化器高效工作的关键条件是（ ）。","options":["使用含铅汽油以提高催化活性","空燃比越高越好，越稀越有利","空燃比控制在理论值附近且达到催化起燃温度","在低温冷启动阶段才能达到最高效率"],"answer":2,"explain":"解析：三元催化净化利用催化剂同时促进三类主要污染物转化：将一氧化碳和未燃烃氧化为二氧化碳和水，将氮氧化物还原为氮气（下编E2-P06关键词“空燃比；催化温度”）。有效运行需使空燃比在适宜范围内，并保持催化剂所需温度与活性。","source":"下编 E2-P06"},{"id":718,"book":"环境","chapter":"第2章 大气环境","kp":"大气综合防治","q":"大气污染综合防治的原则不包括（ ）。","options":["重视二次污染和区域联防联控","以区域环境质量为目标","源头、过程和末端控制相结合","把污染从大气转移到水体即视为治理成功"],"answer":3,"explain":"解析：大气污染综合防治以区域环境质量目标为统领，把能源、产业、交通、空间布局与末端治理结合起来（下编E2-L01关键词“避免转移”）。末端依据污染物性质采用除尘、脱硫、脱硝和挥发性有机物治理。","source":"下编 E2-L01"},{"id":719,"book":"环境","chapter":"第2章 大气环境","kp":"高斯模型假设","q":"高斯扩散模型的基本假设不包括（ ）。","options":["浓度在y、z方向上均呈正态分布","连续稳定点源","风速随时间剧烈变化、源强不稳定","地面全反射（镜像）"],"answer":2,"explain":"解析：下编E2-L02：稳定连续源、高斯分布、镜像反射，有工况限制。手册要点：高斯烟羽模型用于一定条件下连续点源的平均浓度估算，典型假设为源强和平均风场稳定、横向与垂直浓度分布近似高斯、扩散过程中研究物质质量守恒，并用镜像源处理地面反射。","source":"下编 E2-L02"},{"id":720,"book":"环境","chapter":"第2章 大气环境","kp":"有效源高","q":"有效源高是指（ ）。","options":["烟囱几何高度加烟气抬升高度","烟气抬升高度（不含烟囱高度）","混合层高度（逆温层底高度）","烟囱几何高度（不含抬升）"],"answer":0,"explain":"解析：下编公式F2-03：H_e=H_s+ΔH。手册要点：Hs为几何高度，ΔH为抬升高度，He为有效源高，均为m。","source":"下编 公式F2-03"},{"id":721,"book":"环境","chapter":"第2章 大气环境","kp":"烟气抬升影响","q":"下列因素中会使烟气抬升高度增大的是（ ）。","options":["烟气出口温度明显降低","环境风速增大","烟气热释放率增大","烟气量减小"],"answer":2,"explain":"解析：下编公式F2-04：ΔH∝Q_H^n₁/u，热释放率越大、风速越小，抬升越高。热释放率越大，烟气浮力越强，抬升越高，风速增大、烟气温度降低或烟气量减小都会使抬升高度减小。","source":"下编 公式F2-04"},{"id":722,"book":"环境","chapter":"第2章 大气环境","kp":"地面浓度与源高","q":"其他条件不变时，有效源高增加，地面最大浓度（ ）。","options":["不变，与源高无关","与源高无关，只取决于排放量","降低，且出现位置后移","升高，且位置前移"],"answer":2,"explain":"解析：下编公式F2-05：指数项exp(−H_e²/2σ_z²)，源高增加使地面浓度降低。有效源高增加后，烟流扩散到地面前经历了更长的稀释距离，地面最大浓度降低，并出现在更远的下风向。","source":"下编 公式F2-05"},{"id":723,"book":"环境","chapter":"第2章 大气环境","kp":"ppm换mg/m³","q":"在25℃、1个标准大气压下监测得SO₂体积分数0.080 ppm（M=64 g/mol），质量浓度约为（ ）。","options":["0.005 mg/m³","0.209 mg/m³","0.229 mg/m³","209.287 mg/m³"],"answer":1,"explain":"解析：C=x·pM/(RT)=0.080×101325×0.064/(8.314×298.15)≈0.209 mg/m³（也可用C=xM/24.45）。22.4只适用于0℃。","source":"下编 公式F2-07、K2-01"},{"id":724,"book":"环境","chapter":"第2章 大气环境","kp":"风速幂律","q":"10 m处风速3.0 m/s，幂指数p=0.25，100 m处风速约为（ ）。","options":["4.17 m/s","30.00 m/s","6.00 m/s","5.33 m/s"],"answer":3,"explain":"解析：按幂律风廓线u=u₁(z/z₁)^p计算，u=3.0×10^0.25≈5.33 m/s。指数p随稳定度和地形而变，稳定层结和粗糙地表时p较大，计算时应采用给定的p值。","source":"下编 公式F2-03"},{"id":725,"book":"环境","chapter":"第2章 大气环境","kp":"有效源高","q":"烟囱几何高度100 m，烟气抬升高度75.98 m，有效源高为（ ）。","options":["175.98 m","75.98 m","100.00 m","24.02 m"],"answer":0,"explain":"解析：H_e=H_s+ΔH=100+75.98=175.98 m。有效源高决定地面浓度峰值位置与大小。","source":"下编 公式F2-03、K2-02"},{"id":726,"book":"环境","chapter":"第2章 大气环境","kp":"热释放率","q":"pa=1000 hPa，实际烟气量Qv=100 m³/s，Ts=400 K、Ta=290 K，Q_H=0.35p_aQ_v(Ts−Ta)/Ts约为（ ）。","options":["9625.0 kJ/s","9.6 kJ/s","35000.0 kJ/s","13275.9 kJ/s"],"answer":0,"explain":"解析：Q_H=0.35×1000×100×110/400=9625.0 kJ/s。分母应为烟气温度Ts而非环境温度Ta。","source":"下编 公式F2-04"},{"id":727,"book":"环境","chapter":"第2章 大气环境","kp":"高斯地面轴线浓度","q":"源强Q=2.0×10⁵ mg/s，u=4 m/s，σy=200 m、σz=80 m，有效源高150 m，地面轴线浓度C=Q/(πuσyσz)·exp(−He²/2σz²)约为（ ）。","options":["0.1715 mg/m³","0.3895 mg/m³","0.0858 mg/m³","0.9947 mg/m³"],"answer":0,"explain":"解析：前因子=2×10⁵/(π×4×200×80)≈0.995，指数项exp(−1.758)≈0.172，C≈0.1715 mg/m³。地面轴线式含地面全反射，分母为π而非2π。","source":"下编 公式F2-05、K2-03"},{"id":728,"book":"环境","chapter":"第2章 大气环境","kp":"脱硫效率","q":"进口SO₂ 2500 kg/h，出口100 kg/h，脱硫效率为（ ）。","options":["25%","104%","4%","96%"],"answer":3,"explain":"解析：η=(2500−100)/2500=96%。须在同一基准（同流量口径）下比较质量流量。","source":"下编 公式F2-06、K2-04"},{"id":729,"book":"环境","chapter":"第2章 大气环境","kp":"石灰石理论用量","q":"书外应用：石灰石—石膏法每小时去除SO₂ 2400 kg，按CaCO₃:SO₂=1:1（M=100、64），理论CaCO₃用量为（ ）。","options":["3750.0 kg/h","1536.0 kg/h","2400.0 kg/h","6450.0 kg/h"],"answer":0,"explain":"解析：n(SO₂)=2400/64=37.5 kmol/h，m(CaCO₃)=37.5×100=3750.0 kg/h；生成CaSO₄·2H₂O为37.5×172=6450 kg/h。按1:1摩尔比，37.5 kmol/h的SO₂需要37.5 kmol/h的CaCO₃，乘以摩尔质量100即为3750 kg/h，6450 kg/h是生成的石膏量。","source":"下编 公式F2-06、K2-04","tag":"书外应用"},{"id":730,"book":"环境","chapter":"第2章 大气环境","kp":"IAQI计算","q":"书外应用（HJ 633—2026口径）：PM2.5日均95 μg/m³，断点60→100、115→150，插值后向上进位的IAQI为（ ）。","options":["131","125","95","132"],"answer":3,"explain":"解析：IAQI=100+50/55×(95−60)≈131.8，向上进位为132。沿用旧版75断点会得125；直接舍去小数得131不符合进位规则。","source":"下编 K2-05（书外应用，HJ 633—2026）","tag":"书外应用"},{"id":731,"book":"环境","chapter":"第3章 水体环境","kp":"水循环动力","q":"自然界水循环的驱动力是（ ）。","options":["人类活动和水利工程","月球引力和地球自转","地球自转和地壳运动","太阳辐射和地球重力"],"answer":3,"explain":"解析：下编E3-D01：太阳与重力驱动，经蒸发、降水、径流完成大、小循环。手册要点：水循环是地球各种水体在太阳辐射和重力等作用下，经蒸发、输送、凝结降水、下渗及径流，不断迁移和相态转换的过程。","source":"下编 E3-D01"},{"id":732,"book":"环境","chapter":"第3章 水体环境","kp":"大小循环","q":"水的大循环是指（ ）。","options":["陆地内部的蒸发与降水循环","海洋内部的蒸发与降水","地下水内部循环","海陆之间的水分交换循环"],"answer":3,"explain":"解析：下编E3-D01：海陆间为大循环，海洋或陆地内部为小循环。海洋蒸发的水汽被输送到陆地上空形成降水，再经径流回到海洋，这才是大循环，海洋或陆地内部的循环属于小循环。","source":"下编 E3-D01"},{"id":733,"book":"环境","chapter":"第3章 水体环境","kp":"水资源可更新","q":"关于水资源的可更新性，正确的是（ ）。","options":["可通过循环更新，但年更新量有限，超采会耗竭","地下水更新极快，可任意开采","水资源不可更新，用一点少一点","水资源可无限取用，更新量不受限制"],"answer":0,"explain":"解析：水循环连接各圈层、输送物质和能量，并更新淡水资源（下编E3-D01关键词“更新有限”）。但更新速率和区域可用水量有限，不能据此推断淡水可无限取用。","source":"下编 E3-D01"},{"id":734,"book":"环境","chapter":"第3章 水体环境","kp":"DO定义","q":"溶解氧DO是指（ ）。","options":["水分子H₂O中所含的氧","水中有机物分子所含的氧元素","溶解于水中的分子态氧，常用mg/L表示","水中以化合态存在的氧"],"answer":2,"explain":"解析：下编E3-D02：分子态氧，由复氧供氧与耗氧动态平衡决定。手册要点：溶解氧DO是溶解于水中的分子态氧浓度，通常以mg/L表示，是氧供给状态及水生生物生存条件的重要指标。","source":"下编 E3-D02"},{"id":735,"book":"环境","chapter":"第3章 水体环境","kp":"DO影响因素","q":"水温升高时，水中饱和溶解氧（ ）。","options":["升高","先升后降","降低","不变"],"answer":2,"explain":"解析：气体溶解度随温度升高而降低，故夏季水体更易缺氧（下编E3-D02供耗氧平衡，E6-L05热污染互证）。气体溶解度随水温升高而降低，同时微生物耗氧加快，所以夏季或热污染水体更容易缺氧，不是“升高”或“不变”。","source":"下编 E3-D02、E6-L05"},{"id":736,"book":"环境","chapter":"第3章 水体环境","kp":"氧亏","q":"氧亏D的定义是（ ）。","options":["实际DO与饱和DO的比值","耗氧量与复氧量之和","BOD与COD之差","饱和溶解氧与实际溶解氧之差"],"answer":3,"explain":"解析：下编公式F3-01：D=C_s−C_DO。氧亏等于饱和溶解氧减去实际溶解氧，单位是mg/L，它是差值而不是比值，与BOD、COD之差无关。","source":"下编 公式F3-01"},{"id":737,"book":"环境","chapter":"第3章 水体环境","kp":"BOD定义","q":"生化需氧量BOD是指（ ）。","options":["化学氧化剂氧化水中有机物的耗氧量","水样中当前所含溶解氧的浓度","在规定条件下微生物分解水中有机物所消耗的溶解氧量","水中有机碳的总量"],"answer":2,"explain":"解析：下编E3-D03：BOD₅指20℃培养5 d。手册要点：BOD是在规定条件和培养时间内，微生物分解水中可生化降解物质所消耗的氧量，以mg O₂/L表示。","source":"下编 E3-D03"},{"id":738,"book":"环境","chapter":"第3章 水体环境","kp":"BOD5条件","q":"BOD₅的测定条件是（ ）。","options":["25℃培养5天","20℃培养5天","20℃培养20天","30℃培养3天"],"answer":1,"explain":"解析：下编E3-D03：20℃、5 d；与最终BOD（L₀）区别。手册要点：BOD₅通常指20 ℃培养5 d的测定值，用于表征可生化有机污染的耗氧负荷。","source":"下编 E3-D03"},{"id":739,"book":"环境","chapter":"第3章 水体环境","kp":"BOD5与最终BOD","q":"关于BOD₅与最终碳化需氧量L₀，正确的是（ ）。","options":["BOD₅大于L₀","BOD₅就是水中当前DO","BOD₅只是5天累积耗氧，小于L₀","二者相等，BOD₅即为最终的碳化需氧量"],"answer":2,"explain":"解析：下编K3-01、公式F3-06：BOD_t=L₀(1−e^(−k₁t))。手册要点：L₀为初始最终碳化需氧量，L(t)为剩余量，BODt为t内累积碳化耗氧，均mg O₂/L。","source":"下编 公式F3-06"},{"id":740,"book":"环境","chapter":"第3章 水体环境","kp":"COD定义","q":"化学需氧量COD是指（ ）。","options":["水样中当前所含的溶解氧量，常用mg/L表示，可用碘量法测定","规定条件下用强氧化剂（如重铬酸钾）氧化水样所消耗氧化剂折算的氧量","微生物分解有机物所消耗的溶解氧","水中有机物所含碳的总量"],"answer":1,"explain":"解析：下编E3-C03：COD还包含无机还原性物质的耗氧。手册要点：COD是在规定试验条件下，水样中可被指定化学氧化剂氧化的物质所对应的耗氧量，通常以mg O₂/L表示，既受有机物也受部分无机还原物影响。","source":"下编 E3-C03"},{"id":741,"book":"环境","chapter":"第3章 水体环境","kp":"COD与BOD","q":"同一水样COD一般大于BOD₅，原因是（ ）。","options":["COD只测无机物，BOD只测有机物","BOD测定时间更长，氧化更彻底","二者测定原理相同，只是氧化时间不同","化学氧化可氧化难生物降解有机物及部分还原性无机物"],"answer":3,"explain":"解析：下编E3-C03：方法差异；BOD₅/COD可反映可生化性。手册要点：COD是在规定试验条件下，水样中可被指定化学氧化剂氧化的物质所对应的耗氧量，通常以mg O₂/L表示，既受有机物也受部分无机还原物影响。","source":"下编 E3-C03"},{"id":742,"book":"环境","chapter":"第3章 水体环境","kp":"TOC","q":"TOC表示（ ）。","options":["总需氧量","总有机碳","总氮","总磷"],"answer":1,"explain":"解析：下编E3-C03：TOC为有机碳总量，TOD为总需氧量。手册要点：TOC按有机碳质量计量，TOD按规定高温催化氧化的总耗氧量计量。","source":"下编 E3-C03"},{"id":743,"book":"环境","chapter":"第3章 水体环境","kp":"水体概念","q":"环境学中“水体”的含义是（ ）。","options":["只指不含杂质的纯水","只指地下含水层中储存和流动的地下水","包括水、水中悬浮物、底泥及水生生物的完整生态系统","只指流动的河流水"],"answer":2,"explain":"解析：下编E3-C01：水相、底泥生物；介质转移需整体考虑。手册要点：水体还包括底泥、悬浮物、胶体及水生生物，应作为自然综合体研究。","source":"下编 E3-C01"},{"id":744,"book":"环境","chapter":"第3章 水体环境","kp":"点源面源","q":"农田径流携带化肥农药入河属于（ ）。","options":["工业排口排放","固定点排放","点源污染（集中排放）","面源（非点源）污染"],"answer":3,"explain":"解析：下编E3-C02：点源有固定排口，面源随径流分散排放。手册要点：面源经降水径流等分散进入水体，如农田氮磷和城市地面冲刷污染，常有事件性、分散性和治理难度大的特点。","source":"下编 E3-C02"},{"id":745,"book":"环境","chapter":"第3章 水体环境","kp":"水污染物分类","q":"水污染物按性质可分为（ ）。","options":["高架源与地面源污染物","一次与二次污染物","有机污染物与气态污染物","物理性、化学性和生物性污染物"],"answer":3,"explain":"解析：污染物可按性质分物理性、化学性和生物性：分别如热与悬浮物、耗氧有机物与重金属、病原微生物（下编E3-C02：三类污染物）。水污染源按来源可分自然源和人为源，按入水途径可分点源和面源。","source":"下编 E3-C02"},{"id":746,"book":"环境","chapter":"第3章 水体环境","kp":"水体自净","q":"水体自净是指（ ）。","options":["水体冻结或蒸发后污染物会自然消失的过程，无需物理、化学或生物作用","人工建设污水处理厂处理污水","污染物进入水体后，经物理、化学、生物作用使浓度降低、水质恢复的过程","水体蒸发浓缩使污染物沉淀"],"answer":2,"explain":"解析：下编E3-C04：恢复过程，自净能力有限，与水环境容量相关。手册要点：水体自净是污染物经物理、化学及生物作用后，水质向较好状态恢复的自然过程，包括稀释扩散、沉降吸附、氧化还原及生物降解等。","source":"下编 E3-C04"},{"id":747,"book":"环境","chapter":"第3章 水体环境","kp":"水环境容量","q":"水环境容量与下列因素无关的是（ ）。","options":["排污企业的经济效益","水体本底浓度","水质目标","水文条件与自净能力"],"answer":0,"explain":"解析：下编E3-C04、公式F3-04：W=V(S−B)+C_net。水环境容量由水体本底浓度、水质目标以及水文条件和自净能力决定，企业经济效益不影响水体能容纳多少污染物。","source":"下编 公式F3-04"},{"id":748,"book":"环境","chapter":"第3章 水体环境","kp":"推流扩散","q":"河流中污染物随水流平均速度向下游移动的过程称为（ ）。","options":["衰减转化","分子扩散作用","纵向弥散","推流（平流）迁移"],"answer":3,"explain":"解析：下编E3-C05：推流是平均携带；扩散源于随机脉动；弥散源于断面流速差。手册要点：推流是平均水流携带污染物迁移，理想情况下只改变位置，不单独降低浓度峰值。","source":"下编 E3-C05"},{"id":749,"book":"环境","chapter":"第3章 水体环境","kp":"弥散","q":"纵向弥散产生的原因是（ ）。","options":["微生物的生物降解作用","水分子的热运动","化学反应","断面上流速分布不均"],"answer":3,"explain":"解析：弥散则与采用断面平均描述时实际流速分布不均有关（下编E3-C05）。河流断面上中心流速快、近岸流速慢，用断面平均流速描述时，这种差异使污染物沿程拉长，就是纵向弥散。","source":"下编 E3-C05"},{"id":750,"book":"环境","chapter":"第3章 水体环境","kp":"衰减作用","q":"推流与扩散改变的是污染物的空间分布，而真正使污染物总量减少的是（ ）。","options":["推流迁移","衰减（降解、转化等反应）","稀释（与上游来的清洁水混合）","纵向弥散"],"answer":1,"explain":"解析：衰减指研究物质因反应、降解等减少，非保守污染物才需在迁移方程中加入相应反应项（下编E3-C05关键词“分布与总量；反应衰减”）。推流是平均水流携带污染物迁移，理想情况下只改变位置，不单独降低浓度峰值。","source":"下编 E3-C05"},{"id":751,"book":"环境","chapter":"第3章 水体环境","kp":"硝化反硝化","q":"氮在水体中的转化顺序（好氧条件）是（ ）。","options":["氨氮→有机氮→硝酸盐氮→亚硝酸盐氮","N₂→氨氮→有机氮","有机氮→氨氮→亚硝酸盐氮→硝酸盐氮","硝酸盐氮→亚硝酸盐氮→氨氮→有机氮"],"answer":2,"explain":"解析：下编E3-C06：氨化、硝化；反硝化在缺氧条件下将硝酸盐还原为N₂。手册要点：含氮有机物可经氨化形成氨氮，好氧条件下再经硝化生成亚硝酸盐和硝酸盐。","source":"下编 E3-C06"},{"id":752,"book":"环境","chapter":"第3章 水体环境","kp":"内源负荷","q":"湖泊外源污染被截断后富营养化仍持续，原因可能是（ ）。","options":["鱼类减少使藻类被捕食减少","底泥中磷等营养盐释放形成内源负荷","氮气从水面逸出","水温降低"],"answer":1,"explain":"解析：下编E3-C06、E3-P05：磷沉淀与释放，内源负荷。多年沉积在底泥中的磷，在缺氧等条件下会重新释放到水中，形成内源负荷，所以截断外源后富营养化仍会持续一段时间。","source":"下编 E3-C06"},{"id":753,"book":"环境","chapter":"第3章 水体环境","kp":"质量与排放标准","q":"环境质量标准与污水排放标准的区别是（ ）。","options":["前者针对排放口，后者针对受纳环境","二者相同","后者针对水体功能区目标","前者针对受纳环境功能目标，后者针对排放口"],"answer":3,"explain":"解析：环境质量标准规定受纳环境在不同功能与保护目标下的质量要求，评价对象是水体或相应环境（下编E3-C07）。污水排放标准规定排放口污染物的允许排放要求，约束对象是排污行为。","source":"下编 E3-C07"},{"id":754,"book":"环境","chapter":"第3章 水体环境","kp":"处理程度分级","q":"污水二级处理的主要去除对象是（ ）。","options":["重金属和溶解性盐类","可生化降解的有机物（BOD）和悬浮物","漂浮物、砂粒等粗大颗粒及油脂","氮磷及难降解物"],"answer":1,"explain":"解析：下编E3-C08：一级去除固体，二级生化去除有机物，三级针对特定残余。手册要点：按处理程度，一级以去除漂浮物、砂粒和可沉悬浮物为主，二级主要强化可生化有机物及悬浮物去除，三级或深度处理针对特定残余污染物及回用目标进一步处理。","source":"下编 E3-C08"},{"id":755,"book":"环境","chapter":"第3章 水体环境","kp":"一级处理","q":"污水一级处理主要采用（ ）。","options":["格栅、沉砂、初沉等物理方法","反渗透等膜分离方法","活性污泥法等生物方法","臭氧氧化"],"answer":0,"explain":"解析：按作用原理，污水处理可分物理法、化学法、生物法及物理化学法，分别利用分离、化学反应、微生物代谢和吸附膜分离等过程（下编E3-C08）。按处理程度，一级以去除漂浮物、砂粒和可沉悬浮物为主，二级主要强化可生化有机物及悬浮物去除，三级或深度处理针对特定残余污染物及回用目标进一步处理。","source":"下编 E3-C08"},{"id":756,"book":"环境","chapter":"第3章 水体环境","kp":"二级与水质类别","q":"关于“二级处理”，下列说法正确的是（ ）。","options":["是处理程度的分级，不是地表水Ⅱ类水质，也不必然完成脱氮除磷","二级处理可满足任何回用要求，一定能完成脱氮除磷","二级出水就是地表水Ⅱ类水质","二级处理只用化学法，不用生物法"],"answer":0,"explain":"解析：二级出水不一定完成脱氮除磷、消毒或难降解物去除，应依据出水目标选择后续单元（下编E3-C08易失分）。按处理程度，一级以去除漂浮物、砂粒和可沉悬浮物为主，二级主要强化可生化有机物及悬浮物去除，三级或深度处理针对特定残余污染物及回用目标进一步处理。","source":"下编 E3-C08"},{"id":757,"book":"环境","chapter":"第3章 水体环境","kp":"活性污泥法","q":"活性污泥法属于（ ）。","options":["物理化学法（活性炭吸附和过滤）","悬浮生长的好氧生物处理法","附着生长的生物膜法","厌氧处理"],"answer":1,"explain":"解析：下编E3-C09：曝气、二沉、污泥回流、排剩余污泥。生物膜法为附着生长。","source":"下编 E3-C09"},{"id":758,"book":"环境","chapter":"第3章 水体环境","kp":"生物膜法","q":"生物滤池、生物转盘属于（ ）。","options":["化学沉淀法","混凝法","活性污泥法（悬浮生长）","生物膜法（附着生长）"],"answer":3,"explain":"解析：生物膜法主要利用附着在填料或载体表面的微生物膜，与流过或接触的废水交换底物和氧（下编E3-C09）。活性污泥法主要利用悬浮生长微生物絮体，在曝气池中吸附和降解有机物，再通过二沉池泥水分离，部分污泥回流维持生物量，剩余污泥排出。","source":"下编 E3-C09"},{"id":759,"book":"环境","chapter":"第3章 水体环境","kp":"厌氧处理","q":"厌氧生物处理适用于（ ）。","options":["重金属去除","低浓度生活污水深度处理","消毒","高浓度有机废水，并可回收沼气"],"answer":3,"explain":"解析：下编E3-C10：厌氧多菌协作，适合高浓度，产沼气；出水常需好氧后处理。手册要点：厌氧处理在无氧条件下由多类微生物协作分解有机物，常适合高浓度有机废水及污泥稳定化，可回收沼气，但启动、温度和抑制物控制要求较高。","source":"下编 E3-C10"},{"id":760,"book":"环境","chapter":"第3章 水体环境","kp":"一维水质模型","q":"建立一维稳态河流水质模型时，首先需要（ ）。","options":["假定稳定、断面充分混合，并按流量加权计算起始浓度","任意选择边界，不考虑混合","直接取排污口浓度作为起始浓度","直接取排污口浓度，不考虑河流流量与混合"],"answer":0,"explain":"解析：下编E3-P01：稳定充分混合、流量加权、统一单位、含弥散根、边界。手册要点：一维稳态计算先检查流量和排放是否近似稳定、横断面是否充分混合，再以流量加权质量守恒求初始浓度。","source":"下编 E3-P01"},{"id":761,"book":"环境","chapter":"第3章 水体环境","kp":"弥散忽略条件","q":"一维稳态衰减模型中可以忽略纵向弥散的条件是（ ）。","options":["衰减系数很大（降解占主导）","河流流速很慢、弥散作用明显","弥散系数很大（弥散占主导）","ε=4kD_x/u²很小（推流占主导）"],"answer":3,"explain":"解析：ε=4kD_x/u²表示衰减与弥散的共同作用相对推流的大小，ε很小说明推流占主导。此时含弥散与不含弥散的一维稳态解几乎相同，可以忽略纵向弥散，直接用C=C₀exp(−kx/u)计算。","source":"下编 公式F3-05、K3-03"},{"id":762,"book":"环境","chapter":"第3章 水体环境","kp":"一级降解","q":"有机物一级降解的剩余量随时间（ ）。","options":["按指数规律减小","先增大后减小","不变","按时间线性减小"],"answer":0,"explain":"解析：下编E3-P02、公式F3-06：L(t)=L₀e^(−k₁t)。手册要点：随时间增加，剩余需氧量指数下降，而已经实现的累积需氧量逐渐接近初始最终需氧量，二者不能混同。","source":"下编 E3-P02"},{"id":763,"book":"环境","chapter":"第3章 水体环境","kp":"温度修正","q":"BOD降解速率常数的温度修正式为（ ）。","options":["k_T=k₂₀(T−20)","k_T=k₂₀/θ","k_T=k₂₀θ^(T−20)","k_T=k₂₀+θ(T−20)"],"answer":2,"explain":"解析：L₀为初始最终碳化需氧量，L(t)为剩余量，BODt为t内累积碳化耗氧，均mg O₂/L（下编公式F3-06）。BOD₅换算式中k₁用d⁻¹。","source":"下编 公式F3-06"},{"id":764,"book":"环境","chapter":"第3章 水体环境","kp":"氧垂曲线","q":"S—P氧垂曲线描述的是（ ）。","options":["河流受有机污染后，耗氧与复氧共同作用下DO沿程先降后升的变化","河流水温沿程的变化，以及热污染的扩散范围","BOD沿程不断增加的变化","DO沿程持续上升的变化"],"answer":0,"explain":"解析：下编E3-P03：耗氧复氧、氧亏、临界点。手册要点：有机物逐渐衰减后复氧占优，DO回升，形成氧垂曲线。","source":"下编 E3-P03"},{"id":765,"book":"环境","chapter":"第3章 水体环境","kp":"临界点","q":"氧垂曲线临界点（DO最低点）满足（ ）。","options":["耗氧速率等于复氧速率，k₁L=k₂D","复氧速率为零，只有耗氧","DO等于饱和溶解氧","BOD为零，有机物全部降解"],"answer":0,"explain":"解析：下编公式F3-07：k₁L(t_c)=k₂D(t_c)。临界点处DO不再下降，dD/dt=0，即耗氧速率k₁L等于复氧速率k₂D，此时BOD并未降完，DO也低于饱和值。","source":"下编 公式F3-07"},{"id":766,"book":"环境","chapter":"第3章 水体环境","kp":"黑臭","q":"水体黑臭的根本原因是（ ）。","options":["藻类过少，光合产氧不足","pH过高引起的碱性异味","有机物耗氧导致缺氧厌氧，产生H₂S、FeS等","水温过低，微生物活动完全停止，有机物无法分解"],"answer":2,"explain":"解析：下编E3-P04：好氧耗氧→缺氧厌氧→黑臭，生态改变。手册要点：若负荷持续过大使供氧不足，缺氧和厌氧过程增强，可形成硫化氢、甲烷及其他气味物质，导致黑臭并损害水生生物。","source":"下编 E3-P04"},{"id":767,"book":"环境","chapter":"第3章 水体环境","kp":"富营养化成因","q":"水体富营养化的主要原因是（ ）。","options":["水温过低，抑制藻类生长","重金属大量输入，毒害水生生物，使藻类大量死亡并分解","氮、磷营养盐过量输入，配合适宜的水文、光照和温度","溶解氧过高，促进藻类生长"],"answer":2,"explain":"解析：富营养化是氮磷等营养物质在适宜水文、光照和温度条件下促进藻类及水生植物过量增长，导致生态结构及水质恶化的过程（下编E3-P05与单元13）。治理应以削减流域氮磷外源为基础，结合适宜的脱氮除磷、面源控制和生态修复，必要时处理内源并持续监测，单次清藻难以根治。","source":"下编 E3-P05、单元13"},{"id":768,"book":"环境","chapter":"第3章 水体环境","kp":"富营养化水文","q":"下列条件中最有利于富营养化发展的是（ ）。","options":["光照不足、水体浑浊","湖库水流缓慢、交换周期长","水温很低","河流湍急、水体交换速度快"],"answer":1,"explain":"解析：单元13：交换周期长有利于藻类增殖。手册要点：富营养化是氮磷等营养物质在适宜水文、光照和温度条件下促进藻类及水生植物过量增长，导致生态结构及水质恶化的过程。","source":"下编 E3-P05、单元13"},{"id":769,"book":"环境","chapter":"第3章 水体环境","kp":"富营养化危害","q":"富营养化的危害不包括（ ）。","options":["产生藻毒素","破坏水生生态和景观","藻类大量繁殖，夜间及死亡分解耗氧","使水体溶解氧长期升高、水质净化"],"answer":3,"explain":"解析：富营养化是氮磷等营养物质在适宜水文、光照和温度条件下促进藻类及水生植物过量增长，导致生态结构及水质恶化的过程（下编E3-P05）。易错提醒：不是所有赤潮都由人为富营养化单独引起，也不是所有藻类都产毒；白天表层高DO不排除夜间或底层缺氧。","source":"下编 E3-P05"},{"id":770,"book":"环境","chapter":"第3章 水体环境","kp":"重金属特性","q":"重金属在水环境中的特点是（ ）。","options":["可被微生物彻底分解为无害物质","无生物毒性，只影响水的颜色","不能被降解，只能在价态形态和介质间迁移转化","只存在于水相，不进入底泥"],"answer":2,"explain":"解析：下编E3-P06：元素守恒、吸附沉淀再释放。手册要点：重金属元素不能由微生物降解消失，但可在溶解态、颗粒态和生物体间迁移并改变价态与配合形态。","source":"下编 E3-P06"},{"id":771,"book":"环境","chapter":"第3章 水体环境","kp":"汞甲基化","q":"无机汞在底泥中经微生物作用转化为毒性更强的（ ）。","options":["单质汞蒸气","氯化汞","硫化汞","甲基汞"],"answer":3,"explain":"解析：下编E3-P06关键词“甲基化；生物迁移”，甲基汞易沿食物链富集（水俣病）。手册要点：水流搬运控制其机械迁移，吸附、沉淀与解吸溶解控制水泥分配，氧化还原及微生物作用可改变活性与毒性，例如汞甲基化。","source":"下编 E3-P06"},{"id":772,"book":"环境","chapter":"第3章 水体环境","kp":"混凝","q":"混凝主要去除水中的（ ）。","options":["胶体和细小悬浮物","粒径较大的砂粒和砾石","溶解性盐类","溶解氧"],"answer":0,"explain":"解析：下编E3-P07：胶体失稳、絮凝分离；化学沉淀针对溶解离子。混凝剂使胶体脱稳，并让细小颗粒絮凝成较大絮体后沉降分离，大颗粒砂粒用沉砂即可去除，溶解性盐类需化学或膜法处理。","source":"下编 E3-P07"},{"id":773,"book":"环境","chapter":"第3章 水体环境","kp":"理想沉淀池","q":"理想沉淀池中，颗粒能被完全截留的条件是（ ）。","options":["池深越大，截留效果越好","颗粒沉速不小于表面负荷（v_s≥Q/A）","停留时间越短越好，与沉速无关","颗粒沉速大于水平流速即可"],"answer":1,"explain":"解析：下编公式F3-08：截留效率取决于表面负荷而非池深。理想沉淀池中，颗粒沉速只要不小于表面负荷Q/A，就能在流出前沉到池底，截留效果与池深无关，也不是越短越好。","source":"下编 公式F3-08"},{"id":774,"book":"环境","chapter":"第3章 水体环境","kp":"BOD5稀释法","q":"稀释比P=0.060，含样瓶培养前后DO为8.9和4.1 mg/L，空白瓶为9.0和8.7 mg/L，BOD₅约为（ ）。","options":["4.5 mg/L","75.3 mg/L","80.0 mg/L","75.0 mg/L"],"answer":1,"explain":"解析：BOD₅=[(D₁−D₂)−(B₁−B₂)(1−P)]/P=[4.8−0.3×0.94]/0.06≈75.3 mg/L。不扣空白会高估。","source":"下编 公式F3-02、K3-01"},{"id":775,"book":"环境","chapter":"第3章 水体环境","kp":"COD氧当量","q":"重铬酸钾法回滴：空白耗Fe²⁺ 25.0 mL，水样13.0 mL，c=0.100 mol/L，水样50.0 mL，COD为（ ）。","options":["384 mg O₂/L","480 mg O₂/L","608 mg O₂/L","192 mg O₂/L"],"answer":3,"explain":"解析：COD=(V_b−V_s)c×8000/V_w=12.0×0.100×8000/50=192 mg/L。8000来自1 mol电子对应8 g O₂。","source":"下编 公式F3-03、K3-02"},{"id":776,"book":"环境","chapter":"第3章 水体环境","kp":"完全混合浓度","q":"河流Q=10 m³/s、BOD 1 mg/L，污水q=0.5 m³/s、BOD 20 mg/L，完全混合后浓度约为（ ）。","options":["1.52 mg/L","1.90 mg/L","2.00 mg/L","10.50 mg/L"],"answer":1,"explain":"解析：C₀=(QC_r+qC_e)/(Q+q)=(10+10)/10.5≈1.90 mg/L，必须流量加权。混合浓度须按流量加权，即(10×1+0.5×20)/10.5≈1.90 mg/L，直接取平均或忽略河水稀释都会出错。","source":"下编 公式F3-05"},{"id":777,"book":"环境","chapter":"第3章 水体环境","kp":"由BOD5求最终BOD","q":"BOD₅=20 mg/L，k₁=0.23 d⁻¹（e为底），最终碳化需氧量L₀约为（ ）。","options":["43.8 mg/L","29.3 mg/L","13.7 mg/L","63.2 mg/L"],"answer":1,"explain":"解析：L₀=BOD₅/(1−e^(−5k₁))=20/(1−e^(−1.15))≈29.3 mg/L。BOD₅只是5天累积耗氧，小于最终需氧量。","source":"下编 公式F3-06、K3-04"},{"id":778,"book":"环境","chapter":"第3章 水体环境","kp":"BOD速率温度修正","q":"k₂₀=0.23 d⁻¹，θ=1.047，30℃时速率常数约为（ ）。","options":["0.145 d⁻¹","2.408 d⁻¹","0.364 d⁻¹","0.230 d⁻¹"],"answer":2,"explain":"解析：k_T=k₂₀θ^(T−20)=0.23×1.047¹⁰≈0.364 d⁻¹，温度升高降解加快。θ^(T−20)=1.047¹⁰≈1.58，乘以0.23得0.364 d⁻¹，温度升高使降解加快，0.230 d⁻¹忽略了温度修正。","source":"下编 公式F3-06、K3-07"},{"id":779,"book":"环境","chapter":"第3章 水体环境","kp":"剩余BOD","q":"L₀=100 mg/L，k₁=0.285 d⁻¹，3 d后剩余需氧量L(t)=L₀e^(−k₁t)约为（ ）。","options":["14.5 mg/L","42.5 mg/L","57.5 mg/L","14.0 mg/L"],"answer":1,"explain":"解析：L(3)=100×e^(−0.855)≈42.5 mg/L；累积耗氧BOD₃=100−42.5≈57.5 mg/L。剩余需氧量按L₀e^(−k₁t)衰减，3天后剩42.5 mg/L，57.5 mg/L是这3天已累积消耗的BOD₃，两者不要混淆。","source":"下编 公式F3-06、K3-07"},{"id":780,"book":"环境","chapter":"第3章 水体环境","kp":"串联去除总效率","q":"一级处理去除35%BOD₅，二级处理再去除剩余的90%，总去除率为（ ）。","options":["125.0%","31.5%","90.0%","93.5%"],"answer":3,"explain":"解析：η=1−(1−0.35)(1−0.90)=1−0.065=93.5%。效率不能直接相加。","source":"下编 K3-05"},{"id":781,"book":"环境","chapter":"第3章 水体环境","kp":"沉淀池表面负荷","q":"设计流量500 m³/h，沉淀池表面积400 m²，表面负荷q_s=Q/A为（ ）。","options":["20.00 m/h","2.50 m/h","0.80 m/h","1.25 m/h"],"answer":3,"explain":"解析：q_s=500/400=1.25 m/h；理想沉淀池中沉速v_s≥q_s的颗粒可被完全截留，与池深无关。表面负荷是流量除以池表面积，单位m/h，500/400=1.25 m/h，0.80 m/h是取了倒数。","source":"下编 公式F3-08、K3-06"},{"id":782,"book":"环境","chapter":"第3章 水体环境","kp":"理论最小沉淀面积","q":"流量500 m³/h，要截留沉速7.5 m/h的颗粒，理想沉淀池理论最小面积为（ ）。","options":["33.33 m²","66.67 m²","150.00 m²","3750.00 m²"],"answer":1,"explain":"解析：A_min=Q/v_s=500/7.5≈66.67 m²。手册要点：理论最小面积66.67 m²。","source":"下编 公式F3-08、K3-06"},{"id":783,"book":"环境","chapter":"第3章 水体环境","kp":"氧垂临界时间","q":"k₁=0.20 d⁻¹、k₂=0.40 d⁻¹，L₀=20 mg/L、D₀=1.0 mg/L，临界时间t_c=[1/(k₂−k₁)]ln{(k₂/k₁)[1−D₀(k₂−k₁)/(k₁L₀)]}约为（ ）。","options":["6.42 d","1.16 d","3.21 d","3.47 d"],"answer":2,"explain":"解析：括号内=2×(1−1.0×0.2/4)=1.9，t_c=5×ln1.9≈3.21 d。此刻耗氧速率k₁L等于复氧速率k₂D，DO最低。","source":"下编 公式F3-07"},{"id":784,"book":"环境","chapter":"第4章 土壤环境","kp":"土壤质量","q":"土壤质量是指（ ）。","options":["土壤的颗粒组成与质地","土壤中重金属的总含量","在一定生态系统内土壤维持生产力、净化污染、保障生态与健康的能力","土壤颜色、质地和颗粒组成等外观特征，与生态功能无关"],"answer":2,"explain":"解析：下编E4-D01：三个组成（肥力、环境、健康）质量。手册要点：土壤质量是土壤在一定生态系统内支持生物生产、容纳和净化污染物、维持生态平衡并保障动植物和人类健康能力的综合量度。","source":"下编 E4-D01"},{"id":785,"book":"环境","chapter":"第4章 土壤环境","kp":"土壤污染定义","q":"土壤污染是指（ ）。","options":["任何物质进入土壤即为土壤污染","土壤中检出重金属即为污染","土壤中检出任何外来物质，不论是否超过自净能力，都属于污染","污染物进入并累积，超过土壤自净能力，导致质量下降并产生生物或健康影响"],"answer":3,"explain":"解析：下编E4-D02：进入与累积、能力限度、综合判断。手册要点：土壤污染是污染物因自然原因或人类活动进入土壤并累积，超过土壤的容纳、自净能力，使其性状和质量发生不利变化，进而影响作物、生物或人畜健康的现象。","source":"下编 E4-D02"},{"id":786,"book":"环境","chapter":"第4章 土壤环境","kp":"土壤自净","q":"土壤自净作用是指（ ）。","options":["通过土壤自身物理、化学、生物过程使污染物浓度、活性或危害降低","污染物在土壤中彻底消失的过程","土壤颗粒被水流冲刷流失","人工采取物理、化学方法对污染土壤进行修复的过程"],"answer":0,"explain":"解析：下编E4-D03：能力有限，不等于彻底消失。手册要点：土壤自净作用是土壤通过过滤、吸附、迁移、化学转化和生物分解等过程，使污染物的浓度、活性或危害降低的能力。","source":"下编 E4-D03"},{"id":787,"book":"环境","chapter":"第4章 土壤环境","kp":"自净机理","q":"土壤自净的主要机理不包括（ ）。","options":["吸附固定与化学转化","核裂变","生物分解","物理过滤与迁移"],"answer":1,"explain":"解析：下编E4-P01：土壤自净依靠物理（吸附、过滤、稀释）、化学（沉淀、氧化还原）和生物（微生物降解）等过程使污染物浓度或毒性降低。核裂变是核反应过程，与土壤自净无关。","source":"下编 E4-P01"},{"id":788,"book":"环境","chapter":"第4章 土壤环境","kp":"背景值","q":"土壤环境背景值是指（ ）。","options":["未受或少受人类活动影响的土壤中元素的自然含量","土壤所能承受的污染物最大负荷量","国家规定的土壤污染物允许限值","当前实际测得的污染物浓度"],"answer":0,"explain":"解析：下编E4-C01：背景值是自然参比；环境容量是容许负荷。手册要点：背景值指未受或少受人类活动影响时，土壤本身的化学元素组成及其含量，是判断人为增量和研究环境行为的参比。","source":"下编 E4-C01"},{"id":789,"book":"环境","chapter":"第4章 土壤环境","kp":"土壤环境容量","q":"与土壤背景值相比，土壤环境容量强调的是（ ）。","options":["某次监测得到的土壤污染物实测浓度","土壤中污染物超过标准的倍数","在特定环境质量目标和条件下，土壤容许承纳污染物的最大数量或负荷","未受或少受人类活动影响时土壤本身的元素组成及含量"],"answer":2,"explain":"解析：下编E4-C01：背景值是判断人为增量的参比；环境容量是在特定质量目标和条件下土壤可承纳污染物的最大负荷。实测浓度和超标倍数属于现状评价指标。","source":"下编 E4-C01、公式F4-01"},{"id":790,"book":"环境","chapter":"第4章 土壤环境","kp":"重金属特点","q":"土壤重金属污染的特点是（ ）。","options":["迁移极快，很快随水流失，不会在土壤中累积","难降解、易累积，形态可转化，风险取决于有效态和暴露途径","易被微生物分解，可自然消除","只看总量即可判断风险"],"answer":1,"explain":"解析：土壤中的汞、镉、铅、铬和砷等污染物具有累积、潜伏、难以降解及复合污染等特征（下编E4-C02与单元16）。相同总量并不对应相同风险，还须考虑植物差异与暴露途径。","source":"下编 E4-C02"},{"id":791,"book":"环境","chapter":"第4章 土壤环境","kp":"有效态","q":"评价土壤重金属生态风险时，比总量更关键的是（ ）。","options":["土壤颜色与质地","有机质总量","土壤的容重和孔隙度大小","生物有效态（可迁移、可吸收形态）"],"answer":3,"explain":"解析：总量说明污染储量，形态则影响溶解性、迁移性和生物可利用性（下编E4-C02关键词“总量与有效态”）。相同总量并不对应相同风险，还须考虑植物差异与暴露途径。","source":"下编 E4-C02"},{"id":792,"book":"环境","chapter":"第4章 土壤环境","kp":"pH与重金属","q":"土壤酸化通常会使多数重金属阳离子（ ）。","options":["活性增加，更易被植物吸收","彻底沉淀，失去活性","挥发","活性降低，更难被植物根系吸收"],"answer":0,"explain":"解析：下编E4-L02：pH和氧化还原影响迁移转化。pH降低时，H⁺置换出吸附态重金属，并使其氢氧化物、碳酸盐溶解，有效态增加，更易迁移和被植物吸收。","source":"下编 E4-L02"},{"id":793,"book":"环境","chapter":"第4章 土壤环境","kp":"农药半衰期","q":"农药在土壤中的半衰期是指（ ）。","options":["农药残留量降低到初始值一半所需的时间","农药发挥药效的持续时间","两次施药之间的间隔时间","农药在土壤中全部降解、彻底消失所需的时间"],"answer":0,"explain":"解析：下编E4-C03：一级模型条件，不作普适常数。手册要点：半衰期是给定条件下农药含量降低一半所需的时间。","source":"下编 E4-C03"},{"id":794,"book":"环境","chapter":"第4章 土壤环境","kp":"残留期","q":"农药残留期的确定依赖于（ ）。","options":["设定的残留终点（如降至某限值或某比例）","与降解过程无关，固定不变","总是半衰期的2倍","只取决于施药量，与降解过程无关"],"answer":0,"explain":"解析：残留量是某时刻仍存在的农药数量或浓度（下编E4-C03关键词“残留终点”）。残留期描述残留下降到指定程度所需的时间。","source":"下编 E4-C03"},{"id":795,"book":"环境","chapter":"第4章 土壤环境","kp":"农药迁移","q":"农药在土壤中的迁移途径包括（ ）。","options":["只能停留在施用处原地不动，不发生迁移","只能被植物根系吸收","核衰变和放射性迁移","挥发扩散、随水淋溶及吸附在颗粒上随径流迁移"],"answer":3,"explain":"解析：下编E4-P03：吸附解吸、挥发扩散、水与颗粒迁移。手册要点：可挥发扩散进入空气，或溶于水及附着颗粒随径流、淋溶迁移。","source":"下编 E4-P03"},{"id":796,"book":"环境","chapter":"第4章 土壤环境","kp":"农药降解","q":"农药在土壤中的降解方式包括（ ）。","options":["光化学降解、化学降解和微生物降解","只有被土壤颗粒吸附","只有微生物降解一种方式","只有挥发进入大气"],"answer":0,"explain":"解析：下编E4-P03：三类降解，需注意产物风险。手册要点：降解可分光化学、化学和微生物过程，其中表层更易受到光作用，深层则受通气、水分和微生物条件约束。","source":"下编 E4-P03"},{"id":797,"book":"环境","chapter":"第4章 土壤环境","kp":"土壤污染来源","q":"下列不属于土壤污染主要来源的是（ ）。","options":["污水灌溉","大气沉降与固废堆放","植物光合作用","农药化肥施用"],"answer":2,"explain":"解析：危害表现为土壤结构和肥力改变、作物产量或品质下降，以及污染物经植物吸收和食物链进入动物、人类（下编E4-P02与单元16）。易错提醒：不要仅列污染物名称而不写“源—途径—受体”；不要引用旧年份污染面积作为当年现状。","source":"下编 E4-P02"},{"id":798,"book":"环境","chapter":"第4章 土壤环境","kp":"跨介质危害","q":"土壤污染可通过下列途径危害人体（ ）。","options":["食物链积累、地下水污染和扬尘吸入等","不会危害人体健康","只通过噪声和振动","只通过皮肤直接接触土壤这一条途径"],"answer":0,"explain":"解析：下编E4-P02：跨介质迁移、食物链暴露。手册要点：危害表现为土壤结构和肥力改变、作物产量或品质下降，以及污染物经植物吸收和食物链进入动物、人类。","source":"下编 E4-P02"},{"id":799,"book":"环境","chapter":"第4章 土壤环境","kp":"土壤污染特点","q":"土壤污染的基本特点不包括（ ）。","options":["难可逆、治理难周期长","累积性与地域性","隐蔽性与滞后性","易发现、易逆转、治理周期短"],"answer":3,"explain":"解析：土壤污染具有隐蔽性和滞后性，常需样品、作物及环境调查才能发现（下编E4-L01：预防优先）。污染后治理难、成本高、周期长。","source":"下编 E4-L01"},{"id":800,"book":"环境","chapter":"第4章 土壤环境","kp":"隐蔽性","q":"土壤污染常被称为“看不见的污染”，体现了其（ ）。","options":["隐蔽性和滞后性","流动性和扩散性","瞬时性","易恢复性和可逆性"],"answer":0,"explain":"解析：土壤污染具有隐蔽性和滞后性，常需样品、作物及环境调查才能发现（下编E4-L01）。具有累积性和地域性，污染物受土壤固定后容易长期积聚，且分布与污染源、地形和土壤条件有关。","source":"下编 E4-L01"},{"id":801,"book":"环境","chapter":"第4章 土壤环境","kp":"重金属迁移因素","q":"影响土壤重金属迁移转化的因素不包括（ ）。","options":["胶体与有机质","月相","pH与氧化还原电位","吸附、络合与沉淀"],"answer":1,"explain":"解析：迁移包括溶解态随水运动、吸附态随颗粒侵蚀，以及植物吸收形成的生物迁移（下编E4-L02）。pH和氧化还原条件可改变溶解度、络合及价态，从而影响迁移性和生物有效性。","source":"下编 E4-L02"},{"id":802,"book":"环境","chapter":"第4章 土壤环境","kp":"修复技术区分","q":"关于土壤修复技术，下列说法正确的是（ ）。","options":["固化稳定化等于把污染物去除","固化/稳定化降低迁移性但不去除污染物总量，需长期监控","修复过程不会产生任何二次污染","所有修复技术都能使污染物彻底消失，修复完成后无需任何后续监控"],"answer":1,"explain":"解析：下编E4-L03：去除与固定区分，长期及二次污染。手册要点：技术目标主要有两类：降低污染物总量，或降低其迁移性和生物可利用性。","source":"下编 E4-L03"},{"id":803,"book":"环境","chapter":"第4章 土壤环境","kp":"修复框架","q":"土壤污染防治的首要原则是（ ）。","options":["无需调查评估，直接修复","源头控制、预防为主，结合调查评估确定修复目标","先污染后治理，以修复为主","只依靠修复技术，不必控制污染源"],"answer":1,"explain":"解析：防治应先控制污染源、减少新增输入，配合调查监测和土地用途管理（下编E4-L03、E4-L01）。对已污染土壤，依据污染物性质、土壤条件、暴露
